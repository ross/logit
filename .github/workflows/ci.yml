name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      # Same image family contributors build locally (Dockerfile.dev / ADR 0005); script/common.sh
      # detects $CI (set by GitHub Actions) and runs commands directly against it instead of
      # trying to `docker compose run` from inside a container.
      image: docker.io/library/rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps (vendored LuaJIT via mlua) and cargo tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang cmake pkg-config libssl-dev
          rustup component add rustfmt clippy
          cargo install cargo-nextest --locked
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: ./script/cibuild
