name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # `.config/nextest.toml`'s `ci` profile: more test threads than the runner has vCPUs.
      NEXTEST_PROFILE: ci
      # A run starts from a restored `target` and never reuses incremental state, which would
      # otherwise be most of what the cache holds.
      CARGO_INCREMENTAL: "0"
    container:
      # Dockerfile.dev's `ci` stage, published by the "Publish CI image" workflow and tagged by
      # Dockerfile.dev's hash (docs/adr/ci-image-on-ghcr.md). `script/ci-image tag` prints the
      # tag for the checked-out Dockerfile.dev. script/common.sh detects $CI (set by GitHub
      # Actions) and runs commands directly in it instead of `docker compose run`.
      image: ghcr.io/ross/logit-ci:0827e2f8eb86
    steps:
      - uses: actions/checkout@v4

      - name: Check the CI image matches Dockerfile.dev
        run: ./script/ci-image check

      # Only main saves (docs/adr/ci-cargo-cache-saved-on-main.md). A PR restores main's entry,
      # falling back by prefix when its lockfile differs, and cargo fetches and rebuilds only
      # what changed. The month in the key bounds what `target` accumulates: main restores only
      # from its own month, so its first run each month builds clean, while a PR falls back to
      # any month. The image's CARGO_HOME is /usr/local/cargo; `~` is /github/home in a
      # container job. The root manifest's [profile.*] tables decide what `target` holds.
      - id: cache-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            target
            fuzz/target
          key: ${{ runner.os }}-cargo-v4-${{ steps.cache-month.outputs.month }}-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: >-
            ${{ github.ref == 'refs/heads/main'
              && format('{0}-cargo-v4-{1}-', runner.os, steps.cache-month.outputs.month)
              || format('{0}-cargo-v4-', runner.os) }}

      - run: ./script/cibuild

      # Workspace artifacts are stale on the next run, because every push changes them, so
      # remove them before the save and keep only third-party crates. `cargo clean -p` takes a
      # package's lib, test binaries, and build scripts. fuzz/ is its own workspace and builds
      # logit-core and logit-proto again into its own `target`. The image has no jq.
      - name: Prune workspace artifacts from the cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          members() {
            cargo metadata --no-deps --format-version 1 "$@" \
              | grep -oE '"name":"[^"]*","version"' \
              | sed -E 's/"name":"([^"]*)".*/-p \1/'
          }
          cargo clean $(members)
          cargo clean --manifest-path fuzz/Cargo.toml $(members --manifest-path fuzz/Cargo.toml) -p logit-core -p logit-proto
          du -sh target fuzz/target

      # A save under an existing key only logs a warning; skip it on an exact hit.
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            target
            fuzz/target
          key: ${{ runner.os }}-cargo-v4-${{ steps.cache-month.outputs.month }}-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
