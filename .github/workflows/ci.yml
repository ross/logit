name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # `.config/nextest.toml`'s `ci` profile: more test threads than the runner has vCPUs.
      NEXTEST_PROFILE: ci
    container:
      # Same image family contributors build locally (Dockerfile.dev / ADR `containerized-development`); script/common.sh
      # detects $CI (set by GitHub Actions) and runs commands directly against it instead of
      # trying to `docker compose run` from inside a container.
      image: docker.io/library/rust:1.98.1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps (vendored LuaJIT via mlua)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang cmake pkg-config libssl-dev
          rustup component add rustfmt clippy

      - name: Install cargo tools
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-nextest@0.9.144,cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          # The root manifest's [profile.*] tables decide what the cached target dir holds.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}

      - run: ./script/cibuild
