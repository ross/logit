# A Graphite/Carbon relay: receive carbon's wire protocols, forward them to a central carbon or
# anything else that speaks either dialect (docs/adr/graphite-carbon-relay.md). Point an edge
# fleet's `write_graphite`/carbon-relay/StatsD backend at this host on port 2003 and set
# `endpoint` below to the central collector; nothing carbon-side changes.
#
# The relay is lossless modulo the normalization list in `crates/logit-proto/src/graphite/mod.rs`'s
# module doc. Anything the pair can't carry (a multi-value record under the default `multi_value:
# skip`, a non-finite value, a timestamp that floors to zero or below) is a counted drop
# (`logit.output.metrics.skipped`) with a throttled diagnostic. Both protocols work in both
# directions, and this sink's `protocol:`/`transport:` need not match `graphite_in`'s.
#
# No `aggregate`, unlike fixtures/statsd-to-graphite.yaml: a carbon datapoint already carries its
# own second. Add one only when you want to re-window.
#
# There is no `graphite.*` namespace: the dotted path is `MetricRecord.name`, so a `lua`/`set`
# stage that renames a metric between `graphite_in` and `graphite_out` changes the wire path. See
# docs/deploying.md's `graphite_in`/`graphite_out` sections, including the pre-1.1 Graphite
# tag-corruption warning that `tags: drop` exists for.
components:
  graphite_in:
    type: graphite_in
    # Carbon's default plaintext port. `0.0.0.0` accepts from any sender.
    bind: 0.0.0.0:2003
    # transport: tcp             # tcp (default) | udp
    # protocol: plaintext        # plaintext (default) | pickle; pickle requires transport: tcp
    #                            # and is carbon's other listener, conventionally on port 2004
    # max_line_bytes: "8192"     # tcp plaintext only; an oversize line is dropped and counted, the
    #                            # reader resynchronizes at the next newline, and the connection
    #                            # stays up
    # max_frame_bytes: "1MiB"    # pickle only; an oversize frame is counted and closes the
    #                            # connection, since a length-framed stream has no resync point
    # handshake_timeout: 5s      # tcp only; per pre-message phase (TLS accept, then the first
    #                            # byte). Not an idle timeout.
    # idle_timeout: 5m           # tcp only, off by default; closes a connection quiet for this
    #                            # long. Size it above the sender's longest normal gap, and note
    #                            # a plain carbon sender can't detect the close
    #                            # (docs/adr/idle-connection-timeout.md).
    # tls:                       # tcp only; presence turns TLS on with no plaintext fallback. Plain
    #                            # carbon senders speak no TLS, so this is for a logit-to-logit or
    #                            # stunnel-shaped hop; graphite_out has no tls: half.
    #   cert_file: /etc/logit/tls/server.pem
    #   key_file: /etc/logit/tls/server.key
    #   client_ca_file: /etc/logit/tls/ca.pem   # omit for server-auth-only TLS
    #
    # Every field below is its default; omit the block for the same effect. Under transport: tcp
    # there is no receive queue (TCP's flow control is the backpressure), so only the batch and
    # shutdown fields apply and a udp-only field is a `logit validate` error.
    # receive:
    #   max_datagrams: 10000        # udp only: queue depth; whichever of this or max_bytes trips first
    #   max_bytes: "32MiB"          # udp only
    #   overflow: drop_oldest       # udp only: block | drop_oldest | drop_newest
    #   batch_max_events: 1000
    #   batch_max_bytes: "1MiB"
    #   batch_flush_interval: 100ms # 0s disables the timer
    #   # receive_buffer_bytes: 8MiB  # udp only: SO_RCVBUF
    #   read_batch: 64              # udp only: datagrams per recvmmsg(2) read; Linux-only effect
    #   shutdown_grace: 5s

  graphite_out:
    type: graphite_out
    sources: [graphite_in]
    # `host:port`, resolved at send time, so a carbon that isn't up yet is not a config error.
    endpoint: central-carbon:2003
    # Every field below is its default; omit it for the same effect.
    # transport: tcp             # tcp (default) | udp; need not match graphite_in's
    # protocol: plaintext        # plaintext (default) | pickle; pickle requires transport: tcp
    # tags: carbon                # carbon (default) renders ;name=value per attribute; drop omits
    #                              # the tag segment, counted, for a pre-1.1 Graphite whose whisper
    #                              # backend would take the ";" into a directory name
    # multi_value: skip           # skip (default) drops a multi-value record whole, counted; expand
    #                              # renders the dotted sub-paths (.count, .sum, .q0_5, per-bucket
    #                              # counts) listed in crates/logit-proto/src/graphite/mod.rs
    # max_packet_bytes: "1432"    # udp only: bounds one datagram, not one line
    # max_frame_bytes: "1MiB"     # bounds one pickle frame
    # connect_timeout: 5s         # tcp only
    # buffer: (all defaults, docs/adr/buffered-sink-delivery.md -- max_batches 1024,
    #          max_bytes "64MiB", overflow block, retry_budget 60s, retry_max_delay 10s,
    #          shutdown_grace 5s, plus an optional `disk:` sub-block for durable buffering.
    #          `delivery:` derives from duplicate_safe(), which is true here: whisper is
    #          last-write-wins per (path, second), so a redelivered datapoint overwrites itself)
