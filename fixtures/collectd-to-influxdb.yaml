# collectd's binary `network` protocol in, InfluxDB 2.x out: the cross-protocol half of
# docs/adr/collectd-binary-relay.md. Point a collectd fleet's `<Plugin network> Server "<this
# host>" "25826" </Plugin>` at it. The `influx_out` settings match the `influxdb` service
# compose.yaml seeds for the dev stack; change `url`/`org`/`bucket` for yours. `token: !env
# INFLUXDB_TOKEN` reads the token from the environment (docs/adr/env-yaml-tag.md).
#
# No `aggregate`, unlike examples/statsd-to-influxdb.yaml: every collectd value list is already
# one reading per `Interval` with its own timestamp, and a window would re-window it and re-stamp
# it with the flush time. Add one only when the incoming interval is finer than what you store.
#
# This direction is lossy where the relay isn't (a `collectd_in -> collectd_out` pair keeps all of
# it):
#
#   * the `collectd.*` attributes (host, plugin, plugin_instance, type, type_instance, interval)
#     become InfluxDB tags, one per attribute.
#   * a multi-data-source value list becomes N measurements named `plugin.type.ds`
#     (`load.load.shortterm`, `interface.if_octets.rx`) sharing a tag set and a timestamp.
#   * `ds` naming needs `types_db:` below. Without it the same list is `load.load.0/1/2`: stable
#     and correct, but not what a collectd operator's dashboards are named after.
#   * COUNTER/DERIVE/ABSOLUTE all land as fields; InfluxDB has no representation for monotonicity
#     or temporality, so rate/derivative is the query's job.
components:
  collectd_in:
    type: collectd_in
    # collectd's default port. `0.0.0.0` accepts unicast from any sender.
    bind: 0.0.0.0:25826
    # A multicast group instead, for a fleet configured with a bare `Server "239.192.74.66"`
    # (collectd's IPv4 default; `ff18::efc0:4a42` is the IPv6 one). A multicast address is
    # detected and joined with no extra field, and the listener still accepts unicast on the port.
    # bind: 239.192.74.66:25826
    #
    # Optional: collectd `types.db` files, read once at startup, that name each data source in a
    # multi-data-source list (`load.load.{shortterm,midterm,longterm}` instead of
    # `load.load.{0,1,2}`). Nothing else changes. collectd's own types.db is GPL-licensed and not
    # shipped with logit; point this at the sending hosts' copy.
    # types_db:
    #   - /usr/share/collectd/types.db
    #
    # Every field below is its default; omit the block for the same effect. `receive:` is valid
    # only on a datagram listener.
    # receive:
    #   max_datagrams: 10000        # queue depth; whichever of this or max_bytes trips first
    #   max_bytes: "32MiB"
    #   overflow: drop_oldest       # block | drop_oldest | drop_newest; blocking a UDP reader moves
    #                               # loss into the kernel, where nothing counts it
    #   batch_max_events: 1000      # 1 means one send per datagram
    #   batch_max_bytes: "1MiB"
    #   batch_flush_interval: 100ms # 0s disables the timer
    #   # receive_buffer_bytes: 8MiB  # SO_RCVBUF; omitted leaves the kernel default alone
    #   read_batch: 64              # datagrams per recvmmsg(2) read; Linux-only effect
    #   shutdown_grace: 5s

  influx_out:
    type: influxdb_out
    sources: [collectd_in]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN
    # Every field below is its default; omit the block for the same effect
    # (docs/adr/buffered-sink-delivery.md). `buffer:` is valid only on a sink.
    # buffer:
    #   max_batches: 1024      # queue depth; whichever of this or max_bytes trips first
    #   max_bytes: "64MiB"     # a quoted string, always (KiB/MiB/GiB or a bare number)
    #   overflow: block        # block | drop_oldest | drop_newest
    #   # delivery: at_least_once  # at_least_once | at_most_once; omitted derives from the sink's
    #                              # duplicate_safe() (true for influxdb_out's idempotent overwrite)
    #   retry_budget: 60s      # wall-clock ceiling on retrying one batch before it's dropped
    #   retry_max_delay: 10s   # backoff cap between attempts
    #   shutdown_grace: 5s
    #   # disk:                        # opt-in durable buffering (docs/adr/disk-backed-sink-buffer.md);
    #   #                              # replaces the in-memory queue, so max_batches/max_bytes above
    #   #                              # must stay at their defaults
    #   #   path: spool/influxdb_out   # required, relative to this config file's directory
    #   #   max_bytes: "1GiB"          # bound on the sum of on-disk segment sizes
    #   #   segment_bytes: "64MiB"     # soft rotation trigger, not a hard cap
    #   #   compression: none          # none | lz4
    #   #   checkpoint_interval: 1s    # how often the read cursor is persisted
