# The v0.1 vertical slice (docs/OVERVIEW.md): statsd/DogStatsD in, a 10s aggregation window, one
# Lua enrichment script, InfluxDB 2.x out. Matches the `influxdb` service compose.yaml seeds, and
# is what `script/server` runs. `token: !env INFLUXDB_TOKEN` pulls the token from the environment
# (docs/adr/env-yaml-tag.md); any field on any component can use `!env` the same way.
components:
  statsd_in:
    type: statsd_in
    bind: 0.0.0.0:8125
    # transport: udp              # udp (the default) | tcp -- tls: below needs tcp. A tcp listener
    #                             # frames LF-delimited lines and has no receive queue: only the
    #                             # four batch/shutdown fields below apply, per connection
    # tls:                        # tcp only; presence turns TLS on and makes it required
    #   cert_file: server.pem     # resolved against this config file's directory
    #   key_file: server.key
    #   client_ca_file: ca.pem    # omit for server-auth-only TLS; set it to require a client cert
    # handshake_timeout: 5s       # tcp only; bounds the TLS accept and the wait for the first byte
    #                             # separately. Not an idle timeout
    # idle_timeout: 5m            # tcp only, off by default; closes a connection quiet for longer
    #                             # than this. A plaintext statsd client can't detect the close
    #                             # (docs/adr/idle-connection-timeout.md)
    # Every field below is its default; omit the block for the same effect
    # (docs/adr/decoupled-listener-io.md).
    # receive:
    #   max_datagrams: 10000        # receive-queue depth, in datagrams -- whichever of this or max_bytes trips first
    #   max_bytes: "32MiB"          # bound on undecoded datagram bytes held in the queue
    #   overflow: drop_oldest       # block | drop_oldest | drop_newest; blocking a UDP reader moves
    #                               # loss into the kernel, where nothing counts it
    #   batch_max_events: 1000      # events accumulated across datagrams before one send downstream
    #   batch_max_bytes: "1MiB"     # the other accumulation bound -- whichever trips first
    #   batch_flush_interval: 100ms # longest an accumulated batch waits regardless of size; 0s disables the timer
    #   # receive_buffer_bytes: 8MiB  # SO_RCVBUF, requested at bind -- omitted leaves the kernel default alone
    #   read_batch: 64              # datagrams one recvmmsg(2) read may return; Linux-only effect
    #   shutdown_grace: 5s          # how long SIGTERM waits for the receive queue to drain before dropping the rest

  windowed:
    type: aggregate
    sources: [statsd_in]
    interval: 10s

  enrich:
    type: lua
    sources: [windowed]
    script: |
      function process(event)
        event.attributes.env = event.attributes.env or "dev"
        return event
      end

  influx_out:
    type: influxdb_out
    sources: [enrich]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN
    # Every field below is its default; omit the block for the same effect
    # (docs/adr/buffered-sink-delivery.md).
    # buffer:
    #   max_batches: 1024      # queue depth, in batches -- whichever of this or max_bytes trips first
    #   max_bytes: "64MiB"     # estimated heap footprint bound -- a quoted string, always (KiB/MiB/GiB or a bare number)
    #   overflow: block        # block | drop_oldest | drop_newest -- what happens once both bounds are full
    #   # delivery: at_least_once  # at_least_once | at_most_once -- omitted derives from the sink's own
    #                              # duplicate_safe() (true for influxdb_out's idempotent overwrite)
    #   retry_budget: 60s      # wall-clock ceiling on retrying one batch before it's dropped
    #   retry_max_delay: 10s   # backoff cap between retry attempts
    #   shutdown_grace: 5s     # how long SIGTERM waits for the queue to drain before dropping the rest
    #   # disk:                        # opt-in durable buffering (docs/adr/disk-backed-sink-buffer.md);
    #   #                              # replaces the in-memory queue, so max_batches/max_bytes stay at their defaults
    #   #   path: spool/influxdb_out   # required, resolved relative to this config file's own directory
    #   #   max_bytes: "1GiB"          # bound on the sum of on-disk segment sizes
    #   #   segment_bytes: "64MiB"     # soft rotation trigger, not a hard cap
    #   #   compression: none          # none | lz4, logit_proto::native's per-frame compression
    #   #   checkpoint_interval: 1s    # how often the read cursor is persisted during normal operation
