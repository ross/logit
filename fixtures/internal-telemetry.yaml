# Self-observability: `internal` drains logit's own component-level telemetry into the graph like
# any other source (docs/design/internal-telemetry.md). `self` is an ordinary component id.
# `influx_out` points at the dev stack's `influxdb` service (compose.yaml), which seeds org `logit`
# and only the `metrics` bucket: create the `internal` bucket there first, or change `bucket`.
#
# `self`'s `interval` is the drain cadence and the sampling tick for process-level gauges. Pick
# one that divides evenly into `windowed`'s 60s interval, so an aggregation window never straddles
# two drains. `windowed` is optional (`internal` coalesces repeat points between drains), but it's
# how you get real time-windowed telemetry.
#
# `stat_in` and `logs_only`/`logs_out` show the "Logs" capture: `self`'s default `logs: warn`
# turns every `warn`-and-above self-diagnostic into a log event in the same drain. Send a
# malformed line and watch `logs_out`:
#
#   printf 'not a valid statsd line' | nc -u -w0 localhost 8125
#
# A `bad_line` log event attributed to `component: stat_in` reaches `logs_out` on `self`'s next
# tick. The warning is throttled to the 1st, 2nd, 4th, ... occurrence, so send it a few times if
# the first doesn't show up.
components:
  self:
    type: internal
    interval: 10s

  windowed:
    type: aggregate
    sources: [self]
    interval: 60s

  influx_out:
    type: influxdb_out
    sources: [windowed]
    url: http://influxdb:8086
    org: logit
    bucket: internal
    token: !env INFLUXDB_TOKEN

  # A real listener whose throttled diagnostics `self` captures as log events; see the header for
  # how to trigger one. `stdout` shows the listener's ordinary decode path also works.
  stat_in:
    type: statsd_in
    bind: 0.0.0.0:8125

  stdout:
    type: stdio_out
    sources: [stat_in]

  # `keep_signals` clears the payload slots it isn't given, so `logs_out` sees only
  # `LogRecord`-carrying events, never a point or a span.
  logs_only:
    type: keep_signals
    sources: [self]
    signals: [logs]

  logs_out:
    type: stdio_out
    sources: [logs_only]
