# One connection, N streams: the central half. fixtures/fan-out-edge.yaml is the far side and
# says how to run both together; fixtures/forwarder-central.yaml has the `logit_in` field
# reference this file doesn't repeat.
#
# Topology (this file):
#
#                                            /--> host_stream (target) --> windowed (aggregate) --> metrics_out
#   [the wire] --> central_in --> split (route) --> app_stream  (target) -----------------------> app_out
#                                            \--> (unrouted: split's own consumers) --------------> untagged_out
#
# `stdio_out` stands in for a real sink so the example runs with no external service.
components:
  central_in:
    type: logit_in
    bind: 0.0.0.0:5150

  # `route` is the native equality-only router (docs/adr/target-components.md): it reads one key
  # per event (`by:`) and moves each event into the `target` its value maps to. It's a partition,
  # not a fan-out plus filters, so the batch is split in one pass and never cloned
  # (docs/design/memory.md's "Routing" section has the allocation counts).
  split:
    type: route
    sources: [central_in]
    by: {attribute: stream}
    routes:                  # value -> target id; these are the graph's split -> target edges
      host: host_stream
      app: app_stream
    # Alternative `by:` forms, same shape:
    #   by: {resource: service.name}      -- match what a `set` with a `resource:` block stamped,
    #                                         once per batch rather than once per event.
    #   by: {provenance: origin}          -- route on which listener the event arrived through:
    #     routes: {host_in: host_stream, app_in: app_stream}
    #                                      -- reads fixtures/fan-out-edge.yaml's listener ids off
    #                                         the wire, so the edge needs no `set`, at the cost of
    #                                         coupling this file to the edge's component ids.

  # Named destinations `split` fills: no fields, no `sources` of their own. A target is a
  # zero-cost alias (no task, no inbox) that consumers read like any other source.
  host_stream: {type: target}
  app_stream: {type: target}

  # The 60s window happens here, once, centrally; the edge forwards everything unaggregated. A
  # batch arriving here carries `provenance.previous: host_stream`, the target's id, not `split`.
  windowed:
    type: aggregate
    sources: [host_stream]
    interval: 60s

  metrics_out:
    type: stdio_out
    sources: [windowed]
    target: stdout

  app_out:
    type: stdio_out
    sources: [app_stream]
    target: stdout

  # The else branch: everything `stream: host`/`stream: app` didn't claim, including an absent
  # `stream`. A router's own `sources:` edge is where its unrouted events go. With no consumer here
  # they'd be dropped and counted `logit.component.events.dropped{reason="unrouted"}`.
  untagged_out:
    type: stdio_out
    sources: [split]
    target: stderr
