# Relays OTLP into all three Victoria products: metrics to VictoriaMetrics, logs to VictoriaLogs,
# and traces to VictoriaTraces, each over OTLP/HTTP (docs/adr/victoriametrics-interop.md). Point
# your OpenTelemetry SDKs or Collector at `otlp_in`, and change each `endpoint` to your product.
#
# One `otlp_out` posts every signal it carries to one host, and a product answers a signal it
# doesn't ingest with a `404`, which `otlp_out` reads as that signal's rejection: it drops the
# signal's records and spends the request again on every batch. So each product gets its own
# `otlp_out` behind a `route_signals`, which gives each target only its own signal.
#
# What to know per product (docs/deploying.md's "VictoriaMetrics, VictoriaLogs, and
# VictoriaTraces" section):
#
# - VictoriaMetrics keeps no temporality and stores a delta `Sum` as raw per-interval points. If
#   your SDKs export delta temporality, put an `aggregate` with `temporality: cumulative` between
#   `metric_events` and `victoria_metrics`.
# - VictoriaLogs maps the OTLP log body to `_msg` with no `VL-Msg-Field` header; `VL-Stream-Fields`
#   names the fields that identify a log stream.
# - VictoriaTraces also takes OTLP/gRPC, but its gRPC listener closes each connection after about
#   5 seconds without a `GOAWAY`, and a batch in flight at that moment is dropped. Use HTTP.
# - VictoriaMetrics and VictoriaLogs label every record whose OTLP scope is empty with
#   `scope.name="unknown"` and `scope.version="unknown"`. Batches from `otlp_in` keep the scope
#   the SDK sent. For a scope-less source, start VictoriaMetrics with
#   `-opentelemetry.promoteScopeMetadata=false`, or write `scope.name` and `scope.version` in a
#   `lua` stage (docs/design/lua-api.md's "Reading and writing `scope`").
components:
  otel:
    type: otlp_in
    # No authentication on this listener: bind loopback or pod-local, or front it with something
    # that authenticates.
    bind: 127.0.0.1:4318
    protocol: http

  # Sends each signal to its product's target. An event carrying signals for different products
  # is split into one event per target, each holding only that target's payloads. Anything with no
  # signal is discarded and counted.
  by_signal:
    type: route_signals
    sources: [otel]
    signals:
      metrics: metric_events
      logs: log_events
      traces: trace_events

  metric_events:
    type: target

  log_events:
    type: target

  trace_events:
    type: target

  # The three sinks share `otel`, so each spools to disk: one product that's down fills its own
  # spool instead of stopping `otel` for the other two.
  victoria_metrics:
    type: otlp_out
    sources: [metric_events]
    # The OTLP base path; `otlp_out` appends `/v1/metrics`.
    endpoint: http://127.0.0.1:8428/opentelemetry
    buffer:
      disk:
        path: /tmp/logit-spool/victoriametrics-otlp/victoria_metrics

  victoria_logs:
    type: otlp_out
    sources: [log_events]
    endpoint: http://127.0.0.1:9428/insert/opentelemetry
    headers:
      VL-Stream-Fields: service.name
    buffer:
      disk:
        path: /tmp/logit-spool/victoriametrics-otlp/victoria_logs

  victoria_traces:
    type: otlp_out
    sources: [trace_events]
    endpoint: http://127.0.0.1:10428/insert/opentelemetry
    buffer:
      disk:
        path: /tmp/logit-spool/victoriametrics-otlp/victoria_traces
