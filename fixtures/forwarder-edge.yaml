# The native-transport forwarding pair (docs/plans/native-transport.md): a sidecar-shaped `logit`
# collects statsd locally and forwards everything, unaggregated, to a central `logit` over the
# native protocol. The edge collects; fixtures/forwarder-central.yaml windows and sinks.
#
# Run alongside fixtures/forwarder-central.yaml. Start the central process first, or `logit_out`
# keeps retrying the connection (lazy connect, not a config error). Change `endpoint` below to
# the central host.
#
#   logit run fixtures/forwarder-central.yaml &
#   logit run fixtures/forwarder-edge.yaml
#
# Topology (this file):
#
#   statsd (UDP) --> edge_in (statsd_in) --> central_out (logit_out) --> [the wire] --> central
components:
  edge_in:
    type: statsd_in
    bind: 0.0.0.0:8125

    # Every field below is its default; omit the block for the same effect.
    # receive:
    #   max_datagrams: 10000        # queue depth; whichever of this or max_bytes trips first
    #   max_bytes: "32MiB"
    #   overflow: drop_oldest       # block | drop_oldest | drop_newest; blocking a UDP reader moves
    #                               # loss into the kernel, where nothing counts it
    #   batch_max_events: 1000      # 1 means one send per datagram
    #   batch_max_bytes: "1MiB"
    #   batch_flush_interval: 100ms # 0s disables the timer
    #   receive_buffer_bytes: null  # SO_RCVBUF; null leaves the kernel default alone
    #   read_batch: 64              # datagrams per recvmmsg(2) read; Linux-only effect
    #   shutdown_grace: 5s

  central_out:
    type: logit_out
    sources: [edge_in]
    endpoint: central:5140
    # compression: none          # none | lz4, offered in Hello; the peer may negotiate it down
    # request_timeout: 10s        # connect, handshake, and per-batch ack wait, one knob
    # tls:                        # presence turns TLS on; `endpoint` has no scheme to signal it
    #   ca_file: ca.pem
    #   cert_file: client.pem     # cert_file/key_file together, for mutual TLS
    #   key_file: client.key
    #   insecure_skip_verify: false

    # Every field below is its default; omit the block for the same effect
    # (docs/adr/buffered-sink-delivery.md).
    # buffer:
    #   max_batches: 1024
    #   max_bytes: 64MiB
    #   overflow: block
    #   delivery: null             # null derives from duplicate_safe(); logit_out is false, so
    #                                 at_most_once
    #   retry_budget: 60s
    #   retry_max_delay: 10s
    #   shutdown_grace: 5s
