# statsd/DogStatsD in, a 10s aggregation window, Graphite/Carbon out: the cross-protocol
# counterpart to examples/graphite-relay.yaml, for pointing a statsd-speaking fleet at a Carbon
# stack (docs/adr/graphite-carbon-relay.md). Change `endpoint` to your carbon receiver.
#
# `aggregate` does real work here: a carbon datapoint is one number, so a window of counter
# increments or timer samples has to become the single reading each flush emits. Its default
# `distributions: sketch`/`sets: estimate` summarizes timers and sets, and `multi_value: expand`
# on `graphite_out` renders those summaries as dotted sub-paths; `skip` (the default) drops every
# multi-value record, raw or summarized.
#
# A repeated DogStatsD tag key (`#team:a,team:b`) decodes to an array, and `graphite_out` renders
# only its last element as the carbon tag, counted
# `logit.output.tags.normalized{reason="multi_value"}`: carbon's tag grammar can't express one key
# with several values. Resource attributes become carbon tags too.
components:
  statsd_in:
    type: statsd_in
    bind: 0.0.0.0:8125

  windowed:
    type: aggregate
    sources: [statsd_in]
    interval: 10s
    # Every field below is its default; omit it for the same effect
    # (docs/adr/aggregation-window-semantics.md).
    # distributions: sketch      # sketch (default) | samples -- expand renders either as
    #                            # .count/.sum/.q0_5.../.q0_99 (raw samples are sketched first)
    # sets: estimate             # estimate (default) | members -- expand renders either as .count

  graphite_out:
    type: graphite_out
    sources: [windowed]
    endpoint: central-carbon:2003
    # `tags:` is the default; `multi_value:` is not. These are the two settings this hop depends on.
    tags: carbon
    # `skip` (the default) drops every flushed Distribution/Set record, counted
    # `metrics.skipped{metric_kind=...}`, so this example would relay nothing. `expand` renders
    # each as the dotted sub-paths `crates/logit-proto/src/graphite/mod.rs`'s module doc lists.
    multi_value: expand
    # Every other field below is its default; omit it for the same effect.
    # transport: tcp             # tcp (default) | udp
    # protocol: plaintext        # plaintext (default) | pickle -- pickle requires transport: tcp
    # max_packet_bytes: "1432"   # udp only: one datagram's worth of packed lines
    # max_frame_bytes: "1MiB"    # one pickle frame, regardless of transport
    # connect_timeout: 5s        # tcp only
    # buffer: (all defaults; examples/statsd-to-influxdb.yaml has the full block)
