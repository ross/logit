# Consistent, keyed sampling (docs/adr/consistent-sampling-component.md): `sample` keeps a
# fraction of traces, not of events. Every event of a kept trace survives, none of a dropped one
# does, and every `logit` process reaches the same verdict with nothing propagated between them.
# Self-contained: no socket, no service; it runs and exits.
#
#   gen ──────────┐
#                 ├─> traced (trace_context) ─> sampled (sample) ─> out (stdio_out)
#   gen_flagged ──┘
#
#   logit run examples/sample-traces.yaml | grep -o 'trace_id=[0-9a-f]*' | sort | uniq -c
#
# prints the trace ids that survived and how many events each kept: about half of the ten, each
# with all 100 of its events plus the flagged ones, and the same half every run, because the
# verdict is a hash of the trace id, not a draw. A trace kept at `rate: 0.3` is also kept at 0.5;
# changing the rate only moves the threshold.
#
# In the split-collection topology (docs/OVERVIEW.md) the same component sits on every collector a
# trace's spans pass through, and each keeps the same traces independently:
#
#   spans_in:
#     type: otlp_in
#     bind: 0.0.0.0:4318
#   sampled:
#     type: sample
#     sources: [spans_in]
#     rate: 0.1
#     key: trace_id
#   spans_out:
#     type: otlp_out
#     sources: [sampled]
#     endpoint: http://tempo:4318
components:
  # 1000 log lines across ten traces, 100 each: `{seq%10}` completes a 32-hex-character W3C trace
  # id, so `trace.id` cycles through ten distinct ids.
  gen:
    type: generate_in
    count: 1000
    batch: 100
    rate: 5000
    resource:
      service.name: checkout
    event:
      log: '{{"msg":"step","request":{seq}}}'
      attributes:
        trace.id: "4bf92f3577b34da6a3ce929d0e0e473{seq%10}"
        request_id: "{seq}"

  # Ten more lines from the same ten traces, each carrying `sampling.keep`, the "keep this request
  # whatever the rate" flag. These survive even in a trace `sample` drops; the rest of that trace's
  # events still don't, because the override is per event and per leg.
  gen_flagged:
    type: generate_in
    count: 10
    batch: 10
    resource:
      service.name: checkout
    event:
      log: '{{"msg":"debug","request":"flagged-{seq}"}}'
      attributes:
        trace.id: "4bf92f3577b34da6a3ce929d0e0e473{seq%10}"
        sampling.keep: "true"

  # Lifts `trace.id` onto each line's `LogRecord.trace`, which `key: trace_id` reads on an event
  # with no span (and which `otlp_in` sets on a real OTLP log). `key: {attribute: trace.id}` on the
  # unlifted hex string reaches the same verdicts.
  traced:
    type: trace_context
    sources: [gen, gen_flagged]

  sampled:
    type: sample
    sources: [traced]
    # In [0, 1]. `1` is rejected as a no-op; `0` is rejected unless `always_keep` is set.
    rate: 0.5
    # `trace_id`, `{attribute: <name>}`, or `{resource: <name>}`; omit for a per-event draw.
    key: trace_id
    # An event with no key: `random` (the default) draws for it, `keep` forwards it, `drop` drops
    # it. None arrive here.
    missing: drop
    # Kept unconditionally when the event carries this attribute, any value. A `value:` compares
    # as `has_attributes` does, so `value: true` would not match the string "true" these lines
    # carry.
    always_keep:
      attribute: sampling.keep

  out:
    type: stdio_out
    sources: [sampled]
    target: stdout
