# The central half of the native-transport forwarding pair. examples/forwarder-edge.yaml is the
# far side and says how to run both together.
#
# Topology (this file):
#
#   [the wire] --> central_in (logit_in) --> windowed (aggregate) --> central_out (stdio_out)
#
# The 60s window happens here, once; the edge forwards everything unaggregated, so
# docs/adr/aggregation-window-semantics.md's merge applies once, not per hop. `stdio_out` stands
# in for a real sink so the example runs with no external service.
components:
  central_in:
    type: logit_in
    bind: 0.0.0.0:5140
    # tls:                        # presence turns TLS on
    #   cert_file: server.pem
    #   key_file: server.key
    #   client_ca_file: null       # set for mutual TLS
    # max_frame_bytes: 64MiB       # caps one frame, pre- and post-decompression alike
    # handshake_timeout: 5s        # per pre-Hello phase (TLS accept, then the Hello read), so a
    #                                TLS peer that sends no Hello costs up to twice this
    # idle_timeout: 5m              # off by default; closes a handshaken connection quiet for
    #                                this long. Size it above the sender's longest normal gap
    #                                (docs/adr/idle-connection-timeout.md).

  windowed:
    type: aggregate
    sources: [central_in]
    interval: 60s

  central_out:
    type: stdio_out
    sources: [windowed]
    target: stdout
