# Reference nginx config for docs/plans/nginx-integration.md's workstream F: proves
# syslog_in -> json -> kv_metrics -> keep -> aggregate -> influxdb_out (plus stdio_out for
# visibility) against a real nginx, end to end in this repo's own dev stack. Also exercises
# docs/plans/access-log-spans.md's workstream B: the same access line also carries the
# trace-context/span convention (docs/design/data-model.md's "Well-known attribute names"), so
# `examples/nginx-to-influxdb.yaml`'s `nginx_trace` stage can turn it into a real span.
#
# Three server blocks: a plain static vhost, a proxied vhost with a real upstream hop (so
# $upstream_response_time is actually populated), and the (unexposed) upstream itself. Two
# log_formats, both `escape=json` so any character JSON can't represent literally is escaped
# rather than corrupting the line -- see docs/adr/json-parsing-into-attributes.md for what
# `json` expects on the receiving end.

load_module modules/ngx_http_js_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    js_path "/etc/nginx/njs/";
    js_import main from delay.js;

    # No `map` blocks any more (docs/adr/http-access-normalization.md): `trace_context`'s
    # `mint_id: true` mints this vhost's own span id directly -- nginx has no upstream hop of its
    # own to receive a minted id from, so it played the trace's edge, and previously did that with
    # a `$request_id`-prefix `map` trick; that trick is gone, `mint_id: true` is the whole story
    # now. A malformed inbound `traceparent` reaches `trace_context` raw and is counted `invalid`
    # instead of being silently blanked into `missing` by a regex `map` that swallowed it before
    # `trace_context` ever saw it.

    # Verbose; nginx's own container log (stdout only) -- never ingested by `logit` in this
    # topology. Kept as a cutover safety net: see the two `access_log` directives below.
    log_format access_json_full escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
        '"request_method":"$request_method","request_uri":"$request_uri","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time","http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"}';

    # Lean; syslog only -- raw OTel semconv attribute names, the untouched value, per
    # docs/adr/http-access-normalization.md: nothing here is capped, coerced, or classified --
    # that's `http_access`'s job, downstream (`examples/nginx-to-influxdb.yaml`'s `nginx_http`).
    #
    # Quoting rules (docs/plans/http-access-normalization.md's "Producer configs (W5)",
    # verified per-field against nginx.org): quote (as a JSON string) any field that can render
    # non-numeric, empty, or unset on some path; leave bare (a JSON number) only a field that is
    # always well-formed. Concretely:
    #   - `http.response.status_code` ($status) is QUOTED, not bare: nginx can log a non-numeric
    #     "000" status on an abnormal connection termination (trac #1415, #2623) -- an unquoted
    #     `"http.response.status_code":000` is invalid JSON (a leading zero) and loses the whole
    #     line, which is exactly the bug found while writing that ADR. `http_access` coerces the
    #     quoted "000" to `I64(0)`.
    #   - Every `$upstream_*` variable is QUOTED: on a non-proxied vhost these render as `"-"`
    #     ($upstream_addr/$upstream_status) or `""` (the three $upstream_*_time variables --
    #     nginx's JSON-escaping variable copier doesn't replicate the plain copier's
    #     not-found-to-"-" substitution) -- neither is a legal bare JSON number, and on a retried
    #     request the *_time variables become a comma-separated per-attempt list either way.
    #   - Every `$http_*` header variable, `$remote_user`, and `$host` are QUOTED: any of them can
    #     be absent (renders empty) or, for a header, contain characters that only round-trip
    #     safely as a JSON string.
    #   - `"span.end_s":"$msec"` is QUOTED even though `$msec` is always numeric: unquoted, it
    #     parses as an `f64` and loses nginx's exact millisecond digits at epoch magnitude (a
    #     float's ~15-17 significant digits versus $msec's ~13); quoted, `trace_context` parses it
    #     through the exact decimal parser instead. `"http.request.duration_s":$request_time` is
    #     left bare for the opposite reason -- it's a small, sub-second magnitude where an `f64`
    #     loses nothing worth preserving, and `http_access`'s duration coercion accepts either
    #     form.
    #   - `$body_bytes_sent`/`$request_length`/`$bytes_sent` are always well-formed non-negative
    #     integers, so all three are left bare.
    #
    # Always `$request_uri` for `url.original`, never `$uri`: `$uri` is documented as
    # "normalized" and can change mid-request (internal redirects, index files), while
    # `$request_uri` is the untouched "full original request URI (with arguments)" -- the raw
    # value `http_access` expects to decompose into `url.path`/`url.query`.
    log_format access_semconv escape=json
        '{"http.request.method":"$request_method","url.original":"$request_uri",'
        '"url.scheme":"$scheme","network.protocol.version":"$server_protocol",'
        '"http.response.status_code":"$status","http.response.body.size":$body_bytes_sent,'
        '"http.response.size":$bytes_sent,"http.request.size":$request_length,'
        '"http.request.duration_s":$request_time,"server.address":"$host",'
        '"client.address":"$remote_addr","user_agent.original":"$http_user_agent",'
        '"http.request.header.referer":"$http_referer","user.name":"$remote_user",'
        '"upstream.address":"$upstream_addr","upstream.status":"$upstream_status",'
        '"upstream.duration_s":"$upstream_response_time",'
        '"upstream.connect_s":"$upstream_connect_time",'
        '"upstream.header_s":"$upstream_header_time",'
        '"traceparent":"$http_traceparent","span.end_s":"$msec"}';

    server {
        listen 80;
        server_name static.local;

        access_log /dev/stdout access_json_full;
        access_log syslog:server=logit:5140,tag=nginx_access,nohostname access_semconv;

        location / {
            root /usr/share/nginx/html;
        }
    }

    server {
        listen 80;
        server_name proxy.local;

        access_log /dev/stdout access_json_full;
        access_log syslog:server=logit:5140,tag=nginx_access,nohostname access_semconv;

        location / {
            proxy_pass http://127.0.0.1:8081/;
            # Forwards an inbound traceparent unchanged (proxy_pass forwards headers by default
            # regardless, but this documents the intent); the upstream below logs no access line
            # of its own, so there's no second span to parent here today -- see
            # docs/known-gaps.md's entry on deriving an upstream CLIENT span from
            # $upstream_connect_time/$upstream_header_time/$upstream_response_time.
            proxy_set_header traceparent $http_traceparent;
        }
    }

    # The proxy vhost's upstream -- not otherwise exposed (bound to loopback only), one container,
    # no second image, still a real proxy_pass hop so $upstream_response_time is genuinely
    # populated rather than synthesized. Its own access log is silenced: not required for the
    # integration proof, and keeping it off is what keeps stdio_out's output focused on the two
    # public vhosts.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        # Randomized 10-300ms response delay via njs (docs/plans/nginx-integration.md) so
        # nginx.request_time/nginx.upstream_response_time show a real distribution instead of
        # near-uniform sub-millisecond values -- a DdSketch's percentiles are a much more
        # convincing proof point at p50/p90/p99 when the underlying latencies actually vary.
        location / {
            js_content main.delay;
        }
    }
}
