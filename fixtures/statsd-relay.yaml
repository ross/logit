# A statsd/DogStatsD relay: receive on one edge, aggregate, forward to a central statsd/DogStatsD
# agent (docs/adr/statsd-output.md). Counters, gauges, raw timers/histograms/distributions, raw
# sets, and DogStatsD events/service checks round-trip through the real decoder on the other end,
# modulo the normalizations docs/adr/lossless-transit.md permits. Change `endpoint` to your
# central agent.
#
# `windowed` runs `aggregate`'s default `distributions: sketch`/`sets: estimate`, which summarizes
# every timer and set into a sketch or an estimate. `statsd_out` writes each as dotted lines
# (`req.latency.count|c`, `req.latency.sum|c`, `req.latency.max|g`, `req.latency.q0_99|g`,
# `uniq.users.count|g`) under its default `multi_value: expand`
# (docs/adr/statsd-out-multi-value-expansion.md). Configure `distributions: samples`/`sets: members`
# to relay the timer and set lines themselves, so the central agent computes its own aggregates.
components:
  statsd_in:
    type: statsd_in
    bind: 0.0.0.0:8125

  windowed:
    type: aggregate
    sources: [statsd_in]
    interval: 10s

  statsd_out:
    type: statsd_out
    sources: [windowed]
    endpoint: central-statsd:8125
    # Every field below is its default; omit it for the same effect.
    # transport: udp             # udp | tcp
    # format: dogstatsd          # dogstatsd | statsd -- statsd omits the "|#tag:value,..." segment
    # relative_gauges: false     # encode a GaugeDelta natively instead of dropping it, counted; for
    #                            # relaying gauges with no `aggregate` resolving them first
    # multi_value: expand        # expand | skip -- skip drops sketches, set estimates, histograms,
    #                            # and summaries, counted, instead of writing dotted lines
    # max_packet_bytes: "1432"   # one UDP datagram's worth of packed lines; ignored under tcp
    # connect_timeout: 5s        # tcp only -- bounds the connect and the TLS handshake separately
    # tls:                       # presence turns TLS on and makes it required; tcp only
    #   ca_file: ca.pem
    #   cert_file: client.pem    # cert_file/key_file together, for mutual TLS
    #   key_file: client.key
    #   insecure_skip_verify: false
    # buffer: (all defaults; fixtures/statsd-to-influxdb.yaml has the full block)
