# Pushes metrics into a remote-write receiver (Mimir, Thanos, Grafana Cloud, or a Prometheus
# started with `--web.enable-remote-write-receiver`): `prometheus_out` with `endpoint:` is the
# remote-write sender (docs/adr/prometheus-remote-write.md). Pushing is how a `logit` behind a NAT
# or in a short-lived container gets its series out. Change `endpoint` to your receiver and set
# `PROMETHEUS_REMOTE_WRITE_AUTHORIZATION` in the environment.
#
# VictoriaMetrics takes remote-write too, but only `version: 1`: it answers a 2.0 request `204` and
# stores nothing. examples/victoriametrics-remote-write.yaml is the config for it.
#
# `statsd_in -> aggregate -> prometheus_out`, so this runs against the dev stack's statsd port with
# nothing external on the ingress side. The `aggregate` is not optional: Prometheus counters are
# cumulative, `prometheus_out` never accumulates a delta (a delta `Sum`/`Histogram` reaching it is
# skipped and counted), and `temporality: cumulative` is the named stage that keeps the running
# total, as in examples/prometheus-expose.yaml.
components:
  app_metrics:
    type: statsd_in
    bind: 127.0.0.1:8125

  windowed:
    type: aggregate
    sources: [app_metrics]
    interval: 10s
    temporality: cumulative
    # `series_retention` and `max_retained_series` stay at their non-zero defaults, which
    # `temporality: cumulative` requires: they keep a running total alive across windows.

  remote_write:
    type: prometheus_out
    sources: [windowed]
    # An absolute http(s) URL, path included; `/api/v1/write` is what Prometheus, Mimir, and
    # Thanos default to. `path:` belongs to the exposition mode and is rejected with `endpoint:`.
    endpoint: http://127.0.0.1:9090/api/v1/write
    # 1 (`prometheus.WriteRequest`, the default) or 2 (`io.prometheus.write.v2.Request`). No
    # negotiation and no fallback: pick what your receiver speaks. Only 2 carries a counter's start
    # time.
    version: 1
    # compression: snappy        # the default; `zstd` is the VictoriaMetrics remote write
    #                             # protocol, version 1 only, and Prometheus and Mimir reject it
    # Extra headers on every request: `X-Scope-OrgID` for a multi-tenant Mimir, `Authorization`
    # for anything token-guarded. `!env` substitutes the whole value, so the variable holds the
    # `Bearer ` prefix too (docs/adr/env-yaml-tag.md). A header the protocol owns (content-type,
    # content-encoding, content-length, x-prometheus-remote-write-version, user-agent) is rejected
    # at startup.
    headers:
      Authorization: !env PROMETHEUS_REMOTE_WRITE_AUTHORIZATION
    # timeout: 10s                # per-request timeout on the POST
    # endpoint_tls:               # client TLS tuning for an https:// endpoint; a config error under
    #                             # http://. Omitted, an https:// endpoint still verifies against
    #                             # the bundled Mozilla roots
    #   ca_file: ca.pem           # resolved against this config file's directory; a private CA
    #   cert_file: client.pem     # cert_file/key_file together, for mutual TLS
    #   key_file: client.key
    # buffer: (all defaults, docs/adr/buffered-sink-delivery.md). The sink itself never retries;
    #         the buffer's retry budget covers a 429 or 5xx, and a replayed request is an
    #         idempotent overwrite.
