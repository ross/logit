# Receives Prometheus remote-write and re-exposes it for something else to scrape. `prometheus_in`
# with `bind:` is the remote-write receiver; `prometheus_out` with `bind:` serves an exposition
# endpoint (docs/adr/prometheus-remote-write.md). Remote-write is the only way to get the series a
# Prometheus has ingested into `logit`: its own `/metrics` exposes its internal telemetry, not its
# TSDB.
#
# Point a Prometheus at this with:
#
#   remote_write:
#     - url: http://<this-host>:9201/api/v1/write
#       protobuf_message: prometheus.WriteRequest      # or io.prometheus.write.v2.Request
#
# The listener accepts both wire versions, chosen per request from its `Content-Type`.
#
# `instance` and `job` arrive as labels and stay attributes, verbatim: the receiver stamps no
# resource identity of its own. Add a `set` component if you want one.
components:
  remote_write_in:
    type: prometheus_in
    # `bind_tls:` gives this listener transport security, not authentication (docs/known-gaps.md):
    # bind loopback or pod-local and front it with something that authenticates.
    bind: 127.0.0.1:9201
    # path: /api/v1/write         # the one path POSTs are accepted on
    # bind_tls:                   # presence turns server TLS on for this listener
    #   cert_file: server.pem     # resolved against this config file's directory
    #   key_file: server.key
    #   client_ca_file: ca.pem    # omit for server-auth-only TLS; set it to require a client cert
    # Off by default, and set here because senders write on a fixed cadence: a connection quiet
    # for a minute is not coming back. It also bounds a request whose body stalls mid-upload,
    # which otherwise holds one of the listener's 1024 connection permits until the sender goes
    # away (docs/adr/idle-connection-timeout.md). 60s clears Prometheus's 30s default
    # `remote_timeout`.
    idle_timeout: 60s
    # A 1.0 sender ships metric metadata in requests of its own, on its own schedule, so without
    # this cache nearly every request decodes as untyped series: nothing is lost, but a counter's
    # or a histogram's series arrive unrelated and flat. 2.0 is fully typed without it, so a
    # 2.0-only deployment can turn it off. Both values are the defaults, shown because this is the
    # one bind-mode setting worth thinking about rather than inheriting.
    metadata_cache:
      max_families: 10000 # hard cap on remembered families; over it the least-recently-declared is
      #                     evicted, counted logit.input.metadata_cache.evicted{reason="cardinality"}.
      #                     0 turns the cache off
      ttl: 10m # a family not re-declared within this window is forgotten (counted
      #          reason="expired"); keep it above the sender's `metadata_config.send_interval`

  metrics:
    type: prometheus_out
    sources: [remote_write_in]
    # Exposition mode: received series are held and rendered on demand, in the dialect the
    # scraper's `Accept` asks for. Loopback for the same reason as above: no TLS and no auth here.
    bind: 127.0.0.1:9464
