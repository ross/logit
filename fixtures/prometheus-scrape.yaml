# Scrapes one node-exporter-style `/metrics` endpoint on the standard 15s Prometheus cadence and
# prints the decoded events to stdout (docs/adr/prometheus-scrape-and-exposition.md). Change
# `scrape_targets` to the host your exporter listens on; `127.0.0.1` matches a node-exporter
# running alongside `logit`.
#
# `prometheus_in` in scrape mode is an HTTP client and binds no socket of its own.
components:
  node_exporter:
    type: prometheus_in
    scrape_targets: ["http://127.0.0.1:9100/metrics"]
    interval: 15s

  stdout:
    type: stdio_out
    sources: [node_exporter]
