# Relays an OpenTelemetry SDK's metrics to a remote-write receiver with each point's own
# timestamp: OTLP/HTTP in, `dedup_timestamps` collapsing two readings of one series in one
# millisecond, and `prometheus_out` sending remote-write. A remote-write series holds one sample
# per millisecond, and a receiver keeps the first of two in one request and drops the second
# silently (docs/adr/dedup-timestamps-transform.md). In front of it, the later reading survives
# and deltas are summed.
#
# Place `dedup_timestamps` last before the sink: a stage after it can make two series equal
# again. It works within one batch, so two batches' readings of one instant both reach the
# receiver. Use `precision: 1s` instead in front of `datadog_out`.
#
# A delta counter still needs `aggregate` with `temporality: cumulative` upstream, as in
# fixtures/prometheus-remote-write-send.yaml: `prometheus_out` drops a delta `Sum`. An SDK left at
# its default cumulative temporality needs nothing more.
components:
  otel:
    type: otlp_in
    # No authentication on this listener: bind loopback or pod-local, or front it with something
    # that authenticates.
    bind: 127.0.0.1:4318
    protocol: http

  one_per_ms:
    type: dedup_timestamps
    sources: [otel]
    # Required: remote-write's resolution.
    precision: 1ms

  remote_write:
    type: prometheus_out
    sources: [one_per_ms]
    endpoint: http://127.0.0.1:9090/api/v1/write
    version: 1
