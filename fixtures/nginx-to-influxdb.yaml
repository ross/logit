# The nginx reference example (docs/plans/nginx-integration.md):
# syslog_in -> json -> http_access -> trace_context -> kv_metrics -> keep -> keep_values ->
# aggregate -> influxdb_out, plus `stdio_out` taps, against the real nginx in examples/nginx/ in
# the dev stack (`script/server`).
#
# This is a contributor-facing fixture, not the recommended starting point: compose.yaml's
# `nginx` service and crates/logit-bench/src/fixtures.rs's NGINX_SYSLOG_LINE depend on
# examples/nginx/ staying real. To see `logit` work, run `demo/` instead (`script/demo`).
#
# Topology:
#
#   nginx --syslog/UDP--> nginx_in (syslog_in)
#                              |
#                              v
#                       nginx_identity (set)          <- stamps service.name on the batch's
#                              |                          resource
#                              v
#                          nginx_json (json)          <- merges the JSON body into attributes
#                              |
#                              v
#                          nginx_http (http_access)   <- normalizes the raw semconv fields, derives
#                              |                          http.route/user_agent.class/span.name
#                              v                          (docs/adr/http-access-normalization.md)
#                         nginx_trace (trace_context)  <- lifts the traceparent onto LogRecord.trace
#                              |                           and mints a span on the same event
#                              v                           (docs/adr/trace-context-span-lifting.md)
#                          nginx_metrics (kv_metrics) <- adds metrics to the same event
#                  +-----------+-----------+-----------------------------+
#                  v                       v                             v
#             stdio_out              trimmed (keep)   <- drops   nginx_spans (keep_signals: [traces])
#                                          |             high-cardinality        |
#                                          v             attrs                   v
#                                  bounded (keep_values) <- clamps           span_tap (stdio_out)
#                                          |                server.address
#                                          v                to the two real vhosts
#                                    windowed (aggregate)
#                                          |
#                                          v
#                                     influx_out
#
# `nginx.conf`'s `access_semconv` log_format logs raw OTel semconv attribute names with the
# untouched value; capping, coercing, and classifying is `nginx_http`'s job. `bounded` closes the
# cardinality half: nginx serves two vhosts, but `$host` is attacker-controlled, so without a
# clamp a stuffed Host header explodes both `aggregate`'s series count and the InfluxDB tag
# (docs/adr/value-allowlist-cardinality-clamp.md).
components:
  nginx_in:
    type: syslog_in
    bind: 0.0.0.0:5140

  # `syslog_in` doesn't invent a resource identity for data it didn't produce; `set` declares one
  # (docs/adr/operator-declared-resource-attributes.md), and `influx_out` writes it as a tag on
  # every metric.
  nginx_identity:
    type: set
    sources: [nginx_in]
    resource:
      service.name: nginx

  nginx_json:
    type: json
    sources: [nginx_identity]

  # Normalizes the raw semconv fields and, from `routes:`, derives a bounded `http.route`, which
  # names the span `nginx_trace` mints (`GET /{asset}`, never the raw path). Every `http.route`
  # value comes from this config or a built-in set: an unmatched path is `route_other`'s literal
  # `/{other}`, one series however many paths a scanner tries.
  nginx_http:
    type: http_access
    sources: [nginx_json]
    routes:
      - builtin: probes
      - builtin: assets
      - match: '^/$'
        route: /
    route_other: /{other}

  # Lifts the inbound `traceparent` onto LogRecord.trace and, via `span:`, mints a SpanRecord on
  # the same event from `span.end_s` and the `span.duration_s` `nginx_http` mirrored. `mint_id:
  # true` because nginx doesn't mint a span id of its own. `name:` is a fallback; `nginx_http`'s
  # `span.name` wins. The consumed attributes, `traceparent` included, are removed
  # (`keep_source` at its default `false`), so the stages below never see them.
  nginx_trace:
    type: trace_context
    sources: [nginx_http]
    span:
      kind: server
      name: http.request
      mint_id: true

  nginx_metrics:
    type: kv_metrics
    sources: [nginx_trace]
    counters:
      - name: nginx.requests # +1 per event
      - name: nginx.bytes_sent
        field: http.response.body.size
    distributions:
      - name: nginx.request_time
        field: http.request.duration_s
        unit: s
      - name: nginx.upstream_response_time
        field: upstream.duration_s # empty on a non-proxied request -> silently skipped
        unit: s

  tap:
    type: stdio_out
    sources: [nginx_metrics]

  # The span `nginx_trace` minted, isolated from the log+metrics event it rides in on:
  # `keep_signals` clears the other payload slots. Its own `stdio_out` keeps span lines apart from
  # `tap`'s log/metric lines; one sink could take both sources.
  nginx_spans:
    type: keep_signals
    sources: [nginx_trace]
    signals: [traces]

  span_tap:
    type: stdio_out
    sources: [nginx_spans]

  # `keep` before `aggregate`, not after: otherwise `aggregate` keys a series per request on every
  # syslog.* attribute (syslog.timestamp is unique per line) and on `url.path`/`client.address`.
  # The list is semconv's low-cardinality set for `http.server.request.duration` plus
  # `user_agent.class`, each bounded by construction or, for `server.address`, by `bounded` below.
  trimmed:
    type: keep
    sources: [nginx_metrics]
    fields:
      [
        server.address,
        http.request.method,
        http.response.status_code,
        http.route,
        network.protocol.version,
        url.scheme,
        user_agent.class,
      ]

  # `keep` bounds which keys reach `aggregate`; this bounds which values do. `server.address` is
  # nginx's `$host`, the client's Host header, so anything but the two real vhosts goes in one
  # `other` bucket. `normalize: [lower]` is redundant for nginx, which lowercases `$host` itself,
  # and load-bearing for any other syslog client feeding this listener.
  bounded:
    type: keep_values
    sources: [trimmed]
    attributes:
      server.address:
        normalize: [lower]
        allow: [static.local, proxy.local]
        other: other

  windowed:
    type: aggregate
    sources: [bounded]
    interval: 10s

  influx_out:
    type: influxdb_out
    sources: [windowed]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN
