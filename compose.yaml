services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_UID: "1000"
        USER_GID: "1000"
    image: logit-dev:local
    user: "1000:1000"
    working_dir: /work
    volumes:
      # :z relabels the bind mount for SELinux (Enforcing on Fedora); harmless where SELinux is
      # not in play.
      - .:/work:z
      - cargo_home:/home/dev/.cargo
      - target_cache:/work/target
    environment:
      CARGO_HOME: /home/dev/.cargo
      CARGO_TARGET_DIR: /work/target
      # Read by examples/statsd-to-influxdb.yaml's `token: !env INFLUXDB_TOKEN`
      # (docs/adr/0011-env-yaml-tag.md); matches the token influxdb seeds itself with below, and
      # is overridable from the host shell (`INFLUXDB_TOKEN=... script/server`).
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-logit-dev-token}
    networks:
      # `aliases` gives `dev` a second DNS name on the `logit` network, decoupled from the
      # dev-only service name -- this is the name examples/nginx/nginx.conf's
      # `access_log syslog:server=logit:5140,...` directive resolves, so it reads cleanly in
      # config and docs alike regardless of what the actual compose service is called.
      logit:
        aliases: [logit]
    command: sleep infinity

  influxdb:
    image: docker.io/library/influxdb:2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: logit
      DOCKER_INFLUXDB_INIT_PASSWORD: logit-dev-password
      DOCKER_INFLUXDB_INIT_ORG: logit
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: logit-dev-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks: [logit]

  grafana:
    image: docker.io/grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:z
      - grafana_data:/var/lib/grafana
    depends_on: [influxdb]
    networks: [logit]

  # The reference nginx example (docs/plans/0002-nginx-integration.md, workstream F;
  # examples/nginx/). Reaches `dev`'s syslog listener over the compose-internal `logit` network
  # by its `logit` alias above -- no `ports:` entry needed for UDP 5140, since nginx never talks
  # to it from the host.
  nginx:
    build:
      context: ./examples/nginx
    ports:
      - "8080:80"
    networks: [logit]
    # nginx resolves its `syslog:server=logit:5140` target at config-load time (startup), not
    # lazily on first write -- with no `dev` container up yet to carry the `logit` alias, nginx
    # fails to start outright ("host not found in syslog server"), confirmed empirically. This is
    # only a startup-order dependency, not a runtime one (UDP delivery to it afterward is
    # fire-and-forget either way): `depends_on` just needs `dev`'s container running, not `logit
    # run` actually listening on 5140 yet.
    depends_on: [dev]

networks:
  logit: {}

volumes:
  cargo_home: {}
  target_cache: {}
  influxdb_data: {}
  grafana_data: {}
