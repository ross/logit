services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
      args:
        USER_UID: "1000"
        USER_GID: "1000"
    image: logit-dev:local
    user: "1000:1000"
    working_dir: /work
    volumes:
      # :z relabels the bind mount for SELinux (Enforcing on Fedora); harmless where SELinux is
      # not in play.
      - .:/work:z
      - cargo_home:/home/dev/.cargo
      - target_cache:/work/target
    environment:
      CARGO_HOME: /home/dev/.cargo
      CARGO_TARGET_DIR: /work/target
      # Read by the fixtures' `token: !env INFLUXDB_TOKEN` (docs/adr/env-yaml-tag.md). Matches
      # the token influxdb seeds itself with below; override from the host shell.
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-logit-dev-token}
    networks:
      # The `logit` alias is the name fixtures/nginx/nginx.conf's `syslog:server=logit:5140`
      # resolves. Compose applies it only to the `up`-managed container, not to a `compose run`
      # one; see script/server.
      logit:
        aliases: [logit]
    command: sleep infinity

  influxdb:
    image: docker.io/library/influxdb:2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: logit
      DOCKER_INFLUXDB_INIT_PASSWORD: logit-dev-password
      DOCKER_INFLUXDB_INIT_ORG: logit
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: logit-dev-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks: [logit]

  grafana:
    image: docker.io/grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:z
      - grafana_data:/var/lib/grafana
    depends_on: [influxdb]
    networks: [logit]

  # The nginx fixture (fixtures/nginx/). Reaches `dev`'s syslog listener by its `logit`
  # alias on the internal network, so UDP 5140 needs no `ports:` entry.
  nginx:
    build:
      context: ./fixtures/nginx
    ports:
      - "8080:80"
    networks: [logit]
    # nginx resolves its syslog host at startup and fails ("host not found in syslog server") if
    # no container carries the `logit` alias yet. Only startup order matters: `dev` must be
    # running, not `logit run` listening, since UDP delivery is fire-and-forget.
    depends_on: [dev]

  # A single-node KRaft broker for fixtures/kafka-out.yaml, the version
  # testdata/interop/kafka/README.md records. It advertises `kafka:9092`, so only a client on the
  # compose network can reach it; topics are created on first use.
  kafka:
    image: docker.io/apache/kafka:4.2.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks: [logit]

networks:
  logit: {}

volumes:
  cargo_home:
    name: logit_cargo_home
  target_cache:
    name: logit_target_cache
  influxdb_data: {}
  grafana_data: {}
