[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# ISC/BSD-3-Clause/CDLA-Permissive-2.0 came in with reqwest's rustls TLS stack (ring, webpki,
# subtle, webpki-roots) -- all permissive, all fine to depend on.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "ISC", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates reference each other via `foo.workspace = true` with no inline version -- real
# for external/published deps to flag, meaningless here since every crate in this workspace has
# `publish = false` (Cargo.toml `[workspace.package]`) and none of them ever leaves the workspace.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
