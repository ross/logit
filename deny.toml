[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates reference each other via `foo.workspace = true` with no inline version -- real
# for external/published deps to flag, meaningless here since every crate in this workspace has
# `publish = false` (Cargo.toml `[workspace.package]`) and none of them ever leaves the workspace.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
