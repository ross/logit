# The logfmt counterpart of json-parse: generate_in renders a logfmt line, `logfmt` merges its
# nine key/values into attributes, null_out discards. No `kv_metrics`: this isolates the parse.
# Scenario table: docs/plans/load-test-harness.md, "Scenarios".
#
#   script/perf run --scenario logfmt-parse
#
# `gen`'s `log:` is `LOGFMT_LINE` from crates/logit-bench/src/fixtures.rs verbatim, so this parses
# the shape logit-bench's logfmt allocation tests and benches pin at the component level. No
# `{seq}` substitution, for json-parse's reason.
#
# Read against json-parse: nine keys per line against six, each through the transform's own
# `logit_core::interner::KeyCache` (crates/logit-transforms/src/logfmt.rs), so the pair compares
# two tokenizers at two key counts, not two interning strategies.
components:
  gen:
    type: generate_in
    count: 9500000
    event:
      log: 'level=info ts=2026-09-07T06:52:01Z caller=metrics.go:159 component=frontend org_id=fake latency=fast duration=12.3ms status=200 msg="query stats"'

  parsed:
    type: logfmt
    sources: [gen]

  out:
    type: null_out
    sources: [parsed]
