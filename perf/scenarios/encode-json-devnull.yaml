# The NDJSON encoder in situ: generate_in straight into file_out at /dev/null under `format: json`
# (logit_outputs::ndjson), a real sink doing real encode-and-write work. Pairs with
# encode-human-devnull and encode-native-devnull on the identical event stream; the gap from
# passthrough is the encoder's own cost. Scenario table: docs/design/performance.md,
# "Scenarios".
#
#   script/perf run --scenario encode-json-devnull
components:
  gen:
    type: generate_in
    count: 8000000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  out:
    type: file_out
    sources: [gen]
    path: /dev/null
    format: json
