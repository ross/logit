# The NDJSON encoder in situ: generate_in straight into file_out at /dev/null under `format: json`
# (logit_outputs::ndjson), a real sink doing real encode-and-write work. Pairs with
# encode-human-devnull and encode-native-devnull on the identical event stream; the gap from
# passthrough is the encoder's own cost. Scenario table: docs/plans/load-test-harness.md,
# "Scenarios".
#
#   script/perf run --scenario encode-json-devnull
#
# `rotate:` is required: graph rule 29 rejects a `file_out` whose rotation block would never
# rotate. `max_bytes: "100GiB"` is above anything this count can encode, so it never triggers;
# calendar rotation (`interval:`) could trip for real if a run straddled an hour or day boundary.
components:
  gen:
    type: generate_in
    count: 8000000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  out:
    type: file_out
    sources: [gen]
    path: /dev/null
    format: json
    rotate:
      max_bytes: "100GiB"
