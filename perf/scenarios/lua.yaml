# The Lua hop and its event proxy: generate_in feeds a `lua` component running the enrichment
# script logit-bench measures at the component level, null_out discards. Measures the cost of
# crossing into the LuaJIT OS thread and back (the event proxy's field access and write, the round
# trip through `ScriptWorker`) for a whole graph rather than one constructed event
# (crates/logit-bench/benches/pipeline.rs). Scenario table: docs/plans/load-test-harness.md,
# "Scenarios".
#
#   script/perf run --scenario lua
#
# `host` is set on every generated event (`web-{seq%10}`, passthrough's cardinality) so the
# script's `if event.attributes.host ~= nil then` branch is taken on every event; a script whose
# one conditional never fires measures something else.
components:
  gen:
    type: generate_in
    count: 4000000
    event:
      attributes:
        host: "web-{seq%10}"

  # `LUA_ENRICH_SCRIPT` from crates/logit-bench/src/fixtures.rs verbatim, so this scenario's
  # Lua-hop cost is comparable to logit-bench's numbers for the same script.
  enrich:
    type: lua
    sources: [gen]
    script: |
      function process(event)
        if event.attributes.host ~= nil then
          event.attributes.env = "prod"
        end
        return event
      end

  out:
    type: null_out
    sources: [enrich]
