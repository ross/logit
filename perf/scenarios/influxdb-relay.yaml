# InfluxDB line protocol round trip: one process, two disconnected chains sharing one loopback
# connection, `gen -> relay_out` (influxdb_out, a `POST /api/v2/write` per batch) and
# `relay_in -> drop` (influxdb_in). The event is one gauge over 1000 series (`host: h{seq%1000}`),
# a point per event, so this measures line-protocol encode, one HTTP request per 100 points, and
# the whole-body parse. Scenario table: docs/design/performance.md, "Scenarios".
#
#   script/perf run --scenario influxdb-relay
#
# `buffer.max_batches: 64` on the sink keeps the queue left at `generation complete` small. The
# harness divides by `ready` to `generation complete`, and under the default 1024-batch bound a
# sink slower than the generator still holds up to 1024 batches at that line, which inflates
# events/s and can outlast `--settle`.
#
# This scenario never self-exits: `relay_in` is a listener, so the harness sends SIGTERM
# `--settle` after the `generation complete` line (crates/logit-perf/src/scenario.rs's
# `needs_sigterm`). The runtime binds every listener before any task runs, so `relay_in` is
# listening before `relay_out` sends.
components:
  gen:
    type: generate_in
    count: 7000000
    event:
      attributes:
        host: "h{seq%1000}"
      metric:
        name: cpu.usage
        kind: gauge
        value: 12.5

  relay_out:
    type: influxdb_out
    sources: [gen]
    url: http://127.0.0.1:19103
    org: perf
    bucket: perf
    token: perf-token
    buffer:
      max_batches: 64

  relay_in:
    type: influxdb_in
    bind: 127.0.0.1:19103
    tokens: [perf-token]

  drop:
    type: null_out
    sources: [relay_in]
