# Native encode + decode + per-batch ack round trip: one process, two disconnected chains sharing
# one loopback connection, `gen -> relay_out` (logit_out, dialing) and `relay_in -> drop`
# (logit_in, listening). The same graph as native-relay with `window: 1` on `relay_out`: each
# batch waits for `relay_in`'s Ack before the next is sent. It is the one-frame-in-flight
# comparison point for native-relay, which runs the default window
# (docs/adr/native-hop-send-window.md). Scenario table: docs/plans/load-test-harness.md,
# "Scenarios".
#
#   script/perf run --scenario native-relay-window1
#
# Two disconnected chains in one graph is a legal shape: graph rule 5's cycle check runs per
# weakly-connected component. The runtime binds every listener before any task runs
# (crates/logit-pipeline/src/runtime.rs), so `relay_in` is listening before `relay_out` dials;
# `logit_out` dials lazily and retries under `Fault::Clean` regardless.
#
# This scenario never self-exits: `relay_in` has no `count`, so it keeps listening after `gen`
# finishes. The harness detects the listener and sends SIGTERM `--settle` after the
# `generation complete` line instead of waiting for exit (crates/logit-perf/src/scenario.rs's
# `needs_sigterm`).
components:
  gen:
    type: generate_in
    count: 7000000
    event:
      attributes:
        host: "web-{seq%10}"

  relay_out:
    type: logit_out
    sources: [gen]
    endpoint: 127.0.0.1:19001
    window: 1

  relay_in:
    type: logit_in
    bind: 127.0.0.1:19001

  drop:
    type: null_out
    sources: [relay_in]
