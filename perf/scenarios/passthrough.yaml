# Runtime floor: generate_in with no log body and six plain attributes straight into null_out. No
# parsing, no encoding; the only cost is scheduling, the fanout channel hop, and the sink's own
# telemetry, so every other scenario's numbers are read relative to this one. Scenario table:
# docs/plans/load-test-harness.md, "Scenarios".
#
# An ordinary logit config like anything under fixtures/: `logit run perf/scenarios/passthrough.yaml`
# works, as does the harness:
#
#   script/perf run --scenario passthrough
#
# `{seq%N}` in `path`/`host` gives the stream some attribute cardinality rather than byte-identical
# events forever. fanout.yaml and route.yaml copy this template and count; change them together.
components:
  gen:
    type: generate_in
    count: 25000000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  out:
    type: null_out
    sources: [gen]
