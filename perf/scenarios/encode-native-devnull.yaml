# The native encoder in situ: the same shape as encode-human-devnull, but under `format: native`
# (logit_proto::native's dictionary-first wire encoder, docs/adr/file-output-native-format.md).
# `file_out` has three formats, `human`, `json`, and `native` (docs/adr/stream-json-format.md);
# encode-human-devnull and encode-json-devnull measure the other two. Scenario table:
# docs/design/performance.md, "Scenarios".
#
#   script/perf run --scenario encode-native-devnull
#
# `rotate:` is required for the reason encode-human-devnull gives.
components:
  gen:
    type: generate_in
    count: 10000000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  out:
    type: file_out
    sources: [gen]
    path: /dev/null
    format: native
    rotate:
      max_bytes: "100GiB"
