# The native encoder in situ: the same shape as encode-human-devnull, but under `format: native`
# (logit_proto::native's dictionary-first wire encoder, docs/adr/file-output-native-format.md).
# `human` and `native` are the only two formats `file_out` has. Scenario table:
# docs/plans/load-test-harness.md, "Scenarios".
#
#   script/perf run --scenario encode-native-devnull
#
# `rotate:` is required for the reason encode-human-devnull gives.
components:
  gen:
    type: generate_in
    count: 10000000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  out:
    type: file_out
    sources: [gen]
    path: /dev/null
    format: native
    rotate:
      max_bytes: "100GiB"
