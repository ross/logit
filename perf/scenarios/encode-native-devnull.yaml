# The native encoder in situ (docs/plans/load-test-harness.md's scenario table): the same shape as
# encode-human-devnull, generate_in straight into file_out at /dev/null, but under
# `format: native` -- logit_proto::native's dictionary-first wire encoder
# (docs/adr/file-output-native-format.md) instead of the human-readable render. There is no
# `influx` file format to compare against -- these two (`human`/`native`) are the only encoders
# `file_out` has, and the pair is what a real `stdio_out`/`file_out`/`logit_out` deployment would
# actually choose between.
#
#   script/perf run --scenario encode-native-devnull
#
# `rotate:` is required for the same reason as encode-human-devnull -- see that scenario's comment
# for why `max_bytes: "100GiB"` rather than `interval:`.
components:
  gen:
    type: generate_in
    count: 8000000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  out:
    type: file_out
    sources: [gen]
    path: /dev/null
    format: native
    rotate:
      max_bytes: "100GiB"
