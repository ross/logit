# Router + target cost (docs/adr/target-components.md): passthrough.yaml's event stream through a
# `route` that splits it by `host` across three `target`s, each into its own null_out, with the
# tenth host value left unrouted so the router's own consumer edge is exercised too. Every batch of
# 100 lands ~25 events in each of the four destinations, so `route_batch`'s cost of
# `1 + used destinations` allocations per batch (crates/logit-pipeline/src/runtime.rs) is 5 here,
# zero per event, plus one attribute lookup and one table match per event. Scenario table:
# docs/plans/load-test-harness.md, "Scenarios".
#
#   script/perf run --scenario route
#
# Read against passthrough (same events, one sink, no router): the gap is the router hop plus three
# more sink-side hops (drain_inbox -> SinkQueue -> write_loop), each on a quarter-size batch. Read
# against fanout (same events, three sinks): fanout delivers every event three times, this delivers
# every event once, so the interesting number is how close it lands to passthrough. `count` is
# generated events, as in every other scenario.
components:
  gen:
    type: generate_in
    count: 25000000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  split:
    type: route
    sources: [gen]
    by: {attribute: host}
    routes:
      web-0: tier_a
      web-1: tier_a
      web-2: tier_a
      web-3: tier_b
      web-4: tier_b
      web-5: tier_b
      web-6: tier_c
      web-7: tier_c
      web-8: tier_c
      # web-9 is unrouted: it falls through to `unrouted_out` via the router's own `sources:` edge.

  tier_a: {type: target}
  tier_b: {type: target}
  tier_c: {type: target}

  out_a:
    type: null_out
    sources: [tier_a]

  out_b:
    type: null_out
    sources: [tier_b]

  out_c:
    type: null_out
    sources: [tier_c]

  unrouted_out:
    type: null_out
    sources: [split]
