# Disk-backed sink-buffer spool cost: passthrough's graph with `buffer.disk:` on the sink
# (docs/adr/disk-backed-sink-buffer.md), so the gap from passthrough's numbers is the spool's own
# cost (native-frame encode into a segment file, the periodic checkpoint write). Scenario table:
# docs/plans/load-test-harness.md, "Scenarios"; numbers and the variance history:
# docs/design/performance.md §3; the open startup-scan question: docs/known-gaps.md's `buffered`
# entry.
#
#   script/perf run --scenario buffered
#
# `path` resolves against this config file's own directory (crates/logit-cli/src/pipeline.rs's
# `queue_config`), so `../results/spool` lands in the gitignored `perf/results/`. The harness
# clears it before every spawn (crates/logit-perf/src/spool.rs); nothing needs to exist beforehand.
#
# `count` is lower than every other scenario's: this is the one scenario dominated by real disk
# I/O, so its wall time moves with other disk activity on the box. Expect more run-to-run variance
# here than elsewhere in this directory.
components:
  gen:
    type: generate_in
    count: 1200000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  out:
    type: null_out
    sources: [gen]
    buffer:
      disk:
        path: ../results/spool
