# Real-socket UDP intake, one metric per datagram: the syscall-bound worst case. Same graph as
# udp-statsd, a distinct bind port, driven by the sidecar load spec perf/load/udp-statsd-small.yaml,
# whose `datagram_mix:` is all single-line, what an unbuffered client sends (perf/load/README.md).
# How the family is read: docs/design/performance.md, "Driven scenarios".
#
#   script/perf run --scenario udp-statsd-small --repeat 5 --pin-sender 1 --pin-child 2
#
# Per-datagram fixed cost dominates a payload too small to amortize it, so this is where
# `recvmmsg`/`push_many` (docs/adr/udp-intake-batching-and-socket-visibility.md) shows most. Its
# baseline is tuned to a small non-zero kernel drop rate so an improvement has somewhere to move it
# (perf/load/README.md, "Tuning").
components:
  statsd:
    type: statsd_in
    bind: 127.0.0.1:18126
    receive:
      receive_buffer_bytes: 1MiB

  out:
    type: null_out
    sources: [statsd]
