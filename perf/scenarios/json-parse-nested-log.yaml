# The nested log shape: generate_in renders a pino-http completion record, `json` merges its nine
# top-level fields onto tail_in's `log.file.path`, and the request/response objects become
# `Value::Map`s, four boxed AttrMaps per event counting the `headers{{}}` inside each. null_out
# discards. docs/design/data-shapes.md §5.3 measured pino-http at 9 attributes with 4 nested maps;
# §6 names nested maps as the thing that multiplies whatever inline capacity is chosen, since every
# `Value::Map` pays the full inline footprint again. Scenario table:
# docs/plans/load-test-harness.md, "Scenarios"; first run: docs/design/performance.md §8.
#
#   script/perf run --scenario json-parse-nested-log
#
# `gen`'s `log:` is `fixtures::PINO_HTTP_LOG_BODY` (crates/logit-bench/src/fixtures.rs) verbatim,
# and `log.file.path` is what `tail_in` stamps on every line (crates/logit-inputs/src/tail/line.rs),
# so this parses the shape crates/logit-bench/tests/allocations.rs's
# `json_parse_pino_http_nested_event` pins at the component level. `{{`/`}}` are
# logit_core::template's brace-escape. No `{seq}` substitution, for json-parse.yaml's reason. No
# `kv_metrics`, as in logfmt-parse: this isolates the parse at a width, and the three
# `json-parse-*-log` scenarios are read against each other.
#
# Read against json-parse-app-log: narrower (10 attributes against 12) but five allocations to
# parse against one, four of them the nested maps. A sizing change that improves flat width
# without touching `Value::Map` should move this scenario least.
#
# `count` is scaled to ~8 s from the first VM run's wall time and not yet re-measured at this
# value (docs/plans/load-test-harness.md, "Scenarios").
components:
  gen:
    type: generate_in
    count: 4500000
    event:
      log: '{{"level":30,"time":1725091200123,"pid":4821,"hostname":"api-7c9f8d6b5-abcde","reqId":"req-8461","req":{{"method":"POST","url":"/api/v1/orders","headers":{{"host":"shop.example.com","content-type":"application/json","content-length":"842"}}}},"res":{{"statusCode":201,"headers":{{"content-type":"application/json","content-length":"57","vary":"Accept-Encoding"}}}},"responseTime":18,"msg":"request completed"}}'
      attributes:
        log.file.path: /var/log/app/app.log

  parsed:
    type: json
    sources: [gen]

  out:
    type: null_out
    sources: [parsed]
