# Arc-based fan-out to multiple sinks: passthrough.yaml's event stream (same six attributes, same
# count) delivered to three null_out sinks instead of one, so the only difference between the two
# scenarios is the consumer count. Read against passthrough, the gap is the Fanout's per-edge Arc
# clone (crates/logit-pipeline/src/fanout.rs) plus two more sink-side hops
# (drain_inbox -> SinkQueue -> write_loop, crates/logit-pipeline/src/runtime.rs). Scenario table:
# docs/plans/load-test-harness.md, "Scenarios".
#
#   script/perf run --scenario fanout
#
# `count` is generated events, and that is what the harness divides by: this scenario delivers
# 3 x count batch-events, so its CPU us/event is per generated event, not per delivery. Divide the
# gap from passthrough by two for the marginal cost of one extra consumer.
#
# Keep the event template and count in lockstep with passthrough.yaml: a lighter template here
# measures a cheaper generator, not a cheaper delivery path.
components:
  gen:
    type: generate_in
    count: 25000000
    event:
      attributes:
        method: GET
        path: /x/{seq%50}
        status: "200"
        host: web-{seq%10}
        region: us-east-1
        service: web

  out_a:
    type: null_out
    sources: [gen]

  out_b:
    type: null_out
    sources: [gen]

  out_c:
    type: null_out
    sources: [gen]
