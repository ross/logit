# Aggregation and flush-tick cost: generate_in stamps a distribution metric across 1000 series
# (`host: h{seq%1000}`), `aggregate` sketches each into a 1s window, null_out discards the flushed
# windows. The cardinality is what makes the flush tick's own work (walking the series map,
# building one output batch per window) visible alongside the per-event `DdSketch::add`.
# Scenario table: docs/plans/load-test-harness.md, "Scenarios"; numbers: docs/design/performance.md §1.
#
#   script/perf run --scenario aggregate
components:
  gen:
    type: generate_in
    count: 20000000
    event:
      attributes:
        host: "h{seq%1000}"
      metric:
        name: req.latency
        kind: distribution
        value: 12.5

  windowed:
    type: aggregate
    sources: [gen]
    interval: 1s

  out:
    type: null_out
    sources: [windowed]
