# Real-socket UDP intake, mixed datagram packing: the headline scenario of
# docs/adr/udp-intake-batching-and-socket-visibility.md. Unlike every other scenario here there is
# no `generate_in`: the load arrives over a real loopback UDP socket, sent by `logit-perf` itself
# from the sidecar load spec perf/load/udp-statsd.yaml (perf/load/README.md). How the family is
# read: docs/design/performance.md, "Driven scenarios".
#
#   script/perf run --scenario udp-statsd --repeat 5 --pin-sender 1 --pin-child 2
#
# Pins are not optional: on a box with heterogeneous cores an unpinned UDP run is bimodal by
# roughly 2x, and on any box they keep the sender and the child off each other's cores
# (perf/load/README.md, "Pinning").
#
# Still an ordinary `logit` config (`logit run perf/scenarios/udp-statsd.yaml` sits listening until
# something sends to it), which is what `script/validate` and the shipped-config test need.
#
# `receive_buffer_bytes` is small relative to the offered load: this family targets the regime
# where the kernel is close to dropping, so `logit.input.kernel.drops` and
# `receive_buffer.utilization` have something to say (perf/load/README.md, "Tuning").
components:
  statsd:
    type: statsd_in
    bind: 127.0.0.1:18125
    receive:
      # Linux grants double what is requested and clamps at net.core.rmem_max;
      # perf/load/README.md, "Tuning", records what the reference VM grants.
      receive_buffer_bytes: 1MiB

  out:
    type: null_out
    sources: [statsd]
