# The widest, highest-rate log class: generate_in renders a PostgreSQL `jsonlog` line with all 29
# of the format's keys, `json` merges them onto tail_in's `log.file.path` for a 30-attribute event,
# null_out discards. docs/design/data-shapes.md §7 flags this class as having no capture behind it
# (access and audit logs run 15-34 fields at the survey's highest event rates, all desk-counted);
# demo/logit.yaml's `postgres_in` tails this format. Scenario table:
# docs/plans/load-test-harness.md, "Scenarios"; first run: docs/design/performance.md §8.
#
#   script/perf run --scenario json-parse-access-log
#
# `gen`'s `log:` is `fixtures::POSTGRES_JSONLOG_BODY` (crates/logit-bench/src/fixtures.rs)
# verbatim, and `log.file.path` is what `tail_in` stamps on every line
# (crates/logit-inputs/src/tail/line.rs), so this parses the shape
# crates/logit-bench/tests/allocations.rs's `json_parse_access_log_event` pins at the component
# level. `{{`/`}}` are logit_core::template's brace-escape. No `{seq}` substitution, for
# json-parse.yaml's reason. No `kv_metrics`, as in logfmt-parse: this isolates the parse at a
# width, and the three `json-parse-*-log` scenarios are read against each other.
#
# 30 attributes is the only shipped scenario whose AttrMap reallocs: the map grows 8 -> 16 -> 32
# on the way (`json_parse_access_log_event` pins 3 allocations and 2 reallocations). Two of those
# allocations are one JSON-escaped value (PostgreSQL quotes the constraint name in a violation
# message), so here the attribute container is the minority of the cost.
#
# `count` is scaled to ~8 s from the first VM run's wall time and not yet re-measured at this
# value (docs/plans/load-test-harness.md, "Scenarios").
components:
  gen:
    type: generate_in
    count: 3000000
    event:
      log: '{{"timestamp":"2026-09-07 06:52:01.123 UTC","user":"orders_app","dbname":"orders","pid":4821,"remote_host":"10.0.0.17","remote_port":54871,"session_id":"68bd2f41.12d5","line_num":142,"ps":"INSERT","session_start":"2026-09-07 06:40:11 UTC","vxid":"4/2841","txid":"918273","error_severity":"ERROR","state_code":"23505","message":"duplicate key value violates unique constraint \"orders_pkey\"","detail":"Key (id)=(12345) already exists.","hint":"Retry with a fresh identifier.","internal_query":"INSERT INTO orders (id) VALUES ($1)","internal_position":13,"context":"PL/pgSQL function place_order(integer) line 8 at SQL statement","statement":"SELECT place_order(12345)","cursor_position":8,"func_name":"_bt_check_unique","file_name":"nbtinsert.c","file_line_num":666,"application_name":"orders-api","backend_type":"client backend","query_id":-3491082746118273645,"leader_pid":4788}}'
      attributes:
        log.file.path: /var/log/app/app.log

  parsed:
    type: json
    sources: [gen]

  out:
    type: null_out
    sources: [parsed]
