# The parse-into-attributes path: generate_in renders a JSON log body, `json` merges it into
# attributes, `kv_metrics` derives metrics from them, null_out discards. Measures what
# `syslog_in -> json -> kv_metrics` pays in the reference nginx pipeline
# (fixtures/nginx-to-influxdb.yaml), without the syslog framing or the network hop. Scenario table:
# docs/plans/load-test-harness.md, "Scenarios".
#
#   script/perf run --scenario json-parse
#
# `gen`'s `log:` is the JSON portion of `NGINX_SYSLOG_LINE` (crates/logit-bench/src/fixtures.rs)
# verbatim, so this parses the shape logit-bench's allocation tests and benches measure at the
# decoder level. `{{`/`}}` are logit_core::template's brace-escape, needed because a JSON body is
# nothing but braces. No `{seq}` substitution: the point is one representative line parsed as fast
# as the runtime allows, the reasoning fixtures.rs's module doc gives for not varying it.
components:
  gen:
    type: generate_in
    count: 19000000
    event:
      log: '{{"host":"static.local","request_method":"GET","status":200,"body_bytes_sent":612,"request_time":0.001,"upstream_response_time":"0.004"}}'

  parsed:
    type: json
    sources: [gen]

  # The metric specs from fixtures/nginx-to-influxdb.yaml / fixtures::kv_metrics(), so this
  # scenario's `kv_metrics` cost matches the reference pipeline's.
  metrics:
    type: kv_metrics
    sources: [parsed]
    counters:
      - name: nginx.requests
      - name: nginx.bytes_sent
        field: body_bytes_sent
    distributions:
      - name: nginx.request_time
        field: request_time
        unit: s
      - name: nginx.upstream_response_time
        field: upstream_response_time
        unit: s

  out:
    type: null_out
    sources: [metrics]
