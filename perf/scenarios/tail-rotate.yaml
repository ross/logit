# `tail`'s graph with a rotation mid-run: `tail_in` reads the first half of the lines from one
# file, the harness links it aside as `app.log.1` and renames a replacement onto its path, and
# `tail_in` must read the old file to its end and the replacement from its start. Read against
# `tail`, the difference is the rotation path's cost: the rescan, the second open, the draining
# file's last reads and its reap. The sidecar spec perf/load/tail-rotate.yaml says where the rotation falls
# (perf/load/README.md's "File scenarios").
#
#   script/perf run --scenario tail-rotate --repeat 5 --pin-child 2,3
#
# The path is exact, with no `*`: the rotated file (`app.log.1`) and the staged replacement
# (`app.log.next`) must not match it, or the rotation would be read as two new files.
components:
  app:
    type: tail_in
    paths: ["../results/tail-in/tail-rotate/app.log"]
    read_from: beginning

  out:
    type: null_out
    sources: [app]
