# Three parsers contending on shared state: json-parse's generator fanned out to three `json`
# nodes, each into its own null_out, no `kv_metrics`. json-parse has one node interning keys, so a
# change to the interner's lock or hash traffic shows up there only as one node's probe cost; here
# the same probes contend on the same DashMap shards from three tasks, which is what a graph with
# several parsing inputs looks like. Scenario table: docs/plans/load-test-harness.md, "Scenarios";
# numbers: docs/design/performance.md §1.
#
#   script/perf run --scenario json-parse-x3
#
# `count` is generated events, and every one is parsed three times, so CPU us/event is roughly
# three parses plus `Fanout`'s deep clone of the batch for two of the three consumers (the third
# gets the original). The clone is the same for every configuration compared; read `fanout` (three
# sinks, no parsers) if the clone itself is the question. Same template as json-parse (`{{`/`}}`
# are the brace-escape), no `{seq}` substitution, for the reasons given there.
components:
  gen:
    type: generate_in
    count: 9500000
    event:
      log: '{{"host":"static.local","request_method":"GET","status":200,"body_bytes_sent":612,"request_time":0.001,"upstream_response_time":"0.004"}}'

  parsed1:
    type: json
    sources: [gen]
  parsed2:
    type: json
    sources: [gen]
  parsed3:
    type: json
    sources: [gen]

  out1:
    type: null_out
    sources: [parsed1]
  out2:
    type: null_out
    sources: [parsed2]
  out3:
    type: null_out
    sources: [parsed3]
