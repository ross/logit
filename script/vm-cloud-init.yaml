#cloud-config
# User data for the perf VM script/vm creates (docs/adr/disposable-azure-perf-vm.md). Not
# standalone: script/vm substitutes the @NAME@ placeholders into a temp copy and passes it to
# `az vm create --custom-data`, so edit the two together.
#
# Machine setup only. script/vm up runs the cache warm over ssh afterward, so its output streams
# to whoever is waiting.

# Refresh indexes, upgrade nothing: an in-place upgrade makes the kernel depend on the day the VM
# was created, and wants a reboot.
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git       # script/perf computes the git SHA on the host, outside the container
  - gnupg     # verifies Docker's apt signing key by fingerprint below
  - linux-perf # `perf stat -e cycles true` shows whether the guest has a hardware PMU
              # without building crates/logit-perf/Dockerfile
  - tmux      # a long run survives an SSH drop and can be reattached
              # (`script/vm shell 'tmux attach -t <name>'`)

# bootcmd runs in the `init` stage, before `packages:`. apt-daily and unattended-upgrades fire
# seconds into first boot and take the dpkg lock; masking them from runcmd is too late to stop
# them racing the Docker install.
#
# `mask`, not `disable`: another unit's Wants= can't pull a masked unit back in, and masking a
# unit the image doesn't ship still succeeds. Each one is a mid-measurement CPU or disk spike:
#   unattended-upgrades, apt-daily(-upgrade)  unprompted package installs / index refresh
#   man-db.timer                              a full mandb rebuild -- minutes of CPU and disk
#   fstrim.timer                              weekly discard across the whole filesystem
#   e2scrub_all.timer / e2scrub_reap          online fsck of every ext4 volume
#   dpkg-db-backup.timer                      daily tarball of /var/lib/dpkg
#   logrotate.timer                           log compression and its disk I/O
#   systemd-tmpfiles-clean.timer              walks /tmp and /var/tmp
#
# Left running: walinuxagent (serves every `az vm` operation; idle otherwise) and
# systemd-timesyncd (events/s is wall-clock derived, so clock drift corrupts a measurement).
bootcmd:
  - systemctl mask unattended-upgrades.service apt-daily.timer apt-daily.service
      apt-daily-upgrade.timer apt-daily-upgrade.service man-db.timer fstrim.timer
      e2scrub_all.timer e2scrub_reap.service dpkg-db-backup.timer logrotate.timer
      systemd-tmpfiles-clean.timer
  - systemctl stop unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer
      man-db.timer fstrim.timer || true

write_files:
  # `sysctl --system` in runcmd applies this; /etc/sysctl.d keeps it across a reboot.
  - path: /etc/sysctl.d/99-logit-perf.conf
    permissions: "0644"
    content: |
      # Written by script/vm-cloud-init.yaml (docs/adr/disposable-azure-perf-vm.md).
      # ~/logit-vm-metadata.txt records every value here beside each measurement.

      # Ceilings on what an explicit SO_RCVBUF/SO_SNDBUF may request; a ceiling costs no memory
      # until a socket asks. The kernel clamps a request to this value, then doubles it, so
      # 16 MiB admits the 8 MiB `receive_buffer_bytes:` the shipped examples suggest, with room.
      # The udp-statsd* perf scenarios request 1 MiB. crates/logit-inputs/src/udp.rs warns when
      # the kernel grants less than 2x a request. TCP autotuning uses net.ipv4.tcp_rmem instead,
      # left at its default.
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216

      # Pinned at the stock kernel value, not raised: this is what a socket gets when nothing
      # asks, so raising it would change every scenario, break comparison with laptop numbers,
      # and hide a config that forgot `receive_buffer_bytes:`. Written out so a Debian default
      # change shows up as a diff here, not a shift in a results table.
      net.core.rmem_default = 212992
      net.core.wmem_default = 212992

      # Debian builds with CONFIG_SECURITY_PERF_EVENTS_RESTRICT, so the stock default is 3
      # (perf_event_open refused without CAP_PERFMON/CAP_SYS_ADMIN), not upstream's 2. 1 lets a
      # plain `perf stat`/`perf record` run as the admin user, outside any container.
      kernel.perf_event_paranoid = 1
      # Resolves kernel frames to names. paranoid <= 1 permits kernel-address samples and
      # kptr_restrict = 0 permits reading /proc/kallsyms; either alone leaves [unknown] frames.
      kernel.kptr_restrict = 0

  # common.sh defaults DOCKER to `sudo docker`; here the admin user joins the `docker` group in
  # runcmd, so `docker` works directly.
  #
  # /etc/environment, not only profile.d: `ssh host 'command'` runs a non-login shell that never
  # sources /etc/profile. pam_env (Debian's /etc/pam.d/sshd) reads /etc/environment for every ssh
  # session. The profile.d file makes an interactive shell's `env` show it too. script/vm also
  # passes DOCKER=docker on its own ssh calls, so its builds depend on neither.
  - path: /etc/environment
    append: true
    content: |
      DOCKER=docker
  - path: /etc/profile.d/logit-perf.sh
    permissions: "0644"
    content: |
      export DOCKER=docker

  # Every machine fact a recorded number is read against. A script, not an inline command, so
  # `script/vm shell logit-vm-metadata` can re-run it on demand.
  - path: /usr/local/bin/logit-vm-metadata
    permissions: "0755"
    content: |
      #!/bin/bash
      # cloud-init runs this once into ~@ADMIN_USER@/logit-vm-metadata.txt; re-run it any time.
      #
      # Not written inside the ~/logit clone: script/perf sets LOGIT_PERF_GIT_DIRTY from
      # `git status --porcelain`, so an untracked file there marks every result as dirty.
      set -u
      p() { printf '%-16s %s\n' "$1" "$2"; }
      p "captured:"    "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # Read live off the clone, so a re-run after `script/vm build` or a manual checkout
      # reports the current commit.
      p "repo ref:"    "@REPO_REF@ (resolved $(git -C /home/@ADMIN_USER@/logit rev-parse HEAD 2>&1))"
      p "cpu model:"   "$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1)"
      p "cpus:"        "$(nproc) online; $(lscpu | sed -n 's/^Thread(s) per core:[[:space:]]*/threads-per-core /p')"
      p "microcode:"   "$(sed -n 's/^microcode[[:space:]]*: //p' /proc/cpuinfo | head -1)"
      p "kernel:"      "$(uname -srmo)"
      p "os:"          "$(. /etc/os-release && echo "${PRETTY_NAME}")"
      p "docker:"      "$(docker --version 2>&1)"
      p "compose:"     "$(docker compose version 2>&1 | head -1)"
      for k in net.core.rmem_max net.core.wmem_max net.core.rmem_default \
               net.core.wmem_default net.ipv4.tcp_rmem net.ipv4.tcp_wmem \
               kernel.perf_event_paranoid kernel.kptr_restrict; do
        p "sysctl:" "${k} = $(sysctl -n "${k}" 2>&1 | tr -s '[:space:]' ' ')"
      done
      # Recorded, not changed: jemalloc's RSS depends on it (docs/adr/jemalloc-global-allocator.md),
      # and the dev box also reads `always [madvise] never`.
      p "THP:"         "$(cat /sys/kernel/mm/transparent_hugepage/enabled)"
      # Expected empty: this size has no resource disk (MaxResourceVolumeMB is 0) for a swapfile.
      # Any swap invalidates this VM's peak-RSS numbers.
      p "swap:"        "$(swapon --show=NAME,SIZE --noheadings | paste -sd' ' || true)"
      # Expect "not supported": Azure guests have no hardware PMU (the ADR's "Consequences").
      p "perf cycles:" "$(perf stat -e cycles true 2>&1 | tr '\n' ' ')"
      # format=text on IMDS leaf nodes needs no JSON parsing. `version` is what `:latest`
      # resolved to, the only way to tell two sessions' images apart afterward.
      for f in vmId vmSize location zone platformFaultDomain platformUpdateDomain \
               publisher offer sku version; do
        p "azure ${f}:" "$(curl -s -H Metadata:true --max-time 5 \
          "http://169.254.169.254/metadata/instance/compute/${f}?api-version=2023-07-01&format=text")"
      done
      p "masked units:" "$(systemctl list-unit-files --state=masked --no-legend | awk '{print $1}' | paste -sd' ')"
      p "admin uid:"   "$(id -u) (compose.yaml pins user \"1000:1000\" -- this must read 1000)"

ssh_pwauth: false
disable_root: true

runcmd:
  - [ sysctl, --system ]

  # compose.yaml hard-codes `user: "1000:1000"`, so an admin account with another uid writes
  # bind-mounted files as the wrong owner. Failing here makes `cloud-init status` report an
  # error, which script/vm up prints with the log tail.
  - |
    uid="$(id -u '@ADMIN_USER@')"
    if [ "${uid}" != "1000" ]; then
      echo "FATAL: @ADMIN_USER@ has uid ${uid}, not 1000; compose.yaml pins user 1000:1000" >&2
      exit 1
    fi

  # Docker CE, not Debian's packaging: see the ADR's "Docker CE, not Debian's own packaging"
  # section. Debian trixie ships no compose CLI plugin, which common.sh's `${DOCKER} compose`
  # needs.
  #
  # The key is pinned by fingerprint, so a tampered download fails the install.
  # 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 is "Docker Release (CE deb) <docker@docker.com>".
  - [ install, -m, "0755", -d, /etc/apt/keyrings ]
  - curl -fsSL --retry 3 --max-time 60 https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - bash -c "gpg --show-keys --with-fingerprint --with-colons /etc/apt/keyrings/docker.asc | grep -q '^fpr:*9DC858229FC7DD38854AE2D88D81803C0EBFCD88:'"
  # trixie is Debian 13's suite name.
  - bash -c "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable' > /etc/apt/sources.list.d/docker.list"
  - [ apt-get, update ]
  - [ bash, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin" ]

  # Group membership applies at login, and nobody has logged in yet, so every ssh session has it.
  - [ usermod, -aG, docker, "@ADMIN_USER@" ]

  # A full clone, not --depth 1 or --branch: a session routinely builds or compares a second
  # ref. Cloned as the admin user, so uid 1000 owns it and no `safe.directory` is needed.
  - [ runuser, -u, "@ADMIN_USER@", --, git, clone, "@REPO_URL@", "/home/@ADMIN_USER@/logit" ]

  # `@REPO_REF@` is a branch, a tag, or a SHA, resolved to a commit before checkout. A clone
  # creates a local branch only for the remote's HEAD, so another branch resolves only as
  # origin/<name>, and git refuses `checkout --detach <name>` when that would create a tracking
  # branch. script/vm-build-refs resolves refs the same way.
  - |
    runuser -u @ADMIN_USER@ -- bash -c '
      set -e
      cd /home/@ADMIN_USER@/logit
      sha="$(git rev-parse --verify "@REPO_REF@^{commit}" 2>/dev/null \
          || git rev-parse --verify "origin/@REPO_REF@^{commit}")"
      git checkout --detach --quiet "${sha}"
    '

  - [ bash, -c, "/usr/local/bin/logit-vm-metadata > /home/@ADMIN_USER@/logit-vm-metadata.txt 2>&1" ]
  - [ chown, "@ADMIN_USER@:@ADMIN_USER@", "/home/@ADMIN_USER@/logit-vm-metadata.txt" ]
