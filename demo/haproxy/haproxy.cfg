# The demo's front door (docs/plans/demo-tracing-stack.md's workstream A). Mints a W3C
# `traceparent` (https://www.w3.org/TR/trace-context/) when the request doesn't already carry
# one, reuses an inbound one otherwise, and forwards it to nginx -- the root of the trace that
# ties together this request's haproxy/nginx/app log lines and Tempo spans.
#
# `trace_context` now parses a `traceparent` header natively
# (docs/adr/trace-context-span-lifting.md, superseding the "no traceparent parser" reasoning this
# file used to give for splitting the header by hand); the explicit `trace.id`/`span.id`/
# `trace.flags` fields below are kept anyway, alongside the raw header, since this hop already has
# the split values in `txn` vars for `set-header` and `Server-Timing` regardless -- an explicit
# field always wins over a `traceparent`-derived one, so logging both is redundant, not
# contradictory. `span.status`/`span.duration_ms` are gone: `http_access`
# (docs/adr/http-access-normalization.md) now derives the one from `http.response.status_code`
# and mirrors the other from `http.request.duration_ms` whenever the event carries no span timing
# of its own -- the `haproxy_trace` stage (demo/logit.yaml) reads that mirror into a real
# `SpanRecord`, same as before, just no longer from a value this config computed by hand.
#
# Verified against the HAProxy 3.4 configuration manual
# (https://www.haproxy.org/download/3.4/doc/configuration.txt) -- see
# docs/adr/trace-context-span-lifting.md's "Producer timing model" for the full timer diagram and
# why `request_date(us)`/`%Ta` is the correct start/duration pair, not `accept_date`/`%Tt`. Image
# pinned to `haproxy:3.0-alpine` because the JSON log-format converter (`%{+json}o`, below) is new
# in 3.0; `request_date`'s `us` unit argument and every timer used here predate 3.0 as well.

global
    # RFC 3164 HOSTNAME token -- syslog_in reads it as syslog.hostname
    # (crates/logit-inputs/src/syslog.rs). Global, not per-frontend: log-send-hostname has no
    # per-proxy form.
    log-send-hostname demo-haproxy
    maxconn 2048

defaults
    mode http
    option httplog
    # Deliberately NOT set: `option logasap` emits the log line early (before the response body
    # finishes) and prefixes `%Ta`/`%Tt` (and, under `+json`, every other `:sint` byte/time field
    # on the line) with an un-encodable `+`, silently truncating both the metrics leg's
    # `http.request.duration_ms` and the span's mirrored duration below.
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # RFC 3164 TAG token.
    log-tag haproxy_access

frontend fe_http
    bind :8080

    # `<target> [len <n>] [format <fmt>] <facility> [<level>]` -- verified positional order.
    # `format rfc3164`, not the directive's own default `local`: `local` strips the hostname
    # field, which would leave syslog_in with no syslog.hostname to key on.
    log logit:5140 len 2048 format rfc3164 local0 info

    acl has_tp req.hdr(traceparent) -m found

    # Reuse an inbound trace id: traceparent is "00-<32 hex>-<16 hex>-<2 hex>", so the trace id
    # is bytes 3..35. bytes(<offset>[,<length>]) is verified present in 3.0.
    http-request set-var(txn.trace_id) "req.hdr(traceparent),bytes(3,32)" if has_tp

    # Mint one otherwise: uuid() -> 36 chars with dashes -> strip the dashes -> 32 hex chars.
    # Double-quoted as a whole so the single quotes below are the *second* quoting level (the
    # manual's own rule: the first level delimits words on the line, so a literal single quote
    # only survives inside an outer double-quoted argument). '' is the manual's own spelling for
    # an empty replacement (its query-string-stripping example: `regsub([?;&]*,'')`).
    http-request set-var(txn.trace_id) "uuid(),regsub('-','','g')" unless has_tp

    # HAProxy's own span id in this trace -- always freshly minted, inbound or not: a parent's
    # span id isn't ours to reuse.
    http-request set-var(txn.span_id) "uuid(),regsub('-','','g'),bytes(0,16)"

    # The raw inbound header, for the `traceparent` attribute below -- distinct from `txn.trace_id`/
    # `txn.span_id`, which are this hop's own (reused-or-minted trace id, always-minted span id).
    # Only set `if has_tp`; an unset `txn` var renders as an empty string in `%(name)[var(...)]`
    # below, which the convention treats as absent, same as never having received one.
    http-request set-var(txn.inbound_tp) req.hdr(traceparent) if has_tp

    http-request set-header traceparent "00-%[var(txn.trace_id)]-%[var(txn.span_id)]-01"

    # Captured into vars, not read as `req.hdr(host)`/`path`/`query`/`req.hdr(user-agent)` directly
    # inside `log-format` below: by the time a log line is written the request's own sample
    # fetches aren't reliably available any more (confirmed empirically -- `haproxy -c` rejects
    # all four used directly in a `log-format` with "may not be reliably used here"). That
    # restriction is specific to a bracketed `[expr]` item, though -- the dedicated log-format
    # *aliases* used below (`%HM`/`%HV`/`%ST`/`%B`/`%U`/`%Ta`/`%Tc`/`%Tr`/`%ci`/`%cp`/`%si`/`%tsc`/
    # `%ac`/`%TR`/`%Tw`/`%Td`) are looked up in a separate table with no such restriction, so no
    # var is needed for anything one of them already covers.
    http-request set-var(txn.host) req.hdr(host)
    http-request set-var(txn.path) path
    http-request set-var(txn.query) query
    http-request set-var(txn.ua) req.hdr(user-agent)

    # Foundation for docs/plans/browser-tracing.md -- nothing downstream reads this yet.
    # http-after-response (not http-response) so even a haproxy-generated response (a 503, say)
    # carries it. Single-quoted outside so the embedded double quotes in `desc="..."` survive.
    # One line, deliberately -- HAProxy's `\`-newline continuation splits a quoted value's quotes
    # across lines rather than joining them (confirmed empirically against `haproxy -c`), so every
    # directive below is intentionally kept on one line rather than wrapped for readability.
    http-after-response set-header Server-Timing 'traceparent;desc="00-%[var(txn.trace_id)]-%[var(txn.span_id)]-01"'
    http-after-response set-header Timing-Allow-Origin '*'

    # `%{+json}o`: HAProxy's own JSON encoder, one item per attribute, each becoming a genuine
    # JSON key/value pair with automatic per-value escaping ("json: automatically encode value in
    # JSON format") -- no hand-rolled `json(ascii)` converter needed on any item any more, since
    # every item here is named and `+json` covers all of them. `%o`/`+json` must be the first item
    # on the line.
    #
    # DASHED keys, not dotted: `%(name)` only accepts `[A-Za-z0-9_-]` in the name -- a literal `.`
    # is rejected outright ("invalid character in custom name"), confirmed directly against
    # `src/log.c`'s name parser. `http_access` (docs/adr/http-access-normalization.md) accepts
    # every canonical dotted attribute name under an alias spelling with each `.` replaced by `-`
    # (`_` in a name is untouched, since canonical names already use `_` and an `_`-for-`.`
    # rewrite wouldn't be decodable from the dotted table alone) -- see
    # docs/http-access-logs.md's "Emitters that can't write dotted keys" for the worked example
    # this config follows. So `http.response.status_code` is spelled `http-response-status_code`
    # here, `user_agent.original` is `user_agent-original`, and so on; `http_access` removes the
    # dashed key and writes the dotted one, and a name with no dots at all (`conns_active`,
    # `haproxy_timer_*`, both this config's own extras, not semconv) needs no alias and is left as
    # it always was.
    #
    # Per-item notes (docs/plans/http-access-normalization.md's "Producer configs (W5)";
    # verified against HAProxy 3.4's configuration manual and `src/log.c`):
    #   - `%Ta` (total active time -- request received to response fully sent), not `%Tt` (which
    #     includes idle time before the request even started) -- the alias that actually matches
    #     nginx's `$request_time`, hence `http-request-duration_ms`. `%Tr` (time to receive the
    #     full response header from the server) rides along separately as
    #     `upstream-header_ms` -- a genuinely different measurement, not a second spelling of the
    #     same one.
    #   - `%B` is TOTAL bytes written to the client, headers included -- so it's
    #     `http-response-size`, not `.body.size` (no body-only counterpart exists); `%U` is the
    #     request-side analogue, `http-request-size`.
    #   - `upstream-address` is `%si` (the literal backend IP HAProxy connected to), not `%s` (the
    #     configured server *name*, e.g. `nginx`) -- picked over `%s` because `upstream.address`'s
    #     own doc comment (`crates/logit-transforms/src/http_access.rs`) describes an address,
    #     and because nginx's own `$upstream_addr` is an IP too. It has no port: no single alias
    #     gives `host:port` together, and joining `%si`/`%sp` into one string is a derivation, not
    #     a raw value -- `http_access`'s job if it's ever wanted, not this config's.
    #   - `upstream.status` is deliberately omitted: no field carries the backend's raw status
    #     separately from `%ST` (which may itself be HAProxy's own synthesized status, not the
    #     server's) -- emitting `%ST` twice under two names would claim a distinction that isn't
    #     there. Likewise `network.connection.id`/`.requests`: no persistent per-TCP-connection
    #     identifier exists anywhere in HAProxy's fetch table (`%ID`/`unique-id` is
    #     per-transaction), and `cache.status`: HAProxy isn't a cache.
    #   - `trace-flags` is the literal `%[int(1)]` -- HAProxy always mints `-01`, so this is a
    #     known constant, never a fetch (docs/adr/trace-context-span-lifting.md: decimal, never
    #     the raw hex flags octet).
    #   - `%ac` (`actconn`) is a process-wide gauge (concurrent connections on this HAProxy
    #     process), not a per-request value, riding on this request's log line the same way every
    #     other field here does (demo/logit.yaml's `haproxy_metrics` turns it into
    #     `web.connections_active`); `%tsc` is the 4-character HTTP session termination state
    #     (e.g. `----` clean, `sH--` a bad response header, `CD--` a client abort) -- low
    #     cardinality, kept as a tag by `trimmed`.
    #   - `request_date(us)`/`%Ta` is the span's start/duration pair (docs/adr/
    #     trace-context-span-lifting.md's "Producer timing model" -- both anchored at "first byte
    #     of the request header", unlike `accept_date`, which is the *connection's* accept and
    #     would start the span before the request that produced it existed).
    #   - `%TR`/`%Tw`/`%Td` (the remaining legs of HAProxy's own timer breakdown, not otherwise
    #     covered above) are `logit`'s own extras, `haproxy_timer_{request,queue,data}_ms` --
    #     `docs/adr/trace-context-span-lifting.md`'s known-gaps follow-up would need this math to
    #     derive a second, upstream-facing CLIENT span.
    log-format '%{+json}o %(server-address)[var(txn.host)] %(url-path)[var(txn.path)] %(url-query)[var(txn.query)] %(user_agent-original)[var(txn.ua)] %(http-request-method)HM %(network-protocol-version)HV %(http-response-status_code:sint)ST %(http-response-size:sint)B %(http-request-size:sint)U %(http-request-duration_ms:sint)Ta %(upstream-address)si %(upstream-connect_ms:sint)Tc %(upstream-header_ms:sint)Tr %(client-address)ci %(network-peer-port:sint)cp %(http-termination_state)tsc %(conns_active:sint)ac %(traceparent)[var(txn.inbound_tp)] %(trace-id)[var(txn.trace_id)] %(span-id)[var(txn.span_id)] %(trace-flags:sint)[int(1)] %(span-start_us:sint)[request_date(us)] %(haproxy_timer_request_ms:sint)TR %(haproxy_timer_queue_ms:sint)Tw %(haproxy_timer_data_ms:sint)Td'

    # Routes browser-sent OTLP traces into `logit` (demo/logit.yaml's `browser_in`, an `otlp_in`
    # listener) rather than nginx/app. Same-origin through this front door, not published
    # directly, isn't just convenience: `otlp_in` has no CORS support today, so a cross-origin
    # exporter fails HAProxy's own `OPTIONS` preflight before `otlp_in` ever sees the real POST --
    # a reverse proxy in front of both the page and `otlp_in` is the documented, supported
    # workaround (`docs/known-gaps.md`'s "`otlp_in` has no CORS support" entry,
    # docs/plans/browser-tracing.md). `path_beg`, not an exact match on `/v1/traces`: OTLP/HTTP's
    # own per-signal path convention (`crates/logit-proto/src/lib.rs`) is a fixed suffix under
    # whatever base an exporter is configured with -- the same convention `loki_out`'s `/otlp`
    # base (demo/logit.yaml) already relies on -- so this ACL is deliberately wider than the one
    # path this demo's own verification exercises today.
    acl is_otlp path_beg /v1/

    # Without this, every span-export POST here would generate its own HAProxy access line, which
    # `haproxy_trace` (demo/logit.yaml) would lift into a *span in its own fresh trace* --
    # telemetry about telemetry, confusing in Tempo and not what anyone wants. `silent` (verified
    # against the HAProxy 3.4 configuration manual's `http-request set-log-level` entry) drops the
    # log line outright rather than merely lowering its syslog severity, so `haproxy_trace` never
    # sees this request at all.
    http-request set-log-level silent if is_otlp

    use_backend be_logit if is_otlp

    default_backend be_nginx

backend be_nginx
    server nginx nginx:80 check

# `logit`'s own `browser_in` (demo/logit.yaml, :4318, `protocol: http`) -- OTLP/JSON and protobuf
# both accepted (ADR `otlp-json-decoding`), so no content-negotiation logic is needed here beyond
# the path match above.
backend be_logit
    server logit logit:4318 check
