# The demo's front door (docs/plans/demo-tracing-stack.md's workstream A). Mints a W3C
# `traceparent` (https://www.w3.org/TR/trace-context/) when the request doesn't already carry
# one, reuses an inbound one otherwise, and forwards it to nginx -- the root of the trace that
# ties together this request's haproxy/nginx/app log lines and Tempo spans.
#
# `trace_context` now parses a `traceparent` header natively
# (docs/adr/trace-context-span-lifting.md, superseding the "no traceparent parser" reasoning this
# file used to give for splitting the header by hand); the explicit `trace.id`/`span.id`/
# `trace.flags` fields below are kept anyway, alongside the raw header, since this hop already has
# the split values in `txn` vars for `set-header` and `Server-Timing` regardless -- an explicit
# field always wins over a `traceparent`-derived one, so logging both is redundant, not
# contradictory. What *is* new here: `docs/plans/access-log-spans.md`'s `span:` block turns this
# line into a real span -- `haproxy_trace` (demo/logit.yaml) now reads `span.start_us`/
# `span.duration_ms` below into a `SpanRecord`, not just `LogRecord.trace`.
#
# Verified against the HAProxy 3.4 configuration manual
# (https://www.haproxy.org/download/3.4/doc/configuration.txt) -- see
# docs/adr/trace-context-span-lifting.md's "Producer timing model" for the full timer diagram and
# why `request_date(us)`/`%Ta` is the correct start/duration pair, not `accept_date`/`%Tt`. Image
# pinned to `haproxy:3.0-alpine` because the JSON log-format converter (`%{+json}o`, below) is new
# in 3.0; `request_date`'s `us` unit argument and every timer used here predate 3.0 as well.

global
    # RFC 3164 HOSTNAME token -- syslog_in reads it as syslog.hostname
    # (crates/logit-inputs/src/syslog.rs). Global, not per-frontend: log-send-hostname has no
    # per-proxy form.
    log-send-hostname demo-haproxy
    maxconn 2048

defaults
    mode http
    option httplog
    # Deliberately NOT set: `option logasap` emits the log line early (before the response body
    # finishes) and prefixes `%Ta`/`%Tt` with `+`, silently truncating both the metrics leg's
    # `request_time_ms` and the span's `duration_ms` below.
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # RFC 3164 TAG token.
    log-tag haproxy_access

frontend fe_http
    bind :8080

    # `<target> [len <n>] [format <fmt>] <facility> [<level>]` -- verified positional order.
    # `format rfc3164`, not the directive's own default `local`: `local` strips the hostname
    # field, which would leave syslog_in with no syslog.hostname to key on.
    log logit:5140 len 2048 format rfc3164 local0 info

    acl has_tp req.hdr(traceparent) -m found

    # Reuse an inbound trace id: traceparent is "00-<32 hex>-<16 hex>-<2 hex>", so the trace id
    # is bytes 3..35. bytes(<offset>[,<length>]) is verified present in 3.0.
    http-request set-var(txn.trace_id) "req.hdr(traceparent),bytes(3,32)" if has_tp

    # Mint one otherwise: uuid() -> 36 chars with dashes -> strip the dashes -> 32 hex chars.
    # Double-quoted as a whole so the single quotes below are the *second* quoting level (the
    # manual's own rule: the first level delimits words on the line, so a literal single quote
    # only survives inside an outer double-quoted argument). '' is the manual's own spelling for
    # an empty replacement (its query-string-stripping example: `regsub([?;&]*,'')`).
    http-request set-var(txn.trace_id) "uuid(),regsub('-','','g')" unless has_tp

    # HAProxy's own span id in this trace -- always freshly minted, inbound or not: a parent's
    # span id isn't ours to reuse.
    http-request set-var(txn.span_id) "uuid(),regsub('-','','g'),bytes(0,16)"

    # The raw inbound header, for the `traceparent` attribute below -- distinct from `txn.trace_id`/
    # `txn.span_id`, which are this hop's own (reused-or-minted trace id, always-minted span id).
    # Only set `if has_tp`; an unset `txn` var renders as an empty string in `%(name)[var(...)]`
    # below, which the convention treats as absent, same as never having received one.
    http-request set-var(txn.inbound_tp) req.hdr(traceparent) if has_tp

    http-request set-header traceparent "00-%[var(txn.trace_id)]-%[var(txn.span_id)]-01"

    # Captured into vars, not read as `req.hdr(host)`/`path` directly inside `log-format` below:
    # by the time a log line is written the request's own sample fetches aren't reliably
    # available any more (confirmed empirically -- `haproxy -c` rejects both used directly in a
    # `log-format` with "may not be reliably used here"). Every other field the log line needs is
    # either a dedicated log-only fetch (`%HM`/`%ST`/`%B`/`%Tr`/`%ac`/`%tsc`) or already a
    # `txn` var.
    http-request set-var(txn.host) req.hdr(host)
    http-request set-var(txn.path) path

    # `span.status` (docs/design/data-model.md's "Well-known attribute names"): `ok` unless the
    # response was a server error. `http-after-response`, not `http-response`, so this also
    # covers a HAProxy-generated response (a 503, say) with no real backend reply to inspect.
    http-after-response set-var(txn.span_status) str(error) if { status ge 500 }
    http-after-response set-var(txn.span_status) str(ok) unless { status ge 500 }

    # Foundation for docs/plans/browser-tracing.md -- nothing downstream reads this yet.
    # http-after-response (not http-response) so even a haproxy-generated response (a 503, say)
    # carries it. Single-quoted outside so the embedded double quotes in `desc="..."` survive.
    # One line, deliberately -- HAProxy's `\`-newline continuation splits a quoted value's quotes
    # across lines rather than joining them (confirmed empirically against `haproxy -c`), so every
    # directive below is intentionally kept on one line rather than wrapped for readability.
    http-after-response set-header Server-Timing 'traceparent;desc="00-%[var(txn.trace_id)]-%[var(txn.span_id)]-01"'
    http-after-response set-header Timing-Allow-Origin '*'

    # NOT `%{+json}o` any more (`docs/adr/trace-context-span-lifting.md`'s "Risks" -- confirmed
    # directly against `haproxy -c`): that mode's `%(name:type)` items name the JSON key too, and
    # HAProxy's log-format item-name grammar rejects a literal `.` in that name outright
    # ("invalid character in custom name near '.'"), which every `span.*`/`trace.*` attribute
    # needs. Hand-rolled JSON instead, one line, every key spelled out literally so nothing about
    # the key grammar constrains it. `%{+json}o` bought automatic per-value escaping in exchange;
    # the `json(ascii)` converter (distinct from the `+json` log-output flag -- a per-value
    # sample-fetch converter, "escapes the input string and produces ... a JSON string") restores
    # exactly that for every string field whose content isn't already known-safe: `host` (a
    # client-supplied header), `path` (raw off the request line), and the three trace fields that
    # can carry attacker-controlled bytes when a `traceparent` was actually received (`traceparent`
    # itself, and `trace.id`, sliced out of it without validation at this layer -- an invalid one
    # is `trace_context`'s problem to reject downstream, not a reason to risk malformed JSON here).
    # `%HM` (method) and `%tsc` (termination state) are both drawn from fixed, quote-and-backslash-
    # free alphabets (HTTP's method token grammar; HAProxy's own termination-flag characters) and
    # go in unescaped, matching what `%{+json}o` would have produced for them anyway. `span.id` is
    # always HAProxy's own freshly minted id (never sliced from client input, unlike `trace.id`),
    # and `span.status` is one of two internal literals -- both safe unescaped too, escaped anyway
    # below for uniformity since the converter is nearly free.
    #
    # `%B` is TOTAL bytes written to the client, headers included (confirmed empirically: a
    # 2-byte body logged as 117) -- unlike nginx's true body-only `$body_bytes_sent`, so this is
    # named `bytes_sent`, not `body_bytes_sent`, to not imply an equivalence that isn't there
    # (both still feed a shared `web.bytes_sent` counter in demo/logit.yaml -- the per-tier
    # panels never compare the two directly). The literal `1` is `trace.flags` -- HAProxy always
    # mints `-01`, so this is a known constant, not a fetch (docs/adr/trace-context-span-lifting.md:
    # decimal, never the hex flags octet). `%ac` is `actconn`, the total concurrent connections on
    # this HAProxy process -- a process-wide gauge, not a per-request value, riding on this
    # request's log line the same way every other field here does (demo/logit.yaml's
    # `haproxy_metrics` turns it into `web.connections_active`). `%tsc` is the 4-character HTTP
    # session termination state (e.g. `----` clean, `sH--` a bad response header, `CD--` a client
    # abort) -- low cardinality, kept as a tag by `trimmed`.
    #
    # `request_date(us)`/`%Ta` is the span's start/duration pair (docs/adr/
    # trace-context-span-lifting.md's "Producer timing model" -- both anchored at "first byte of
    # the request header", unlike `accept_date`, which is the *connection's* accept and would
    # start the span before the request that produced it existed). `%Tr` (`request_time_ms`,
    # still read by `haproxy_metrics` below) and the `haproxy.timer.*` breakdown
    # (`%TR`/`%Tw`/`%Tc`/`%Tr`/`%Td`) are the same numbers `docs/adr/trace-context-span-lifting.md`'s
    # known-gaps follow-up would need to derive a second, upstream-facing CLIENT span -- logged now
    # as plain attributes so that math is possible later without a config change here.
    log-format '{"host":"%[var(txn.host),json(ascii)]","request_method":"%HM","path":"%[var(txn.path),json(ascii)]","status":%ST,"bytes_sent":%B,"request_time_ms":%Tr,"conns_active":%ac,"termination_state":"%tsc","traceparent":"%[var(txn.inbound_tp),json(ascii)]","trace.id":"%[var(txn.trace_id),json(ascii)]","span.id":"%[var(txn.span_id),json(ascii)]","trace.flags":1,"span.status":"%[var(txn.span_status),json(ascii)]","span.start_us":%[request_date(us)],"span.duration_ms":%Ta,"haproxy.timer.request_ms":%TR,"haproxy.timer.queue_ms":%Tw,"haproxy.timer.connect_ms":%Tc,"haproxy.timer.response_ms":%Tr,"haproxy.timer.data_ms":%Td}'

    default_backend be_nginx

backend be_nginx
    server nginx nginx:80 check
