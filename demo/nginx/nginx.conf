# The demo's middle tier (docs/plans/demo-tracing-stack.md's workstream A;
# docs/plans/access-log-spans.md's workstream C). A new file, not an edit of
# examples/nginx/nginx.conf -- that one is a three-vhost njs proof artifact for
# docs/plans/nginx-integration.md and stays as it is; this is a plain single-vhost reverse proxy
# in front of the demo app, reusing only its log_format conventions.
#
# Relays haproxy's W3C traceparent (https://www.w3.org/TR/trace-context/), and -- unlike before
# docs/adr/trace-context-span-lifting.md -- now mints its *own* span id and forwards a new
# traceparent carrying it, so `app`'s real OTel span becomes a child of nginx's span rather than
# reaching directly past it to haproxy's. `logit` now parses a `traceparent` header natively
# (that ADR supersedes this file's older "no traceparent parser" reasoning), but nginx's own
# log_format has no way to invoke that parser itself, so the split into
# trace.id/span.parent_id still happens here via `map`, the same way examples/nginx/nginx.conf
# does it and demo/haproxy/haproxy.cfg does the equivalent in HAProxy vars.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Positional regex captures are usable as the map value (ngx_http_map_module). No `default`
    # on the id maps => an empty string when the header is absent or malformed -- `trace_context`
    # then reports `skipped{reason="missing"}`, not the noisier `invalid`.
    map $http_traceparent $trace_id {
        "~^00-([0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $1;
    }
    # haproxy's span id, from nginx's point of view: the *parent* of the span this hop is about
    # to mint -- never this hop's own id (docs/adr/trace-context-span-lifting.md's `parent_id`
    # naming, matched here so the same regex/capture-group shape appears in every config that
    # parses a traceparent by hand).
    map $http_traceparent $parent_span_id {
        "~^00-[0-9a-f]{32}-([0-9a-f]{16})-[0-9a-f]{2}$" $1;
    }
    # DECIMAL 0/1 -- never the raw hex flags octet. `trace_context`'s `trace.flags` field rejects
    # hex by design (crates/logit-transforms/src/trace_context.rs::numeric_flags) -- see
    # docs/adr/trace-context-span-lifting.md. The odd-nibble test below is the correct
    # "sampled bit set" check for the flags octet; haproxy always mints `-01`, so this only
    # matters if something else ever sends `-00`.
    map $http_traceparent $trace_flags {
        default                                        0;
        "~^00-[0-9a-f]{32}-[0-9a-f]{16}-0[13579bdf]$"  1;
    }
    # This hop's own span id -- nginx has no built-in random-hex generator without njs, but its
    # own `$request_id` (32 hex characters, on by default since 1.11.0) is exactly as random as a
    # dedicated 16-hex value would be; the first 16 characters of it are used as-is, the same
    # minting trick examples/nginx/nginx.conf uses at its own edge.
    map $request_id $span_id {
        "~^([0-9a-f]{16})" $1;
    }
    map $status $span_status {
        "~^5" error;
        default ok;
    }

    # Same five original field names as the pre-tracing access_json_syslog format (examples/nginx/
    # nginx.conf) -- that's what lets demo/logit.yaml's nginx_scale/nginx_metrics/trimmed/windowed
    # chain and demo/grafana/dashboards/logit-internal.json's InfluxDB panels stay unchanged.
    # `span.end_s`/`span.duration_s`, not `_ms`: `$msec`/`$request_time` are both seconds with
    # millisecond resolution (floats), never integer milliseconds -- see
    # docs/adr/trace-context-span-lifting.md's "Producer timing model". `$msec` is the log-write
    # instant, which pairs with `$request_time` as an (end, duration) pair, not as a start. Both
    # are QUOTED here, unlike the unquoted `$request_time` above: an unquoted number parses as a
    # JSON float (`serde_json`/`Value::F64`), which `trace_context`'s `_s` form accepts but only
    # reproduces to ~1us at epoch magnitude (a float's precision, not nginx's); quoted, it parses
    # as a string and goes through the exact digit-for-digit decimal parser instead, matching
    # nginx's own millisecond resolution exactly rather than adding float noise below it.
    log_format access_json_syslog escape=json
        '{"host":"$host","request_method":"$request_method","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"traceparent":"$http_traceparent","trace.id":"$trace_id","span.id":"$span_id",'
        '"span.parent_id":"$parent_span_id","trace.flags":$trace_flags,'
        '"span.end_s":"$msec","span.duration_s":"$request_time","span.status":"$span_status"}';

    server {
        listen 80;

        access_log /dev/stdout access_json_syslog;
        access_log syslog:server=logit:5141,tag=nginx_access,nohostname access_json_syslog;

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            # A *new* traceparent, carrying this hop's own span id as the parent of whatever
            # `app` creates next -- not a plain relay of the inbound header (contrast
            # examples/nginx/nginx.conf's proxied vhost, which has no span of its own to insert
            # and so does relay unchanged). If $trace_id came back empty (no inbound header at
            # all -- not a shape this demo otherwise produces, since haproxy always mints one),
            # this renders a malformed header ("00--<span>-01"); the app's OTel SDK falls back to
            # starting a fresh, parent-less trace on an unparseable traceparent, same as if the
            # header were absent entirely.
            proxy_set_header traceparent "00-$trace_id-$span_id-01";
        }
    }
}
