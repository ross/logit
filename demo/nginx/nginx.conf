# The demo's middle tier (docs/plans/demo-tracing-stack.md's workstream A;
# docs/plans/access-log-spans.md's workstream C). A new file, not an edit of
# examples/nginx/nginx.conf -- that one is a three-vhost njs proof artifact for
# docs/plans/nginx-integration.md and stays as it is; this is a plain single-vhost reverse proxy
# in front of the demo app, reusing only its log_format conventions.
#
# Logs to stdout only (docs/adr/file-tailing-and-docker-json-logs.md, docs/plans/file-tailing.md's
# workstream D) -- `logit`'s `nginx_in` tails the container's own Docker json-file log
# (`docker_in`) instead of receiving a `syslog:` stream, the end-to-end proof for that ADR.
# `NGINX_ENTRYPOINT_QUIET_LOGS=1` (demo/compose.yaml) keeps the entrypoint's own non-JSON startup
# lines off this same stdout stream, since `docker_in` would otherwise diagnose each one as a
# `bad_line`. `error_log`'s own destination is unchanged (the image's own default -- `/dev/stderr`
# -- see docker-library/nginx's entrypoint): `nginx_in` still sees those lines (same container,
# same json-file log, `stream: "stderr"`), and demo/logit.yaml's `nginx_stdout` (a `lua` stage)
# drops them before `nginx_identity`, matching the ADR's "Alternatives considered" on why that's a
# Lua stage today rather than a `streams:` config field or named output ports.
#
# Relays haproxy's W3C traceparent (https://www.w3.org/TR/trace-context/), and -- unlike before
# docs/adr/trace-context-span-lifting.md -- now mints its *own* span id and forwards a new
# traceparent carrying it, so `app`'s real OTel span becomes a child of nginx's span rather than
# reaching directly past it to haproxy's. `logit` now parses a `traceparent` header natively
# (that ADR supersedes this file's older "no traceparent parser" reasoning), but nginx's own
# log_format has no way to invoke that parser itself, so the split into
# trace.id/span.parent_id still happens here via `map`, the same way examples/nginx/nginx.conf
# used to (before docs/adr/http-access-normalization.md dropped that vhost's own maps -- this
# tier keeps its maps because it, unlike that one, actually forwards the `traceparent` it logs)
# and demo/haproxy/haproxy.cfg does the equivalent in HAProxy vars.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Positional regex captures are usable as the map value (ngx_http_map_module). No `default`
    # on the id maps => an empty string when the header is absent or malformed -- `trace_context`
    # then reports `skipped{reason="missing"}`, not the noisier `invalid`.
    map $http_traceparent $trace_id {
        "~^00-([0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $1;
    }
    # haproxy's span id, from nginx's point of view: the *parent* of the span this hop is about
    # to mint -- never this hop's own id (docs/adr/trace-context-span-lifting.md's `parent_id`
    # naming, matched here so the same regex/capture-group shape appears in every config that
    # parses a traceparent by hand).
    map $http_traceparent $parent_span_id {
        "~^00-[0-9a-f]{32}-([0-9a-f]{16})-[0-9a-f]{2}$" $1;
    }
    # DECIMAL 0/1 -- never the raw hex flags octet. `trace_context`'s `trace.flags` field rejects
    # hex by design (crates/logit-transforms/src/trace_context.rs::numeric_flags) -- see
    # docs/adr/trace-context-span-lifting.md. The odd-nibble test below is the correct
    # "sampled bit set" check for the flags octet; haproxy always mints `-01`, so this only
    # matters if something else ever sends `-00`.
    map $http_traceparent $trace_flags {
        default                                        0;
        "~^00-[0-9a-f]{32}-[0-9a-f]{16}-0[13579bdf]$"  1;
    }
    # This hop's own span id -- nginx has no built-in random-hex generator without njs, but its
    # own `$request_id` (32 hex characters, on by default since 1.11.0) is exactly as random as a
    # dedicated 16-hex value would be; the first 16 characters of it are used as-is, the same
    # minting trick examples/nginx/nginx.conf's own edge vhost used before it moved onto
    # `trace_context`'s `mint_id: true` (docs/adr/http-access-normalization.md) -- this tier keeps
    # the hand-rolled version because it needs the id *in the log line itself*
    # (`span.id`/`span.parent_id` below feed a new outbound `traceparent`), not just in
    # `trace_context`'s own lift.
    map $request_id $span_id {
        "~^([0-9a-f]{16})" $1;
    }

    # Raw OTel semconv attribute names, the untouched value, per
    # docs/adr/http-access-normalization.md -- `url.original` is new here (the pre-normalization
    # format carried no path/query at all): `examples/nginx-to-influxdb.yaml`'s `nginx_http` and
    # `demo/logit.yaml`'s own `nginx_http` (docs/plans/http-access-normalization.md's W6) both need
    # `url.path` to derive `http.route`/`span.name`, which is what turns this tier's spans into
    # `GET /work`/`GET /{probe}` instead of a bare `GET`. `span.status`/`span.duration_s` are gone:
    # `http_access` derives the one from `http.response.status_code` and mirrors the other from
    # `http.request.duration_s` whenever the event carries no span timing of its own -- carrying
    # both a raw and a derived spelling of the same fact is exactly the duplication
    # `trace_context`'s `keep_source` reasoning rejects, one component over. `$status` is QUOTED
    # (docs/adr/http-access-normalization.md's motivating bug: an unquoted "000" on an abnormal
    # termination is invalid JSON, a leading zero) where the pre-normalization format left it
    # bare.
    #
    # `span.end_s`/`http.request.duration_s`: `$msec`/`$request_time` are both seconds with
    # millisecond resolution (floats), never integer milliseconds -- see
    # docs/adr/trace-context-span-lifting.md's "Producer timing model". `$msec` is the log-write
    # instant, which pairs with `$request_time` as an (end, duration) pair, not as a start.
    # `span.end_s` stays QUOTED: unquoted, it parses as a JSON float and loses nginx's exact
    # millisecond digits at epoch magnitude (a float's precision, not nginx's); quoted, it goes
    # through the exact digit-for-digit decimal parser instead.  `http.request.duration_s` is left
    # bare -- its magnitude is small enough that an `f64` loses nothing worth preserving, and
    # `http_access`'s duration coercion accepts either form.
    log_format access_json escape=json
        '{"http.request.method":"$request_method","url.original":"$request_uri",'
        '"server.address":"$host","http.response.status_code":"$status",'
        '"http.response.body.size":$body_bytes_sent,"http.request.duration_s":$request_time,'
        '"upstream.duration_s":"$upstream_response_time",'
        '"upstream.connect_s":"$upstream_connect_time",'
        '"upstream.header_s":"$upstream_header_time",'
        '"traceparent":"$http_traceparent","trace.id":"$trace_id","span.id":"$span_id",'
        '"span.parent_id":"$parent_span_id","trace.flags":$trace_flags,'
        '"span.end_s":"$msec"}';

    server {
        listen 80;

        access_log /dev/stdout access_json;

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            # A *new* traceparent, carrying this hop's own span id as the parent of whatever
            # `app` creates next -- not a plain relay of the inbound header (contrast
            # examples/nginx/nginx.conf's proxied vhost, which has no span of its own to insert
            # and so does relay unchanged). If $trace_id came back empty (no inbound header at
            # all -- not a shape this demo otherwise produces, since haproxy always mints one),
            # this renders a malformed header ("00--<span>-01"); the app's OTel SDK falls back to
            # starting a fresh, parent-less trace on an unparseable traceparent, same as if the
            # header were absent entirely.
            proxy_set_header traceparent "00-$trace_id-$span_id-01";
        }
    }
}
