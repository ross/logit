# The demo's middle tier (docs/plans/demo-tracing-stack.md; docs/plans/access-log-spans.md): a
# plain single-vhost reverse proxy in front of the demo app. It's separate from
# fixtures/nginx/nginx.conf, a three-vhost njs proof artifact for docs/plans/nginx-integration.md,
# and reuses only that file's log_format conventions.
#
# Logs to stdout only (docs/adr/file-tailing-and-docker-json-logs.md, docs/plans/file-tailing.md):
# `logit`'s `nginx_in` tails the container's Docker json-file log (`docker_in`) rather than
# receiving a `syslog:` stream, the end-to-end proof for that ADR.
# `NGINX_ENTRYPOINT_QUIET_LOGS=1` (demo/compose.yaml) keeps the entrypoint's non-JSON startup
# lines off this stdout stream, because `docker_in` would otherwise diagnose each one as a
# `bad_line`. `error_log` keeps the image's default destination (`/dev/stderr`; see
# docker-library/nginx's entrypoint). `nginx_in` still sees those lines (same container, same
# json-file log, `stream: "stderr"`), and demo/logit.yaml's `nginx_stdout` (a `lua` stage) drops
# them before `nginx_identity`. The ADR's "Alternatives considered" covers why that's a Lua stage
# rather than a `streams:` config field or named output ports.
#
# Relays haproxy's W3C traceparent (https://www.w3.org/TR/trace-context/), but mints its *own*
# span id and forwards a new traceparent carrying it (docs/adr/trace-context-span-lifting.md), so
# `app`'s real OTel span becomes a child of nginx's span rather than reaching past it to
# haproxy's. `logit` parses a `traceparent` header natively, but nginx's log_format can't invoke
# that parser, and this tier needs the split ids to build the outbound header. So the split into
# trace.id/span.parent_id happens here via `map`, as demo/haproxy/haproxy.cfg does in HAProxy
# vars. (fixtures/nginx/nginx.conf dropped its equivalent maps under
# docs/adr/http-access-normalization.md because that vhost doesn't forward the `traceparent` it
# logs.)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Positional regex captures are usable as the map value (ngx_http_map_module). No `default`
    # on the id maps => an empty string when the header is absent or malformed, so `trace_context`
    # reports `skipped{reason="missing"}`, not the noisier `invalid`.
    map $http_traceparent $trace_id {
        "~^00-([0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $1;
    }
    # haproxy's span id, from nginx's point of view: the *parent* of the span this hop is about
    # to mint, never this hop's own id (docs/adr/trace-context-span-lifting.md's `parent_id`
    # naming, matched here so the same regex/capture-group shape appears in every config that
    # parses a traceparent by hand).
    map $http_traceparent $parent_span_id {
        "~^00-[0-9a-f]{32}-([0-9a-f]{16})-[0-9a-f]{2}$" $1;
    }
    # DECIMAL 0/1, never the raw hex flags octet. `trace_context`'s `trace.flags` field rejects
    # hex by design (crates/logit-transforms/src/trace_context.rs::numeric_flags; see
    # docs/adr/trace-context-span-lifting.md). The odd-nibble test below is the correct
    # "sampled bit set" check for the flags octet; haproxy always mints `-01`, so this only
    # matters if something else ever sends `-00`.
    map $http_traceparent $trace_flags {
        default                                        0;
        "~^00-[0-9a-f]{32}-[0-9a-f]{16}-0[13579bdf]$"  1;
    }
    # This hop's own span id. nginx has no built-in random-hex generator without njs, but its
    # `$request_id` (32 hex characters, on by default since 1.11.0) is exactly as random as a
    # dedicated 16-hex value would be, so its first 16 characters are used as-is. (`trace_context`
    # can mint one itself with `mint_id: true`, docs/adr/http-access-normalization.md, but this tier
    # needs the id *in the log line itself*: `span.id`/`span.parent_id` below feed a new outbound
    # `traceparent`, not just `trace_context`'s lift.)
    map $request_id $span_id {
        "~^([0-9a-f]{16})" $1;
    }

    # Raw OTel semconv attribute names with the untouched value, per
    # docs/adr/http-access-normalization.md. `fixtures/nginx-to-influxdb.yaml`'s `nginx_http` and
    # `demo/logit.yaml`'s `nginx_http` both need `url.original` to derive `url.path`, and from it
    # `http.route`/`span.name`, which is what names this tier's spans `GET /work`/`GET /{probe}`
    # instead of a bare `GET`. This format logs no `span.status` or duration mirror: `http_access`
    # derives `span.status` from `http.response.status_code` and mirrors the span duration from
    # `http.request.duration_s` whenever the event carries no span timing of its own. Carrying both
    # a raw and a derived spelling of the same fact is the duplication `trace_context`'s
    # `keep_source` reasoning rejects, one component over. `$status` is QUOTED, because an unquoted
    # "000" on an abnormal termination is invalid JSON (a leading zero;
    # docs/adr/http-access-normalization.md's motivating bug).
    #
    # `span.end_s`/`http.request.duration_s`: `$msec`/`$request_time` are both seconds with
    # millisecond resolution (floats), never integer milliseconds; see
    # docs/adr/trace-context-span-lifting.md's "Producer timing model". `$msec` is the log-write
    # instant, which pairs with `$request_time` as an (end, duration) pair, not as a start.
    # `span.end_s` stays QUOTED: unquoted, it parses as a JSON float and loses nginx's exact
    # millisecond digits at epoch magnitude (a float's precision, not nginx's); quoted, it goes
    # through the exact digit-for-digit decimal parser instead. `http.request.duration_s` is left
    # bare, because its magnitude is small enough that an `f64` loses nothing worth preserving, and
    # `http_access`'s duration coercion accepts either form.
    log_format access_json escape=json
        '{"http.request.method":"$request_method","url.original":"$request_uri",'
        '"server.address":"$host","http.response.status_code":"$status",'
        '"http.response.body.size":$body_bytes_sent,"http.request.duration_s":$request_time,'
        '"upstream.duration_s":"$upstream_response_time",'
        '"upstream.connect_s":"$upstream_connect_time",'
        '"upstream.header_s":"$upstream_header_time",'
        '"traceparent":"$http_traceparent","trace.id":"$trace_id","span.id":"$span_id",'
        '"span.parent_id":"$parent_span_id","trace.flags":$trace_flags,'
        '"span.end_s":"$msec"}';

    server {
        listen 80;

        access_log /dev/stdout access_json;

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            # A *new* traceparent, carrying this hop's own span id as the parent of whatever
            # `app` creates next, not a plain relay of the inbound header (contrast
            # fixtures/nginx/nginx.conf's proxied vhost, which has no span of its own to insert
            # and so relays unchanged). If $trace_id came back empty (no inbound header at all,
            # which this demo doesn't otherwise produce, since haproxy always mints one), this
            # renders a malformed header ("00--<span>-01"). The app's OTel SDK then starts a fresh,
            # parent-less trace, the same as if the header were absent.
            proxy_set_header traceparent "00-$trace_id-$span_id-01";
        }
    }
}
