# The demo's middle tier (docs/plans/demo-tracing-stack.md's workstream A). A new file, not an
# edit of examples/nginx/nginx.conf -- that one is a three-vhost njs proof artifact for
# docs/plans/nginx-integration.md and stays as it is; this is a plain single-vhost reverse proxy
# in front of the demo app, reusing only its log_format conventions.
#
# Relays and logs haproxy's W3C traceparent (https://www.w3.org/TR/trace-context/); creates no
# span of its own. `logit` has no traceparent parser, so the split into trace_id/span_id/
# trace_flags happens here via `map`, the same way demo/haproxy/haproxy.cfg does it in HAProxy
# vars -- see that file's header comment for why.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Positional regex captures are usable as the map value (ngx_http_map_module). No `default`
    # => empty string when the header is absent or malformed -- trace_context then reports
    # skipped{reason="missing"}, not "invalid".
    map $http_traceparent $trace_id {
        "~^00-([0-9a-f]{32})-([0-9a-f]{16})-([0-9a-f]{2})$" $1;
    }
    map $http_traceparent $span_id {
        "~^00-([0-9a-f]{32})-([0-9a-f]{16})-([0-9a-f]{2})$" $2;
    }
    # DECIMAL 0/1 -- never the raw hex flags octet. trace_context's `flags` field rejects hex by
    # design (crates/logit-transforms/src/trace_context.rs::numeric_flags) -- see
    # demo/haproxy/haproxy.cfg's header comment. The odd-nibble test below is the correct
    # "sampled bit set" check for the flags octet; in this demo HAProxy always mints `-01`, so
    # this only matters if something else ever sends `-00`.
    map $http_traceparent $trace_flags {
        default                                        0;
        "~^00-[0-9a-f]{32}-[0-9a-f]{16}-0[13579bdf]$"  1;
    }

    # Same five field names as the pre-existing access_json_syslog format (examples/nginx/
    # nginx.conf) -- that's what lets demo/logit.yaml's access_metrics/trimmed/windowed chain and
    # demo/grafana/dashboards/logit-internal.json's InfluxDB panels stay unchanged.
    log_format access_json_syslog escape=json
        '{"host":"$host","request_method":"$request_method","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"trace_id":"$trace_id","span_id":"$span_id","trace_flags":$trace_flags}';

    server {
        listen 80;

        access_log /dev/stdout access_json_syslog;
        access_log syslog:server=logit:5141,tag=nginx_access,nohostname access_json_syslog;

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            # proxy_pass forwards all inbound headers by default (minus Host/Connection, which
            # are rewritten) -- this is belt-and-braces documentation, not load-bearing.
            proxy_set_header traceparent $http_traceparent;
        }
    }
}
