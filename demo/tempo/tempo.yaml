# Tempo 2.10.x, monolithic, local filesystem backend, OTLP receivers only. Three things write
# here now: `logit`'s own internal pipeline spans, haproxy's/nginx's real access-line spans
# (demo/logit.yaml's `tempo_out`, docs/adr/trace-context-span-lifting.md), and `demo-app`'s real
# OpenTelemetry request spans, sent straight to the `http` receiver below rather than through
# `logit` (demo/logit.yaml's header comment explains why).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
