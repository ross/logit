# Tempo 2.10.x, monolithic, local filesystem backend, OTLP receivers only. Two senders write here:
#   - `logit`'s `tempo_out` (demo/logit.yaml), to the `grpc` receiver: `logit`'s own internal
#     pipeline spans, haproxy's/nginx's real access-line spans
#     (docs/adr/trace-context-span-lifting.md), and the landing page's browser spans.
#   - `demo-app`'s and `demo-worker`'s real OpenTelemetry spans, sent straight to the `http`
#     receiver rather than through `logit` (demo/logit.yaml's header comment explains why).
# Only the OTLP ports (4317/4318) are published on the host; Grafana queries :3200 inside the
# `demo` network.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
