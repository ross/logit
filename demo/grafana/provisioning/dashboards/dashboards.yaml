# File-based dashboard provider. `options.path` is a separate mount from this provisioning
# directory -- see demo/compose.yaml's `grafana` service volumes.
apiVersion: 1

providers:
  - name: logit-demo
    orgId: 1
    folder: logit
    folderUid: logit
    type: file
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
