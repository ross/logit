# Pre-provisioned datasources, so `docker compose up` gives a working Grafana with no manual
# setup. Matches demo/compose.yaml's service names. Separate from the dev stack's
# deploy/grafana/provisioning/datasources/influxdb.yaml, because this stack is self-contained.
apiVersion: 1

datasources:
  # VictoriaMetrics serves the Prometheus query API, so Grafana's built-in `prometheus` type reads
  # it with no plugin. Queries are PromQL; VictoriaMetrics also accepts its MetricsQL extensions.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      # demo/logit.yaml's `windowed` flushes every 10s. Grafana sizes `$__rate_interval` from this,
      # so a `rate()` window always spans at least two samples.
      timeInterval: 10s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Two derived fields, both linking to the same Tempo trace. The label matcher is the one
      # that fires against real data (docs/plans/demo-tracing-stack.md): demo/logit.yaml's
      # `trace_context` transforms lift each tier's trace_id/span_id onto LogRecord.trace with
      # `keep_source` at its default `false`, so the id leaves the log body and becomes Loki's
      # *native* trace_id structured metadata via OTLP ingestion, not text in the message. The
      # body-regex field is a fallback for any log line that names an id inline instead.
      derivedFields:
        - name: TraceID (structured metadata)
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"
        - name: TraceID (body)
          datasourceUid: tempo
          # `trace\.id` first: the dotted convention name (docs/design/data-model.md's
          # "Well-known attribute names"), which a body only carries when `trace_context` skipped
          # the line (`keep_source: false` removes it on every successful lift). The other three
          # alternatives are generic spellings, for anything not produced by this demo's tiers.
          matcherRegex: '(?:trace\.id|trace_id|traceID|traceid)[=":\s]+([a-fA-F0-9]{16,32})'
          # `$$`, not `$`: Grafana's *provisioning* loader interpolates `${VAR}` as an
          # environment variable first. `${__value.raw}` is the derived field's own runtime
          # templating syntax, evaluated later, and silently resolves to "" if written unescaped
          # here (the API shows url: "" unless it's doubled).
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
