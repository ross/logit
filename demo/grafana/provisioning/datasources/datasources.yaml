# Pre-provisioned datasources so `docker compose up` gives a working Grafana with no manual
# clicking. Matches demo/compose.yaml's service names and demo-token values. Separate from (not
# an edit of) the dev stack's deploy/grafana/provisioning/datasources/influxdb.yaml -- this stack
# is self-contained.
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: logit
      defaultBucket: metrics
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Token logit-demo-token

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Two derived fields, both click through to the same Tempo trace. The label matcher is the
      # one that actually fires against real data (docs/plans/demo-tracing-stack.md's workstream
      # A): demo/logit.yaml's `trace_context` transforms lift each tier's trace_id/span_id onto
      # LogRecord.trace with `keep_source` at its default `false`, so the id leaves the log body
      # and becomes Loki's *native* trace_id structured metadata via OTLP ingestion, not text in
      # the message. The body-regex field is kept as a fallback for any log line that names an id
      # inline instead.
      derivedFields:
        - name: TraceID (structured metadata)
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"
        - name: TraceID (body)
          datasourceUid: tempo
          matcherRegex: '(?:trace_id|traceID|traceid)[=":\s]+([a-fA-F0-9]{16,32})'
          # `$$` (not `$`): Grafana's *provisioning* loader interpolates `${VAR}` as an
          # environment variable first -- `${__value.raw}` is the derived field's own runtime
          # templating syntax, evaluated later, and silently resolves to "" if written unescaped
          # here (confirmed empirically: the API showed url: "" until this was doubled).
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
