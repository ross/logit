# Loki 3.7.x, monolithic single-binary, no auth, no multi-tenancy, filesystem storage. Demo-only:
# everything under /loki lives in the `loki_data` named volume (demo/compose.yaml) and is
# disposable.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Loki's schema config has changed repeatedly across 2.x/3.x -- v13 + tsdb + filesystem is the
# current combination; boltdb-shipper and schemas below v13 are deprecated.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # A restarted `writer` (demo/compose.yaml) can replay lines slightly out of order; without this
  # Loki rejects them as "too old" rather than accepting them.
  reject_old_samples: false
  allow_structured_metadata: true
  volume_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
