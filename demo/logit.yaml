# The demo pipeline (demo/README.md, docs/plans/demo-tracing-stack.md, docs/plans/demo-stack.md,
# docs/plans/otlp-end-to-end.md, docs/plans/otlp-logs-and-resource-identity.md,
# docs/plans/access-log-spans.md). Exercises syslog in, set + json + trace_context + scale +
# kv_metrics + keep_signals + keep + aggregate, InfluxDB out, OTLP/HTTP out, OTLP/gRPC out, plus
# `internal` observing the pipeline itself (ADR `internal-telemetry-as-pipeline-events`, ADR
# `internal-span-emission-and-deterministic-sampling`) -- against traffic that crosses three real
# tiers: haproxy -> nginx -> app (demo/compose.yaml's `traffic` service drives it;
# docs/plans/demo-tracing-stack.md's workstream A). Logs and metrics leave `logit` for a real
# backend (Loki, InfluxDB); traces reach Tempo three ways -- `logit`'s own internal spans via
# `tempo_out`, haproxy's and nginx's real access-line spans (`docs/adr/
# trace-context-span-lifting.md`'s `span:` block, also via `tempo_out`), and `demo-app`'s real
# request spans going straight to Tempo, deliberately not through `logit` at all (see the comment
# above `stdout` below) -- not every telemetry leg needs `logit` in front of it, and this demo
# shows that honestly rather than routing everything through `logit` just to prove it can.
# `otlp_in` (`crates/logit-inputs/src/otlp.rs`) is consequently still unexercised by this demo.
#
# Topology:
#
#   One `syslog_in` listener per tier -- `set` stamps a resource onto the whole BATCH, not per
#   event, so three tiers sharing one listener would interleave into one batch and get one wrong
#   service.name (docs/plans/demo-tracing-stack.md's workstream A).
#
#   haproxy --syslog/UDP:5140--> haproxy_in -> haproxy_identity (set) -> haproxy_json (json)
#                                                                              |
#   nginx   --syslog/UDP:5141--> nginx_in   -> nginx_identity   (set) -> nginx_json   (json)
#                                                                              |
#   demo-app --syslog/UDP:5142--> app_in    -> app_identity     (set) -> app_json     (json)
#                                                                              |
#                                                                              v
#                                            {haproxy,nginx,app}_trace (trace_context) <- lifts
#                                                                 |             trace.id/span.id
#                                                                 |             onto LogRecord.trace;
#                                                                 |             haproxy_trace/
#                                                                 |             nginx_trace also
#                                                                 |             mint a real span
#                                                                 |             from the same line
#                                                                 |             (docs/adr/
#                                                                 |             trace-context-
#                                                                 |             span-lifting.md)
#                                       +-------------------------+---------------------+
#                                       v                         v                     v
#                              stdout (stdio_out)      logs_only (keep_signals: [logs])  |
#                                                                 |                      |
#                                                                 v                      |
#                                                          loki_out (otlp_out, HTTP)      |
#                                                                                         v
#                                                              access_spans (keep_signals: [traces],
#                                                                             haproxy_trace/nginx_trace only --
#                                                                             app_trace carries no span)
#                                                                                         |
#          haproxy_trace                       nginx_trace                               |
#                |                                   |                                   |
#                |                                   v                                   |
#                |                          nginx_scale (scale)  <- request_time: s -> ms |
#                |                                   |                                   |
#                v                                   v                                   |
#       haproxy_metrics (kv_metrics)         nginx_metrics (kv_metrics)                   |
#                |                                   |                                   |
#                +-------------------+---------------+                                   |
#                                    v                                                    |
#                              trimmed (keep)   <- drops high-cardinality attrs            |
#                                    |                                                    |
#                                    v                                                    |
#                              windowed (aggregate)                                        |
#                                    |                                                    |
#   self (internal) --+-> self_windowed (aggregate) --> influx_out --> InfluxDB            |
#                      |                                                                  |
#                      +-> trace_only (has_signal) ---------------------------------> tempo_out (otlp_out, gRPC) --> tempo
#
#   demo-app --OTLP/HTTP protobuf--> tempo:4318 directly, bypassing `logit` entirely --
#   parented to nginx's span (docs/adr/trace-context-span-lifting.md: nginx now mints and forwards
#   its own span id, rather than only relaying haproxy's), since the default W3C propagator
#   extracts whichever `traceparent` it's given regardless of which backend the span is headed for.
components:
  haproxy_in:
    type: syslog_in
    bind: 0.0.0.0:5140
  nginx_in:
    type: syslog_in
    bind: 0.0.0.0:5141
  app_in:
    type: syslog_in
    bind: 0.0.0.0:5142

  # `syslog_in` mustn't invent a resource identity for data it didn't produce
  # (docs/design/internal-telemetry.md's "Resource identity" section) -- `set` is the operator
  # declaring one instead (ADR `operator-declared-resource-attributes`), one per tier since each
  # has its own listener (see the topology comment above).
  haproxy_identity:
    type: set
    sources: [haproxy_in]
    resource:
      service.name: haproxy
      service.namespace: demo
  nginx_identity:
    type: set
    sources: [nginx_in]
    resource:
      service.name: nginx
      service.namespace: demo
  app_identity:
    type: set
    sources: [app_in]
    resource:
      service.name: demo-app
      service.namespace: demo

  haproxy_json:
    type: json
    sources: [haproxy_identity]
  nginx_json:
    type: json
    sources: [nginx_identity]
  app_json:
    type: json
    sources: [app_identity]

  # Lifts each tier's trace.id/span.id/trace.flags (or an inbound `traceparent`, parsed natively
  # as of `docs/adr/trace-context-span-lifting.md`) onto `LogRecord.trace`. `haproxy_trace`/
  # `nginx_trace` additionally mint a real `SpanRecord` on the same event via `span:` -- an access
  # line's own start/end/duration attributes become a span whose start replaces `event.timestamp`.
  # `app_trace` carries no `span:` block: `app`'s request span is already real
  # (opentelemetry-instrumentation-django), so lifting one from its access log would be a second,
  # redundant span for the same request rather than a useful one. `keep_source` left at its
  # default `false`: the convention attributes are removed on a successful lift so `logs_only`/
  # `loki_out` below carry only what each tier's own log body actually needs, and a surviving
  # `trace_id`-shaped attribute can't collide with Loki's *native* trace_id structured metadata.
  haproxy_trace:
    type: trace_context
    sources: [haproxy_json]
    span:
      kind: server
      name: http.request
  nginx_trace:
    type: trace_context
    sources: [nginx_json]
    span:
      kind: server
      name: http.request
  app_trace:
    type: trace_context
    sources: [app_json]

  # No component here for the app's own OTel spans (demo/app/gunicorn.conf.py) -- they go straight
  # to Tempo's own `otlp.protocols.http` receiver on :4318 (`demo/tempo/tempo.yaml`), alongside the
  # gRPC one `tempo_out` below uses, never touching `logit` (see the header comment for why). The
  # default W3C propagator still makes each span a genuine child of nginx's span with no code in
  # `demo/app` at all -- that part doesn't depend on which backend the span lands in.

  # `docker compose logs -f logit` -- the fastest way to see the pipeline doing something, now one
  # block per tier per request (haproxy's and nginx's carrying a real `span` section too), all
  # three sharing a trace id and differing in span id. The app's own spans don't appear here --
  # they never reach `logit` (see above).
  stdout:
    type: stdio_out
    sources: [haproxy_trace, nginx_trace, app_trace]

  # Loki's OTLP ingestion accepts logs only -- it registers no `TracesService`/`MetricsService` --
  # and `otlp_out` aborts an entire batch's `send` on the first signal request that fails
  # (`crates/logit-outputs/src/otlp.rs`'s module doc; see `trace_only`/`tempo_out` below for the
  # identical reasoning applied to Tempo). Before `docs/adr/trace-context-span-lifting.md`,
  # `haproxy_trace`/`nginx_trace`/`app_trace` only ever produced log events, so this was never a
  # problem; now that the first two also produce span-only events downstream, `loki_out` needs
  # this `keep_signals: [logs]` gate in front of it -- `has_signal`/`keep_signals` never mutate a
  # forwarded event (ADR `signal-filtering-components`), so every log that does reach `loki_out`
  # arrives exactly as its `*_trace` stage produced it, just without the span-only events that
  # would otherwise trip Loki's `send`.
  logs_only:
    type: keep_signals
    sources: [haproxy_trace, nginx_trace, app_trace]
    signals: [logs]

  # Logs to Loki, direct over OTLP -- no relay service in between (docs/plans/
  # otlp-logs-and-resource-identity.md's workstream B; Loki accepts OTLP logs natively as of
  # 3.7.7, the version this stack pins). `protocol: http`, not `grpc` like `tempo_out` below --
  # Loki's OTLP ingestion is HTTP-only. `endpoint` is a URL base for HTTP (unlike gRPC's bare
  # authority): `http://loki:3100/otlp` resolves to exactly `/otlp/v1/logs`
  # (`crates/logit-proto/src/lib.rs`'s hardcoded per-signal path). Loki's default index-label set
  # already includes `service.name`/`service.namespace` -- what each `*_identity` stamps above --
  # so no `demo/loki/loki.yaml` change is needed for real stream labels.
  loki_out:
    type: otlp_out
    sources: [logs_only]
    protocol: http
    endpoint: http://loki:3100/otlp

  # The real spans `haproxy_trace`/`nginx_trace` minted, isolated from the log event each rides in
  # on -- `app_trace` isn't a source here at all, since it never produces a span (see its own
  # comment above). Feeds `tempo_out` below alongside `logit`'s own internal spans (`trace_only`).
  access_spans:
    type: keep_signals
    sources: [haproxy_trace, nginx_trace]
    signals: [traces]

  # nginx's JSON field names (host/request_method/status/body_bytes_sent/request_time) are
  # unchanged from before workstream A. `request_time` still arrives in SECONDS here -- `scale`
  # converts it to milliseconds below, right before `nginx_metrics` reads it, so the attribute
  # itself (and everything else that might read it, `stdout`/`loki_out` included) keeps meaning
  # "seconds"; only the metrics branch sees the converted value.
  nginx_scale:
    type: scale
    sources: [nginx_trace]
    fields:
      request_time: 1000 # seconds -> milliseconds, to match haproxy's %Tr below

  # Both tiers share the `web.*` measurement names below and are told apart by the `service.name`
  # tag `*_identity` already stamped (Grafana panels filter on it) -- see
  # docs/adr/scale-transform.md for why `request_time` needed `scale` first to make that safe.
  # `web.bytes_sent` is the one name shared despite meaning slightly different things per tier:
  # HAProxy's `%B` (demo/haproxy/haproxy.cfg) is total bytes written to the client, headers
  # included; nginx's `$body_bytes_sent` is body only. Neither tier's panel ever compares the two
  # directly, so sharing the name is fine -- just not exact.
  nginx_metrics:
    type: kv_metrics
    sources: [nginx_scale]
    counters:
      - name: web.requests # +1 per event
      - name: web.bytes_sent
        field: body_bytes_sent
    distributions:
      - name: web.request_time
        field: request_time
        unit: ms # nginx_scale already converted it

  haproxy_metrics:
    type: kv_metrics
    sources: [haproxy_trace]
    counters:
      - name: web.requests
      - name: web.bytes_sent
        field: bytes_sent
    # A process-wide gauge (HAProxy's own concurrent-connection count), not a per-request value --
    # it rides on this event's request/response tags the same way every other field here does, so
    # it lands as one series per tag combination holding the last value seen each window. A panel
    # over it should `|> group() |> last()` rather than plot the raw series.
    gauges:
      - name: web.connections_active
        field: conns_active
    distributions:
      - name: web.request_time
        field: request_time_ms
        unit: ms

  # Before `aggregate`, not after -- otherwise its SeriesKey would key a series per request on
  # `request_id` (or now, `trace.id`/`span.id`) alone. `host`/`request_method`/`status` are the
  # tags meant to survive from both tiers; `termination_state` is HAProxy-only (absent on nginx
  # events, so it's simply not a tag there). The trace/span attributes never reach here at all --
  # `haproxy_trace`/`nginx_trace` already removed them (`keep_source: false`, above).
  trimmed:
    type: keep
    sources: [nginx_metrics, haproxy_metrics]
    fields: [host, request_method, status, termination_state]

  windowed:
    type: aggregate
    sources: [trimmed]
    interval: 10s

  # `logit` observing itself (docs/design/internal-telemetry.md, ADR `internal-telemetry-as-pipeline-events`) -- the dashboard's
  # `logit.*` panels come from here. `span_sample_rate` set explicitly to `1.0` rather than left at
  # its `0.1` default (docs/adr/internal-span-emission-and-deterministic-sampling.md) -- this
  # is a demo meant to show every span it can, not a production deployment weighing span volume
  # against storage cost. Its batches carry `service.name = logit` on their resource (see
  # internal-telemetry.md's "Resource identity" section) -- that's what lets Tempo resolve a root
  # service for these traces at all.
  self:
    type: internal
    interval: 10s
    span_sample_rate: 1.0

  self_windowed:
    type: aggregate
    sources: [self]
    interval: 60s # `self`'s 10s divides evenly into it, as internal-telemetry.md's guidance asks

  influx_out:
    type: influxdb_out
    sources: [windowed, self_windowed]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN

  # `self` is `internal` observing *all* of `logit`'s own telemetry, not just spans -- every drain
  # also carries this process's own `logit.*` metrics (Counter/Gauge/Distribution) alongside its
  # spans, but `self` never mixes the two *on one event*: each drain is either a metric-only point
  # or a span-only span event (`crates/logit-core/src/telemetry.rs`'s `drain`), never both at
  # once. `trace_only` exists to drop the metric-only ones before `tempo_out` ever sees them --
  # `has_signal` never mutates a forwarded event, so every span that does reach `tempo_out` arrives
  # exactly as `self` produced it. See `docs/adr/signal-filtering-components.md`.
  #
  # This isn't pipeline hygiene, it's load-bearing: `otlp_out` issues one request per signal and
  # aborts the rest of a `send` call on the first failing one
  # (`crates/logit-outputs/src/otlp.rs`'s module doc), and Tempo is a traces-only gRPC server (it
  # registers no `MetricsService`) -- an `internal` metric point reaching `tempo_out` would fail
  # with `grpc-status: 12` (UNIMPLEMENTED), and enough consecutive failures trip `write_loop`'s
  # ~60s sustained-permanent-failure guard (`docs/adr/service-lifecycle-and-output-retry.md`,
  # revised by `docs/adr/buffered-sink-delivery.md`), ending the whole `logit` process -- taking
  # the InfluxDB metrics path down with it, not just Tempo. Confirmed directly against an earlier
  # version of this config that fed `self` straight into `tempo_out`: see `docs/known-gaps.md`'s
  # "`otlp_out` aborts an entire batch's `send`..." entry for the full account. `access_spans`
  # above needs the identical gate for the identical reason, once `haproxy_trace`/`nginx_trace`
  # started producing metric-and-span-carrying batches too.
  trace_only:
    type: has_signal
    sources: [self]
    signals: [traces]

  # Deliberately gRPC, not HTTP (docs/adr/hand-rolled-grpc-over-hyper.md) -- Tempo's `:4317`
  # receiver, to exercise the transport the rest of this config doesn't otherwise touch;
  # `endpoint` is a bare `host:port` authority for gRPC, not a URL (see
  # `crates/logit-outputs/src/otlp.rs`'s `grpc_authority`). Two sources now: `logit`'s own
  # internal spans (`trace_only`) and haproxy's/nginx's real access-line spans (`access_spans`,
  # docs/adr/trace-context-span-lifting.md) -- `demo-app`'s real request spans go straight to
  # Tempo's own OTLP/HTTP receiver instead, never touching `logit` at all (see the comment above
  # `stdout`). All of it still lands in the same Tempo trace when trace ids agree -- Tempo doesn't
  # care which of its receivers a span for a given trace arrived through.
  tempo_out:
    type: otlp_out
    sources: [trace_only, access_spans]
    protocol: grpc
    endpoint: tempo:4317
