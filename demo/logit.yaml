# The demo pipeline (demo/README.md, docs/plans/0003-demo-stack.md). Exercises exactly what
# `logit` implements today -- syslog in, json + kv_metrics + keep + aggregate, InfluxDB out, plus
# `internal` observing the pipeline itself (ADR 0018) -- against the traffic `demo/compose.yaml`'s
# `hello` service emits (real visits plus a background synthetic loop).
#
# Topology:
#
#   hello --syslog/UDP--> access_in (syslog_in)
#                               |
#                               v
#                          access_json (json)     <- merges the JSON body into attributes
#                              / \
#                             v   v
#                    tap (stdio_out)  access_metrics (kv_metrics) <- adds metrics to the event
#                                          |
#                                          v
#                                    trimmed (keep)   <- drops high-cardinality attrs (request_id)
#                                          |
#                                          v
#                                    windowed (aggregate)
#                                          |
#   self (internal) --> self_windowed (aggregate) --+
#                                                    v
#                                              influx_out
components:
  access_in:
    type: syslog_in
    bind: 0.0.0.0:5140

  access_json:
    type: json
    sources: [access_in]

  # `docker compose logs -f logit` -- the fastest way to see the pipeline doing something.
  tap:
    type: stdio_out
    sources: [access_json]

  access_metrics:
    type: kv_metrics
    sources: [access_json]
    counters:
      - name: web.requests # +1 per event
      - name: web.bytes_sent
        field: body_bytes_sent
    distributions:
      - name: web.request_time
        field: request_time
        unit: s

  # Before `aggregate`, not after -- otherwise its SeriesKey would key a series per request on
  # `request_id` alone. `host`/`request_method`/`status` are the only tags meant to survive.
  trimmed:
    type: keep
    sources: [access_metrics]
    fields: [host, request_method, status]

  windowed:
    type: aggregate
    sources: [trimmed]
    interval: 10s

  # `logit` observing itself (docs/design/internal-telemetry.md, ADR 0018) -- the dashboard's
  # `logit.*` panels come from here.
  self:
    type: internal
    interval: 10s

  self_windowed:
    type: aggregate
    sources: [self]
    interval: 60s # `self`'s 10s divides evenly into it, as internal-telemetry.md's guidance asks

  influx_out:
    type: influxdb_out
    sources: [windowed, self_windowed]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN

  # -- Pending, not runnable yet --
  #
  # Logs to Loki: needs a `syslog_out` ComponentKind, which doesn't exist (docs/plans/
  # 0003-demo-stack.md). It would mirror `syslog_in` -- UDP, RFC 3164 -- and point at the `alloy`
  # service's syslog listener (demo/alloy/config.alloy), which is already up and provisioned in
  # Grafana as the Loki datasource, waiting.
  #
  # log_out:
  #   type: syslog_out
  #   sources: [access_json]
  #   endpoint: alloy:5141
  #
  # Traces to Tempo: needs `otlp_out` implemented (declared in logit-config, rejected at
  # validation today) *and* something that actually produces spans -- `bench/internal-spans-
  # costing` (PR #39) measured the cost of carrying trace context through the pipeline and
  # reverted the prototype; no span is emitted anywhere yet. `tempo`'s OTLP receiver
  # (demo/tempo/tempo.yaml) is already up, waiting.
  #
