# The demo pipeline (demo/README.md, docs/plans/demo-tracing-stack.md, docs/plans/demo-stack.md,
# docs/plans/otlp-end-to-end.md, docs/plans/otlp-logs-and-resource-identity.md). Exercises
# syslog in, otlp in, set + json + trace_context + scale + kv_metrics + keep + aggregate, InfluxDB
# out, OTLP/HTTP out, OTLP/gRPC out, plus `internal` observing the pipeline itself (ADR
# `internal-telemetry-as-pipeline-events`, ADR `internal-span-emission-and-deterministic-sampling`)
# -- against traffic that crosses three real tiers: haproxy -> nginx -> app
# (demo/compose.yaml's `traffic` service drives it; docs/plans/demo-tracing-stack.md's
# workstream A). All three signals -- logs, metrics, traces -- leave `logit` for a real backend:
# Loki, InfluxDB, and Tempo respectively.
#
# Topology:
#
#   One `syslog_in` listener per tier -- `set` stamps a resource onto the whole BATCH, not per
#   event, so three tiers sharing one listener would interleave into one batch and get one wrong
#   service.name (docs/plans/demo-tracing-stack.md's workstream A).
#
#   haproxy --syslog/UDP:5140--> haproxy_in -> haproxy_identity (set) -> haproxy_json (json)
#                                                                              |
#   nginx   --syslog/UDP:5141--> nginx_in   -> nginx_identity   (set) -> nginx_json   (json)
#                                                                              |
#   demo-app --syslog/UDP:5142--> app_in    -> app_identity     (set) -> app_json     (json)
#                                                                              |
#                                                                              v
#                                            {haproxy,nginx,app}_trace (trace_context) <- splits
#                                                                 |             each tier's plain
#                                                                 |             trace_id/span_id/
#                                       +-------------------------+             trace_flags fields
#                                       |                         |             onto LogRecord.trace
#                                       v                         v
#                              tap (stdio_out)      log_out (otlp_out, HTTP) --> Loki
#
#          haproxy_trace                       nginx_trace
#                |                                   |
#                |                                   v
#                |                          nginx_scale (scale)  <- request_time: s -> ms, to
#                |                                   |              share a measurement with
#                v                                   v              haproxy's own milliseconds
#       haproxy_metrics (kv_metrics)         nginx_metrics (kv_metrics)
#                |                                   |
#                +-------------------+---------------+
#                                    v
#                              trimmed (keep)   <- drops high-cardinality attrs (request_id,
#                                    |             trace_id, span_id)
#                                    v
#                              windowed (aggregate)
#                                    |
#   self (internal) --+-> self_windowed (aggregate) --> influx_out --> InfluxDB
#                      |
#                      +-> trace_windowed (aggregate) ---+
#                                                         +-> trace_out (otlp_out, gRPC) --> tempo
#   demo-app --OTLP/HTTP protobuf:4318--> app_otlp_in -> app_spans (aggregate) --+
#   (workstream B -- the app's own real spans, parented to haproxy's, alongside
#   `logit`'s internal ones; the first traffic `otlp_in` has ever received in this demo)
components:
  haproxy_in:
    type: syslog_in
    bind: 0.0.0.0:5140
  nginx_in:
    type: syslog_in
    bind: 0.0.0.0:5141
  app_in:
    type: syslog_in
    bind: 0.0.0.0:5142

  # `syslog_in` mustn't invent a resource identity for data it didn't produce
  # (docs/design/internal-telemetry.md's "Resource identity" section) -- `set` is the operator
  # declaring one instead (ADR `operator-declared-resource-attributes`), one per tier since each
  # has its own listener (see the topology comment above).
  haproxy_identity:
    type: set
    sources: [haproxy_in]
    resource:
      service.name: haproxy
      service.namespace: demo
  nginx_identity:
    type: set
    sources: [nginx_in]
    resource:
      service.name: nginx
      service.namespace: demo
  app_identity:
    type: set
    sources: [app_in]
    resource:
      service.name: demo-app
      service.namespace: demo

  haproxy_json:
    type: json
    sources: [haproxy_identity]
  nginx_json:
    type: json
    sources: [nginx_identity]
  app_json:
    type: json
    sources: [app_identity]

  # Lifts each tier's plain trace_id/span_id/trace_flags JSON fields onto LogRecord.trace (ADR
  # `log-record-trace-context`) -- `logit` has no traceparent parser, so every tier logs the
  # already-split id: demo/haproxy/haproxy.cfg mints the W3C traceparent and demo/nginx/nginx.conf
  # splits it by hand via `map`, while demo/app's access log reads its already-split
  # otelTraceID/otelSpanID straight off the active OpenTelemetry span
  # (opentelemetry-instrumentation-django's own W3C-propagator extraction of the same header --
  # demo/app/pages/logging_formatter.py). `keep_source` left at its default `false`:
  # the lifted id becomes Loki's *native* trace_id structured metadata via `log_out`'s OTLP
  # export below, and a surviving `trace_id` attribute would collide with it.
  haproxy_trace:
    type: trace_context
    sources: [haproxy_json]
    trace_id: trace_id
    span_id: span_id
    flags: trace_flags # decimal, never hex
  nginx_trace:
    type: trace_context
    sources: [nginx_json]
    trace_id: trace_id
    span_id: span_id
    flags: trace_flags
  app_trace:
    type: trace_context
    sources: [app_json]
    trace_id: trace_id
    span_id: span_id
    flags: trace_flags

  # The app's own real OTel spans (demo/app/gunicorn.conf.py), over OTLP/HTTP protobuf -- the
  # first traffic `otlp_in` has ever received in this demo (`demo/README.md`'s old "What isn't
  # exercised yet"). `protocol: http`, matching `demo/app`'s exporter
  # (opentelemetry-exporter-otlp-proto-http; `otlp_in` rejects OTLP/JSON outright,
  # `crates/logit-inputs/src/otlp.rs`). The default W3C propagator makes each span a genuine child
  # of haproxy's span with no code in `demo/app` at all.
  app_otlp_in:
    type: otlp_in
    bind: 0.0.0.0:4318
    protocol: http

  # Same reasoning as `trace_windowed` below: `otlp_out` aborts a whole `send` on the first failing
  # signal, and Tempo is traces-only, so anything non-span must be stripped before `trace_out` sees
  # it. `app_otlp_in` only ever carries spans today, so this is currently a no-op pass-through in
  # practice -- kept for the same reason `trace_windowed` is: correctness that doesn't depend on
  # staying that way.
  app_spans:
    type: aggregate
    sources: [app_otlp_in]
    interval: 60s

  # `docker compose logs -f logit` -- the fastest way to see the pipeline doing something, now one
  # block per tier per request, all three sharing a trace_id and differing in span_id, plus the
  # app's own span blocks from `app_otlp_in`.
  tap:
    type: stdio_out
    sources: [haproxy_trace, nginx_trace, app_trace, app_otlp_in]

  # Logs to Loki, direct over OTLP -- no relay service in between (docs/plans/
  # otlp-logs-and-resource-identity.md's workstream B; Loki accepts OTLP logs natively as of
  # 3.7.7, the version this stack pins). `protocol: http`, not `grpc` like `trace_out` below --
  # Loki's OTLP ingestion is HTTP-only. `endpoint` is a URL base for HTTP (unlike gRPC's bare
  # authority): `http://loki:3100/otlp` resolves to exactly `/otlp/v1/logs`
  # (`crates/logit-proto/src/lib.rs`'s hardcoded per-signal path). Loki's default index-label set
  # already includes `service.name`/`service.namespace` -- what each `*_identity` stamps above --
  # so no `demo/loki/loki.yaml` change is needed for real stream labels.
  log_out:
    type: otlp_out
    sources: [haproxy_trace, nginx_trace, app_trace]
    protocol: http
    endpoint: http://loki:3100/otlp

  # nginx's JSON field names (host/request_method/status/body_bytes_sent/request_time) are
  # unchanged from before workstream A. `request_time` still arrives in SECONDS here -- `scale`
  # converts it to milliseconds below, right before `nginx_metrics` reads it, so the attribute
  # itself (and everything else that might read it, `tap`/`log_out` included) keeps meaning
  # "seconds"; only the metrics branch sees the converted value.
  nginx_scale:
    type: scale
    sources: [nginx_trace]
    fields:
      request_time: 1000 # seconds -> milliseconds, to match haproxy's %Tr below

  # Both tiers share the `web.*` measurement names below and are told apart by the `service.name`
  # tag `*_identity` already stamped (Grafana panels filter on it) -- see
  # docs/adr/scale-transform.md for why `request_time` needed `scale` first to make that safe.
  # `web.bytes_sent` is the one name shared despite meaning slightly different things per tier:
  # HAProxy's `%B` (demo/haproxy/haproxy.cfg) is total bytes written to the client, headers
  # included; nginx's `$body_bytes_sent` is body only. Neither tier's panel ever compares the two
  # directly, so sharing the name is fine -- just not exact.
  nginx_metrics:
    type: kv_metrics
    sources: [nginx_scale]
    counters:
      - name: web.requests # +1 per event
      - name: web.bytes_sent
        field: body_bytes_sent
    distributions:
      - name: web.request_time
        field: request_time
        unit: ms # nginx_scale already converted it

  haproxy_metrics:
    type: kv_metrics
    sources: [haproxy_trace]
    counters:
      - name: web.requests
      - name: web.bytes_sent
        field: bytes_sent
    # A process-wide gauge (HAProxy's own concurrent-connection count), not a per-request value --
    # it rides on this event's request/response tags the same way every other field here does, so
    # it lands as one series per tag combination holding the last value seen each window. A panel
    # over it should `|> group() |> last()` rather than plot the raw series.
    gauges:
      - name: web.connections_active
        field: conns_active
    distributions:
      - name: web.request_time
        field: request_time_ms
        unit: ms

  # Before `aggregate`, not after -- otherwise its SeriesKey would key a series per request on
  # `request_id` (or now, `trace_id`/`span_id`) alone. `host`/`request_method`/`status` are the
  # tags meant to survive from both tiers; `termination_state` is HAProxy-only (absent on nginx
  # events, so it's simply not a tag there).
  trimmed:
    type: keep
    sources: [nginx_metrics, haproxy_metrics]
    fields: [host, request_method, status, termination_state]

  windowed:
    type: aggregate
    sources: [trimmed]
    interval: 10s

  # `logit` observing itself (docs/design/internal-telemetry.md, ADR `internal-telemetry-as-pipeline-events`) -- the dashboard's
  # `logit.*` panels come from here. `span_sample_rate` set explicitly to `1.0` rather than left at
  # its `0.1` default (docs/adr/internal-span-emission-and-deterministic-sampling.md) -- this
  # is a demo meant to show every span it can, not a production deployment weighing span volume
  # against storage cost. Its batches carry `service.name = logit` on their resource (see
  # internal-telemetry.md's "Resource identity" section) -- that's what lets Tempo resolve a root
  # service for these traces at all.
  self:
    type: internal
    interval: 10s
    span_sample_rate: 1.0

  self_windowed:
    type: aggregate
    sources: [self]
    interval: 60s # `self`'s 10s divides evenly into it, as internal-telemetry.md's guidance asks

  influx_out:
    type: influxdb_out
    sources: [windowed, self_windowed]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN

  # `self` is `internal` observing *all* of `logit`'s own telemetry, not just spans -- every drain
  # also carries this process's own `logit.*` metrics (Counter/Gauge/Distribution, every one of
  # them mergeable). `trace_windowed` exists to strip those out before `trace_out` ever sees them:
  # `aggregate` absorbs every mergeable metric into its window state and forwards a metric-less
  # event -- a pure span, here -- untouched and immediately, on every `process` call, without
  # waiting for its own `flush` (`crates/logit-transforms/src/aggregate.rs`'s `process` doc
  # comment). So on the (overwhelming) majority of ticks, only spans reach `trace_out` at all.
  #
  # This isn't pipeline hygiene, it's load-bearing: `otlp_out` issues one request per signal and
  # aborts the rest of a `send` call on the first failing one
  # (`crates/logit-outputs/src/otlp.rs`'s module doc), and Tempo is a traces-only gRPC server (it
  # registers no `MetricsService`) -- a batch mixing spans and metrics would see its traces
  # request succeed and its metrics request fail with `grpc-status: 12` (UNIMPLEMENTED), correctly
  # classified `Fault::Permanent` and correctly not retried. That alone is recoverable noise (the
  # spans already landed). What isn't recoverable: confirmed directly against a first version of
  # this config that skipped `trace_windowed` -- `self`'s 10s drain interval meant *every* batch
  # failed this way, `send` never once returned `Ok` for `trace_out`, and `write_loop`'s ~60s
  # sustained-permanent-failure guard (`docs/adr/service-lifecycle-and-output-retry.md`,
  # revised by `docs/adr/buffered-sink-delivery.md`) killed the whole `logit` process a
  # minute after startup -- taking the InfluxDB metrics path down with it. `trace_windowed`'s own
  # `flush` (every 60s here) still occasionally emits a real metrics-only batch that fails the same
  # way, but the many successful pure-span deliveries in between (every ~10s) reset that guard's
  # streak long before it reaches 60s -- see `docs/known-gaps.md`'s "`otlp_out` aborts an entire
  # batch's `send`..." entry for the full account, including why this is specific to a mixed-signal
  # source feeding a signal-partial backend, not a general `otlp_out` problem.
  trace_windowed:
    type: aggregate
    sources: [self]
    interval: 60s

  # Deliberately gRPC, not HTTP (docs/adr/hand-rolled-grpc-over-hyper.md) -- Tempo's `:4317`
  # receiver, to exercise the transport the rest of this config doesn't otherwise touch;
  # `endpoint` is a bare `host:port` authority for gRPC, not a URL (see
  # `crates/logit-outputs/src/otlp.rs`'s `grpc_authority`). Two sources now: `logit`'s own internal
  # spans (`trace_windowed`) and `demo-app`'s real request spans (`app_spans`) -- both land in the
  # same Tempo trace when their trace ids agree, which is exactly the haproxy-rooted trace every
  # other tier's log lines already carry.
  trace_out:
    type: otlp_out
    sources: [trace_windowed, app_spans]
    protocol: grpc
    endpoint: tempo:4317
