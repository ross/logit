# The demo pipeline (demo/README.md, docs/plans/demo-stack.md, docs/plans/
# otlp-end-to-end.md). Exercises exactly what `logit` implements today -- syslog in, json +
# kv_metrics + keep + aggregate, InfluxDB out, syslog out, OTLP/gRPC out, plus `internal` observing
# the pipeline itself (ADR `internal-telemetry-as-pipeline-events`, ADR `internal-span-emission-and-deterministic-sampling`) -- against the traffic `demo/compose.yaml`'s `hello`
# service emits (real visits plus a background synthetic loop). All three signals -- logs, metrics,
# traces -- now leave `logit` for a real backend: Loki, InfluxDB, and Tempo respectively.
#
# Topology:
#
#   hello --syslog/UDP--> access_in (syslog_in)
#                               |
#                               v
#                          access_json (json)     <- merges the JSON body into attributes
#                             /  |  \
#                            v   v   v
#              tap (stdio_out)  |    log_out (syslog_out) --> alloy --> Loki
#                                |
#                                v
#                       access_metrics (kv_metrics) <- adds metrics to the event
#                                          |
#                                          v
#                                    trimmed (keep)   <- drops high-cardinality attrs (request_id)
#                                          |
#                                          v
#                                    windowed (aggregate)
#                                          |
#   self (internal) --+-> self_windowed (aggregate) --> influx_out --> InfluxDB
#                      |
#                      +-> trace_only (has_signal) --> trace_out (otlp_out, gRPC) --> tempo
components:
  access_in:
    type: syslog_in
    bind: 0.0.0.0:5140

  access_json:
    type: json
    sources: [access_in]

  # `docker compose logs -f logit` -- the fastest way to see the pipeline doing something.
  tap:
    type: stdio_out
    sources: [access_json]

  # Logs to Loki, via the `alloy` service's syslog listener (demo/alloy/config.alloy). Sources
  # `access_json`, so the message is the raw JSON body -- exactly what the dashboard's `| json`
  # LogQL panels parse. RFC 5424, not 3164: 3164 carries no year and no timezone, so a receiver
  # has to guess both (docs/adr/syslog-output.md). `facility`/`hostname`/`app_name` are all
  # left at their defaults on purpose -- the demo's traffic already carries `syslog.facility`,
  # `syslog.hostname` (`demo-hello`), and `syslog.tag` (`demoapp`) from `access_in`'s own
  # `syslog_in` decode, and `syslog_out` round-trips those attributes onto every relayed message,
  # which is what gives Loki real `host`/`app` stream labels from the first line.
  log_out:
    type: syslog_out
    sources: [access_json]
    endpoint: alloy:5141
    transport: udp
    format: rfc5424

  access_metrics:
    type: kv_metrics
    sources: [access_json]
    counters:
      - name: web.requests # +1 per event
      - name: web.bytes_sent
        field: body_bytes_sent
    distributions:
      - name: web.request_time
        field: request_time
        unit: s

  # Before `aggregate`, not after -- otherwise its SeriesKey would key a series per request on
  # `request_id` alone. `host`/`request_method`/`status` are the only tags meant to survive.
  trimmed:
    type: keep
    sources: [access_metrics]
    fields: [host, request_method, status]

  windowed:
    type: aggregate
    sources: [trimmed]
    interval: 10s

  # `logit` observing itself (docs/design/internal-telemetry.md, ADR `internal-telemetry-as-pipeline-events`) -- the dashboard's
  # `logit.*` panels come from here. `span_sample_rate` set explicitly to `1.0` rather than left at
  # its `0.1` default (docs/adr/internal-span-emission-and-deterministic-sampling.md) -- this
  # is a demo meant to show every span it can, not a production deployment weighing span volume
  # against storage cost. Its batches carry `service.name = logit` on their resource (see
  # internal-telemetry.md's "Resource identity" section) -- that's what lets Tempo resolve a root
  # service for these traces at all.
  self:
    type: internal
    interval: 10s
    span_sample_rate: 1.0

  self_windowed:
    type: aggregate
    sources: [self]
    interval: 60s # `self`'s 10s divides evenly into it, as internal-telemetry.md's guidance asks

  influx_out:
    type: influxdb_out
    sources: [windowed, self_windowed]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN

  # `self` is `internal` observing *all* of `logit`'s own telemetry, not just spans -- every drain
  # also carries this process's own `logit.*` metrics (Counter/Gauge/Distribution) alongside its
  # spans, but `self` never mixes the two *on one event*: each drain is either a metric-only point
  # or a span-only span event (`crates/logit-core/src/telemetry.rs`'s `drain`), never both at
  # once. `trace_only` exists to drop the metric-only ones before `trace_out` ever sees them --
  # `has_signal` never mutates a forwarded event, so every span that does reach `trace_out` arrives
  # exactly as `self` produced it. See `docs/adr/signal-filtering-components.md`.
  #
  # This isn't pipeline hygiene, it's load-bearing: `otlp_out` issues one request per signal and
  # aborts the rest of a `send` call on the first failing one
  # (`crates/logit-outputs/src/otlp.rs`'s module doc), and Tempo is a traces-only gRPC server (it
  # registers no `MetricsService`) -- an `internal` metric point reaching `trace_out` would fail
  # with `grpc-status: 12` (UNIMPLEMENTED), and enough consecutive failures trip `write_loop`'s
  # ~60s sustained-permanent-failure guard (`docs/adr/service-lifecycle-and-output-retry.md`,
  # revised by `docs/adr/buffered-sink-delivery.md`), ending the whole `logit` process -- taking
  # the InfluxDB metrics path down with it, not just Tempo. Confirmed directly against an earlier
  # version of this config that fed `self` straight into `trace_out`: see `docs/known-gaps.md`'s
  # "`otlp_out` aborts an entire batch's `send`..." entry for the full account.
  trace_only:
    type: has_signal
    sources: [self]
    signals: [traces]

  # Deliberately gRPC, not HTTP (docs/adr/hand-rolled-grpc-over-hyper.md) -- Tempo's `:4317`
  # receiver, to exercise the transport the rest of this config doesn't otherwise touch;
  # `endpoint` is a bare `host:port` authority for gRPC, not a URL (see
  # `crates/logit-outputs/src/otlp.rs`'s `grpc_authority`).
  trace_out:
    type: otlp_out
    sources: [trace_only]
    protocol: grpc
    endpoint: tempo:4317
