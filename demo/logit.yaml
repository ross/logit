# The demo pipeline (demo/README.md, docs/plans/demo-tracing-stack.md, docs/plans/demo-stack.md,
# docs/plans/otlp-end-to-end.md, docs/plans/otlp-logs-and-resource-identity.md,
# docs/plans/access-log-spans.md, docs/plans/file-tailing.md, docs/plans/demo-richer-traces.md,
# docs/plans/operator-surface.md).
# Exercises syslog in, tail_in, docker_in, otlp_in, set + json + lua + trace_context + scale +
# kv_metrics + keep_signals + keep + aggregate, InfluxDB out, OTLP/HTTP out, OTLP/gRPC out, plus
# `internal` observing the pipeline itself (ADR `internal-telemetry-as-pipeline-events`, ADR
# `internal-span-emission-and-deterministic-sampling`) -- against traffic that crosses five real
# tiers: haproxy -> nginx -> app -> postgres, plus an async worker over Redis
# (demo/compose.yaml's `traffic` service drives the first three; docs/plans/demo-tracing-stack.md's
# workstream A, docs/plans/demo-richer-traces.md's workstreams C and D). Logs and metrics leave
# `logit` for a real backend (Loki, InfluxDB); traces reach Tempo four ways -- `logit`'s own
# internal spans via `tempo_out`, haproxy's and nginx's real access-line spans (`docs/adr/
# trace-context-span-lifting.md`'s `span:` block, also via `tempo_out`), every real SDK-carried
# span (`demo-app`'s request/database-client/Celery-producer spans, `demo-worker`'s own
# Celery-consumer/database-client spans) going straight to Tempo, deliberately not through `logit`
# at all (see the comment above `stdout` below), and now real OTLP traces `logit` itself decodes --
# `browser_in` (`otlp_in`, ADR `otlp-json-decoding`), reachable through `haproxy`'s own `/v1/*`
# route (`demo/haproxy/haproxy.cfg`) rather than published directly -- not every telemetry leg
# needs `logit` in front of it, and this demo shows that honestly rather than routing everything
# through `logit` just to prove it can. `postgres`'s own log lines still carry that same trace id
# back into Loki, though (`postgres_trace_lift`/`postgres_trace` below) -- a `traceparent` lifted
# out of a sqlcommenter-tagged SQL statement, not a second SDK.
# `browser_in` wires `otlp_in` into this demo for the first time (demo/README.md's old "What isn't
# exercised yet"), closing that gap structurally -- but nothing in this stack's own traffic sends
# to it yet: a real browser OTel SDK is docs/plans/browser-tracing.md's workstream C, separate and
# later. This workstream only proves the server-side path, with a manual OTLP/JSON POST.
#
# Topology:
#
#   One listener per tier -- `set` stamps a resource onto the whole BATCH, not per event, so
#   three tiers sharing one listener would interleave into one batch and get one wrong
#   service.name (docs/plans/demo-tracing-stack.md's workstream A). nginx's is `docker_in`, not
#   `syslog_in` (docs/adr/file-tailing-and-docker-json-logs.md, docs/plans/file-tailing.md's
#   workstream D) -- this demo is that ADR's end-to-end proof; `nginx_stdout` (`lua`) drops its
#   container's own error_log lines (`log.iostream: stderr`) before they'd otherwise reach
#   `nginx_identity`/`nginx_json` as if they were access lines.
#
#   haproxy --syslog/UDP:5140--> haproxy_in -> haproxy_identity (set) -> haproxy_json (json)
#                                                                              |
#   nginx   --stdout--> json-file --tail(docker_in)--> nginx_in -> nginx_stdout (lua, drops
#                                       stderr) -> nginx_identity (set) -> nginx_json (json)
#                                                                              |
#   demo-app --syslog/UDP:5142--> app_in    -> app_identity     (set) -> app_json     (json)
#                                                                              |
#   demo-worker --syslog/UDP:5143--> worker_in -> worker_identity (set) -> worker_json (json)
#                                                                              |
#                                                                              v
#                                       {haproxy,nginx,app,worker}_trace (trace_context) <- lifts
#                                                                 |             trace.id/span.id
#                                                                 |             onto LogRecord.trace;
#                                                                 |             haproxy_trace/
#                                                                 |             nginx_trace also
#                                                                 |             mint a real span
#                                                                 |             from the same line
#                                                                 |             (docs/adr/
#                                                                 |             trace-context-
#                                                                 |             span-lifting.md)
#                                       +-------------------------+---------------------+
#                                       v                         v                     v
#                              stdout (stdio_out)      logs_only (keep_signals: [logs])  |
#                                                                 |                      |
#                                                                 v                      |
#                                                          loki_out (otlp_out, HTTP)      |
#                                                                                         v
#                                                              access_spans (keep_signals: [traces],
#                                                                             haproxy_trace/nginx_trace only --
#                                                                             app_trace/worker_trace carry no span)
#                                                                                         |
#          haproxy_trace                       nginx_trace                               |
#                |                                   |                                   |
#                |                                   v                                   |
#                |                          nginx_scale (scale)  <- request_time: s -> ms |
#                |                                   |                                   |
#                v                                   v                                   |
#       haproxy_metrics (kv_metrics)         nginx_metrics (kv_metrics)                   |
#                |                                   |                                   |
#                +-------------------+---------------+                                   |
#                                    v                                                    |
#                              trimmed (keep)   <- drops high-cardinality attrs            |
#                                    |                                                    |
#                                    v                                                    |
#                              windowed (aggregate)                                        |
#                                    |                                                    |
#   self (internal) --+-> self_windowed (aggregate) --> influx_out --> InfluxDB            |
#                      |                                                                  |
#                      +-> trace_only (has_signal) ---------------------------------> tempo_out (otlp_out, gRPC) --> tempo
#
#   demo-app --OTLP/HTTP protobuf--> tempo:4318 directly, bypassing `logit` entirely --
#   parented to nginx's span (docs/adr/trace-context-span-lifting.md: nginx now mints and forwards
#   its own span id, rather than only relaying haproxy's), since the default W3C propagator
#   extracts whichever `traceparent` it's given regardless of which backend the span is headed for.
#   demo-worker does the same, straight to the same tempo:4318 -- its own Celery CONSUMER span
#   parents to demo-app's Celery PRODUCER span (`.delay()`, docs/plans/demo-richer-traces.md
#   workstream D), which parents to whichever request enqueued it, same propagator, no code either
#   side of that hop.
#
#   Two more parallel legs (docs/plans/demo-richer-traces.md workstreams C and D), untied to the
#   diagram above since neither touches haproxy/nginx/app's own listeners:
#
#   postgres --jsonlog file--> tail(tail_in)--> postgres_in -> postgres_identity (set)
#             -> postgres_json (json) -> postgres_trace_lift (regex, extracts a `traceparent` out
#             of a sqlcommenter-tagged statement) -> postgres_trace (trace_context, no `span:` --
#             demo-app's own psycopg CLIENT span is already real) -> stdout / logs_only -> loki_out
#
#   demo-worker --syslog/UDP:5143--> worker_in -> worker_identity (set) -> worker_json (json)
#             -> worker_trace (trace_context, no `span:` -- the worker's own Celery/psycopg spans
#             are already real) -> stdout / logs_only -> loki_out
#
#   browser (real OTel SDK, or curl) --OTLP/JSON POST /v1/traces--> haproxy (`is_otlp` ACL,
#             demo/haproxy/haproxy.cfg) --> browser_in (otlp_in, :4318) -> stdout / browser_spans
#             (keep_signals: [traces]) -> tempo_out. No set/json/trace_context chain -- unlike
#             every listener above, the sender already carries its own Resource and a real
#             SpanRecord, so there's nothing for `set` to stamp on. `browser_spans` exists for the
#             identical reason `trace_only`/`access_spans` do (see `trace_only`'s comment below),
#             not because a real OTel SDK would ever send this input anything but traces.
#
#   logit's own self-diagnostics (warn and above, `internal`'s default `logs:` threshold) ride
#   the same `self` -> logs_only -> loki_out leg as every other tier's log events, alongside
#   `self`'s own points/spans (docs/plans/operator-surface.md, workstream D) -- they are ordinary
#   `LogRecord`-carrying events, nothing loki_out needs to know is different.
#
# `admin: { bind: 0.0.0.0:9600 }` below serves `/readyz`/`/healthz`
# (docs/deploying.md's "Probes and exit codes") -- what demo/compose.yaml's own `logit` healthcheck
# probes via `logit ready`.
admin:
  bind: 0.0.0.0:9600

components:
  haproxy_in:
    type: syslog_in
    bind: 0.0.0.0:5140
  # docker_in, not syslog_in -- `nginx` (demo/compose.yaml) logs to stdout only now, and this
  # tails its container's own Docker json-file log directly off the host
  # (docs/adr/file-tailing-and-docker-json-logs.md; this demo is that ADR's end-to-end proof).
  # `containers:` names the fixed `container_name` demo/compose.yaml gives the `nginx` service --
  # explicit, not `discover: true`, since there's exactly one container to follow and naming it
  # is clearer than opting into every container on the host. `read_from: beginning` plus the
  # checkpoint below mean nothing is lost even if nginx logs a request before `logit` first
  # discovers its container directory.
  nginx_in:
    type: docker_in
    containers: [logit-demo-nginx]
    read_from: beginning
    checkpoint_path: /var/lib/logit/nginx.checkpoint

  # nginx's own error_log shares the same container (and so the same Docker json-file log) as its
  # access log, distinguished only by `log.iostream` (`stdout` vs `stderr`) -- `docker_in` itself
  # has no per-stream filter (deliberately; see the ADR's "Alternatives considered"), so this
  # inline `lua` stage is the filter, dropping anything that isn't an access line before it ever
  # reaches `nginx_identity`/`nginx_json` below (an error_log line isn't the JSON `nginx_json`
  # expects, and would otherwise inflate `web.requests` by one per error line too). `lua`, not a
  # native `filter` component -- there isn't one; `logit` ships no native predicate language, and
  # this five-line stage is the worked example for why (docs/adr/routing-by-condition-is-lua.md).
  nginx_stdout:
    type: lua
    sources: [nginx_in]
    script: |
      function process(event)
        if event.attributes["log.iostream"] ~= "stdout" then
          return nil
        end
        return event
      end
  app_in:
    type: syslog_in
    bind: 0.0.0.0:5142

  # The `worker` service's own log line for `pages/tasks.py`'s one task
  # (docs/plans/demo-richer-traces.md workstream D) -- a separate listener from `app_in`, same
  # reasoning as every other tier: one `service.name` per batch. Its own OTel spans (Celery
  # CONSUMER, psycopg CLIENT) go straight to Tempo, exactly like `app`'s -- this listener only
  # ever sees the one log line `pages/tasks.py`'s `worker_logger` emits per task run.
  worker_in:
    type: syslog_in
    bind: 0.0.0.0:5143

  # This demo's first real `tail_in` (docs/plans/demo-richer-traces.md workstream C) -- every
  # other tier so far is `syslog_in` or `docker_in`, `tail_in`'s own Docker-specific sibling.
  # `paths`' `*` is permitted only in the final path component (`crates/logit-config/src/lib.rs`),
  # which is exactly Postgres's own jsonlog rotation shape: a fresh `postgresql-<timestamp>.json`
  # file every `log_rotation_age` (demo/compose.yaml), never a rename-in-place. `read_from:
  # beginning` plus the checkpoint below mean a `logit` restart resumes rather than replaying or
  # skipping, the same contract `nginx_in` already has. Unlike `docker_in`, `tail_in` stamps no
  # resource attributes of its own -- `postgres_identity` below is load-bearing, not decorative.
  postgres_in:
    type: tail_in
    paths: ["/var/log/postgresql/*.json"]
    read_from: beginning
    checkpoint_path: /var/lib/logit/postgres.checkpoint

  # Browser-facing OTLP ingress (docs/plans/demo-tracing-stack.md workstream C,
  # docs/plans/browser-tracing.md) -- reachable through `haproxy`'s `is_otlp` ACL on its published
  # `:8080` (demo/haproxy/haproxy.cfg's `/v1/*` route), not published directly (demo/README.md):
  # a browser SDK needs a same-origin endpoint, and there's no other reason to expose `logit` to
  # the host. `protocol: http`, not `grpc` -- a browser's `fetch`/`XMLHttpRequest` can't speak
  # gRPC, and OTLP/JSON decoding (ADR `otlp-json-decoding`) is what makes this endpoint usable from
  # one at all, not just protobuf. Unlike every syslog/docker/tail-sourced input above, no `set`
  # stage stamps a resource in front of this one: a real OTel SDK (or a hand-built OTLP/JSON
  # payload, like this workstream's own curl verification) sets its own `Resource` with
  # `service.name`, so there's nothing for `set` to supply that the sender didn't already provide.
  browser_in:
    type: otlp_in
    bind: 0.0.0.0:4318
    protocol: http

  # `syslog_in` mustn't invent a resource identity for data it didn't produce
  # (docs/design/internal-telemetry.md's "Resource identity" section) -- `set` is the operator
  # declaring one instead (ADR `operator-declared-resource-attributes`), one per tier since each
  # has its own listener (see the topology comment above).
  haproxy_identity:
    type: set
    sources: [haproxy_in]
    resource:
      service.name: haproxy
      service.namespace: demo
  nginx_identity:
    type: set
    sources: [nginx_stdout]
    resource:
      service.name: nginx
      service.namespace: demo
  app_identity:
    type: set
    sources: [app_in]
    resource:
      service.name: demo-app
      service.namespace: demo
  worker_identity:
    type: set
    sources: [worker_in]
    resource:
      service.name: demo-worker
      service.namespace: demo
  postgres_identity:
    type: set
    sources: [postgres_in]
    resource:
      service.name: postgres
      service.namespace: demo

  haproxy_json:
    type: json
    sources: [haproxy_identity]
  nginx_json:
    type: json
    sources: [nginx_identity]
  app_json:
    type: json
    sources: [app_identity]
  worker_json:
    type: json
    sources: [worker_identity]
  # Parses each raw jsonlog line itself -- Postgres already writes one JSON object per line
  # (`log_destination=jsonlog`, demo/compose.yaml), so this needs no field remapping, the same way
  # every other tier's own JSON access line doesn't.
  postgres_json:
    type: json
    sources: [postgres_identity]

  # Lifts each tier's trace.id/span.id/trace.flags (or an inbound `traceparent`, parsed natively
  # as of `docs/adr/trace-context-span-lifting.md`) onto `LogRecord.trace`. `haproxy_trace`/
  # `nginx_trace` additionally mint a real `SpanRecord` on the same event via `span:` -- an access
  # line's own start/end/duration attributes become a span whose start replaces `event.timestamp`.
  # `app_trace` carries no `span:` block: `app`'s request span is already real
  # (opentelemetry-instrumentation-django), so lifting one from its access log would be a second,
  # redundant span for the same request rather than a useful one. `keep_source` left at its
  # default `false`: the convention attributes are removed on a successful lift so `logs_only`/
  # `loki_out` below carry only what each tier's own log body actually needs, and a surviving
  # `trace_id`-shaped attribute can't collide with Loki's *native* trace_id structured metadata.
  haproxy_trace:
    type: trace_context
    sources: [haproxy_json]
    span:
      kind: server
      name: http.request
  nginx_trace:
    type: trace_context
    sources: [nginx_json]
    span:
      kind: server
      name: http.request
  app_trace:
    type: trace_context
    sources: [app_json]
  # No `span:` block, same reasoning as `app_trace` above -- the worker's own spans (Celery
  # CONSUMER, psycopg CLIENT) are already real (`demoproj/telemetry.py`), so lifting one from this
  # log line would only be redundant.
  worker_trace:
    type: trace_context
    sources: [worker_json]

  # `opentelemetry-instrumentation-psycopg`'s sqlcommenter (`enable_commenter=True`,
  # demo/app/gunicorn.conf.py) appends a trailing SQL comment carrying `traceparent='<header>'`
  # (among other, irrelevant keys) to every statement `pages/views.py`'s `work` issues --
  # `log_min_duration_statement=0` (demo/compose.yaml) then logs that statement, comment included,
  # verbatim into `message`. `regex` (docs/adr/regex-transform.md) extracts it: `field: message`
  # matches `postgres_json`'s already-lifted `attributes.message` instead of `log.message`, and
  # the pattern's one named capture, `traceparent`, becomes that same attribute for `trace_context`
  # below to parse exactly as it would a real HTTP header. A line with no match (Postgres's own
  # startup/checkpointer/autovacuum lines, or a statement issued outside a request's span) passes
  # through unchanged, not dropped -- `trace_context` reports `skipped{reason="missing"}` for those
  # and passes them through as plain logs, same as any tier's own untraced line.
  postgres_trace_lift:
    type: regex
    sources: [postgres_json]
    field: message
    pattern: "traceparent='(?P<traceparent>[^']+)'"
  postgres_trace:
    type: trace_context
    sources: [postgres_trace_lift]

  # No component here for the app's own OTel spans (demo/app/gunicorn.conf.py) -- they go straight
  # to Tempo's own `otlp.protocols.http` receiver on :4318 (`demo/tempo/tempo.yaml`), alongside the
  # gRPC one `tempo_out` below uses, never touching `logit` (see the header comment for why). The
  # default W3C propagator still makes each span a genuine child of nginx's span with no code in
  # `demo/app` at all -- that part doesn't depend on which backend the span lands in.

  # `docker compose logs -f logit` -- the fastest way to see the pipeline doing something, now one
  # block per tier per request (haproxy's and nginx's carrying a real `span` section too), all
  # three sharing a trace id and differing in span id. The app's own spans don't appear here --
  # they never reach `logit` (see above). `postgres_trace`/`worker_trace` join the other four
  # tiers -- most of `postgres_trace`'s lines carry no trace at all (Postgres logs far more than
  # one line per request), and `worker_trace`'s block for a given trace typically arrives well
  # after the other tiers' own, since the task itself runs after the response already went back
  # to the client. Both are expected, not bugs. `browser_in` joins the same sink directly, not
  # through a `*_trace` stage -- it's already a span, with no companion log line the way every
  # other source here has -- but nothing in this stack's own traffic sends to it yet (see the
  # header comment), so its block only shows up after a manual `curl`/browser POST to `/v1/traces`.
  stdout:
    type: stdio_out
    sources:
      [haproxy_trace, nginx_trace, app_trace, worker_trace, postgres_trace, browser_in]

  # Loki's OTLP ingestion accepts logs only -- it registers no `TracesService`/`MetricsService` --
  # and `otlp_out` aborts an entire batch's `send` on the first signal request that fails
  # (`crates/logit-outputs/src/otlp.rs`'s module doc; see `trace_only`/`tempo_out` below for the
  # identical reasoning applied to Tempo). Before `docs/adr/trace-context-span-lifting.md`,
  # `haproxy_trace`/`nginx_trace`/`app_trace` only ever produced log events, so this was never a
  # problem; now that the first two also produce span-only events downstream, `loki_out` needs
  # this `keep_signals: [logs]` gate in front of it -- `keep_signals` clears the payload slots it
  # isn't given (ADR `signal-filtering-components`), so every log that does reach `loki_out`
  # arrives with its log payload intact, just without the span-only events that would otherwise
  # trip Loki's `send`. `self` (below) joins the same gate for the identical reason: it emits
  # points, spans, *and* (docs/plans/operator-surface.md, workstream D) logs, all through this one
  # component -- `keep_signals: [logs]` is what lets `logit`'s own self-diagnostics reach Loki
  # without also sending `loki_out` a metric point or a span it would reject.
  logs_only:
    type: keep_signals
    sources: [haproxy_trace, nginx_trace, app_trace, worker_trace, postgres_trace, self]
    signals: [logs]

  # Logs to Loki, direct over OTLP -- no relay service in between (docs/plans/
  # otlp-logs-and-resource-identity.md's workstream B; Loki accepts OTLP logs natively as of
  # 3.7.7, the version this stack pins). `protocol: http`, not `grpc` like `tempo_out` below --
  # Loki's OTLP ingestion is HTTP-only. `endpoint` is a URL base for HTTP (unlike gRPC's bare
  # authority): `http://loki:3100/otlp` resolves to exactly `/otlp/v1/logs`
  # (`crates/logit-proto/src/lib.rs`'s hardcoded per-signal path). Loki's default index-label set
  # already includes `service.name`/`service.namespace` -- what each `*_identity` stamps above --
  # so no `demo/loki/loki.yaml` change is needed for real stream labels.
  loki_out:
    type: otlp_out
    sources: [logs_only]
    protocol: http
    endpoint: http://loki:3100/otlp

  # The real spans `haproxy_trace`/`nginx_trace` minted, isolated from the log event each rides in
  # on -- `app_trace` isn't a source here at all, since it never produces a span (see its own
  # comment above). Feeds `tempo_out` below alongside `logit`'s own internal spans (`trace_only`).
  access_spans:
    type: keep_signals
    sources: [haproxy_trace, nginx_trace]
    signals: [traces]

  # Same reasoning as `trace_only`/`access_spans` above, applied to `browser_in`: `otlp_out`
  # aborts `tempo_out`'s entire batch send on the first signal request that fails
  # (`crates/logit-outputs/src/otlp.rs`'s module doc), and Tempo registers no `MetricsService`.
  # The browser will only ever send traces here -- there's no logs/metrics leg on this input at
  # all -- but making that structural rather than incidental is the same call this config already
  # makes for every other source feeding `tempo_out`: `keep_signals` costs nothing and rules the
  # failure mode out by construction rather than by what a well-behaved sender happens to do.
  browser_spans:
    type: keep_signals
    sources: [browser_in]
    signals: [traces]

  # nginx's JSON field names (host/request_method/status/body_bytes_sent/request_time) are
  # unchanged from before workstream A. `request_time` still arrives in SECONDS here -- `scale`
  # converts it to milliseconds below, right before `nginx_metrics` reads it, so the attribute
  # itself (and everything else that might read it, `stdout`/`loki_out` included) keeps meaning
  # "seconds"; only the metrics branch sees the converted value.
  nginx_scale:
    type: scale
    sources: [nginx_trace]
    fields:
      request_time: 1000 # seconds -> milliseconds, to match haproxy's %Tr below

  # Both tiers share the `web.*` measurement names below and are told apart by the `service.name`
  # tag `*_identity` already stamped (Grafana panels filter on it) -- see
  # docs/adr/scale-transform.md for why `request_time` needed `scale` first to make that safe.
  # `web.bytes_sent` is the one name shared despite meaning slightly different things per tier:
  # HAProxy's `%B` (demo/haproxy/haproxy.cfg) is total bytes written to the client, headers
  # included; nginx's `$body_bytes_sent` is body only. Neither tier's panel ever compares the two
  # directly, so sharing the name is fine -- just not exact.
  nginx_metrics:
    type: kv_metrics
    sources: [nginx_scale]
    counters:
      - name: web.requests # +1 per event
      - name: web.bytes_sent
        field: body_bytes_sent
    distributions:
      - name: web.request_time
        field: request_time
        unit: ms # nginx_scale already converted it

  haproxy_metrics:
    type: kv_metrics
    sources: [haproxy_trace]
    counters:
      - name: web.requests
      - name: web.bytes_sent
        field: bytes_sent
    # A process-wide gauge (HAProxy's own concurrent-connection count), not a per-request value --
    # it rides on this event's request/response tags the same way every other field here does, so
    # it lands as one series per tag combination holding the last value seen each window. A panel
    # over it should `|> group() |> last()` rather than plot the raw series.
    gauges:
      - name: web.connections_active
        field: conns_active
    distributions:
      - name: web.request_time
        field: request_time_ms
        unit: ms

  # Before `aggregate`, not after -- otherwise its SeriesKey would key a series per request on
  # `request_id` (or now, `trace.id`/`span.id`) alone. `host`/`request_method`/`status` are the
  # tags meant to survive from both tiers; `termination_state` is HAProxy-only (absent on nginx
  # events, so it's simply not a tag there). The trace/span attributes never reach here at all --
  # `haproxy_trace`/`nginx_trace` already removed them (`keep_source: false`, above).
  trimmed:
    type: keep
    sources: [nginx_metrics, haproxy_metrics]
    fields: [host, request_method, status, termination_state]

  windowed:
    type: aggregate
    sources: [trimmed]
    interval: 10s

  # `logit` observing itself (docs/design/internal-telemetry.md, ADR `internal-telemetry-as-pipeline-events`) -- the dashboard's
  # `logit.*` panels come from here. `span_sample_rate` set explicitly to `1.0` rather than left at
  # its `0.1` default (docs/adr/internal-span-emission-and-deterministic-sampling.md) -- this
  # is a demo meant to show every span it can, not a production deployment weighing span volume
  # against storage cost. Its batches carry `service.name = logit` on their resource (see
  # internal-telemetry.md's "Resource identity" section) -- that's what lets Tempo resolve a root
  # service for these traces at all.
  self:
    type: internal
    interval: 10s
    span_sample_rate: 1.0

  self_windowed:
    type: aggregate
    sources: [self]
    interval: 60s # `self`'s 10s divides evenly into it, as internal-telemetry.md's guidance asks

  influx_out:
    type: influxdb_out
    sources: [windowed, self_windowed]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN

  # `self` is `internal` observing *all* of `logit`'s own telemetry, not just spans -- every drain
  # also carries this process's own `logit.*` metrics (Counter/Gauge/Distribution) alongside its
  # spans, but `self` never mixes the two *on one event*: each drain is either a metric-only point
  # or a span-only span event (`crates/logit-core/src/telemetry.rs`'s `drain`), never both at
  # once. `trace_only` exists to drop the metric-only ones before `tempo_out` ever sees them --
  # `has_signal` never mutates a forwarded event, so every span that does reach `tempo_out` arrives
  # exactly as `self` produced it. See `docs/adr/signal-filtering-components.md`.
  #
  # This isn't pipeline hygiene, it's load-bearing: `otlp_out` issues one request per signal and
  # aborts the rest of a `send` call on the first failing one
  # (`crates/logit-outputs/src/otlp.rs`'s module doc), and Tempo is a traces-only gRPC server (it
  # registers no `MetricsService`) -- an `internal` metric point reaching `tempo_out` would fail
  # with `grpc-status: 12` (UNIMPLEMENTED), and enough consecutive failures trip `write_loop`'s
  # ~60s sustained-permanent-failure guard (`docs/adr/service-lifecycle-and-output-retry.md`,
  # revised by `docs/adr/buffered-sink-delivery.md`), ending the whole `logit` process -- taking
  # the InfluxDB metrics path down with it, not just Tempo. Confirmed directly against an earlier
  # version of this config that fed `self` straight into `tempo_out`: see `docs/known-gaps.md`'s
  # "`otlp_out` aborts an entire batch's `send`..." entry for the full account. `access_spans`
  # above needs the identical gate for the identical reason, once `haproxy_trace`/`nginx_trace`
  # started producing metric-and-span-carrying batches too -- `browser_spans` needs it too, though
  # `browser_in` itself only ever emits traces (see `browser_spans`'s own comment above).
  trace_only:
    type: has_signal
    sources: [self]
    signals: [traces]

  # Deliberately gRPC, not HTTP (docs/adr/hand-rolled-grpc-over-hyper.md) -- Tempo's `:4317`
  # receiver, to exercise the transport the rest of this config doesn't otherwise touch;
  # `endpoint` is a bare `host:port` authority for gRPC, not a URL (see
  # `crates/logit-outputs/src/otlp.rs`'s `grpc_authority`). Three sources now: `logit`'s own
  # internal spans (`trace_only`), haproxy's/nginx's real access-line spans (`access_spans`,
  # docs/adr/trace-context-span-lifting.md), and whatever real OTLP traces `browser_in` decoded
  # (`browser_spans`) -- `demo-app`'s real request spans go straight to Tempo's own OTLP/HTTP
  # receiver instead, never touching `logit` at all (see the comment above `stdout`). All of it
  # still lands in the same Tempo trace when trace ids agree -- Tempo doesn't care which of its
  # receivers a span for a given trace arrived through.
  tempo_out:
    type: otlp_out
    sources: [trace_only, access_spans, browser_spans]
    protocol: grpc
    endpoint: tempo:4317
