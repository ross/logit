# The demo's `logit` pipeline. demo/README.md's "What's actually flowing" walks through it in
# prose, and the landing page (http://localhost:8080) shows it rendered live by `logit graph`.
#
# Traffic crosses five real tiers: haproxy -> nginx -> app -> postgres, plus an async Celery worker
# over Redis. demo/compose.yaml's `traffic` service drives requests into the first three.
#
# What comes in:
#   - haproxy, the app, and the worker send JSON log lines over syslog (`haproxy_in`, `app_in`,
#     `worker_in`: UDP 5140, 5142, 5143).
#   - nginx and Redis log to stdout; `docker_in` tails their containers' Docker json-file logs
#     (`nginx_in`, `redis_in`).
#   - Postgres writes a rotating jsonlog directory; `tail_in` tails it (`postgres_in`).
#   - The landing page's browser OTel SDK posts OTLP/JSON traces through haproxy's `/v1/*` route
#     (demo/haproxy/haproxy.cfg) to `browser_in` (`otlp_in`, ADR `otlp-json-decoding`), which
#     isn't published on the host directly.
#   - `self` (`internal`) observes `logit`'s own pipeline (ADR
#     `internal-telemetry-as-pipeline-events`, ADR
#     `internal-span-emission-and-deterministic-sampling`).
#
# What goes out:
#   - Logs to Loki (`loki_out`, OTLP/HTTP).
#   - Metrics to VictoriaMetrics (`victoria_out`, `prometheus_out` sending remote-write).
#   - Spans to Tempo (`tempo_out`, OTLP/gRPC): `logit`'s own internal spans, the spans haproxy and
#     nginx get from their access lines (`docs/adr/trace-context-span-lifting.md`'s `span:` block),
#     and the browser's spans from `browser_in`.
#   - Every event to `stdout`, for `docker compose logs -f logit`.
#
# Why the app's and worker's spans bypass `logit`: every real SDK-carried span (`demo-app`'s
# request, database-client, and Celery-producer spans; `demo-worker`'s Celery-consumer and
# database-client spans) goes straight to Tempo, deliberately not through `logit`. Not every
# telemetry leg needs `logit` in front of it, and this demo shows that honestly rather than routing
# everything through `logit` just to prove it can. Postgres's own log lines still carry the same
# trace id back into Loki (`postgres_trace_lift`/`postgres_trace` below), through a `traceparent`
# lifted out of a sqlcommenter-tagged SQL statement rather than a second SDK.
#
# Components exercised: syslog_in, tail_in, docker_in, otlp_in, set, json, lua, regex,
# http_access, trace_context, kv_metrics, keep_signals, has_signal, keep, aggregate, internal,
# prometheus_out (remote-write), and otlp_out over both HTTP and gRPC.
#
# Background: docs/plans/demo-stack.md, docs/plans/demo-tracing-stack.md,
# docs/plans/otlp-end-to-end.md, docs/plans/otlp-logs-and-resource-identity.md,
# docs/plans/access-log-spans.md, docs/plans/file-tailing.md, docs/plans/demo-richer-traces.md,
# docs/plans/operator-surface.md, docs/plans/browser-tracing.md.
#
# Topology:
#
#   One listener per tier, because `set` stamps a resource onto the whole BATCH, not per event:
#   three tiers sharing one listener would interleave into one batch and get one wrong
#   service.name (docs/plans/demo-tracing-stack.md). nginx's listener is `docker_in`, not
#   `syslog_in` (docs/adr/file-tailing-and-docker-json-logs.md, docs/plans/file-tailing.md); this
#   demo is that ADR's end-to-end proof. `nginx_stdout` (`lua`) drops the container's own
#   error_log lines (`log.iostream: stderr`), which would otherwise reach
#   `nginx_identity`/`nginx_json` as if they were access lines.
#
#   haproxy --syslog/UDP:5140--> haproxy_in -> haproxy_identity (set) -> haproxy_json (json)
#                                                               -> haproxy_http (http_access)
#                                                                              |
#   nginx   --stdout--> json-file --tail(docker_in)--> nginx_in -> nginx_stdout (lua, drops
#                                       stderr) -> nginx_identity (set) -> nginx_json (json)
#                                                               -> nginx_http (http_access)
#                                                                              |
#   demo-app --syslog/UDP:5142--> app_in    -> app_identity     (set) -> app_json     (json)
#                                                                              |
#   demo-worker --syslog/UDP:5143--> worker_in -> worker_identity (set) -> worker_json (json)
#                                                                              |
#                                                                              v
#                                       {haproxy,nginx,app,worker}_trace (trace_context) <- lifts
#                                                                 |             trace.id/span.id
#                                                                 |             onto LogRecord.trace;
#                                                                 |             haproxy_trace/
#                                                                 |             nginx_trace also
#                                                                 |             mint a real span
#                                                                 |             from the same line
#                                                                 |             (docs/adr/
#                                                                 |             trace-context-
#                                                                 |             span-lifting.md),
#                                                                 |             named by
#                                                                 |             *_http's route
#                                       +-------------------------+---------------------+
#                                       v                         v                     v
#                              stdout (stdio_out)      logs_only (keep_signals: [logs])  |
#                                                                 |                      |
#                                                                 v                      |
#                                                          loki_out (otlp_out, HTTP)      |
#                                                                                         v
#                                                              access_spans (keep_signals: [traces],
#                                                                             haproxy_trace/nginx_trace only --
#                                                                             app_trace/worker_trace carry no span)
#                                                                                         |
#          haproxy_trace                       nginx_trace                               |
#                |                                   |                                   |
#                v                                   v                                   |
#       haproxy_metrics (kv_metrics)         nginx_metrics (kv_metrics)                   |
#                |                                   |                                   |
#                +-------------------+---------------+                                   |
#                                    v                                                    |
#                              trimmed (keep)   <- drops high-cardinality attrs            |
#                                    |                                                    |
#                                    v                                                    |
#                              windowed (aggregate)                                        |
#                                    |                                                    |
#   self (internal) --+-> self_windowed (aggregate) --> victoria_out --> VictoriaMetrics   |
#                      |                                                                  |
#                      +-> trace_only (has_signal) ---------------------------------> tempo_out (otlp_out, gRPC) --> tempo
#
#   demo-app --OTLP/HTTP protobuf--> tempo:4318 directly, bypassing `logit`. Its span parents to
#   nginx's span (nginx mints and forwards its own span id, docs/adr/trace-context-span-lifting.md),
#   because the default W3C propagator extracts whichever `traceparent` it's given, regardless of
#   which backend the span is headed for. demo-worker sends to the same tempo:4318: its Celery
#   CONSUMER span parents to demo-app's Celery PRODUCER span (`.delay()`,
#   docs/plans/demo-richer-traces.md), which parents to the request that enqueued it. The same
#   propagator does it, with no code on either side of that hop.
#
#   Four more legs, separate from the diagram above because none touches haproxy/nginx/app's
#   listeners (docs/plans/demo-richer-traces.md):
#
#   postgres --jsonlog file--> tail(tail_in)--> postgres_in -> postgres_identity (set)
#             -> postgres_json (json) -> postgres_trace_lift (regex, extracts a `traceparent` out
#             of a sqlcommenter-tagged statement) -> postgres_trace (trace_context, no `span:` --
#             demo-app's own psycopg CLIENT span is already real) -> stdout / logs_only -> loki_out
#
#   demo-worker --syslog/UDP:5143--> worker_in -> worker_identity (set) -> worker_json (json)
#             -> worker_trace (trace_context, no `span:` -- the worker's own Celery/psycopg spans
#             are already real) -> stdout / logs_only -> loki_out
#
#   redis --stdout--> json-file --tail(docker_in)--> redis_in -> redis_identity (set)
#             -> redis_parse (regex, splits pid/role/level off Redis's plain-text line) -> stdout /
#             logs_only -> loki_out. No trace_context: Redis logs carry no trace, and its query
#             traffic is already real CLIENT spans from demo-app/demo-worker's Redis instrumentation.
#
#   browser (real OTel SDK, or curl) --OTLP/JSON POST /v1/traces--> haproxy (`is_otlp` ACL,
#             demo/haproxy/haproxy.cfg) --> browser_in (otlp_in, :4318) -> stdout / browser_spans
#             (keep_signals: [traces]) -> tempo_out. No set/json/trace_context chain: unlike
#             every listener above, the sender already carries its own Resource and a real
#             SpanRecord, so there's nothing for `set` to stamp on. `browser_spans` exists for the
#             same reason `trace_only`/`access_spans` do (see `trace_only`'s comment below),
#             not because a real OTel SDK would ever send this input anything but traces.
#
#   `logit`'s own self-diagnostics (warn and above, `internal`'s default `logs:` threshold) ride
#   the same `self` -> logs_only -> loki_out leg as every other tier's log events, alongside
#   `self`'s own points and spans (docs/plans/operator-surface.md). They're ordinary
#   `LogRecord`-carrying events; loki_out treats them like any other.
#
# `admin: { bind: 0.0.0.0:9600 }` below serves `/readyz`/`/healthz`
# (docs/deploying.md's "Probes and exit codes"), which demo/compose.yaml's `logit` healthcheck
# probes via `logit ready`.
admin:
  bind: 0.0.0.0:9600

components:
  haproxy_in:
    type: syslog_in
    bind: 0.0.0.0:5140
  # `nginx` (demo/compose.yaml) logs to stdout only, so this tails its container's Docker
  # json-file log directly off the host (docs/adr/file-tailing-and-docker-json-logs.md; this demo
  # is that ADR's end-to-end proof). `containers:` names the fixed `container_name` demo/compose.yaml
  # gives the `nginx` service. It's explicit rather than `discover: true` because there's exactly
  # one container to follow, and naming it is clearer than opting into every container on the
  # host. `read_from: beginning` plus the checkpoint mean nothing is lost even if nginx logs a
  # request before `logit` first discovers its container directory.
  nginx_in:
    type: docker_in
    containers: [logit-demo-nginx]
    read_from: beginning
    checkpoint_path: /var/lib/logit/nginx.checkpoint

  # Redis's own server log (Celery's broker, docs/plans/demo-richer-traces.md), read by `docker_in`
  # like `nginx_in` above, against the fixed `container_name` demo/compose.yaml gives the `redis`
  # service. There's no `nginx_stdout`-style iostream filter: Redis writes every log line to
  # stdout, so there's no second stream to tell apart. Redis has no per-command log, so this is
  # startup, persistence, and warning lines only. The broker's query traffic is already covered by
  # `demo-app`/`demo-worker`'s real `opentelemetry-instrumentation-redis` CLIENT spans (`LPUSH`,
  # `LLEN`, ...), sent straight to Tempo.
  redis_in:
    type: docker_in
    containers: [logit-demo-redis]
    read_from: beginning
    checkpoint_path: /var/lib/logit/redis.checkpoint

  # nginx's error_log shares its container (and so its Docker json-file log) with the access log,
  # told apart only by `log.iostream` (`stdout` vs `stderr`). `docker_in` deliberately has no
  # per-stream filter (see the ADR's "Alternatives considered"), so this inline `lua` stage is the
  # filter: it drops anything that isn't an access line before it reaches
  # `nginx_identity`/`nginx_json`. An error_log line isn't the JSON `nginx_json` expects, and would
  # also inflate `web.requests` by one per error line. It's `lua` because there's no native
  # `filter` component: `logit` ships no native predicate language, and this five-line stage is
  # the worked example for why (docs/adr/routing-by-condition-is-lua.md).
  nginx_stdout:
    type: lua
    sources: [nginx_in]
    script: |
      function process(event)
        if event.attributes["log.iostream"] ~= "stdout" then
          return nil
        end
        return event
      end
  app_in:
    type: syslog_in
    bind: 0.0.0.0:5142

  # The `worker` service's log line for `pages/tasks.py`'s one task
  # (docs/plans/demo-richer-traces.md). It's a separate listener from `app_in` for the same reason
  # as every other tier: one `service.name` per batch. The worker's OTel spans (Celery CONSUMER,
  # psycopg CLIENT) go straight to Tempo like `app`'s, so this listener only ever sees the one log
  # line `pages/tasks.py`'s `worker_logger` emits per task run.
  worker_in:
    type: syslog_in
    bind: 0.0.0.0:5143

  # The demo's plain-file tail (docs/plans/demo-richer-traces.md); every other log tier is
  # `syslog_in` or `docker_in`, `tail_in`'s Docker-specific sibling. `paths`' `*` is permitted only
  # in the final path component (`crates/logit-config/src/lib.rs`), which matches Postgres's jsonlog
  # rotation exactly: a fresh `postgresql-<timestamp>.json` file every `log_rotation_age`
  # (demo/compose.yaml), never a rename in place. `read_from: beginning` plus the checkpoint mean a
  # `logit` restart resumes rather than replaying or skipping, the same contract `nginx_in` has.
  # Unlike `docker_in`, `tail_in` stamps no resource attributes of its own, so
  # `postgres_identity` below is load-bearing, not decorative.
  postgres_in:
    type: tail_in
    paths: ["/var/log/postgresql/*.json"]
    read_from: beginning
    checkpoint_path: /var/lib/logit/postgres.checkpoint

  # Browser-facing OTLP ingress (docs/plans/demo-tracing-stack.md, docs/plans/browser-tracing.md).
  # The landing page's browser SDK reaches it through `haproxy`'s `is_otlp` ACL on its published
  # `:8080` (demo/haproxy/haproxy.cfg's `/v1/*` route); it isn't published directly
  # (demo/README.md's "`otlp_in` from the browser"). A browser SDK needs a same-origin endpoint,
  # and there's no other reason to expose `logit` to the host. `protocol: http`, not `grpc`,
  # because a browser's `fetch`/`XMLHttpRequest` can't speak gRPC; OTLP/JSON decoding (ADR
  # `otlp-json-decoding`) is what makes this endpoint usable from one at all. Unlike every
  # syslog/docker/tail input above, no `set` stage stamps a resource in front of this one: a real
  # OTel SDK (or a hand-built OTLP/JSON payload sent with curl) sets its own `Resource` with
  # `service.name`, so there's nothing for `set` to add.
  browser_in:
    type: otlp_in
    bind: 0.0.0.0:4318
    protocol: http

  # `syslog_in` mustn't invent a resource identity for data it didn't produce
  # (docs/design/internal-telemetry.md's "Resource identity" section), so `set` is the operator
  # declaring one instead (ADR `operator-declared-resource-attributes`): one per tier, since each
  # tier has its own listener (see the topology comment above).
  haproxy_identity:
    type: set
    sources: [haproxy_in]
    resource:
      service.name: haproxy
      service.namespace: demo
  nginx_identity:
    type: set
    sources: [nginx_stdout]
    resource:
      service.name: nginx
      service.namespace: demo
  app_identity:
    type: set
    sources: [app_in]
    resource:
      service.name: demo-app
      service.namespace: demo
  worker_identity:
    type: set
    sources: [worker_in]
    resource:
      service.name: demo-worker
      service.namespace: demo
  postgres_identity:
    type: set
    sources: [postgres_in]
    resource:
      service.name: postgres
      service.namespace: demo
  # Overlays onto the `container.*` resource `redis_in` already stamped, same as `nginx_identity`.
  redis_identity:
    type: set
    sources: [redis_in]
    resource:
      service.name: redis
      service.namespace: demo

  haproxy_json:
    type: json
    sources: [haproxy_identity]
  nginx_json:
    type: json
    sources: [nginx_identity]
  # The app sends through a `SysLogHandler` subclass with `append_nul` off
  # (demo/app/pages/syslog_handler.py). The stock handler's trailing NUL byte would survive to
  # here as a character after the JSON object's closing `}`, and `json` would reject the line as
  # trailing garbage.
  app_json:
    type: json
    sources: [app_identity]
  worker_json:
    type: json
    sources: [worker_identity]
  # Postgres already writes one JSON object per line (`log_destination=jsonlog`,
  # demo/compose.yaml), so this parses each raw jsonlog line with no field remapping, like every
  # other tier's JSON access line.
  postgres_json:
    type: json
    sources: [postgres_identity]

  # Both web tiers log raw OTel semconv attribute names with the untouched value
  # (demo/haproxy/haproxy.cfg, demo/nginx/nginx.conf). Nothing is capped, coerced, or classified
  # at the producer; `http_access` does all of it here (docs/adr/http-access-normalization.md):
  #   - `http.response.status_code` to an integer.
  #   - nginx's `url.original` split into `url.path`/`url.query`.
  #   - Both tiers' durations to `_s` seconds.
  #   - `user_agent.class` from the built-in table (haproxy only: nginx's line doesn't log the
  #     header, and an absent header gets no class).
  #   - A bounded `http.route` from `routes:` below. That route names each tier's span
  #     `GET /work` rather than a bare `http.request`, and sets `span.status` (error on a 5xx,
  #     unset otherwise, per semconv -- never `ok`).
  # HAProxy can't write a dotted key through `%{+json}o` (`.` isn't legal in its `%(name)` item),
  # so its line arrives dashed (`http-response-status_code`). `haproxy_http` de-aliases it to the
  # dotted spelling before anything else runs, so nothing downstream ever sees a dashed key.
  #
  # The `routes:` block is copied verbatim between the two stages. It's sized to
  # demo/compose.yaml's `traffic` loop (`/`, `/health`, `/graph.svg`, `/missing`, `/work`,
  # `/boom`) plus `/inner`, the nginx hop `/work` calls back into (demo/app/pages/views.py). The
  # built-in `probes`/`assets` sets name `/health` and `/graph.svg` (and the index page's own
  # `/architecture.svg`/`/telemetry.js`) `/{probe}`/`/{asset}`. The app's real routes are each
  # listed literally. `/missing`, a 404 with no route behind it, falls through to `route_other`'s
  # literal `/{other}`, the bucket every scanner-shaped path lands in too. Every value comes from
  # this config or a built-in set, never from the path itself, so the route set (and so the
  # span-name set, and the `http.route` tag `trimmed` keeps below) stays bounded however many
  # distinct paths arrive.
  haproxy_http:
    type: http_access
    sources: [haproxy_json]
    routes:
      - builtin: probes
      - builtin: assets
      - match: '^/$'
        route: /
      - match: '^/work$'
        route: /work
      - match: '^/boom$'
        route: /boom
      - match: '^/inner$'
        route: /inner
    route_other: /{other}
  nginx_http:
    type: http_access
    sources: [nginx_json]
    routes:
      - builtin: probes
      - builtin: assets
      - match: '^/$'
        route: /
      - match: '^/work$'
        route: /work
      - match: '^/boom$'
        route: /boom
      - match: '^/inner$'
        route: /inner
    route_other: /{other}

  # Lifts each tier's trace.id/span.id/trace.flags (or an inbound `traceparent`, parsed natively,
  # `docs/adr/trace-context-span-lifting.md`) onto `LogRecord.trace`.
  #
  # `haproxy_trace`/`nginx_trace` also mint a real `SpanRecord` on the same event via `span:`: an
  # access line's own start/end/duration attributes become a span whose start replaces
  # `event.timestamp`. Their `name:` is only a fallback, because `haproxy_http`/`nginx_http`
  # already wrote `span.name` (`GET /work`, `GET /{probe}`, ...) and `span.status`, and an event
  # attribute always wins over the block's default. Neither sets `mint_id`: both tiers log the
  # span id they forwarded downstream in their own outbound `traceparent` (haproxy's `span-id`,
  # nginx's `$request_id`-derived `span.id`), and minting a different one here would orphan the
  # next hop's span.
  #
  # `app_trace` has no `span:` block, because `app`'s request span is already real
  # (opentelemetry-instrumentation-django); lifting one from its access log would add a second,
  # redundant span for the same request.
  #
  # `keep_source` stays at its default `false`: the convention attributes are removed on a
  # successful lift, so `logs_only`/`loki_out` below carry only what each tier's log body needs,
  # and a surviving `trace_id`-shaped attribute can't collide with Loki's *native* trace_id
  # structured metadata.
  haproxy_trace:
    type: trace_context
    sources: [haproxy_http]
    span:
      kind: server
      name: http.request
  nginx_trace:
    type: trace_context
    sources: [nginx_http]
    span:
      kind: server
      name: http.request
  app_trace:
    type: trace_context
    sources: [app_json]
  # No `span:` block, for the same reason as `app_trace`: the worker's own spans (Celery CONSUMER,
  # psycopg CLIENT) are already real (`demoproj/telemetry.py`), so lifting one from this log line
  # would be redundant.
  worker_trace:
    type: trace_context
    sources: [worker_json]

  # How a Postgres log line gets the request's trace id:
  #   1. `opentelemetry-instrumentation-psycopg`'s sqlcommenter (`enable_commenter=True`,
  #      demo/app/demoproj/telemetry.py) appends a trailing SQL comment carrying
  #      `traceparent='<header>'` (among other, irrelevant keys) to every statement
  #      `pages/views.py`'s `work` issues.
  #   2. `log_min_duration_statement=0` (demo/compose.yaml) logs that statement, comment included,
  #      verbatim into `message`.
  #   3. `regex` (docs/adr/regex-transform.md) extracts it. `field: message` matches
  #      `postgres_json`'s already-lifted `attributes.message`, not `log.message`, and the
  #      pattern's one named capture, `traceparent`, becomes an attribute of that name.
  #   4. `postgres_trace` parses it exactly as it would a real HTTP header.
  # A line with no match (Postgres's own startup/checkpointer/autovacuum lines, or a statement
  # issued outside a request's span) passes through unchanged, not dropped. `trace_context` reports
  # `skipped{reason="missing"}` for those and passes them on as plain logs, like any tier's own
  # untraced line.
  postgres_trace_lift:
    type: regex
    sources: [postgres_json]
    field: message
    pattern: "traceparent='(?P<traceparent>[^']+)'"
  postgres_trace:
    type: trace_context
    sources: [postgres_trace_lift]

  # Redis's plain-text log line is `<pid>:<role> <day> <mon> <year> <hh:mm:ss.mmm> <level> <message>`
  # (e.g. `1:M 12 Sep 2026 23:01:01.041 * DB saved on disk`). There's no JSON to hand `json`, so
  # `regex` (docs/adr/regex-transform.md) splits it instead:
  #   - `redis.role` is Redis's one-letter process role (`M` primary, `S` replica, `C` a forked
  #     child such as a background save, `X` sentinel).
  #   - `redis.level` is its one-character severity (`.` debug, `-` verbose, `*` notice,
  #     `#` warning), kept as the raw character because `regex` has no mapping step and
  #     `event.log.severity` is read-only from `lua` (docs/design/lua-api.md).
  # The level is namespaced rather than a bare `level` on purpose: Loki reads a `level`
  # structured-metadata key as the line's severity, and would show every notice line with a
  # `detected_level` of `*`. Redis's own timestamp is left unparsed, because `docker_in` already
  # stamps the json-file envelope's `time`, the same instant to within Docker's own write. A line
  # that doesn't match (none expected, but a future Redis could change its format) passes through
  # unchanged as a plain log. No `trace_context` stage follows, because Redis logs carry no trace.
  redis_parse:
    type: regex
    sources: [redis_identity]
    pattern: '^(?P<process.pid>\d+):(?P<redis.role>[MSCX]) \d{2} \w{3} \d{4} [\d:.]+ (?P<redis.level>[.\-*#]) '

  # There's no component here for the app's own OTel spans (demo/app/gunicorn.conf.py). They go
  # straight to Tempo's `otlp.protocols.http` receiver on :4318 (`demo/tempo/tempo.yaml`),
  # alongside the gRPC one `tempo_out` below uses, and never touch `logit` (see the header comment
  # for why). The default W3C propagator still makes each one a genuine child of nginx's span, with
  # no code in `demo/app`; that doesn't depend on which backend the span lands in.

  # `docker compose logs -f logit` is the fastest way to see the pipeline doing something: one
  # block per tier per request (haproxy's and nginx's with a real `span` section too), sharing a
  # trace id and differing in span id. The app's own spans don't appear here, because they never
  # reach `logit` (see above). Two things look odd but are expected:
  #   - Most of `postgres_trace`'s lines carry no trace at all, because Postgres logs far more than
  #     one line per request.
  #   - `worker_trace`'s block for a given trace typically arrives well after the other tiers',
  #     because the task runs after the response has gone back to the client.
  # `browser_in` feeds this sink directly, not through a `*_trace` stage: it's already a span,
  # with no companion log line. Its blocks appear once someone loads the landing page in a browser
  # (or POSTs to `/v1/traces` by hand); `traffic`'s curl loop never sends to it.
  stdout:
    type: stdio_out
    sources:
      [
        haproxy_trace,
        nginx_trace,
        app_trace,
        worker_trace,
        postgres_trace,
        redis_parse,
        browser_in,
      ]

  # Loki's OTLP ingestion accepts logs only (it registers no `TracesService`/`MetricsService`), and
  # `otlp_out` aborts an entire batch's `send` on the first signal request that fails
  # (`crates/logit-outputs/src/otlp.rs`'s module doc; `trace_only`/`tempo_out` below apply the same
  # reasoning to Tempo). `haproxy_trace`/`nginx_trace` produce span-only events, so `loki_out`
  # needs this `keep_signals: [logs]` gate in front of it. `keep_signals` clears the payload slots
  # it isn't given (ADR `signal-filtering-components`), so every log that reaches `loki_out` keeps
  # its log payload intact, without the span-only events that would trip Loki's `send`. `self`
  # (below) joins the same gate for the same reason: it emits points, spans, *and* logs
  # (docs/plans/operator-surface.md) through this one component, and `keep_signals: [logs]` lets
  # `logit`'s own self-diagnostics reach Loki without also sending `loki_out` a metric point or a
  # span it would reject.
  logs_only:
    type: keep_signals
    sources:
      [haproxy_trace, nginx_trace, app_trace, worker_trace, postgres_trace, redis_parse, self]
    signals: [logs]

  # Logs to Loki, direct over OTLP with no relay service in between (docs/plans/
  # otlp-logs-and-resource-identity.md; Loki accepts OTLP logs natively as of 3.7.7, the version
  # this stack pins). `protocol: http`, not `grpc` like `tempo_out` below, because Loki's OTLP
  # ingestion is HTTP-only. `endpoint` is a URL base for HTTP (unlike gRPC's bare authority):
  # `http://loki:3100/otlp` resolves to exactly `/otlp/v1/logs`
  # (`crates/logit-proto/src/lib.rs`'s hardcoded per-signal path). Loki's default index-label set
  # already includes `service.name`/`service.namespace`, which each `*_identity` stamps above, so
  # real stream labels need no `demo/loki/loki.yaml` change.
  loki_out:
    type: otlp_out
    sources: [logs_only]
    protocol: http
    endpoint: http://loki:3100/otlp

  # The real spans `haproxy_trace`/`nginx_trace` minted, separated from the log event each rides
  # in on. `app_trace` isn't a source because it never produces a span (see its comment above).
  # Feeds `tempo_out` below alongside `logit`'s own internal spans (`trace_only`).
  access_spans:
    type: keep_signals
    sources: [haproxy_trace, nginx_trace]
    signals: [traces]

  # Same reasoning as `trace_only`/`access_spans`, applied to `browser_in`: `otlp_out` aborts
  # `tempo_out`'s entire batch send on the first signal request that fails
  # (`crates/logit-outputs/src/otlp.rs`'s module doc), and Tempo registers no `MetricsService`.
  # The browser only ever sends traces here, but this config makes that structural rather than
  # incidental for every source feeding `tempo_out`: `keep_signals` costs nothing and rules the
  # failure mode out by construction, rather than relying on a well-behaved sender.
  browser_spans:
    type: keep_signals
    sources: [browser_in]
    signals: [traces]

  # `http_access` hands both tiers' durations over as `http.request.duration_s` (the unit is only
  # ever in the name), so neither chain needs a `scale` stage (docs/adr/scale-transform.md's
  # 2026-09-22 amendment).
  #
  # Both tiers share the `web.*` metric names below and are told apart by the `service.name`
  # resource attribute `*_identity` stamped, which reaches VictoriaMetrics as the `service_name`
  # label (Grafana panels filter on it). That's safe because `http_access` hands both the same
  # quantity in the same unit. `web.bytes_sent` is the one name shared despite meaning slightly
  # different things per tier: HAProxy's `%B` (demo/haproxy/haproxy.cfg) is total bytes written to
  # the client, headers included (`http.response.size`); nginx's `$body_bytes_sent` is body only
  # (`http.response.body.size`). No panel compares the two tiers directly, so sharing the name is
  # fine, just not exact.
  nginx_metrics:
    type: kv_metrics
    sources: [nginx_trace]
    counters:
      - name: web.requests # +1 per event
      - name: web.bytes_sent
        field: http.response.body.size
    distributions:
      - name: web.request_time
        field: http.request.duration_s
        unit: s
      # nginx-only: HAProxy logs its connect and response-header timers (`upstream.connect_s`/
      # `upstream.header_s`) but no whole upstream duration, so `haproxy_metrics` has nothing to
      # pair this with.
      - name: web.upstream_time
        field: upstream.duration_s
        unit: s

  haproxy_metrics:
    type: kv_metrics
    sources: [haproxy_trace]
    counters:
      - name: web.requests
      - name: web.bytes_sent
        field: http.response.size
    # A process-wide gauge (HAProxy's concurrent-connection count), not a per-request value. It
    # rides on this event's request/response tags like every other field here, so it lands as one
    # series per tag combination holding the last value seen each window. A panel over it should
    # take `max(...)` across those series rather than plot each one.
    gauges:
      - name: web.connections_active
        field: conns_active
    distributions:
      - name: web.request_time
        field: http.request.duration_s # HAProxy's %Ta, converted from `_ms` by haproxy_http
        unit: s

  # Runs before `aggregate`, not after; otherwise its SeriesKey would key a series per request on
  # `url.path`/`client.address` alone. The list is semconv's own low-cardinality attribute set for
  # `http.server.request.duration` plus `user_agent.class`, each bounded by `http_access` (a route
  # or class from config or a built-in table, a normalized method, an integer status).
  # `server.address` is the Host header, unclamped here because the traffic generator only ever
  # sends one; `fixtures/nginx-to-influxdb.yaml`'s `bounded` is the worked `keep_values` clamp for
  # it. `http.termination_state` is HAProxy-only, so it's simply not a tag on nginx events, and a
  # field a tier doesn't log at all (nginx's line carries no `url.scheme`,
  # `network.protocol.version`, or user agent) is likewise just absent. The trace/span attributes
  # never reach here, because `haproxy_trace`/`nginx_trace` already removed them (`keep_source:
  # false`, above).
  trimmed:
    type: keep
    sources: [nginx_metrics, haproxy_metrics]
    fields:
      [
        server.address,
        http.request.method,
        http.response.status_code,
        http.route,
        network.protocol.version,
        url.scheme,
        user_agent.class,
        http.termination_state,
      ]

  # `temporality: cumulative` because `victoria_out` below skips a delta `Sum`: remote-write
  # carries running totals, so `web.requests`/`web.bytes_sent` arrive as `_total` counters that
  # PromQL's `rate()` reads. A `Distribution` tumbles in either mode, so each window's
  # `web.request_time` is that window's own sketch, which `victoria_out` renders as a summary
  # (`web_request_time{quantile="0.5"|...|"0.99"}` plus `_count`). The dashboard's p50/p99 panels
  # read those `quantile` series.
  windowed:
    type: aggregate
    sources: [trimmed]
    interval: 10s
    temporality: cumulative

  # `logit` observing itself (docs/design/internal-telemetry.md, ADR `internal-telemetry-as-pipeline-events`);
  # the dashboard's `logit.*` panels come from here. `span_sample_rate` is `1.0` rather than its
  # `0.1` default (docs/adr/internal-span-emission-and-deterministic-sampling.md), because this
  # demo is meant to show every span it can, not weigh span volume against storage cost. Its
  # batches carry `service.name = logit` on their resource (see internal-telemetry.md's "Resource
  # identity" section), which is what lets Tempo resolve a root service for these traces at all.
  self:
    type: internal
    interval: 10s
    span_sample_rate: 1.0

  # Cumulative for the same reason as `windowed`: `self`'s counters are deltas.
  self_windowed:
    type: aggregate
    sources: [self]
    interval: 60s # `self`'s 10s divides evenly into it, as internal-telemetry.md's guidance asks
    temporality: cumulative

  # Remote-write into VictoriaMetrics (docs/deploying.md's "VictoriaMetrics, VictoriaLogs, and
  # VictoriaTraces"). `version: 1` is required: VictoriaMetrics answers a 2.0 request `204` and
  # stores nothing. `compression: zstd` is the VictoriaMetrics remote write protocol vmagent sends
  # by default; VictoriaMetrics also accepts Snappy. `self_windowed`'s span and log events carry no
  # metric record, so this sink ignores them without a signal gate. Each series is labelled with
  # its event attributes and resource attributes, names sanitized (`service.name` becomes
  # `service_name`, `web.requests` becomes `web_requests_total`).
  victoria_out:
    type: prometheus_out
    sources: [windowed, self_windowed]
    endpoint: http://victoriametrics:8428/api/v1/write
    version: 1
    compression: zstd

  # `self` carries *all* of `logit`'s own telemetry, not just spans: every drain also carries this
  # process's `logit.*` metrics (Counter/Gauge/Distribution). It never mixes the two *on one
  # event*, though: each drain is either a metric-only point or a span-only span event
  # (`crates/logit-core/src/telemetry.rs`'s `drain`). `trace_only` drops the metric-only ones
  # before `tempo_out` sees them. `has_signal` never mutates a forwarded event, so every span that
  # reaches `tempo_out` arrives exactly as `self` produced it. See
  # `docs/adr/signal-filtering-components.md`.
  #
  # This gate is load-bearing, not hygiene. `otlp_out` issues one request per signal and aborts the
  # rest of a `send` call on the first failing one (`crates/logit-outputs/src/otlp.rs`'s module
  # doc), and Tempo is a traces-only gRPC server (it registers no `MetricsService`). An `internal`
  # metric point reaching `tempo_out` would fail with `grpc-status: 12` (UNIMPLEMENTED), and enough
  # consecutive failures trip `write_loop`'s ~60s sustained-permanent-failure guard
  # (`docs/adr/service-lifecycle-and-output-retry.md`, revised by
  # `docs/adr/buffered-sink-delivery.md`), ending the whole `logit` process and taking the
  # VictoriaMetrics metrics path down with it, not just Tempo. See `docs/known-gaps.md`'s
  # "`otlp_out` aborts an entire batch's `send`..." entry for the full account. `access_spans` needs
  # the same gate for the same reason, because `haproxy_trace`/`nginx_trace` produce
  # metric-and-span-carrying batches, and so does `browser_spans`, even though `browser_in` only
  # ever emits traces (see `browser_spans`'s comment above).
  trace_only:
    type: has_signal
    sources: [self]
    signals: [traces]

  # Deliberately gRPC, not HTTP (docs/adr/hand-rolled-grpc-over-hyper.md): Tempo's `:4317`
  # receiver, to exercise the transport the rest of this config doesn't otherwise touch.
  # `endpoint` is a bare `host:port` authority for gRPC, not a URL (see
  # `crates/logit-outputs/src/otlp.rs`'s `grpc_authority`). Three sources: `logit`'s own internal
  # spans (`trace_only`), haproxy's/nginx's real access-line spans (`access_spans`,
  # docs/adr/trace-context-span-lifting.md), and whatever real OTLP traces `browser_in` decoded
  # (`browser_spans`). `demo-app`'s real request spans go straight to Tempo's OTLP/HTTP receiver
  # instead, never touching `logit` (see the comment above `stdout`). They still land in the same
  # Tempo trace when trace ids agree, because Tempo doesn't care which of its receivers a span
  # arrived through.
  tempo_out:
    type: otlp_out
    sources: [trace_only, access_spans, browser_spans]
    protocol: grpc
    endpoint: tempo:4317
