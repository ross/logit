# A self-contained stack for trying `logit`: no Rust toolchain, no script/*, no knowledge of this
# repo beyond `docker compose up`. See demo/README.md.
#
# This is deliberately separate from the repo root's compose.yaml, which is the contributor dev
# stack (bind-mounted source, `script/server`, `cargo run` inside a long-lived container). This
# stack instead builds and runs the production image (../Dockerfile) -- what a real user gets.

# Shared via YAML's merge key (`<<:`), not repeated per service -- `app` and `app-migrate` both
# need the same Postgres connection settings (`demo/app/demoproj/settings.py`'s `DATABASES`), and
# duplicating five env vars invites exactly one of them drifting.
x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: demo
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: demo-postgres-password

services:
  influxdb:
    image: docker.io/library/influxdb:2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: logit
      DOCKER_INFLUXDB_INIT_PASSWORD: logit-demo-password
      DOCKER_INFLUXDB_INIT_ORG: logit
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: logit-demo-token
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks: [demo]

  # `demo/app`'s state (`docs/plans/demo-richer-traces.md` workstream C), and this stack's first
  # real exercise of `tail_in` (`crates/logit-inputs/src/tail/`) -- `nginx_in` below is `docker_in`,
  # `tail_in`'s Docker-specific sibling, so nothing here has tailed a plain file directly until now
  # (see demo/README.md's old "What isn't exercised yet"). `jsonlog` (Postgres 15+), not the plain-
  # text default, so `logit`'s existing `json` transform reads it unchanged, the same way every
  # other tier's access line already does. `log_min_duration_statement=0` logs every statement, not
  # just slow ones -- this is a demo meant to show the mechanism, not a production sampling policy.
  # `log_rotation_age` is minutes, not the default 24h, deliberately: `tail_in`'s directory-glob
  # discovery (demo/logit.yaml's `postgres_in`, `paths: [.../*.json]`) only sees a rotation if one
  # actually happens during a demo session. Wrapped in a `/bin/sh -c` entrypoint, not passed as
  # `command:` alone, because `log_directory` points outside `PGDATA` -- the official image's own
  # entrypoint only prepares `PGDATA` itself, so the directory has to exist (and be owned by the
  # `postgres` user postgres eventually drops privileges to) before `docker-entrypoint.sh` runs.
  postgres:
    image: docker.io/library/postgres:17-alpine
    # The official image only ever reads its own POSTGRES_DB/USER/PASSWORD out of this map --
    # POSTGRES_HOST/PORT (also in `*postgres-env`, for `app`'s/`app-migrate`'s benefit) are simply
    # ignored here, not meaningful to this service itself.
    environment:
      <<: *postgres-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/log/postgresql && chown postgres:postgres /var/log/postgresql
        exec docker-entrypoint.sh postgres \
          -c logging_collector=on \
          -c log_destination=jsonlog \
          -c log_directory=/var/log/postgresql \
          -c log_min_duration_statement=0 \
          -c log_rotation_age=5min
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    networks: [demo]

  # Celery's broker (`docs/plans/demo-richer-traces.md` workstream D) -- `app`'s `.delay()` and
  # `worker`'s own consumption both go through here. No persistence configured: this demo has
  # nothing worth surviving a restart on the broker side, unlike `postgres_data` above.
  redis:
    image: docker.io/library/redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [demo]

  grafana:
    image: docker.io/grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Provisioning config vs. the dashboard JSON files it points at are two separate mounts --
      # Grafana's `dashboards` provider reads `options.path` from wherever the config says, which
      # is not under `provisioning/` itself.
      - ./grafana/provisioning:/etc/grafana/provisioning:z,ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:z,ro
      - grafana_data:/var/lib/grafana
    networks: [demo]

  # Log backend -- receives `logit`'s own log lines directly over OTLP/HTTP from `loki_out`
  # (demo/logit.yaml, docs/plans/otlp-logs-and-resource-identity.md's workstream B; no relay
  # service in between). Unlike the old demo writer, `hello` below doesn't also write to Loki
  # directly -- `logit`'s own `otlp_out` is the only path in.
  loki:
    image: docker.io/grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/loki.yaml"]
    healthcheck:
      # Loki's image is distroless -- no shell, no curl/wget, so this is the native probe
      # (backported to 3.6.5+), not the classic `wget --spider` healthcheck you'll see elsewhere.
      test: ["CMD", "loki", "-health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:z,ro
      # A named volume, not a bind mount: the image runs as a fixed non-root UID and can't create
      # directories inside a root-owned bind mount (and this sidesteps rootless-podman UID
      # remapping too, same reasoning as root compose.yaml's `:z` comment, one step further).
      - loki_data:/loki
    networks: [demo]

  # Trace backend -- receives `logit`'s own internal spans over OTLP/gRPC from `tempo_out`
  # (demo/logit.yaml), provisioned in Grafana with `tracesToLogsV2` pointed at Loki -- both Loki
  # and Tempo receive real data now (demo/grafana/provisioning/datasources/datasources.yaml).
  tempo:
    # Pinned to 2.10.x, not the current 3.0.x: Tempo 3.0 removed the legacy ingester write path
    # and reworked config wholesale (docs/plans/demo-stack.md). 2.10's monolithic mode is
    # the well-trodden config below.
    image: docker.io/grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:z,ro
      - tempo_data:/var/tempo
    ports:
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP
    networks: [demo]

  logit:
    build:
      context: ..
      dockerfile: Dockerfile
    # Named explicitly so `graph-dot` below can reuse this exact image without a second `build:`
    # -- unnamed, Compose would call it `<project>-logit`, derived from the directory name and
    # overridable via -p/COMPOSE_PROJECT_NAME, not something worth another service guessing at.
    image: logit-demo:latest
    command: ["run", "/config.yaml"]
    depends_on:
      # influxdb_out/otlp_out both retry transient failures (ADR
      # `service-lifecycle-and-output-retry`), but there's no reason to spend the demo's first
      # several seconds visibly doing that against a cold InfluxDB/Loki.
      influxdb:
        condition: service_healthy
      loki:
        condition: service_healthy
      # `service_started`, not `service_healthy` -- `tempo` (above) declares no healthcheck at
      # all, so `service_started` is the honest limit anyway (same reasoning as `hello`'s
      # dependency on `logit` below). Unlike `influxdb_out`/`otlp_out`'s Loki leg, `tempo_out`
      # doesn't need Tempo up first for a clean start: it retries through `write_loop` like any
      # other sink (ADR `service-lifecycle-and-output-retry`'s bounded output retry), so a `logit`
      # that starts before Tempo finishes booting just retries its first few span exports rather
      # than failing.
      tempo:
        condition: service_started
      # `service_started`, same reasoning as `tempo` above -- `postgres_in` (demo/logit.yaml) is a
      # `tail_in` glob over `postgres`'s own log directory, and a glob matching nothing yet is a
      # silent, retried no-op by design (`docs/deploying.md`'s "What to watch"), not a startup
      # ordering `logit` needs `postgres` healthy first to avoid.
      postgres:
        condition: service_started
    # `nginx_in` (demo/logit.yaml) tails `nginx`'s own Docker json-file log directly off the host
    # (`docker_in`, docs/adr/file-tailing-and-docker-json-logs.md) rather than receiving a
    # `syslog:` stream -- this stack's end-to-end proof for that ADR. Docker's per-container state
    # directories are `root:root 0710` and the logs `root:root 0640` on a stock install, so
    # `logit` needs both `user: "0:0"` and the bind mount below; this is real cost specific to
    # reading the json-file driver directly rather than the docker socket/API (see the ADR's
    # "Root privileges" section) -- only this one service pays it, and only for this one reason.
    # **Native Linux Docker Engine only**: rootless Docker uses `~/.local/share/docker/containers`
    # and Docker Desktop's paths live inside its VM, neither matching `/var/lib/docker/containers`
    # -- `docker_in`'s own `root:` config field (unset here, so it keeps its stock default) is
    # where a non-default install would point it instead.
    user: "0:0"
    volumes:
      - ./logit.yaml:/config.yaml:ro
      # `:ro`, and deliberately **not** `:z`: an SELinux relabel of the *daemon's own* live state
      # directory (not a directory this stack owns) would be actively harmful, unlike every other
      # bind mount in this file. `security_opt` below is the SELinux accommodation instead.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # `nginx_in`'s and `postgres_in`'s checkpoints (demo/logit.yaml) -- survive a `logit` restart
      # so it resumes without replaying/losing lines; `docker compose down -v` wipes both along
      # with everything else this stack persists.
      - logit_state:/var/lib/logit
      # `postgres_in`'s own source (demo/logit.yaml) -- `:ro`, unlike the Docker-state mount above,
      # since this is a directory this stack owns outright, not the daemon's live state.
      - postgres_logs:/var/log/postgresql:ro
    # Only meaningful on an SELinux host (Fedora/RHEL and derivatives) -- a no-op elsewhere.
    # Disables SELinux confinement for this one container rather than relabeling the bind mount
    # above (`:z` would do that, and is exactly what must NOT happen to the daemon's own state).
    security_opt: ["label=disable"]
    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-logit-demo-token}
    # `logit ready` (`docs/deploying.md`'s "Probes and exit codes", ADR `admin-readiness-endpoint`)
    # against demo/logit.yaml's own `admin: { bind: 0.0.0.0:9600 }` -- the same probe
    # `Dockerfile`'s own `HEALTHCHECK` runs, just declared explicitly here so this stack's
    # `depends_on: service_healthy` entries below have something real to wait on.
    healthcheck:
      test: ["CMD", "logit", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      demo:
        aliases: [logit]

  # -- The demo's front door, and the two graph renders that feed it --------------------------
  #
  # `logit graph` prints DOT; turning that into an SVG needs graphviz, which the release image
  # doesn't (and shouldn't) carry. So: one-shot containers, chained by
  # `service_completed_successfully` where there's a real dependency (graph-dot -> graph-svg),
  # writing through a shared `graph_data` volume. This is runtime sequencing, not build-time --
  # `up --build` finishes every build before starting any container, but doesn't order builds
  # relative to each other, so a cross-image `COPY --from=<another service's image>` at build time
  # would be a race; depends_on isn't.
  #
  # Note for podman-compose (script/common.sh's DOCKER=podman): `service_completed_successfully`
  # is reportedly unimplemented there and may be ignored rather than honored, in which case `app`
  # can start before `graph-svg`/`arch-svg` finish. Harmless either way -- see `app`'s
  # `pages.views._serve_svg`, which reads each file fresh per request rather than caching it, so a
  # page load a few seconds later just works.

  # Step 1: render the pipeline config to DOT, from the very image the demo is running.
  graph-dot:
    # Not a `build:` -- reuses the `logit` service's already-built `logit-demo:latest` tag.
    image: logit-demo:latest
    # The release image runs as the non-root `logit` user (../Dockerfile). A named volume whose
    # mountpoint doesn't exist in the image is created root-owned, so the redirect below would
    # fail EPERM -- silently, given the `|| true` needed for the reason in the next comment.
    # Root just for this one-shot write.
    user: "0:0"
    # Overrides ENTRYPOINT ["logit"] with a shell, purely to redirect stdout to a file. `|| true`:
    # `logit graph` resolves `!env` exactly like `validate`/`run` (needs INFLUXDB_TOKEN) and
    # exits 1 with nothing on stdout if that fails to resolve -- but on a config that loads yet
    # fails *semantic* validation, it prints complete, valid DOT to stdout before exiting 1, so
    # gating this step on exit code alone would throw away perfectly good output.
    entrypoint: ["/bin/sh", "-c"]
    command: ["logit graph /config.yaml > /graph/logit.dot || true"]
    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-logit-demo-token}
    volumes:
      - ./logit.yaml:/config.yaml:ro
      - graph_data:/graph
    networks: [demo]

  # Step 2: DOT -> SVG.
  graph-svg:
    build:
      context: ./graph-renderer
    image: logit-demo-graph-renderer:latest
    depends_on:
      graph-dot:
        condition: service_completed_successfully
    # `test -s` first: a config that fails to *load* leaves graph-dot's redirect writing nothing
    # at all (as opposed to the semantic-validation-failure case, which still writes real DOT).
    # Either way this must exit 0, or `app` (below) never starts.
    command: ["test -s /graph/logit.dot && dot -Tsvg /graph/logit.dot -o /graph/logit.svg || true"]
    volumes:
      - graph_data:/graph
    networks: [demo]

  # A second, independent diagram: the demo's service architecture (who talks to whom, and what
  # *kind* of traffic -- web/logging/tracing/metrics/query), shown just above the pipeline diagram
  # on the landing page. Unlike graph-dot -> graph-svg above, there's no generation step first --
  # demo/architecture.dot is hand-authored (see its own header comment for why: no single
  # machine-readable source encodes "traffic type" the way demo/logit.yaml encodes the pipeline),
  # so this just renders it, reusing the same Graphviz image graph-svg already builds. No
  # `depends_on: graph-svg` -- independent output file, no shared input, and `up --build` finishes
  # every image build before starting any container either way (graph-dot's own comment above).
  arch-svg:
    image: logit-demo-graph-renderer:latest
    command: ["dot -Tsvg /architecture.dot -o /graph/architecture.svg"]
    volumes:
      - ./architecture.dot:/architecture.dot:ro
      - graph_data:/graph
    networks: [demo]

  # One-shot: `manage.py migrate` against a real Postgres, gated on `postgres` being ready to
  # accept connections -- `service_healthy`, not `service_started`, since (unlike `docker_in`'s
  # tolerant treatment of `postgres` above) a migration that runs before Postgres can accept
  # connections just fails outright, no retry built in. Same `service_completed_successfully`
  # pattern as `graph-dot`/`graph-svg` below: expect `Exited (0)` in `docker compose ps`, not a
  # crash. Reuses `logit-demo-app:latest` with no second `build:` of its own, the same trick
  # `graph-dot` already uses against `logit-demo:latest` -- `--build` builds every image once,
  # regardless of how many services reference the tag afterward.
  app-migrate:
    image: logit-demo-app:latest
    depends_on:
      postgres:
        condition: service_healthy
      # Every `manage.py` invocation loads `demoproj/settings.py`'s `LOGGING` regardless of which
      # command runs, and `SysLogHandler.__init__` resolves its `address` host synchronously at
      # handler-configuration time -- so `migrate` needs `logit`'s network alias to exist before it
      # runs, even though it never actually logs anything. `service_healthy`, not just
      # `service_started`, now that `logit`'s own healthcheck (`docs/deploying.md`'s "Probes and
      # exit codes") gives Compose something real to wait on -- previously the honest limit was
      # "started," since there was no way to know a listener was actually bound.
      logit:
        condition: service_healthy
    entrypoint: ["python", "manage.py"]
    command: ["migrate", "--noinput"]
    environment:
      <<: *postgres-env
    networks: [demo]

  # Step 3: the innermost tier a request reaches -- no longer the demo's front door or its own
  # traffic source (docs/plans/demo-tracing-stack.md's workstream A). Sits behind `nginx` below;
  # `traffic` drives requests through the whole haproxy -> nginx -> app chain. A real Django app
  # now (workstream B) -- replaces `hello`'s stdlib stub, so unlike every other bind-mounted script
  # in this stack, this one is a real image build: `demo/app/Dockerfile`, not "nothing to install."
  # Writes into `logit` for its access log only (syslog, `app_in`, :5142, same reasoning as every
  # other tier's own listener). Its own OTel request spans bypass `logit` entirely and go straight
  # to `tempo`'s own OTLP/HTTP receiver (below) -- deliberate, not every telemetry leg needs
  # `logit` in front of it, and `demo/logit.yaml`'s header comment explains why this is the one
  # that doesn't. `otlp_in` (`crates/logit-inputs/src/otlp.rs`) is consequently still unexercised
  # by this demo.
  app:
    build:
      context: ./app
    image: logit-demo-app:latest
    depends_on:
      graph-svg:
        condition: service_completed_successfully
      arch-svg:
        condition: service_completed_successfully
      # `service_healthy`: `logit`'s own healthcheck (`docs/deploying.md`'s "Probes and exit
      # codes") now answers "is the UDP listener actually bound" for real, closing the gap
      # `docs/deploying.md`'s "ordering rule" used to name -- UDP is still fire-and-forget once
      # `app` is running, this only bounds when it's allowed to start sending.
      logit:
        condition: service_healthy
      # The OTLP/HTTP leg below is TCP and does get retried by the exporter's own SDK-level retry
      # (a `BatchSpanProcessor` export failure just gets dropped and retried on the next batch, no
      # crash), so `service_started` is no less honest a limit for `tempo` either -- same reasoning
      # `logit`'s own dependency on `tempo` above already uses for `tempo_out`.
      tempo:
        condition: service_started
      # The schema `pages/models.py`'s `WorkRecord` needs must exist before the first `/work`
      # request, not just before this container starts serving -- `service_completed_successfully`,
      # not `service_started`, since `app-migrate` racing its own `migrate` against live traffic is
      # exactly the ordering bug this dependency exists to rule out.
      app-migrate:
        condition: service_completed_successfully
      # `.delay()` (pages/views.py's `work`) publishes to Redis synchronously, in the request
      # thread -- unlike `tempo`/`logit` above, there's no background retry queue underneath it,
      # so `service_healthy` here (Redis's own healthcheck is fast: 5s interval, 5s start period)
      # is worth the small extra startup wait.
      redis:
        condition: service_healthy
    environment:
      <<: *postgres-env
      CELERY_BROKER_URL: redis://redis:6379/0
      # The URL a *browser on the host* uses, not a container-network name.
      GRAFANA_URL: http://localhost:3000
      LOGIT_PORT: "5142" # app_in, not haproxy_in/nginx_in -- see demo/logit.yaml
      OTEL_SERVICE_NAME: demo-app
      # Straight to Tempo's OTLP/HTTP receiver (demo/tempo/tempo.yaml's `otlp.protocols.http`,
      # :4318) -- not `logit`. See the comment above and demo/logit.yaml's header comment for why.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf # documentation -- see gunicorn.conf.py's comment
      # `/work` (pages/views.py) calls back into nginx's own `/inner` -- a container-network name,
      # unlike GRAFANA_URL above, since this call never leaves the `demo` network. `docs/plans/
      # demo-richer-traces.md` workstream B: nginx, not haproxy, so this hop takes a different path
      # than the request that triggered it, while still landing on a tier `logit` mints a real span
      # from (demo/logit.yaml's `nginx_trace`).
      INNER_URL: http://nginx/inner
      # 4, not `gunicorn.conf.py`'s own default of 2 -- `/work` blocks one worker on its own
      # inbound call to `/inner`, which needs a *different* worker of this same pool to answer. At
      # 2, two concurrent `/work` requests self-deadlock: both hold a worker waiting on `/inner`,
      # and neither request the inner call is waiting for can ever be served. `traffic`'s loop
      # (below) is serial, so 4 is ample headroom, not a value tuned against real concurrency.
      WEB_CONCURRENCY: "4"
    # No longer published -- haproxy is the front door now.
    volumes:
      - graph_data:/graph:ro
    restart: unless-stopped
    networks: [demo]

  # The demo's async tier (`docs/plans/demo-richer-traces.md` workstream D) -- `pages/tasks.py`'s
  # one task, run here, never in a gunicorn worker. Reuses `logit-demo-app:latest` with no second
  # `build:` of its own, the same trick `app-migrate`/`graph-dot` already use: `--build` builds
  # every image once, regardless of how many services reference the tag afterward. Its own real
  # OTel spans (`demoproj/telemetry.py`) go straight to Tempo, exactly like `app`'s -- `logit`
  # isn't in this leg either, consistent with every other tier's own SDK-carried spans in this
  # demo.
  worker:
    image: logit-demo-app:latest
    depends_on:
      redis:
        condition: service_healthy
      app-migrate:
        condition: service_completed_successfully
      # `service_healthy`, now that `logit` has a real healthcheck to wait on
      # (`docs/deploying.md`'s "Probes and exit codes").
      logit:
        condition: service_healthy
      tempo:
        condition: service_started
    entrypoint: ["celery", "-A", "demoproj.celery", "worker"]
    command: ["--loglevel=info", "--concurrency=2"]
    environment:
      <<: *postgres-env
      CELERY_BROKER_URL: redis://redis:6379/0
      OTEL_SERVICE_NAME: demo-worker
      # worker_in, not app_in -- pages/tasks.py logs through `demoapp.worker`
      # (demoproj/settings.py), a separate logger/handler/port from `app`'s own `demoapp.access`.
      WORKER_LOGIT_PORT: "5143"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    restart: unless-stopped
    networks: [demo]

  # Step 4: nginx, relaying and logging the W3C traceparent haproxy mints. See
  # demo/nginx/nginx.conf's header comment.
  nginx:
    image: docker.io/library/nginx:1.27-alpine
    # Fixed, not Compose's default `<project>-nginx-<n>` -- `nginx_in` (demo/logit.yaml) names
    # this container explicitly (`docker_in`'s `containers:`), and a project-derived name would
    # be one more thing to keep in sync by hand across two files for no benefit.
    container_name: logit-demo-nginx
    environment:
      # Keeps the entrypoint script's own non-JSON startup lines off stdout -- see
      # demo/nginx/nginx.conf's header comment for why that matters now that `logit` tails this
      # container's stdout directly.
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    depends_on:
      app:
        condition: service_started
      # No `logit` dependency any more -- nginx no longer sends it anything directly (no more
      # `syslog:` destination), and `nginx_in`'s `read_from: beginning` plus its checkpoint mean
      # nothing is lost even if `nginx` happens to start, and log a few lines, before `logit`
      # first discovers its container directory.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:z,ro
    networks: [demo]

  # Step 5: the demo's front door. Mints (or reuses) a W3C traceparent, forwards it to nginx, and
  # is what `traffic` and any browser actually talk to. See demo/haproxy/haproxy.cfg's header
  # comment.
  haproxy:
    image: docker.io/library/haproxy:3.0-alpine
    depends_on:
      nginx:
        condition: service_started
      # `service_healthy`, now that `logit` has a real healthcheck to wait on
      # (`docs/deploying.md`'s "Probes and exit codes").
      logit:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:z,ro
    ports:
      - "8080:8080"
    networks: [demo]

  # The demo's traffic source, replacing `hello`'s old in-process synthetic loop (which fabricated
  # syslog lines directly and so never crossed haproxy/nginx, carrying no trace context). Low
  # volume by design -- this is a demo showing correlation working, not a load test. A stock image
  # and an inline loop, not a Dockerfile, for the same "nothing to build" reason `hello` is one.
  traffic:
    image: docker.io/curlimages/curl:8.11.1
    depends_on:
      haproxy:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    # `$$p`, not `$p`: compose interpolates `$VAR`/`${VAR}` in this file itself before the string
    # ever reaches the container's shell (confirmed empirically: unescaped, compose warned about
    # an unset variable "p" and substituted an empty string, so every request hit "haproxy:8080"
    # instead of cycling through the four paths below).
    #
    # A YAML *sequence* of one string, like graph-dot's/graph-svg's `command: ["..."]` above --
    # NOT a bare scalar. Compose word-splits a bare-scalar `command:` itself (the same short-form
    # normalization that turns `command: python3 app.py` into `["python3", "app.py"]`), stopping
    # at the first `;` -- confirmed empirically: a bare multi-line scalar here resolved
    # (`docker compose config`) to just `["while", "true"]`, silently discarding everything after,
    # which `/bin/sh -c` then read as a bodyless `while true` and errored `unexpected end of file
    # (expecting "do")`. Wrapping the whole script as one list element makes it a single opaque
    # argv entry -- exactly what `-c` needs -- with no compose-side splitting at all. `|` (literal
    # block) inside that one element keeps every line break a real newline, which the shell inside
    # the container treats as a statement separator exactly like `;`.
    # `/work` repeated three times, not once, so it's the majority of the loop's traffic --
    # `docs/plans/demo-richer-traces.md` workstream A's whole point is a Tempo/Grafana story worth
    # looking at, which means enough `/work` traces (jittered latency, an occasional real 503) to
    # fill in `web.request_time`'s p50/p99 spread and the "Loki: 5xx lines/sec" panel without `/boom`
    # (a guaranteed 500, kept rare here) dominating either one.
    command:
      - |
        while true; do
          for p in / /health /graph.svg /missing /work /work /work /boom; do
            curl -s -o /dev/null "http://haproxy:8080$$p" || true
            sleep 2
          done
        done
    restart: unless-stopped
    networks: [demo]

networks:
  demo: {}

volumes:
  influxdb_data: {}
  grafana_data: {}
  loki_data: {}
  tempo_data: {}
  graph_data: {}
  logit_state: {}
  postgres_data: {}
  postgres_logs: {}
