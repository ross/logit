[package]
name = "logit-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Codec traits, the native logit-to-logit frame format, and the output Buffer trait."

# The vendored OTLP proto comments carried into src/otlp/generated/ include prose that rustdoc
# reads as code blocks (Span's attributes doc, for one). `#![allow(rustdoc::all)]` silences the
# lint, but rustdoc still runs such a block as a doctest, so doctests are off crate-wide. No
# hand-written doctest exists here.
[lib]
doctest = false

[dependencies]
logit-core.workspace = true
# `collectd::TypesDb::load` reads an operator-supplied file; `anyhow::Context` puts its path on
# the error, as every other file-reading path in the workspace does.
anyhow.workspace = true
bytes.workspace = true
prost.workspace = true
thiserror.workspace = true
lz4_flex.workspace = true
crc32c.workspace = true
# OTLP/JSON decoding (src/otlp/json). No `serde`: the JSON walk is plain functions over
# `serde_json::Value`, because derives can't express OTLP/JSON's hex-vs-base64 and
# string-or-number rules (ADR `otlp-json-decoding`).
serde_json.workspace = true
base64.workspace = true
# Prometheus remote-write's Snappy block compression. Only prometheus/generated/mod.rs's round-trip
# test calls it here; the remote-write sink and receiver compress in logit-outputs/logit-inputs.
snap.workspace = true

[dev-dependencies]
# Generated corpora for the property tests (most of tests/*_fixed_point.rs, src/otlp/metrics.rs).
proptest.workspace = true
