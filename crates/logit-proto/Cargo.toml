[package]
name = "logit-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Codec traits, the native logit-to-logit frame format, and the output Buffer trait."

# The vendored OTLP proto comments carried into src/otlp/generated/ include prose that rustdoc
# reads as code blocks (Span's attributes doc, for one). `#![allow(rustdoc::all)]` silences the
# lint, but rustdoc still runs such a block as a doctest, so doctests are off crate-wide. No
# hand-written doctest exists here.
[lib]
doctest = false

[dependencies]
logit-core.workspace = true
# `collectd::TypesDb::load` reads an operator-supplied file; `anyhow::Context` puts its path on
# the error, as every other file-reading path in the workspace does.
anyhow.workspace = true
bytes.workspace = true
prost.workspace = true
thiserror.workspace = true
lz4_flex.workspace = true
crc32c.workspace = true
# OTLP/JSON decoding (src/otlp/json) -- both already resolve in Cargo.lock at these exact versions
# via other workspace members (serde_json transitively through several crates, base64 through
# reqwest/rustls), so neither adds a new crate version to the dependency graph. No `serde` here:
# the JSON walk is plain functions over `serde_json::Value`, not `Deserialize` derives -- see
# ADR `otlp-json-decoding` for why (short version: derives can't express OTLP's hex-vs-base64 or
# string-or-number dialect rules without fighting the derive, and this crate's generated `prost`
# types are never hand-edited -- ADR `committed-pregenerated-otlp-protobuf`).
# serde_json's default float parser isn't correctly rounded (a value can land one or two ulps
# off, and re-parsing its own shortest output moves it again), so a metric relayed over a JSON
# route would drift on every hop. `float_roundtrip` makes decode -> encode -> decode the identity.
# Cargo unifies features, so this also makes OTLP/JSON and the `json` transform parse floats
# exactly; the feature costs about 2x on float parsing only (serde_json's own documentation), and
# `docs/known-gaps.md`'s Datadog entry gates the merge on a perf-VM measurement.
# `raw_value` lets the Splunk HEC decoder read an envelope's `time` as the sender's number text, so
# a nanosecond-precise decimal keeps every digit instead of rounding through an `f64`. Not
# `arbitrary_precision`, which would change every `serde_json::Number` in the workspace.
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
base64.workspace = true
# Prometheus remote-write's two body encodings, Snappy block format and zstd, both through
# prometheus/compression.rs, which the remote-write sink and receiver share.
snap.workspace = true
ruzstd.workspace = true

[dev-dependencies]
# Generated corpora for the property tests (most of tests/*_fixed_point.rs, src/otlp/metrics.rs).
proptest.workspace = true
# tests/datadog_interop.rs undoes a recorded request's Content-Encoding as datadog_in does.
ruzstd.workspace = true
flate2.workspace = true
