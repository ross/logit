[package]
name = "logit-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Codec traits, the native logit-to-logit frame format, and the output Buffer trait."

# The vendored OTLP proto comments (crates/logit-proto/proto/, carried into src/otlp/generated/ by
# prost-build) include prose examples that read as indented/fenced code blocks to rustdoc -- e.g.
# Span's attributes doc comment. `#![allow(rustdoc::all)]` on those files silences the *lint*, but
# rustdoc still tries to *run* such a block as a doctest regardless of that lint. Turning doctests
# off for the whole crate (no hand-written doctest exists here to lose -- house style favors prose
# doc comments, see AGENTS.md) is the standard fix for third-party-generated code with this shape.
[lib]
doctest = false

[dependencies]
logit-core.workspace = true
bytes.workspace = true
prost.workspace = true
thiserror.workspace = true
lz4_flex.workspace = true
crc32c.workspace = true
# OTLP/JSON decoding (src/otlp/json) -- both already resolve in Cargo.lock at these exact versions
# via other workspace members (serde_json transitively through several crates, base64 through
# reqwest/rustls), so neither adds a new crate version to the dependency graph. No `serde` here:
# the JSON walk is plain functions over `serde_json::Value`, not `Deserialize` derives -- see
# ADR `otlp-json-decoding` for why (short version: derives can't express OTLP's hex-vs-base64 or
# string-or-number dialect rules without fighting the derive, and this crate's generated `prost`
# types are never hand-edited -- ADR `committed-pregenerated-otlp-protobuf`).
serde_json.workspace = true
base64.workspace = true

[dev-dependencies]
# The OTLP fixed-point tests (tests/otlp_fixed_point.rs): decode(encode(b)) == b over a generated
# corpus of MetricRecords, plus the hand-built fully-populated-batch fixtures.
proptest.workspace = true
