[package]
name = "logit-outputs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Per-protocol sinks implementing logit-pipeline's Output trait (InfluxDB 2.x first)."

[dependencies]
logit-core.workspace = true
logit-pipeline.workspace = true
logit-proto.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
reqwest.workspace = true
# otlp_out's hand-rolled gRPC-over-HTTP/2 client (docs/adr/hand-rolled-grpc-over-hyper.md);
# HTTP framing itself rides on `reqwest`, above.
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
# otlp_out's optional gzip request compression (docs/adr/otlp-compression-and-decompression-bounds.md).
flate2.workspace = true
# TLS for otlp_out, both transports (docs/adr/otlp-tls-and-pooled-grpc-client.md): `rustls`/
# `rustls-pki-types` build a `rustls::ClientConfig` from config-supplied PEM; `hyper-rustls` wraps
# `hyper-util`'s pooled client (the gRPC transport's connection manager) in it; `webpki-roots` is
# the same bundled Mozilla trust root the HTTP transport already gets from `reqwest` by default.
rustls.workspace = true
rustls-pki-types.workspace = true
hyper-rustls.workspace = true
webpki-roots.workspace = true
# A real (non-dev) dependency: `StreamOutput` (`stdio.rs`) writes via `tokio::io`/`tokio::fs`.
# `InfluxDbOutput::send` no longer retries on its own (that moved to `logit-pipeline`'s generic
# writer, `docs/adr/buffered-sink-delivery.md`) and so no longer needs `tokio::time` itself.
tokio.workspace = true
# `logit_out` (`logit.rs`) dials a raw TCP(+TLS) connection itself, unlike `otlp_out`'s
# HTTP-framed transports -- promoted from a dev-dependency (it used to back only otlp.rs's canned
# TLS test servers) to a real one, same version already in Cargo.lock.
tokio-rustls.workspace = true

[dev-dependencies]
# Only for the end-to-end regression test that a Lua enrichment stage doesn't silently change an
# attribute's InfluxDB tag-inclusion behavior -- see
# bytes_attribute_stays_excluded_from_tags_after_a_lua_enrichment_stage below.
logit-script.workspace = true
# `syslog.rs`'s relay test (decodes with a real `SyslogDecoder`) and `logit.rs`'s round-trip
# tests (drive a real `LogitInput` rather than hand-rolling the wire protocol on both ends).
logit-inputs.workspace = true
