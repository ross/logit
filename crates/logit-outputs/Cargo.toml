[package]
name = "logit-outputs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Per-protocol sinks implementing logit-pipeline's Output trait (InfluxDB 2.x first)."

[dependencies]
logit-core.workspace = true
logit-aws.workspace = true
# kafka_out's broker connection, SASL, and error codes, shared with kafka_in.
logit-kafka.workspace = true
logit-pipeline.workspace = true
logit-proto.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
reqwest.workspace = true
# otlp_out's hand-rolled gRPC client (docs/adr/hand-rolled-grpc-over-hyper.md); its OTLP/HTTP
# transport uses `reqwest`.
hyper.workspace = true
hyper-util.workspace = true
# datadog_trace_out's Unix-socket connector for `hyper-util`'s pooled client.
tower-service.workspace = true
http.workspace = true
http-body-util.workspace = true
# otlp_out's optional gzip (docs/adr/otlp-compression-and-decompression-bounds.md).
flate2.workspace = true
# kafka_out's request codecs (docs/adr/kafka-output.md, item 1). Record batch v2 and its
# compression are `logit_proto::kafka`'s.
kafka-protocol.workspace = true
# otlp_out TLS on both transports (docs/adr/otlp-tls-and-pooled-grpc-client.md): the
# `rustls::ClientConfig` `logit_pipeline::tls::build_client_config` builds, wrapped around
# `hyper-util`'s pooled gRPC client by `hyper-rustls`; `webpki-roots` is the Mozilla root set
# `reqwest` bundles for the HTTP side.
rustls.workspace = true
rustls-pki-types.workspace = true
hyper-rustls.workspace = true
webpki-roots.workspace = true
# kafka_out's SASL (docs/adr/kafka-sasl.md): SCRAM's HMAC, PBKDF2, and nonce, and its base64
# attributes.
ring.workspace = true
base64.workspace = true
# kafka_out's OAUTHBEARER (docs/adr/kafka-sasl.md): the token endpoint's answer, a JWT's claims,
# and a broker's error challenge. Tests also parse what `ndjson` and kafka_out's sinks write.
serde_json.workspace = true
tokio.workspace = true
# TLS for the raw-TCP sinks (`logit_out`, `syslog_out`, `statsd_out`), which don't go through
# `reqwest`/`hyper`; tests' TLS servers use it too.
tokio-rustls.workspace = true

[dev-dependencies]
# `HttpStub`, the stand-in for STS, the container endpoint, and IMDS in `kafka_out`'s tests.
logit-aws = { workspace = true, features = ["test-util"] }
# The fake broker `kafka_out`'s tests run against, and the `FakeStream` the stream sinks' tests
# script.
logit-kafka = { workspace = true, features = ["test-util"] }
# Arms `logit_pipeline::fault` and compiles `logit_pipeline::test_util` in this crate's tests.
# Dev-only, so the release binary never has either.
logit-pipeline = { workspace = true, features = ["fault-injection", "test-util"] }
# Remote-write sender tests decode the captured body as the vendored prompb message, not this
# codec's own view of it.
prost.workspace = true
# influxdb.rs's test that a Lua stage doesn't change an attribute's tag inclusion
# (`bytes_attribute_stays_excluded_from_tags_after_a_lua_enrichment_stage`).
logit-script.workspace = true
# `logit.rs`'s transport tests run a real `LogitInput` as the receiving end.
logit-inputs.workspace = true
# TLS tests assert on the `insecure_skip_verify` warning, which reaches only `tracing`. Dev-only:
# `logit-outputs` never installs a subscriber itself.
tracing-subscriber.workspace = true
# Remote-write sender tests undo the Snappy body they capture.
snap.workspace = true
# Codec fixed-point property tests (`decode(encode(decode(x))) == decode(x)`).
proptest.workspace = true
# `msgpack`'s parity test reads an NDJSON line into a tree that keeps each object's key order,
# which `serde_json::Value` doesn't.
serde.workspace = true
# `test-util` for the paused-clock TLS handshake timeout test in `stream.rs`.
tokio = { workspace = true, features = ["test-util"] }
