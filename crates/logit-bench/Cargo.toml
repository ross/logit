[package]
name = "logit-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Allocation measurement and throughput benchmarks for logit. Dev-only; ships in nothing."

# `logit-pipeline` depends on no concrete input/transform/output (`docs/design/pipeline-graph.md`'s
# "Crate layout" section), so an end-to-end `syslog_in -> json -> kv_metrics -> keep -> aggregate ->
# influxdb_out` measurement needs a crate that depends on all of them: this one.

[dependencies]
logit-config.workspace = true
logit-core.workspace = true
logit-pipeline.workspace = true
logit-inputs.workspace = true
logit-outputs.workspace = true
logit-transforms.workspace = true
logit-script.workspace = true
logit-proto.workspace = true
bytes.workspace = true
# The remote-write fixtures build `prometheus.WriteRequest`/`io.prometheus.write.v2.Request` from
# the vendored prompb types, not through `logit_proto::prometheus::remote_write`: a fixture that is
# the output of the code it measures is not a fixture.
prost.workspace = true
serde.workspace = true
# The native-wire-format bake-off's other two arms (docs/design/wire-protocol.md's "Encoding:
# decided — hand-rolled", docs/adr/native-wire-format-encoding.md). Both serialize
# `bakeoff::wire_mirror::WireBatch`, a plain-data mirror of `EventBatch`, never the shipped
# `logit_proto::native` codec. In `[dependencies]` rather than `[dev-dependencies]` so `tests/` and
# `benches/` share the mirror types; `logit-bench` ships in nothing either way.
# `default-features = false`: postcard's defaults (`heapless`, `heapless-cas`) are for no_std use,
# and `to_allocvec`/`from_bytes` need only `alloc`. It also drops `heapless`'s dependency on
# `atomic-polyfill`, an unmaintained crate `script/audit` (`cargo-deny`) flags (RUSTSEC-2023-0089),
# rather than suppressing the advisory.
postcard = { version = "1", default-features = false, features = ["alloc"] }
rkyv = "0.8"
# The attribute-sizing arms' mirror of `AttrMap` (`src/bakeoff/attr_arms/`) needs the real backing
# store, `SmallVec<[(Symbol, Value); 8]>` with the `union` feature, since the layout and `Clone`'s
# growth policy are what it measures. Through the workspace, so it can't drift from `logit-core`'s.
smallvec.workspace = true

[dev-dependencies]
divan = "0.1"
# `benches/size_vs_alloc.rs`'s `#[global_allocator]`, at the version `logit-cli` ships
# (`docs/adr/jemalloc-global-allocator.md`). That bench measures what an allocation *costs*, so it
# runs on production's allocator; `benches/pipeline.rs`'s `divan::AllocProfiler` wraps the
# **system** allocator, which suits counting but not this.
tikv-jemallocator = "0.6"
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "wire_format"
harness = false

[[bench]]
name = "size_vs_alloc"
harness = false

# The attribute-sizing arms (`docs/plans/event-sizing.md`). Installs jemalloc as
# `#[global_allocator]`, as `size_vs_alloc` does and for the same reason: they measure what a clone
# and an allocation *cost*. The matching allocation counts live in `tests/attr_arms.rs`, which wraps
# `System` instead.
[[bench]]
name = "attr_arms"
harness = false
