[package]
name = "logit-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Allocation measurement and throughput benchmarks for logit. Dev-only; ships in nothing."

# This crate exists because no other one can hold these measurements: `logit-pipeline` deliberately
# doesn't depend on any concrete input/transform/output (`docs/design/pipeline-graph.md`'s crate
# layout), so the only place an end-to-end `syslog_in -> json -> kv_metrics -> keep -> aggregate ->
# influxdb_out` measurement can live is a crate that depends on all of them. See
# `docs/design/memory.md`.

[dependencies]
logit-config.workspace = true
logit-core.workspace = true
logit-pipeline.workspace = true
logit-inputs.workspace = true
logit-outputs.workspace = true
logit-transforms.workspace = true
logit-script.workspace = true
logit-proto.workspace = true
bytes.workspace = true
# The remote-write fixtures below build a `prometheus.WriteRequest` / `io.prometheus.write.v2.Request`
# straight from the vendored prompb types rather than through `logit_proto::prometheus::remote_write`
# itself -- a fixture that is the output of the code it measures is not a fixture.
prost.workspace = true
serde.workspace = true
# The native-wire-format bake-off's other two arms (docs/design/wire-protocol.md's "Encoding:
# decide with a benchmark, not up front", docs/adr/native-wire-format-encoding.md). Both serialize
# `bakeoff::wire_mirror::WireBatch`, a plain-data mirror of `EventBatch` -- never the shipped
# `logit_proto::native` codec, which is hand-rolled either way. `logit-bench` ships in nothing (see
# this crate's own module doc), so these live in `[dependencies]` rather than `[dev-dependencies]`
# purely so both `tests/` and `benches/` can reach the same mirror types without duplicating them.
# `default-features = false`: postcard's two default features (`heapless`, `heapless-cas`) exist
# for no_std/embedded use (a fixed-capacity buffer instead of `Vec`), which this bake-off arm
# doesn't need -- `to_allocvec`/`from_bytes` only need `alloc`. Turning them off also drops
# `heapless`'s own dependency on `atomic-polyfill`, an unmaintained crate `script/audit`
# (`cargo-deny`) flags (RUSTSEC-2023-0089) -- avoided entirely rather than suppressed.
postcard = { version = "1", default-features = false, features = ["alloc"] }
rkyv = "0.8"

[dev-dependencies]
divan = "0.1"
# `benches/size_vs_alloc.rs`'s `#[global_allocator]`, at the same version `logit-cli` ships
# (`docs/adr/jemalloc-global-allocator.md`). That bench measures what an allocation *costs*, so it
# has to run against the allocator production actually uses -- `benches/pipeline.rs`'s
# `divan::AllocProfiler` wraps the **system** allocator and counts from inside the timed region,
# which is the right trade for an allocation-count bench and the wrong one for this.
tikv-jemallocator = "0.6"
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "wire_format"
harness = false

[[bench]]
name = "size_vs_alloc"
harness = false
