[package]
name = "logit-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The component graph: Input/Output/Transform traits, Fanout, graph resolution, and the node runtime."

[dependencies]
logit-core.workspace = true
logit-config.workspace = true
logit-proto.workspace = true
logit-script.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
thiserror.workspace = true
regex.workspace = true
# `run_lua`'s remaining `eprintln!`s go through `Diagnostics`, and its own lifecycle events
# (`ready`, `shutdown signal received`, `drain complete`, `degraded`/`recovered`) go straight
# through `tracing` (docs/plans/operator-surface.md).
tracing.workspace = true
# The disk-backed sink buffer's cursor.json (crates/logit-pipeline/src/disk_queue.rs), the same
# tmp+rename JSON idiom crates/logit-inputs/src/tail/checkpoint.rs already uses for its own
# same-sized checkpoint file.
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# `sockstat`'s `getsockopt(SO_MEMINFO)` / `getsockopt(TCP_INFO)` reads -- Linux-only socket
# options, so a Linux-only dependency, exactly as `logit-inputs` already declares `libc` for its
# inotify wake source. Already present transitively at this exact version, so this adds no new
# entry to the dependency tree.
libc.workspace = true

[dev-dependencies]
# `test-util` (for `tokio::time::pause`/`#[tokio::test(start_paused = true)]`) is enabled per
# crate that has paused-clock tests, here and in `logit-inputs` -- a `dev-dependencies` override
# of the same workspace dependency applies just to test/bench/example builds, not the normal
# library build. It has to be declared in each such crate rather than inherited: a
# `cargo test -p <crate>` builds that package's feature set alone, so a sibling's override
# doesn't carry over even though a `--workspace` build's feature unification hides that.
tokio = { workspace = true, features = ["test-util"] }
