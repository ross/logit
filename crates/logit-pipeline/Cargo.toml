[package]
name = "logit-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The component graph: Input/Output/Transform traits, Fanout, graph resolution, and the node runtime."

[dependencies]
logit-core.workspace = true
logit-config.workspace = true
logit-proto.workspace = true
logit-script.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
thiserror.workspace = true
regex.workspace = true
# The runtime's lifecycle events (`ready`, `shutdown signal received`, `drain complete`,
# `degraded`/`recovered`) go through `tracing` (docs/adr/tracing-for-self-logging.md).
tracing.workspace = true
# `disk_queue`'s cursor.json, written with the tmp+rename idiom of
# crates/logit-inputs/src/tail/checkpoint.rs.
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true

[features]
# Arms the fault-injection seam (`src/fault.rs`) outside this crate's own tests. Only ever a
# dev-dependency feature: `script/lint` fails if `logit-cli`'s normal dependency graph enables it.
fault-injection = []

[target.'cfg(target_os = "linux")'.dependencies]
# `sockstat`'s `getsockopt(SO_MEMINFO)` / `getsockopt(TCP_INFO)` reads: Linux-only socket
# options, so a Linux-only dependency.
libc.workspace = true

[dev-dependencies]
# `test-util` enables paused-clock tests. Declare it in each crate that has them: a
# `cargo test -p <crate>` builds that package's feature set alone, so a sibling's override
# doesn't carry over, though a `--workspace` build's feature unification hides that.
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
# The `max_memory` runtime tests capture the self-log a Lua node's own OS thread writes.
tracing-subscriber.workspace = true
