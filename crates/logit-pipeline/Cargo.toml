[package]
name = "logit-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The component graph: Input/Output/Transform traits, Fanout, graph resolution, and the node runtime."

[dependencies]
logit-core.workspace = true
logit-config.workspace = true
logit-proto.workspace = true
logit-script.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
thiserror.workspace = true
regex.workspace = true
# The disk-backed sink buffer's cursor.json (crates/logit-pipeline/src/disk_queue.rs), the same
# tmp+rename JSON idiom crates/logit-inputs/src/tail/checkpoint.rs already uses for its own
# same-sized checkpoint file.
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true

[dev-dependencies]
# `test-util` (for `tokio::time::pause`/`#[tokio::test(start_paused = true)]`) only needs to be
# enabled for this crate's own tests -- a `dev-dependencies` override of the same workspace
# dependency applies just to test/bench/example builds, not the normal library build.
tokio = { workspace = true, features = ["test-util"] }
