[package]
name = "logit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Internal event model: Event, Value, Resource, metric kinds, attribute interner."

[dependencies]
bytes.workspace = true
smallvec.workspace = true
lasso = { version = "0.7", features = ["multi-threaded"] }
sketches-ddsketch.workspace = true
# `HyperLogLog`'s underlying cardinality estimator (docs/plans/lossless-transit.md's W2).
cardinality-estimator.workspace = true
# Drives `cardinality-estimator`'s tuple-shaped `Serialize`/`Deserialize` impl through the
# hand-rolled byte `Serializer`/`Deserializer` in `metric.rs` -- no data-format crate needed, just
# the trait definitions themselves.
serde.workspace = true
# `Diagnostics::warn`/`warn_throttled` emit through it (docs/plans/operator-surface.md).
tracing.workspace = true
# `telemetry::TelemetryLayer` captures `tracing` events into the pipeline as log events
# (docs/plans/operator-surface.md, workstream D) -- needs the `Layer` trait itself, not a
# subscriber (that's `logit-cli::main::init_logging`'s job).
tracing-subscriber.workspace = true

[dev-dependencies]
# `tests/type_sizes.rs` asserts `size_of::<bytes::Bytes>()` directly -- it's the term that sets
# `Value`'s size, so the assertion is more legible naming it than hiding it behind `Value`.
# An integration test can't reach a crate's ordinary dependencies, hence the restatement here.
bytes.workspace = true
