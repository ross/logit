[package]
name = "logit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The logit binary."

[[bin]]
name = "logit"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# See `main.rs`'s `#[global_allocator]` and docs/adr/jemalloc-global-allocator.md. On by default
# so the shipped binary gets it; `--no-default-features` falls back to the system allocator, to
# measure the difference or for a target jemalloc doesn't support.
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
logit-core.workspace = true
logit-config.workspace = true
logit-pipeline.workspace = true
logit-inputs.workspace = true
logit-outputs.workspace = true
logit-transforms.workspace = true
# `build_spec` names `logit_proto::frame::Compression` (`to_native_compression`). Already a
# transitive dependency via `logit-outputs`.
logit-proto.workspace = true
clap.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
tokio.workspace = true
tikv-jemallocator = { version = "0.6", optional = true }
# `init_logging` builds the subscriber; `--log-level`/`LOGIT_LOG` and `--log-format` pick its
# filter and formatter (docs/plans/operator-surface.md).
tracing.workspace = true
tracing-subscriber.workspace = true
# `admin.rs`'s `/readyz`/`/healthz` server, and `logit ready`'s client. Already direct deps of
# `logit-inputs`/`logit-outputs` at these versions, so no new crate version enters the graph.
bytes.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true

[dev-dependencies]
# `admin_ready.rs`'s drain test needs a real SIGTERM: `Child::kill` sends SIGKILL, which has no
# graceful drain to probe. Already a dependency via `logit-inputs`.
libc.workspace = true
# `tests/durable_buffer_restart.rs` implements `logit_pipeline::Input`/`Output` test doubles.
async-trait.workspace = true
# `tests/logit_round_trip.rs` constructs the `bytes::Bytes` it hands `StatsdDecoder` directly.
# Already a transitive dependency.
bytes.workspace = true
# `tests/statsd_round_trip.rs`'s `mod tls`: a raw `tokio_rustls` client makes the one assertion a
# sink can't, that a refused handshake leaves the listener serving everyone else. All three are
# already transitive at these versions via `logit-inputs`/`logit-outputs`.
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
# `tests/prometheus_round_trip.rs`'s scrape client (its canned target uses the `hyper` stack
# above). Already transitive at this version via `logit-inputs`/`logit-outputs`.
reqwest.workspace = true
# `tests/prometheus_remote_write_round_trip.rs` hand-builds the metadata-only and samples-only
# `WriteRequest`s a real Prometheus 1.0 sender produces (`logit`'s own sender always attaches
# `metadata[]` to its samples) on `logit_proto::prometheus::generated`'s prost types, then
# Snappy-block-compresses them. Both already transitive at these versions via `logit-proto`.
prost.workspace = true
snap.workspace = true
# `tests/datadog_in_round_trip.rs` posts every route gzip-, deflate-, and zstd-compressed, as a
# Datadog Agent does. Both already transitive at these versions via `logit-inputs`.
flate2.workspace = true
ruzstd.workspace = true
# `tests/lua_example.rs` runs `examples/lua/process.lua` in a `ScriptWorker`. Already a
# transitive dependency via `logit-pipeline`.
logit-script.workspace = true
