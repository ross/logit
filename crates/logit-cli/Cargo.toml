[package]
name = "logit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The logit binary."

[[bin]]
name = "logit"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# See `main.rs`'s `#[global_allocator]` and docs/adr/jemalloc-global-allocator.md. Opt-out
# rather than opt-in so the shipped binary gets it by default, but a build can still fall back to
# the system allocator to measure the difference (or on a target jemalloc doesn't support).
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
logit-core.workspace = true
logit-config.workspace = true
logit-pipeline.workspace = true
logit-inputs.workspace = true
logit-outputs.workspace = true
logit-transforms.workspace = true
# `to_native_compression` (pipeline.rs) crosses `logit_config::Compression` into
# `logit_proto::frame::Compression` -- already a transitive dependency via `logit-outputs`, named
# directly here because `build_spec` names its type.
logit-proto.workspace = true
clap.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
tokio.workspace = true
tikv-jemallocator = { version = "0.6", optional = true }
# `init_logging` builds the subscriber; `--log-level`/`LOGIT_LOG` and `--log-format` pick its
# filter and formatter (docs/plans/operator-surface.md).
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `crates/logit-cli/tests/durable_buffer_restart.rs` implements `logit_pipeline::Input`/`Output`
# test doubles directly, the same way `crates/logit-outputs`/`logit-inputs` implement the real
# ones.
async-trait.workspace = true
# tests/logit_round_trip.rs's forwarding-chain test decodes a real statsd line with
# `StatsdDecoder` directly, which takes its input as `bytes::Bytes` -- already a transitive
# dependency via every crate above, named directly here because the test constructs one itself.
bytes.workspace = true
