[package]
name = "logit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The logit binary."

[[bin]]
name = "logit"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# See `main.rs`'s `#[global_allocator]` and docs/adr/jemalloc-global-allocator.md. Opt-out
# rather than opt-in so the shipped binary gets it by default, but a build can still fall back to
# the system allocator to measure the difference (or on a target jemalloc doesn't support).
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
logit-core.workspace = true
logit-config.workspace = true
logit-pipeline.workspace = true
logit-inputs.workspace = true
logit-outputs.workspace = true
logit-transforms.workspace = true
# `to_native_compression` (pipeline.rs) crosses `logit_config::Compression` into
# `logit_proto::frame::Compression` -- already a transitive dependency via `logit-outputs`, named
# directly here because `build_spec` names its type.
logit-proto.workspace = true
clap.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
tokio.workspace = true
tikv-jemallocator = { version = "0.6", optional = true }
# `init_logging` builds the subscriber; `--log-level`/`LOGIT_LOG` and `--log-format` pick its
# filter and formatter (docs/plans/operator-surface.md).
tracing.workspace = true
tracing-subscriber.workspace = true
# `admin.rs`'s `/readyz`/`/healthz` server, and `logit ready`'s client -- already direct deps of
# `logit-inputs`/`logit-outputs` at these exact versions; promoting them here adds no new crate
# version to the graph (docs/plans/operator-surface.md, workstream C).
bytes.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true

[dev-dependencies]
# `admin_ready.rs`'s drain test needs a real SIGTERM (`Child::kill` sends SIGKILL, which has no
# graceful path and therefore no drain to probe). Already a workspace dependency via
# `logit-inputs`, so this adds no new crate to the graph.
libc.workspace = true
# `crates/logit-cli/tests/durable_buffer_restart.rs` implements `logit_pipeline::Input`/`Output`
# test doubles directly, the same way `crates/logit-outputs`/`logit-inputs` implement the real
# ones.
async-trait.workspace = true
# tests/logit_round_trip.rs's forwarding-chain test decodes a real statsd line with
# `StatsdDecoder` directly, which takes its input as `bytes::Bytes` -- already a transitive
# dependency via every crate above, named directly here because the test constructs one itself.
bytes.workspace = true
# tests/statsd_round_trip.rs's `mod tls` now drives the real `statsd_out -> statsd_in` path over
# TLS on both ends (`docs/adr/statsd-output.md`'s TLS amendment). A raw `tokio_rustls` client
# survives alongside it for the one assertion a sink cannot make: that a *refused* handshake
# leaves the listener still serving everyone else. All three are already transitive dependencies
# at these exact versions via `logit-inputs`/`logit-outputs`, so naming them here adds no new
# crate version to the graph -- the same call `bytes`/`reqwest` below already make.
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
# tests/prometheus_round_trip.rs's scrape client, and its canned-target server (the same
# `hyper`/`hyper-util`/`http-body-util` stack `crates/logit-inputs/src/prometheus.rs`'s own tests
# use, all already ordinary dependencies above). `reqwest` is already a transitive dependency at
# this exact version via `logit-inputs`/`logit-outputs`, so this adds no new crate version to the
# graph.
reqwest.workspace = true
# tests/prometheus_remote_write_round_trip.rs hand-builds the two request shapes only a real
# Prometheus 1.0 sender produces -- a metadata-only `WriteRequest` and a samples-only one, which
# `logit`'s own sender never writes because it always attaches `metadata[]` to the samples it
# describes -- straight onto `logit_proto::prometheus::generated`'s prost types, and Snappy-block-
# compresses them the way both specs require. Both are already transitive dependencies at these
# exact versions via `logit-proto`, so naming them here adds no new crate version to the graph.
prost.workspace = true
snap.workspace = true
