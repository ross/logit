[package]
name = "logit-perf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Out-of-CI load-test harness: spawns the real `logit` binary against perf/scenarios/*.yaml and measures throughput, CPU per event, and peak RSS (docs/adr/load-test-harness.md). Dev-only; ships in nothing."

[[bin]]
name = "logit-perf"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
# `wait4` (rusage.rs) and SIGTERM (run.rs's settle-then-signal path for a scenario that doesn't
# self-exit).
libc.workspace = true
# `attribute` decodes the `internal -> file_out format: native` dump with the codec the runtime
# wrote it with (`logit_proto::frame::read_frame` + `logit_proto::native::decode_batch`), not a
# re-derived format or a human-readable render (docs/adr/load-test-harness.md's "Per-node
# attribution" section). This dependency is why `logit-perf` is a workspace member under `crates/`
# rather than a standalone `tools/*` workspace.
logit-proto.workspace = true
# The `Event`/`MetricKind`/`DdSketch` types the decoded batches are made of, and
# `interner::resolve` for a `MetricRecord`'s `Symbol` name.
logit-core.workspace = true
# `Bytes` is `read_frame`'s cursor type: the whole dump is read into one and each frame split off
# its front.
bytes.workspace = true

[dev-dependencies]
# Tests only: every line `perf/load/statsd-app.yaml` renders must parse cleanly through the
# `StatsdDecoder` the scenario's `statsd_in` runs, or the scenario would benchmark the
# malformed-line path. The harness binary decodes no statsd; its runtime check reads
# `logit.component.diagnostics{key="bad_line"}` from telemetry instead.
logit-inputs.workspace = true
