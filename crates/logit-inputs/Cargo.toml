[package]
name = "logit-inputs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Per-protocol listeners implementing logit-pipeline's Input trait (statsd first)."

[dependencies]
logit-core.workspace = true
logit-pipeline.workspace = true
logit-proto.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
bytes.workspace = true
socket2.workspace = true
# tail_in/docker_in's checkpoint file (docs/adr/file-tailing-and-docker-json-logs.md).
serde.workspace = true
serde_json.workspace = true
# otlp_in's HTTP/1.1+h2c and hand-rolled gRPC-over-HTTP/2 servers
# (docs/adr/hand-rolled-grpc-over-hyper.md).
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
# otlp_in's matching gzip request decode (docs/adr/otlp-compression-and-decompression-bounds.md).
flate2.workspace = true
# datadog_in's zstd request decode (docs/adr/datadog-agent-and-intake-relay.md, decision 4).
ruzstd.workspace = true
# Listener TLS termination (docs/adr/otlp-tls-and-pooled-grpc-client.md): `rustls`/
# `rustls-pki-types` build a `rustls::ServerConfig` from config-supplied PEM, and `tokio-rustls`'s
# `TlsAcceptor` wraps each accepted `TcpStream` before the serving path sees it.
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
# prometheus_in's scrape client (docs/adr/prometheus-scrape-and-exposition.md).
reqwest.workspace = true
# `generate_in`'s `generation complete` line (docs/plans/load-test-harness.md). Not through
# `logit_core::Diagnostics` like every other self-diagnostic here: the perf harness reads
# `events`/`batches`/`elapsed` as fields off the JSON log line, and `Diagnostics` renders one
# pre-formatted message. This crate emits events but never installs a subscriber.
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# tail_in/docker_in's inotify wake source (docs/adr/file-tailing-and-docker-json-logs.md) and the
# UDP listener's batched `recvmmsg(2)` read (docs/adr/udp-intake-batching-and-socket-visibility.md).
libc.workspace = true

[dev-dependencies]
# Arms `logit_pipeline::fault` in this crate's tests. Dev-only, so the release binary never has it.
logit-pipeline = { workspace = true, features = ["fault-injection"] }
# `prometheus_in`'s receiver tests hand-build a remote-write 1.0 request with no `metadata[]`:
# the shape a real Prometheus sends, which `remote_write::encode` never produces.
prost.workspace = true
# `prometheus_in`'s receiver tests Snappy-compress request bodies directly, the way a sender does,
# rather than through the receiver's own `logit_proto::prometheus::compression`.
snap.workspace = true
# tests/statsd_to_aggregate.rs needs a real `Aggregator` to prove a decoded `GaugeDelta`
# resolves. Dev-only: the library never depends on `logit-transforms`.
logit-transforms.workspace = true
# `internal.rs`'s tests drive `logit_core::TelemetryLayer` through a real `tracing` event, which
# needs a subscriber; the library never installs one.
tracing-subscriber.workspace = true
# `test-util` (`tokio::time::pause`/`start_paused`) for `internal.rs`'s shutdown-drain tests,
# which advance a 60s drain interval by hand. Declared here, not inherited from a sibling, because
# `cargo test -p logit-inputs` builds this package's feature set alone.
tokio = { workspace = true, features = ["test-util"] }
