[package]
name = "logit-inputs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Per-protocol listeners implementing logit-pipeline's Input trait (statsd first)."

[dependencies]
logit-core.workspace = true
logit-pipeline.workspace = true
logit-proto.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
bytes.workspace = true
# otlp_in's HTTP/1.1+h2c and hand-rolled gRPC-over-HTTP/2 servers
# (docs/adr/0024-hand-rolled-grpc-over-hyper.md).
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true

[dev-dependencies]
# Test-only: the end-to-end statsd -> aggregate integration test
# (tests/statsd_to_aggregate.rs) needs a real `Aggregator` to prove a decoded `GaugeDelta`
# actually resolves, not just that it decodes correctly in isolation. Not a production
# dependency -- `logit-inputs` still doesn't depend on `logit-transforms` for the library itself
# (AGENTS.md's crate layout).
logit-transforms.workspace = true
