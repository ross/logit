# Prometheus config template for script/record-fixtures's `prometheus` producer: scrape one target
# and remote-write to the raw_capture.py listener (the "capture" container), so the captured
# bodies are what a real Prometheus 3.x puts on the wire.
#
# A template, not a config: `record_prometheus` substitutes the six `@@NAME@@` placeholders with
# `sed`. One file keeps it checkable that the three fixture sets differ only in those values; three
# near-identical files would drift, as collectd.conf and collectd-threshold.conf have to warn
# about.
#
# Mounted over the image's own /etc/prometheus/prometheus.yml with no command override, so the
# container runs the stock command line. There's no dpkg conffile hazard here.

global:
  # The same short interval for all three renderings, so a capture finishes in seconds. Prometheus
  # staggers a target's first scrape by a hash-derived offset within it, which is part of the
  # worst-case wait the capture timeout allows for.
  scrape_interval: @@SCRAPE_INTERVAL@@
  scrape_timeout: 5s
  # One fixed label on every series, like collectd.conf's `Hostname "logit-fixture"`, so a test can
  # assert on it instead of on a container id or measured value.
  external_labels:
    monitor: logit-fixture

# The sample captures render the target as `localhost:9090`, Prometheus scraping its own /metrics:
# a real, fully formed scrape covering counter, gauge, histogram, and summary with no second
# container. The metadata capture renders it as the static prometheus-metadata-target.prom, whose
# header says why. `job_name` stays `prometheus` either way, so the `job` label doesn't change
# between captures.
scrape_configs:
  - job_name: prometheus
    # Prometheus 3.x rejects an unrecognized `Content-Type` unless a fallback is named ("received
    # unsupported Content-Type ... and no fallback_scrape_protocol specified"), and
    # `python3 -m http.server` serves the static target as `application/octet-stream`. The
    # self-scrape sends `text/plain; version=0.0.4`, so the fallback never applies there.
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ['@@SCRAPE_TARGET@@']

remote_write:
  # `prometheus_in`'s default receiver path, so the `.headers` sidecar records the path a
  # `prometheus_in` receiver answers on.
  - url: http://capture:9091/api/v1/write
    remote_timeout: 10s
    # 1.0 (`prometheus.WriteRequest`) or 2.0 (`io.prometheus.write.v2.Request`). Set on every run,
    # though 3.x defaults to 1.0, so the fixture records a choice rather than a default a later
    # release could move. 2.0 needs no feature flag on 3.x.
    #
    # 3.14.0 sends 2.0 series with empty inline `Metadata` (`type: UNSPECIFIED`) in this topology;
    # testdata/interop/prometheus/README.md records the finding and what was tried.
    protobuf_message: @@PROTOBUF_MESSAGE@@
    # The 1.0 sender ships `MetricMetadata` in separate requests on this ticker, which is why
    # `prometheus_in` has a `metadata_cache:` and what the `prometheus-v1-metadata` capture records.
    # 2.0 ignores this block. `send_interval` is 1s for the metadata capture and long enough to be
    # irrelevant for the others. Metadata isn't subject to `write_relabel_configs`, so the small
    # `max_samples_per_send` is what keeps a metadata request inside testdata/interop/README.md's
    # size budget.
    metadata_config:
      send: true
      send_interval: @@METADATA_SEND_INTERVAL@@
      max_samples_per_send: 10
    # One shard, one in-flight request, and a short deadline, so a fixture is the smallest
    # well-formed request a real sender produces. Prometheus requires `capacity` above
    # `max_samples_per_send`.
    queue_config:
      capacity: 500
      max_samples_per_send: 100
      batch_send_deadline: 1s
      min_shards: 1
      max_shards: 1
    # The size budget, enforced at the source. The sample captures keep four families, one per
    # classic metric type: gauge (`prometheus_build_info`), counter (`_total`), histogram
    # (`_bucket`/`_sum`/`_count`), and summary (`quantile` plus `_sum`/`_count`). Together they're
    # 26 series, so one scrape fits in one request. Relabel regexes are fully anchored. The
    # alternation lives in `record_prometheus`, since action and pattern change together.
    #
    # The metadata capture renders `action: drop` over `.*`, so it can put no samples on the wire
    # and every request it produces is a metadata request. The replay test asserts all three of its
    # captures are metadata-only, so the recipe can't depend on a race with the first sample batch.
    write_relabel_configs:
      - source_labels: [__name__]
        action: @@RELABEL_ACTION@@
        regex: "@@RELABEL_REGEX@@"
