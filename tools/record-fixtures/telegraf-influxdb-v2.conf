# Telegraf configuration for `script/record-fixtures influxdb`. Two outputs.influxdb_v2 sections
# write to the capture sink on the fixture network: the default gzip body, and an identity body.
[agent]
  interval = "5s"
  round_interval = false
  flush_interval = "5s"
  flush_jitter = "0s"
  collection_jitter = "0s"
  hostname = "telegraf-fixture"
  omit_hostname = false
  logfile = ""

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

# `uptime` is a number and `uptime_format` a string field.
[[inputs.system]]

[[inputs.file]]
  files = ["/etc/telegraf/lines.txt"]
  data_format = "influx"

[[outputs.influxdb_v2]]
  urls = ["http://capture:8086"]
  token = "00000000-0000-0000-0000-000000000000"
  organization = "fixture-org"
  bucket = "fixture-gzip"
  influx_uint_support = true

[[outputs.influxdb_v2]]
  urls = ["http://capture:8086"]
  token = "00000000-0000-0000-0000-000000000000"
  organization = "fixture-org"
  bucket = "fixture-identity"
  content_encoding = "identity"
  influx_uint_support = true
