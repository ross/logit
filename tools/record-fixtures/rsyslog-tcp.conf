# Minimal rsyslog config for script/record-fixtures's `rsyslog-tcp` producer: accept local
# `logger` traffic over the Unix domain socket rsyslog itself creates, and forward everything to
# the raw_capture.py listener (the "capture" container, on the shared Docker network) over TCP,
# unmodified -- no local file logging, no other modules, so the captured byte stream is exactly
# what rsyslog's own TCP forwarder puts on the wire.
#
# Deliberately `protocol="tcp"` with no `TCP_Framing` parameter set: rsyslog's `omfwd` default is
# RFC 6587 §3.4.2 non-transparent (LF-terminated) framing, *not* `TCP_Framing="octet-counted"`.
# That default is exactly what a stock rsyslog forwarder -- the kind `logit`'s auto-detecting TCP
# listener (`crates/logit-inputs/src/tcp.rs`'s `Framer`) has to interoperate with in practice --
# actually sends, so this fixture deliberately does not opt into octet-counting: it exercises the
# framing real deployments hit first, leaving octet-counted rsyslog as later, separate follow-on
# work (see `testdata/interop/syslog/README.md`).
global(workDirectory="/tmp/rsyslog-work")
module(load="imuxsock")
# Forward only the fixture producer's own message, not rsyslogd's own startup notice (also
# delivered over imuxsock) -- keeps the captured fixture to exactly the one message
# script/record-fixtures actually sent.
if $programname == 'logit-fixture' then {
    action(type="omfwd" target="capture" port="601" protocol="tcp")
}
