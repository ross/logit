# Minimal rsyslog config for script/record-fixtures's `rsyslog-tcp` producer: accept `logger`
# traffic on rsyslog's own Unix socket and forward it unmodified over TCP to the raw_capture.py
# listener (the "capture" container). No other modules, so the byte stream is what rsyslog's TCP
# forwarder puts on the wire.
#
# No `TCP_Framing` parameter: `omfwd`'s default is RFC 6587 §3.4.2 non-transparent
# (LF-terminated) framing, not octet-counted. That's what a stock forwarder sends, and what the
# auto-detecting `Framer` (crates/logit-inputs/src/tcp.rs) must handle first. Octet-counted
# rsyslog is follow-on work (testdata/interop/syslog/README.md).
global(workDirectory="/tmp/rsyslog-work")
module(load="imuxsock")
# Forward only the fixture message, not rsyslogd's startup notice, which also arrives over
# imuxsock.
if $programname == 'logit-fixture' then {
    action(type="omfwd" target="capture" port="601" protocol="tcp")
}
