# Minimal rsyslog config for script/record-fixtures's best-effort `rsyslog` producer: accept local
# `logger` traffic over the Unix domain socket rsyslog itself creates, and forward everything to
# the raw_capture.py listener (the "capture" container, on the shared Docker network) over UDP,
# unmodified -- no local file logging, no other modules, so the captured datagram is exactly what
# rsyslog's own RFC 3164 forwarder puts on the wire.
global(workDirectory="/tmp/rsyslog-work")
module(load="imuxsock")
# Forward only the fixture producer's own message, not rsyslogd's own startup notice (also
# delivered over imuxsock) -- keeps the captured fixture to exactly the one message
# script/record-fixtures actually sent.
if $programname == 'logit-fixture' then {
    action(type="omfwd" target="capture" port="5514" protocol="udp")
}
