# Minimal rsyslog config for script/record-fixtures's `rsyslog` producer: accept `logger` traffic
# on rsyslog's own Unix socket and forward it unmodified over UDP to the raw_capture.py listener
# (the "capture" container). No other modules, so the datagram is what rsyslog's RFC 3164
# forwarder puts on the wire.
global(workDirectory="/tmp/rsyslog-work")
module(load="imuxsock")
# Forward only the fixture message, not rsyslogd's startup notice, which also arrives over
# imuxsock.
if $programname == 'logit-fixture' then {
    action(type="omfwd" target="capture" port="5514" protocol="udp")
}
