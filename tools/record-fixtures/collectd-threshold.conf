# collectd config for script/record-fixtures's notification capture
# (`testdata/interop/collectd/collectd-notification-000.raw`): collectd.conf plus the `threshold`
# plugin. A separate file so the value-list capture never loads `threshold`, which would put a
# notification in `collectd-00{0,1,2}.raw` and break
# `interop_fixture_every_datagram_decodes_clean_with_the_expected_identity`.
#
# Everything through `<Plugin network>` matches collectd.conf; see its comments. Keep the two in
# sync by hand. There's no `Include`, so a diff between the files shows everything a notification
# capture adds.
#
# Mounted at /etc/collectd-fixture.conf and passed with `-C`, not over the package's
# /etc/collectd/collectd.conf, to avoid dpkg's conffile prompt (see
# docs/plans/recorded-interop-fixtures.md's "Findings worth recording" section).

Hostname "logit-fixture"
FQDNLookup false

Interval 1

LoadPlugin load
LoadPlugin memory
LoadPlugin interface
LoadPlugin network

# A `WarningMax` of 0.0 on `load`'s `shortterm` fires on the first read: the load average reflects
# the host kernel's load and is essentially never zero, so the first check dispatches a
# notification without waiting for a state change. `FailureMax` too, so a rerun that reads a load
# over it still produces a (FAILURE rather than WARNING) notification.
LoadPlugin threshold

<Plugin threshold>
  <Plugin "load">
    <Type "load">
      DataSource "shortterm"
      WarningMax 0.0
      FailureMax 0.0
    </Type>
  </Plugin>
</Plugin>

<Plugin network>
  # "capture" is the raw_capture.py container's name on script/record-fixtures's Docker network;
  # 25826 is collectd's default port (logit_proto::collectd::DEFAULT_PORT).
  Server "capture" "25826"
</Plugin>
