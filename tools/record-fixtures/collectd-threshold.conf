# collectd config for script/record-fixtures's second `collectd` capture (W5's notification
# fixture, `testdata/interop/collectd/collectd-notification-000.raw`) -- a copy of `collectd.conf`
# plus the `threshold` plugin, kept as its own file rather than a shared one so the plain
# value-list capture (`collectd-00{0,1,2}.raw`) never loads `threshold` too. `record_collectd`'s
# own comment in `script/record-fixtures` has the full reasoning: both `docker run`s are
# sequential, not concurrent, but they share nothing else, and mounting the same conf for both
# would make `threshold` fire on the *first* capture's very first read as well, mixing a
# notification into what's supposed to be three pure value-list datagrams and breaking
# `interop_fixture_every_datagram_decodes_clean_with_the_expected_identity`'s assumptions.
#
# Everything through `<Plugin network>` is identical to `collectd.conf` -- see that file's own
# comments for why each setting is what it is. Keep the two in sync by hand if either changes;
# there is no `Include` directive used here on purpose, so a diff between the two files is the
# whole story of what a notification capture needs beyond a value-list one.
#
# Mounted at /etc/collectd-fixture.conf and passed with `-C`, *not* over the package's own
# /etc/collectd/collectd.conf: mounting over a package conffile makes `apt-get install` block on an
# interactive dpkg prompt with no stdin attached -- the finding recorded in
# docs/plans/recorded-interop-fixtures.md for the rsyslog producer, which applies verbatim here.

Hostname "logit-fixture"
FQDNLookup false

Interval 1

LoadPlugin load
LoadPlugin memory
LoadPlugin interface
LoadPlugin network

# `threshold` -- the plugin this capture exists for. A `WarningMax` of `0.0` on `load`'s
# `shortterm` data source fires on the very first read: a real load average is essentially never
# exactly zero, even on an idle container (it reflects the *host* kernel's own load), so the
# threshold plugin's very first check finds the value already over the limit and dispatches one
# notification immediately -- no need to wait for a state change over multiple intervals.
# `FailureMax` too, so a rerun that happens to read a load average overshooting it still produces a
# (FAILURE, not WARNING) notification rather than none at all.
LoadPlugin threshold

<Plugin threshold>
  <Plugin "load">
    <Type "load">
      DataSource "shortterm"
      WarningMax 0.0
      FailureMax 0.0
    </Type>
  </Plugin>
</Plugin>

<Plugin network>
  # "capture" is the raw_capture.py container's name on script/record-fixtures's own Docker
  # network; 25826 is collectd's default port (logit_proto::collectd::DEFAULT_PORT).
  Server "capture" "25826"
</Plugin>
