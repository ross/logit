# Minimal collectd config for script/record-fixtures's `collectd` producer: read three stock
# plugins once a second and forward every value list to the raw_capture.py listener (the "capture"
# container) over collectd's binary network protocol, so the captured datagrams are what the
# `network` plugin puts on the wire.
#
# Not used by the notification capture: collectd-threshold.conf adds `threshold`, which fires on
# the first read and would mix a notification into `collectd-00{0,1,2}.raw` if loaded here.
#
# Mounted at /etc/collectd-fixture.conf and passed with `-C`, not over the package's
# /etc/collectd/collectd.conf, to avoid dpkg's conffile prompt (see
# docs/plans/recorded-interop-fixtures.md's "Findings worth recording" section).

# A fixed host name, so the `interop_fixture_*` tests (crates/logit-inputs/src/collectd.rs) can
# assert on `collectd.host` instead of a container id. FQDNLookup off for the same reason, and
# because a reverse lookup in a throwaway container only adds delay.
Hostname "logit-fixture"
FQDNLookup false

# One second, so a capture finishes in seconds: the `network` plugin sends a datagram only when its
# buffer fills (MaxPacketSize 1452) or at shutdown, so the read interval sets the pace. Every
# captured list carries it, and the tests assert `collectd.interval == 1.0`.
Interval 1

# Three read plugins, chosen for the wire shapes they produce:
#   load      -- one 3-data-source GAUGE list (shortterm/midterm/longterm), the multi-data-source
#                case, and the one types.db renames from `load.load.{0,1,2}` to
#                `load.load.{shortterm,midterm,longterm}`
#   memory    -- several single-data-source GAUGE lists differing only in type_instance, which is
#                the sender-side identity elision the codec has to get right
#   interface -- 2-data-source DERIVE lists (if_octets/if_packets/if_errors/if_dropped) with a
#                plugin_instance (the interface name): the other data-source kind and the other
#                identity field
# No `syslog`/`logfile` plugin: with neither loaded collectd logs to stderr, which `docker logs`
# picks up.
LoadPlugin load
LoadPlugin memory
LoadPlugin interface
LoadPlugin network

<Plugin network>
  # "capture" is the raw_capture.py container's name on script/record-fixtures's Docker network;
  # 25826 is collectd's default port (logit_proto::collectd::DEFAULT_PORT).
  Server "capture" "25826"
</Plugin>
