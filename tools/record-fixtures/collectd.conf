# Minimal collectd config for script/record-fixtures's `collectd` producer: read three stock
# plugins once a second and forward every value list -- plus, since the `threshold` plugin below,
# one notification -- to the raw_capture.py listener (the "capture" container, on the shared
# Docker network) over collectd's own binary network protocol, so the captured datagrams are
# exactly what collectd's `network` plugin puts on the wire.
#
# Mounted at /etc/collectd-fixture.conf and passed with `-C`, *not* over the package's own
# /etc/collectd/collectd.conf: mounting over a package conffile makes `apt-get install` block on an
# interactive dpkg prompt with no stdin attached -- the finding recorded in
# docs/plans/recorded-interop-fixtures.md for the rsyslog producer, which applies verbatim here.

# A fixed, recognisable host name, so the consuming tests
# (crates/logit-inputs/src/collectd.rs's `interop_fixture_*`) can assert on `collectd.host` instead
# of on whatever random container id Docker happened to hand out. FQDNLookup off for the same
# reason -- and because a reverse lookup inside a throwaway container is a guaranteed delay, not a
# guaranteed answer.
Hostname "logit-fixture"
FQDNLookup false

# One second, so a capture finishes in seconds rather than minutes: collectd's `network` plugin
# buffers value lists and only puts a datagram on the wire once the buffer is full (default
# MaxPacketSize 1452) or at shutdown, so the read interval is what sets the capture's pace. It is
# also what every captured list's Interval/IntervalHR part carries -- the consuming tests assert
# `collectd.interval == 1.0`.
Interval 1

# Three read plugins, chosen for the wire shapes they produce rather than for coverage of collectd:
#   load      -- one 3-data-source GAUGE list (shortterm/midterm/longterm), the multi-data-source
#                case, and the one types.db renames from `load.load.{0,1,2}` to
#                `load.load.{shortterm,midterm,longterm}`
#   memory    -- several single-data-source GAUGE lists differing only in type_instance, which is
#                exactly the sender-side identity elision this codec has to get right
#   interface -- 2-data-source DERIVE lists (if_octets/if_packets/if_errors/if_dropped) with a
#                plugin_instance (the interface name), i.e. the other data-source kind and the
#                other identity field
# No `syslog`/`logfile` plugin: collectd logs to stderr with neither loaded, which `docker logs`
# picks up anyway, and neither one puts anything on the wire this corpus is about.
LoadPlugin load
LoadPlugin memory
LoadPlugin interface
LoadPlugin network

# `threshold` -- W5's notification fixture (`record_collectd`'s second capture,
# `testdata/interop/collectd/collectd-notification-000.raw`). A `WarningMax` of `0.0` on `load`'s
# `shortterm` data source fires on the very first read: a real load average is essentially never
# exactly zero, even on an idle container (it reflects the *host* kernel's own load, which this
# session's other work keeps above zero anyway), so the threshold plugin's very first check finds
# the value already over the limit and dispatches one WARNING notification immediately -- no need
# to wait for a state change over multiple intervals. `FailureMax` too, so a future rerun that
# somehow reads a load average that overshoots it still produces a (FAILURE, not WARNING)
# notification rather than none at all. Deliberately *not* used by the plain `collectd` capture
# above -- see `record_collectd`'s own comment for why the two captures run as separate,
# sequential `docker run`s against separate listeners rather than sharing one capture window.
LoadPlugin threshold

<Plugin threshold>
  <Plugin "load">
    <Type "load">
      DataSource "shortterm"
      WarningMax 0.0
      FailureMax 0.0
    </Type>
  </Plugin>
</Plugin>

<Plugin network>
  # "capture" is the raw_capture.py container's name on script/record-fixtures's own Docker
  # network; 25826 is collectd's default port (logit_proto::collectd::DEFAULT_PORT).
  Server "capture" "25826"
</Plugin>
