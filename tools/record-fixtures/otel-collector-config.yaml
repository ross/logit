# Collector config for script/record-fixtures's `otlp` producer.
#
# Receives OTLP (gRPC and HTTP, protobuf) from `telemetrygen`, an SDK-backed sender, and
# re-exports each signal through the `file` exporter's default JSON marshaler.
#
# That JSON is the fixture, not a raw byte capture: pdata's marshaler is the normative OTLP/JSON
# implementation, and the result doesn't depend on the sender's transport or encoding. See
# testdata/interop/otlp/README.md.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file/traces:
    path: /output/traces.json
  file/logs:
    path: /output/logs.json
  file/metrics:
    path: /output/metrics.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
