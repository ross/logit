# Minimal collectd config for script/record-fixtures's `graphite` producer: read the same three
# stock plugins as `collectd.conf` once a second, but forward every value list through collectd's
# `write_graphite` plugin -- real carbon plaintext lines, `path value timestamp\n` -- to the
# raw_capture.py listener (the "capture" container) over TCP port 2003
# (`logit_proto::graphite::DEFAULT_PLAINTEXT_PORT`), instead of `collectd.conf`'s own binary
# `network` protocol. See `collectd.conf`'s own comments for why `load`/`memory`/`interface` are
# the three read plugins and why `Hostname "logit-fixture"` / `Interval 1` are fixed -- identical
# reasoning applies here, just aimed at a different output plugin.
#
# Mounted at /etc/collectd-fixture.conf and passed with `-C`, *not* over the package's own
# /etc/collectd/collectd.conf: mounting over a package conffile makes `apt-get install` block on an
# interactive dpkg prompt with no stdin attached (the finding recorded in
# docs/plans/recorded-interop-fixtures.md for the rsyslog producer, which applies verbatim here).

Hostname "logit-fixture"
FQDNLookup false

Interval 1

LoadPlugin load
LoadPlugin memory
LoadPlugin interface
LoadPlugin write_graphite

<Plugin write_graphite>
  <Node "capture">
    # "capture" is the raw_capture.py container's name on script/record-fixtures's own Docker
    # network; 2003 is carbon's own plaintext port (logit_proto::graphite::DEFAULT_PLAINTEXT_PORT).
    Host "capture"
    Port "2003"
    Protocol "tcp"
    LogSendErrors true
    # No prefix/postfix: the recorded path should be exactly what collectd's own naming produces
    # (`<host>.<plugin>...`), not this fixture's invention.
    Prefix ""
    # Rates, not this codec's business either way -- StoreRates only changes whether a
    # DERIVE/COUNTER value is divided by the interval before it hits the wire, which the consuming
    # test does not depend on (it only asserts a decoded path prefix and that every kind is a
    # Gauge, per graphite's own one-number-per-datapoint wire).
    StoreRates false
    AlwaysAppendDS false
    EscapeCharacter "_"
  </Node>
</Plugin>
