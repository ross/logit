# Minimal collectd config for script/record-fixtures's `graphite` producer: collectd.conf's three
# read plugins, host name, and interval (see its comments), but output through `write_graphite`:
# carbon plaintext lines, `path value timestamp\r\n`, to the raw_capture.py listener over TCP port
# 2003 (`logit_proto::graphite::DEFAULT_PLAINTEXT_PORT`).
#
# Mounted at /etc/collectd-fixture.conf and passed with `-C`, not over the package's
# /etc/collectd/collectd.conf, to avoid dpkg's conffile prompt (see
# docs/plans/recorded-interop-fixtures.md's "Findings worth recording" section).

Hostname "logit-fixture"
FQDNLookup false

Interval 1

LoadPlugin load
LoadPlugin memory
LoadPlugin interface
LoadPlugin write_graphite

<Plugin write_graphite>
  <Node "capture">
    # "capture" is the raw_capture.py container's name on script/record-fixtures's Docker network;
    # 2003 is carbon's plaintext port (logit_proto::graphite::DEFAULT_PLAINTEXT_PORT).
    Host "capture"
    Port "2003"
    Protocol "tcp"
    LogSendErrors true
    # No prefix: the recorded path is collectd's own naming (`<host>.<plugin>...`).
    Prefix ""
    # StoreRates only decides whether a DERIVE/COUNTER value is divided by the interval; the test
    # asserts a path prefix and that every kind is a Gauge, so it doesn't depend on this.
    StoreRates false
    AlwaysAppendDS false
    EscapeCharacter "_"
  </Node>
</Plugin>
