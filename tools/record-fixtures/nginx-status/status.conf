# The one config every nginx-family server in `script/record-fixtures nginx-status` runs: a
# `stub_status` location on port 8080 and nothing else. Passed with `-c`, so the image's own
# config is ignored.
worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    server {
        listen 8080;

        location = /nginx_status {
            stub_status;
        }
    }
}
