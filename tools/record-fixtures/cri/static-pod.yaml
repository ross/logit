# Copied into the node's /etc/kubernetes/manifests: the kubelet runs it as a static pod, so its log
# directory carries the kubelet's manifest hash where a regular pod has an API uid.
apiVersion: v1
kind: Pod
metadata:
  name: static-hello
  namespace: cri-fixture
spec:
  containers:
    - name: hello
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "echo static hello; echo static stderr >&2; sleep 3600"]
