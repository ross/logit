# The one config every httpd in `script/record-fixtures apache-status` runs: `mod_status` on
# port 8080 and nothing else, with each variant chosen by an `httpd -D` name. Passed with `-f`,
# so the image's own config is ignored.
#   PREFORK, WORKER  load that MPM instead of `event`
#   EXT_OFF          `ExtendedStatus Off`
#   SSL              `mod_ssl` on port 8443 with an `shmcb` session cache, whose block
#                    `mod_status` appends after `Scoreboard`
ServerRoot "/usr/local/apache2"
Listen 8080

<IfDefine PREFORK>
    LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
</IfDefine>
<IfDefine WORKER>
    LoadModule mpm_worker_module modules/mod_mpm_worker.so
</IfDefine>
<IfDefine !PREFORK>
    <IfDefine !WORKER>
        LoadModule mpm_event_module modules/mod_mpm_event.so
    </IfDefine>
</IfDefine>
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so

User www-data
Group www-data
ServerName status-server
ErrorLog /proc/self/fd/2
LogLevel warn

<IfDefine EXT_OFF>
    ExtendedStatus Off
</IfDefine>

<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>

<IfDefine SSL>
    LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
    LoadModule ssl_module modules/mod_ssl.so
    Listen 8443
    SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
    <VirtualHost *:8443>
        SSLEngine on
        SSLCertificateFile /tmp/server.crt
        SSLCertificateKeyFile /tmp/server.key
    </VirtualHost>
</IfDefine>
