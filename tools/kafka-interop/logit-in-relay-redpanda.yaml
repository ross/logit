    sources: [in_json_event, in_json_batch, in_msgpack_event, in_msgpack_batch, in_native_event, in_native_batch, in_text_event, in_text_batch, in_otlp_proto_none, in_otlp_proto_gzip, in_otlp_proto_snappy, in_otlp_proto_lz4, in_otlp_proto_zstd, in_otlp_json_none, in_otlp_json_gzip, in_otlp_json_snappy, in_otlp_json_lz4, in_otlp_json_zstd]
    target: /out/consume-relay-redpanda.jsonl
