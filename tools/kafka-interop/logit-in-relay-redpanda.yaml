# The relay legs of `script/kafka-interop` against Redpanda: `kafka_out` writes one set of events in
# every format, `record:` mode, and codec, each to its own topic, and `kafka_in` reads every topic
# back. check.py compares what each `kafka_in` read, carriers removed, with what the generators
# wrote to `relay-redpanda-sent.jsonl` and `relay-redpanda-text-sent.jsonl`.
#
#   relay-<format>-<record>-<codec>         json, msgpack, native, and text, under both `record:`
#                                           modes and all five codecs: 40 topics
#   relay-<otlp format>-<codec>-<signal>    otlp_proto and otlp_json under all five codecs, one
#                                           topic per signal: 30 topics
#
# `mint` makes, per tick, a metrics event with five kinds, a log, and a span, with attributes of
# several value types; `text` carries a log body and nothing else, so its own generator makes
# body-only logs. Every sink drops its oldest batch rather than stall the others, so a drop shows as
# a missing event.
admin: { bind: 127.0.0.1:9600 }

components:
  load:
    type: generate_in
    count: 40
    rate: 20
    batch: 10
    resource:
      service.name: kafka-interop-relay
    event:
      attributes: { seq: "{seq}" }

  mint:
    type: lua
    sources: [load]
    script: |
      function process(event)
        local s = tonumber(event.attributes.seq)
        local ts = event.timestamp
        local trace_id = "b2" .. string.format("%030x", s % 8)
        local span_id = string.format("%016x", s + 1)
        local attributes = {seq = s, ratio = s / 4, ok = s % 2 == 0, tags = {"a", "b"},
                            nested = {k = "v", n = s}}
        local metrics = Event.new{
          timestamp = ts,
          attributes = attributes,
          metrics = {
            {name = "relay_delta_sum", kind = "sum", value = 1, temporality = "delta"},
            {name = "relay_cumulative_sum", kind = "sum", value = s + 1,
             temporality = "cumulative"},
            {name = "relay_gauge", kind = "gauge", value = s * 0.5, unit = "By",
             description = "a gauge"},
            {name = "relay_hist", kind = "histogram", temporality = "delta", sum = 10 + s,
             buckets = {{bound = 1, count = 1}, {bound = 5, count = s % 3},
                        {bound = math.huge, count = 2}}},
            {name = "relay_exphist", kind = "exponential_histogram", scale = 0, zero_count = 1,
             count = 4, zero_threshold = 0, sum = 7, temporality = "delta",
             positive = {offset = 0, counts = {1, 2}}, negative = {offset = 0, counts = {}}},
          },
        }
        local log = Event.new{timestamp = ts, attributes = attributes,
          log = {message = "relay log " .. s, severity = "warn", trace_id = trace_id,
                 span_id = span_id}}
        local span = Event.new{
          timestamp = ts,
          attributes = attributes,
          span = {
            trace_id = trace_id, span_id = span_id, name = "relay-span-" .. s, kind = "client",
            status = (s % 5 == 0) and "error" or "ok",
            status_message = (s % 5 == 0) and "boom" or nil,
            end_timestamp = ts, events = {{timestamp = ts, name = "retry"}},
          },
        }
        return {metrics, log, span}
      end

  sent:
    type: stdio_out
    sources: [mint]
    target: /out/relay-redpanda-sent.jsonl
    format: json

  load_text:
    type: generate_in
    count: 40
    rate: 20
    batch: 10
    event:
      log: "relay text {seq} \\ é\nsecond line"

  sent_text:
    type: stdio_out
    sources: [load_text]
    target: /out/relay-redpanda-text-sent.jsonl
    format: json

  out_json_event_none:
    type: kafka_out
    sources: [mint]
    brokers: ["redpanda:9092"]
    topic: relay-json-event-none
    format: json
    record: event
    compression: none
    buffer: { overflow: drop_oldest }
  out_json_event_gzip:
    type: kafka_out
    sources: [mint]
    brokers: ["redpanda:9092"]
    topic: relay-json-event-gzip
    format: json
    record: event
    compression: gzip
    buffer: { overflow: drop_oldest }
  out_json_event_snappy:
    type: kafka_out
    sources: [mint]
    brokers: ["redpanda:9092"]
    topic: relay-json-event-snappy
    format: json
    record: event
    compression: snappy
    buffer: { overflow: drop_oldest }
  out_json_event_lz4:
