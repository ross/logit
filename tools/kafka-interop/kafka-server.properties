# The single-node KRaft broker `script/kafka-interop` runs (compose.yaml's `kafka` service), the
# `apache/kafka:4.2.0` that testdata/interop/kafka/README.md records. compose.yaml starts it with
# `kafka-server-start.sh` on this file, bypassing the image's environment-to-properties scripts,
# so every setting the run depends on is here.
#
# Three client listeners on one broker, all advertised as `kafka`, the name the run's
# certificate carries:
#
#   PLAINTEXT  :9092  every leg but TLS, and every read-back
#   TLS        :9093  server TLS from the run's private CA
#   MTLS       :9094  the same, and a client certificate from that CA is required
#   SASLP      :9096  SASL_PLAINTEXT: PLAIN, SCRAM-SHA-256, and SCRAM-SHA-512
#   SASLS      :9097  SASL_SSL: the same three mechanisms over server TLS
#
# The SASL user is `logit` with the password `logit-secret`, a throwaway for this stack. PLAIN's
# comes from the JAAS entries below, SCRAM's from compose.yaml's `kafka-storage.sh format
# --add-scram`. The controller and inter-broker listeners stay unauthenticated.
#
# The certificates are generated at run time into the run directory, mounted at /tls.
# `log.message.timestamp.after.max.ms` stays at its 4.x default, one hour, which the timestamp
# leg relies on.

node.id=1
process.roles=broker,controller
controller.quorum.voters=1@localhost:9095
controller.listener.names=CONTROLLER

listeners=PLAINTEXT://:9092,TLS://:9093,MTLS://:9094,SASLP://:9096,SASLS://:9097,CONTROLLER://localhost:9095
advertised.listeners=PLAINTEXT://kafka:9092,TLS://kafka:9093,MTLS://kafka:9094,SASLP://kafka:9096,SASLS://kafka:9097
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,TLS:SSL,MTLS:SSL,SASLP:SASL_PLAINTEXT,SASLS:SASL_SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# PEM files, so no keystore tooling is needed. The keystore file holds the broker's PKCS#8 key
# and its certificate.
listener.name.tls.ssl.keystore.type=PEM
listener.name.tls.ssl.keystore.location=/tls/broker-keystore.pem
listener.name.mtls.ssl.keystore.type=PEM
listener.name.mtls.ssl.keystore.location=/tls/broker-keystore.pem
listener.name.mtls.ssl.truststore.type=PEM
listener.name.mtls.ssl.truststore.location=/tls/ca.pem
listener.name.mtls.ssl.client.auth=required
listener.name.sasls.ssl.keystore.type=PEM
listener.name.sasls.ssl.keystore.location=/tls/broker-keystore.pem

sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512

listener.name.saslp.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_logit="logit-secret";
listener.name.saslp.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.saslp.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasls.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_logit="logit-secret";
listener.name.sasls.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasls.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

log.dirs=/tmp/kraft-combined-logs
num.partitions=1
auto.create.topics.enable=true
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
