# The broker-restart leg of `script/kafka-interop` against Redpanda: a `kafka_in` member of the
# group `consume-restart` reading the 3-partition `restart` topic, which
# `logit-in-restart-produce-redpanda.yaml` writes 300 records to, 5 a second. It runs after the
# other legs have stopped. The script restarts the broker 20 s in, with this member reading; then
# stops this member, which commits and leaves the group, restarts the broker again, and starts this
# member once more, which must resume each partition from the commit that outlived both restarts.
# check.py judges that every record was read, that no offset was read twice beyond a commit
# interval, and that `start:` was used once per partition only, at the first join.
admin: { bind: 127.0.0.1:9600 }

components:
  member:
    type: kafka_in
    brokers: ["redpanda:9092"]
    topics: [restart]
    group: consume-restart
    format: json
    start: earliest

  read:
    type: stdio_out
    sources: [member]
    target: /out/consume-restart-redpanda.jsonl
    format: json

  self: { type: internal, interval: 1s, span_sample_rate: 0.0, logs: off }
  telemetry:
    type: stdio_out
    sources: [self]
    target: /out/in-restart-redpanda-telemetry.log
    format: json
