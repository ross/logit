      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z

  logit-sasl-kafka:
    <<: *logit
    volumes:
      - ./logit-sasl-kafka.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z

  logit-sasl-redpanda:
    <<: *logit
    volumes:
      - ./logit-sasl-redpanda.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z

  logit-timestamp-kafka:
    <<: *logit
    volumes:
      - ./logit-timestamp-kafka.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z

  logit-timestamp-redpanda:
    <<: *logit
    volumes:
      - ./logit-timestamp-redpanda.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z

  # The OAUTHBEARER legs run in `oauth`'s network namespace, so their token endpoint is
  # `http://127.0.0.1`, which `token_endpoint` allows over plain HTTP; a token endpoint on
  # another host must be `https://`. Broker names still resolve through `oauth`'s network.
  logit-oauth-kafka:
    <<: *logit
    network_mode: service:oauth
    depends_on:
      oauth: { condition: service_started }
      kafka: { condition: service_healthy }
    environment:
      KAFKA_INTEROP_OAUTH_TOKEN: ${KAFKA_INTEROP_OAUTH_TOKEN:-unset}
    volumes:
      - ./logit-oauth-kafka.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z

  logit-oauth-redpanda:
    <<: *logit
    network_mode: service:oauth
    depends_on:
      oauth: { condition: service_started }
      redpanda: { condition: service_healthy }
    environment:
      KAFKA_INTEROP_OAUTH_TOKEN: ${KAFKA_INTEROP_OAUTH_TOKEN:-unset}
    volumes:
      - ./logit-oauth-redpanda.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z

  logit-otlp-kafka:
    <<: *logit
    volumes:
      - ./logit-otlp-kafka.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z
