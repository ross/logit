  # One Collector per broker, reading the topics `logit-otlp-*` writes. It writes what it decoded
  # to the run directory's `collector/<broker>/` and, for the `keyed` traces, re-keys them into
  # `exporter-*` topics with its own `kafka` exporter. The image has no shell, so there's no
  # healthcheck; the script stops it with the legs.
  collector-kafka:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      BROKER: kafka
    command: ["--config=/etc/collector.yaml"]
    volumes:
      - ./collector.yaml:/etc/collector.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/collector/kafka:/out:z

  collector-redpanda:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    restart: "no"
    depends_on:
      redpanda: { condition: service_healthy }
    environment:
      BROKER: redpanda
    command: ["--config=/etc/collector.yaml"]
    volumes:
