# The stack `script/kafka-interop` drives: Apache Kafka (KRaft) and Redpanda, each with a plain,
# a TLS, a mutual-TLS, a SASL_PLAINTEXT, and a SASL_SSL listener (and on Kafka an OAUTHBEARER
# one), an OAuth 2.0 token server, one `logit` per leg per broker from the release image, and
# one OpenTelemetry Collector per broker that reads the OTLP legs' topics. See README.md here, "What it runs", for what each leg proves.
#
# `script/kafka-interop` runs this under the compose project `kafka-interop` with an
# `--env-file` it writes, which sets:
#
#   KAFKA_INTEROP_OUT    the host run directory: /out in every `logit` service, its `tls/` at
#                        /tls in every service, and its `redpanda/` at /etc/redpanda
#   KAFKA_INTEROP_IMAGE  the `logit` release image tag
#   KAFKA_INTEROP_OAUTH_TOKEN  a token from `oauth`, fetched before the legs start, for the
#                        OAUTHBEARER legs' fixed-token sinks
#
# The script starts the brokers first, then every `logit-*` service by name, so `up` with no
# service names isn't how this file is run. Nothing binds a host port: the read-back runs inside
# the `kafka` container and in kcat containers on this network. No `container_name`, so a second
# stack under another project name can't collide with this one.

name: kafka-interop

networks:
  default:
    name: kafka-interop-net

x-logit: &logit
  image: ${KAFKA_INTEROP_IMAGE:-logit:kafka-interop}
  depends_on:
    kafka: { condition: service_healthy }
    redpanda: { condition: service_healthy }
  # The script stops each leg once its window has passed; nothing restarts one.
  restart: "no"
  entrypoint: ["logit", "run", "/config.yaml"]
  command: []

services:
  # The OAuth 2.0 server the OAUTHBEARER legs fetch tokens from and both brokers validate them
  # against. Every client-credentials token it issues names the subject `logit`, the audience
  # `kafka-interop`, and the issuer `http://oauth/default`, whichever host it was asked on,
  # and lives 45 s. It takes any client id and secret. It listens on port 80 because Redpanda
  # v26.2.3 drops the port of the discovery document's `jwks_uri` and fetches the JWKS from :80.
  # At `DEBUG` it logs each token request's body (and masks its `Authorization`), which is how
  # check.py counts the tokens each `oauth_cc` sink fetched, told apart by their `scope`.
  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2@sha256:b538810afd589d42fbfb856c588c2065eaeed1dc528d6c532972048e67fc2aff
    hostname: oauth
    environment:
      SERVER_PORT: "80"
      LOG_LEVEL: DEBUG
      JSON_CONFIG: >-
        {"tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 45, "requestMappings": [
        {"requestParam": "grant_type", "match": "client_credentials", "claims": {"sub": "logit",
        "aud": ["kafka-interop"], "iss": "http://oauth/default"}}]}]}

  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    depends_on:
      oauth: { condition: service_started }
    environment:
      # Any base64 UUID; the broker's log directory lives and dies with the container.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Kafka 4.x fetches no OAuth URL this system property doesn't list.
      KAFKA_OPTS: -Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=http://oauth/default/jwks
    volumes:
      - ./kafka-server.properties:/interop/server.properties:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z
    # The image's own startup maps environment variables onto server.properties; this file sets
    # everything, so format the log directory and start the broker on it directly.
    entrypoint:
      - bash
      - -c
      - >-
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t "$${CLUSTER_ID}"
        -c /interop/server.properties
        --add-scram 'SCRAM-SHA-256=[name=logit,password=logit-secret]'
        --add-scram 'SCRAM-SHA-512=[name=logit,password=logit-secret]' >/dev/null
        && exec /opt/kafka/bin/kafka-server-start.sh /interop/server.properties
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 30s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    hostname: redpanda
    # rpk rewrites redpanda.yaml on start and chowns its new copy to the old file's owner, the
    # host user who ran the script, which only root may do.
    user: "0:0"
    volumes:
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/redpanda:/etc/redpanda:z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 5s
      timeout: 15s
      retries: 30

  logit-parity-kafka:
    <<: *logit
    volumes:
      - ./logit-parity-kafka.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z

  logit-parity-redpanda:
    <<: *logit
    volumes:
      - ./logit-parity-redpanda.yaml:/config.yaml:ro,z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}:/out:z
      - ${KAFKA_INTEROP_OUT:?set by script/kafka-interop}/tls:/tls:ro,z

  logit-codecs-kafka:
