# Leg `hec-logs` of `script/splunk-interop`: structured logs through `splunk_hec_out` into Splunk's
# `main` index on the default token, no acknowledgment.
#
# A `lua` stage mints one warn-level log per tick with `Event.new`, carrying a trace reference and
# a nested attribute, so the harness can find the severity fields, `trace_id`, and the flattened
# `detail.*` keys as indexed fields. `set` stamps the envelope carriers onto the resource.
#
# `internal` taps the sink's own telemetry into /out/hec-logs-telemetry.log, where the harness
# counts what Splunk answered and what the sink dropped.
#
# The sink's `endpoint`, `token`, and `tls` come from `SPLUNK_INTEROP_HEC_URL`,
# `SPLUNK_INTEROP_HEC_TOKEN`, and `SPLUNK_INTEROP_HEC_INSECURE` (compose.yaml's `x-logit`), so the
# leg runs unchanged against the local Splunk or a Splunk Cloud stack.
admin:
  bind: 127.0.0.1:9600

components:
  tick:
    type: generate_in
    rate: 1
    batch: 1

  mint:
    type: lua
    sources: [tick]
    script: |
      local n = 0

      function process(event)
        n = n + 1
        return Event.new{
          timestamp = event.timestamp,
          attributes = {leg = "hec-logs", n = n, detail = {stage = "mint", ok = true}},
          log = {
            message = "splunk-interop hec-logs line " .. n,
            severity = "warn",
            trace_id = "0af7651916cd43dd8448eb211c80319c",
            span_id = "b7ad6b7169203331",
          },
        }
      end

  envelope:
    type: set
    sources: [mint]
    resource:
      com.splunk.index: main
      com.splunk.sourcetype: logit:test
      com.splunk.source: splunk-interop
      host.name: splunk-interop-logit

  splunk:
    type: splunk_hec_out
    sources: [envelope]
    endpoint: !env SPLUNK_INTEROP_HEC_URL
    token: !env SPLUNK_INTEROP_HEC_TOKEN
    tls:
      insecure_skip_verify: !env SPLUNK_INTEROP_HEC_INSECURE

  self:
    type: internal
    interval: 5s
    span_sample_rate: 0.0
    logs: off

  sink_telemetry:
    type: has_attributes
    sources: [self]
    attributes:
      component: splunk

  telemetry:
    type: stdio_out
    sources: [sink_telemetry]
    target: /out/hec-logs-telemetry.log
