# Leg `hec-ack` of `script/splunk-interop`: the `hec-logs` leg on the `ack` token (`useACK=1`)
# with `ack: true`, so every request carries a channel and is polled on `/services/collector/ack`
# until Splunk confirms it.
#
# `internal` taps the sink's own telemetry into /out/ack-telemetry.log, where the harness counts
# `logit.output.acks` by `result`.
#
# The sink's `endpoint`, `token`, and `tls` come from `SPLUNK_INTEROP_HEC_URL`,
# `SPLUNK_INTEROP_ACK_TOKEN`, and `SPLUNK_INTEROP_HEC_INSECURE` (compose.yaml's `x-logit`), so the
# leg runs unchanged against the local Splunk or a Splunk Cloud stack.
admin:
  bind: 127.0.0.1:9600

components:
  tick:
    type: generate_in
    rate: 1
    batch: 1

  mint:
    type: lua
    sources: [tick]
    script: |
      local n = 0

      function process(event)
        n = n + 1
        return Event.new{
          timestamp = event.timestamp,
          attributes = {leg = "hec-ack", n = n},
          log = {message = "splunk-interop hec-ack line " .. n, severity = "info"},
        }
      end

  envelope:
    type: set
    sources: [mint]
    resource:
      com.splunk.index: main
      com.splunk.sourcetype: logit:ack
      com.splunk.source: splunk-interop
      host.name: splunk-interop-logit

  splunk:
    type: splunk_hec_out
    sources: [envelope]
    endpoint: !env SPLUNK_INTEROP_HEC_URL
    token: !env SPLUNK_INTEROP_ACK_TOKEN
    tls:
      insecure_skip_verify: !env SPLUNK_INTEROP_HEC_INSECURE
    ack: true
    ack_timeout: 60s

  self:
    type: internal
    interval: 5s
    span_sample_rate: 0.0
    logs: off

  sink_telemetry:
    type: has_attributes
    sources: [self]
    attributes:
      component: splunk

  telemetry:
    type: stdio_out
    sources: [sink_telemetry]
    target: /out/ack-telemetry.log
