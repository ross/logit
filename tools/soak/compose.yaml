# The stack `script/soak` drives for one scenario: VictoriaMetrics, the `logit` under test, and a
# second `logit` as the load source. See README.md here and docs/plans/soak-harness.md's "Compose".
#
# The driver runs this under the compose project `soak-<scenario>` with an `--env-file` it writes
# into the run directory, which sets:
#
#   SOAK_IMAGE             the `logit` release image tag (`logit:soak`)
#   SOAK_SUT_CONFIG        absolute path of the scenario's `logit` config for the service `logit`
#   SOAK_GENERATOR_CONFIG  absolute path of the scenario's config for the service `generator`
#
# A scenario with an external target (`[target] kind = "external"`) gets a second `--env-file`,
# `SOAK_EXTERNAL_ENV` (perf/results/soak-external.env by default), holding the variables its
# `[target] env` lists. The `logit` service's `environment:` passes each variable scenario.py's
# `EXTERNAL_ENV_PASSED` names, empty when unset.
#
# `victoria-metrics` is in the `local` profile, which the driver enables for a local-target
# scenario only, so an external target's stack runs without it.
#
# No `container_name` and no `name:`, so a second scenario under another project can't collide
# with this one. The one published port is VictoriaMetrics on an ephemeral loopback port, which
# the driver reads with `compose port` after every start of that service.

x-logit: &logit
  image: ${SOAK_IMAGE:-logit:soak}
  # A crash must stay observable: nothing restarts a container but the driver's own steps.
  restart: "no"
  # Rotated so an hours-long run bounds the daemon's disk: at the observed 6.4 KB/s of
  # telemetry a 20 MB file lasts about 50 minutes, so the four full files a rotation keeps hold
  # about 3.5 hours, and the driver captures a chunk every 5 minutes. tools/soak/README.md's
  # "Long runs" has the arithmetic.
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5", compress: "true" }
  # stdout carries the `internal` NDJSON, stderr the JSON self-log; the driver collects them apart
  # with `docker logs`.
  entrypoint: ["logit", "--log-format", "json", "run", "/config.yaml"]
  command: []

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    profiles: [local]
    command:
      - -retentionPeriod=100y
    ports: ["127.0.0.1::8428"]
    logging: *logging

  logit:
    <<: *logit
    # Not required: an external target's stack has no victoria-metrics service to wait for.
    depends_on:
      victoria-metrics: { condition: service_started, required: false }
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
    volumes: ["${SOAK_SUT_CONFIG:?set by script/soak}:/config.yaml:ro,z"]

  generator:
    <<: *logit
    depends_on:
      logit: { condition: service_healthy }
    volumes: ["${SOAK_GENERATOR_CONFIG:?set by script/soak}:/config.yaml:ro,z"]
