# The stack `script/soak` drives for one scenario: VictoriaMetrics, the `logit` under test, and a
# second `logit` as the load source. See README.md here and docs/plans/soak-harness.md's "Compose".
#
# The driver runs this under the compose project `soak-<scenario>` with an `--env-file` it writes
# into the run directory, which sets:
#
#   SOAK_IMAGE             the `logit` release image tag (`logit:soak`)
#   SOAK_SUT_CONFIG        absolute path of the scenario's `logit` config for the service `logit`
#   SOAK_GENERATOR_CONFIG  absolute path of the scenario's config for the service `generator`,
#                          and one such variable per generator an override adds
#                          (scenario.py's `config_env()`)
#
# A scenario with an external target (`[target] kind = "external"`) gets a second `--env-file`:
# a private plain copy of the variables its `[target] env` lists, taken from `SOAK_EXTERNAL_ENV`
# (perf/results/soak-external.env by default) and removed when the run ends. The `logit` service's `environment:` passes each variable scenario.py's
# `EXTERNAL_ENV_PASSED` names, empty when unset.
#
# `victoria-metrics` is in the `local` profile, which the driver enables for a local-target
# scenario only, so an external target's stack runs without it. `kafka` is in the `kafka`
# profile, which the driver enables for a Kafka-target scenario only, in place of `local`.
#
# Every service carries a `soak.role` label, `sut`, `generator`, `backend`, or `broker` (the
# Kafka target's broker), which is how the driver and the checks know it. A scenario's
# `compose =` override file is merged onto this one (`-f compose.yaml -f <override>`) and labels
# any service it adds, such as a second backend.
#
# No `container_name` and no `name:`, so a second scenario under another project can't collide
# with this one. The only published ports are the backends': each publishes its own ephemeral
# loopback port, which the driver reads with `compose port` after every start of that backend.

x-logit: &logit
  image: ${SOAK_IMAGE:-logit:soak}
  # A crash must stay observable: nothing restarts a container but the driver's own steps.
  restart: "no"
  # Rotated so an hours-long run bounds the daemon's disk: at the observed 6.4 KB/s of
  # telemetry a 20 MB file lasts about 50 minutes, so the four full files a rotation keeps hold
  # about 3.5 hours, and the driver captures a chunk every 5 minutes. tools/soak/README.md's
  # "Long runs" has the arithmetic.
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5", compress: "true" }
  # stdout carries the `internal` NDJSON, stderr the JSON self-log; the driver collects them apart
  # with `docker logs`.
  entrypoint: ["logit", "--log-format", "json", "run", "/config.yaml"]
  command: []

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    profiles: [local]
    labels: { soak.role: backend }
    command:
      - -retentionPeriod=100y
    ports: ["127.0.0.1::8428"]
    logging: *logging

  # A single-node KRaft broker, the version testdata/interop/kafka/README.md records. One
  # partition per topic, so the topic's end offset is its record count; topics are created on
  # first use. The driver reads the target topic back with this image's own tools through
  # `docker exec`, so nothing is published. A restart keeps its log: the container is never
  # recreated.
  kafka:
    image: apache/kafka:4.2.0
    profiles: [kafka]
    labels: { soak.role: broker }
    hostname: kafka
    restart: "no"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server",
             "localhost:9092"]
      # Each probe starts a JVM, so after startup it runs twice a minute.
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s
      start_interval: 2s
    logging: *logging

  logit:
    <<: *logit
    labels: { soak.role: sut }
    # Neither is required: each is in a profile only one target's stack runs.
    depends_on:
      victoria-metrics: { condition: service_started, required: false }
      kafka: { condition: service_healthy, required: false }
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
    volumes: ["${SOAK_SUT_CONFIG:?set by script/soak}:/config.yaml:ro,z"]

  generator:
    <<: *logit
    labels: { soak.role: generator }
    depends_on:
      logit: { condition: service_healthy }
    volumes: ["${SOAK_GENERATOR_CONFIG:?set by script/soak}:/config.yaml:ro,z"]
