# A generated statsd stream into `logit` and out to a local Kafka broker that is restarted,
# paused, and stopped mid-run. The ledger's V is the topic, read back after the SUT stops
# (`[target] kind = "kafka"`, tools/soak/README.md's "Kafka targets"): `ledger.egress` judges the
# increments the SUT absorbed against those the topic's distinct records hold, and
# `ledger.topic` the topic's distinct record count against the records the sink saw accepted,
# and its duplicate copies per SUT life.
#
# `kafka_out` is idempotent by default, so a resend after an `Ambiguous` attempt carries its
# first attempt's producer id, epoch, and sequence, and the broker discards one it already
# appended. A broker restart keeps the producer state, so no fault here should store a record
# twice: `ledger.topic` FAILs a duplicate copy in a SUT life with no epoch bump.
#
# The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "kafka-broker-restart"
description = "generator -> statsd_in (UDP) -> aggregate 2s delta -> kafka_out (idempotent) -> Kafka, restarted, paused, and stopped; the topic is read back"
duration = "8m30s"        # warmup + one cycle + cooldown
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s, a metadata refresh, and two aggregate windows
cycle = "6m30s"           # the stop's recovery (5m45s) + one progress window and slack

[target]
kind = "kafka"
topic = "soak"

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]                  # component ids the checker reads; no VictoriaMetrics query
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
sut_aggregate = "window"
sut_sink = "kafka"
wire_loss_outside_faults = 0.0

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# A clean restart: the broker shuts down on SIGTERM, writes its producer-state snapshots, and
# comes back with its log. `for` is the window the checks excuse; a restart has no revert.
[[step]]
at = "0s"
action = "restart"
on = "kafka"
for = "30s"

# The broker's process stops answering while its sockets stay open, so produce requests sent
# during the pause time out after the sink's 10 s `timeout` as `Ambiguous`, and their resends
# carry the same sequences.
[[step]]
at = "1m45s"
action = "pause"
on = "kafka"
for = "40s"

# The broker is gone, and its name with it: every connect fails `Clean`, and the sink holds its
# queue until the broker is back.
[[step]]
at = "3m45s"
action = "stop"
on = "kafka"
for = "60s"

# The sink never drops a batch: `block` holds the queue through every fault.
[[expect]]
name = "no-drop-restart"
service = "logit"
metric = "logit.component.batches.dropped"
component = "kafka"
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "no-drop-pause"
service = "logit"
metric = "logit.component.batches.dropped"
component = "kafka"
step = "c0s2"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "no-drop-stop"
service = "logit"
metric = "logit.component.batches.dropped"
component = "kafka"
step = "c0s3"
window = "through"
reduce = "delta"
max = 0

# The pause leaves at least one attempt `Ambiguous`, so `ledger.topic`'s no-duplicate verdict
# rests on resends the broker had to deduplicate.
[[expect]]
name = "pause-is-ambiguous"
service = "logit"
metric = "logit.output.requests"
attrs = { component = "kafka", class = "ambiguous" }
step = "c0s2"
window = "through"
reduce = "delta"
min = 1

# The stop makes the sink retry for certain, and it stops retrying once the broker is back.
[[expect]]
name = "retrying-during-stop"
service = "logit"
metric = "logit.component.retrying"
component = "kafka"
step = "c0s3"
window = "during"
reduce = "max"
min = 1

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "kafka"
step = "c0s3"
window = "after"
reduce = "last"
max = 0
