# Syslog lines that each carry a log and a metric, split by a `route_signals` into a log part
# and a metric part, each to its own target, aggregate, sink, and VictoriaMetrics, under a stop
# of the metric branch's backend, a stop and a kill of the SUT, and loss on the generator. One
# event reaches both sinks, so each sink's V is judged against its own target's sends
# (`split = "target"`) and the router against its copies. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "route-signals"
description = "syslog lines with a log and a metric each, split by route_signals into two targets, aggregates, sinks, and VictoriaMetrics: one backend stopped, the SUT stopped and killed, loss on the generator"
duration = "13m"          # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "10m"             # >= last recovery (8m45s) + 2 x progress_window
compose = "compose.override.yaml"   # adds victoria-metrics-b

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
wire_loss_outside_faults = 0.0
split = "target"          # each sink behind its own target and aggregate
sut_router = "split"

[[ledger.source]]         # one per generator the ledger follows into the SUT
service = "generator"
generator_input = "load"
generator_sink = "syslog"
sut_listener = "lines"
sut_transforms = ["parse", "labels", "count"]   # lines to the router, in order

[[ledger.sink]]           # the log parts, one soak_log_lines increment each
id = "vm_logs"
target = "tier_logs"
transforms = ["count_logs", "logs_metrics_only"]
aggregate = "window_logs"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_log_lines_total"}'

[[ledger.sink]]           # the metric parts, the soak_lines increment `count` gave each line
id = "vm_metrics"
target = "tier_metrics"
aggregate = "window_metrics"
backend = "victoria-metrics-b"
vm_selector = '{__name__="soak_lines_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

[[step]]                  # c0s1: the metric branch's backend down
at = "0s"
action = "stop"
on = "victoria-metrics-b"
for = "90s"

[[step]]                  # c0s2: a stopped life, whose ledger rows are exact
at = "3m"
action = "stop"
on = "logit"
for = "30s"

[[step]]                  # c0s3: a killed life, judged in each branch's band
at = "5m"
action = "kill"
on = "logit"
for = "30s"

[[step]]                  # c0s4
at = "7m"
action = "netem"
on = "generator"
args = "loss 10%"
for = "60s"

# Each target's sends go to its own aggregate, and vm_metrics' queue holds the stop, so vm_logs
# keeps delivering every window.
[[expect]]
name = "logs-deliver-while-metrics-backend-stopped"
service = "logit"
metric = "logit.component.batches.delivered"
component = "vm_logs"
step = "c0s1"
window = "during"
reduce = "delta"
min = 6

[[expect]]
name = "metrics-queue-while-stopped"
service = "logit"
metric = "logit.component.buffer.batches"
component = "vm_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 5

[[expect]]
name = "metrics-drop-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_metrics"
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

# Every event carries both signals, so the router copies each one once: the copies are about
# 2,000 a second.
[[expect]]
name = "router-copies-every-event"
service = "logit"
metric = "logit.component.events.copied"
component = "split"
step = "c0s1"
window = "during"
reduce = "delta"
min = 100000

[[expect]]
name = "router-discards-nothing"
service = "logit"
metric = "logit.component.events.discarded"
component = "split"
window = "run"
reduce = "delta"
max = 0
