# OTLP log records whose bodies each hold four lines of InfluxDB line protocol, into `logit`'s
# `otlp_in` over HTTP, through `line_protocol`, which emits one event per point, and out to
# VictoriaMetrics, under statsd-vm's schedule. `fan_out = { points = 4 }` has `ledger.edge`
# judge the node's children against 4 x the records it received, less the lines it dropped, and
# every row after it count the listener's records carried through the node. The backend stop
# blocks the sink, and each batch held behind it past `line_protocol` holds 4 times the events.
# The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "otlp-fan-out"
description = "generator otlp_out -> otlp_in (HTTP) -> line_protocol (4 points per record) -> kv_metrics -> aggregate 500ms cumulative -> prometheus_out RW1 zstd -> VictoriaMetrics"
duration = "16m"          # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # the generator's retry_max_delay 1s, the sink's 10s, and a drain
cycle = "13m"             # >= last recovery (11m45s) + 2 x progress_window

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]                  # component ids the checker reads; no rates here
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "otlp"
sut_listener = "otlp"
wire = "http"             # G events.delivered, W the listener's events.sent: one per record
sut_transforms = ["points", "count"]
fan_out = { points = 4 }  # four points per record

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_points_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "120s"

[[step]]
at = "3m"
action = "netem"
on = "logit"
args = "loss 30%"
for = "90s"

[[step]]
at = "5m"
action = "netem"
on = "generator"
args = "loss 10%"
for = "60s"

# The sink's two-batch queue and the inboxes behind it fill, and `otlp_in` holds each request
# until the generator's 10 s timeout, then takes the resend too. A backend stop opens no HTTP
# window, so `ledger.wire` reads it as steady state, where that surplus counts 0.
[[step]]
at = "6m30s"
action = "stop"
on = "victoria-metrics"
for = "90s"

[[step]]
at = "8m30s"
action = "pause"
on = "logit"
for = "30s"

[[step]]
at = "9m30s"
action = "stop"
on = "logit"
for = "30s"

[[step]]
at = "10m15s"
action = "partition"
on = "logit"
for = "45s"

[[expect]]
name = "sink-queue-fills"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s4"
window = "during"
reduce = "max"
min = 2

# Backpressure never reaches the sink as a drop: `block` holds every batch.
[[expect]]
name = "sink-never-drops"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s4"
window = "through"
reduce = "delta"
max = 0

# A pause longer than the generator's 10 s timeout ends its requests in transport errors.
[[expect]]
name = "generator-resends"
service = "generator"
metric = "logit.output.requests"
component = "otlp"
attrs = { class = "network_error" }
step = "c0s5"
window = "through"
reduce = "delta"
min = 1

# Every body is well formed, so the fan-out term has no lines to take off.
[[expect]]
name = "no-lines-dropped"
service = "logit"
metric = "logit.transform.lines.dropped"
component = "points"
window = "run"
reduce = "delta"
max = 0
