# The system under test in `script/soak`'s spool-full scenario: statsd-vm's SUT with its sink on
# a small disk spool under `overflow: drop_oldest`, so a long VictoriaMetrics stop fills the
# spool. Its `internal` telemetry goes to stdout as NDJSON for the harness to read; `script/soak`
# runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd
    buffer:
      overflow: drop_oldest
      # The spool frees a whole segment at a time, so segments are a fraction of max_bytes.
      disk: { path: /tmp/soak-spool, max_bytes: 128KiB, segment_bytes: 16KiB }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
