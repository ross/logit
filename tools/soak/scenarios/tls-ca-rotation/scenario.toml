# tls-reload's stream, statsd over TCP with mutual TLS into `logit` and out to VictoriaMetrics,
# while the run's private CA itself rotates. Both ends first trust a bundle of the old CA and a
# new one; the SUT's server certificate, then the generator's client certificate, are reissued
# from the new CA; then the bundle drops the old CA. The SUT reloads its bundle and its
# certificate on a SIGHUP, with the poll off, and the generator on its own 10 s poll. A probe
# after each server rotation reads which leaf is served and by which CA, verified against the
# bundle in force, and a SUT restart after each change makes the generator handshake again
# under it. Nothing here should fail a handshake or lose a line. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "tls-ca-rotation"
description = "generator -> statsd_in (TCP, mutual TLS) -> aggregate 10s cumulative -> prometheus_out RW1 zstd -> VictoriaMetrics, through a CA rotation: a bundle of both CAs, leaves from the new one, then the new CA alone"
duration = "15m30s"       # warmup + one cycle + cooldown; --duration overrides
# A second cycle would repeat the CA generations and the certificates' days.
max_duration = "15m30s"
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "12m30s"          # >= last step's end (10m30s) + recovery_bound + 2 x progress_window
compose = "compose.override.yaml"   # mounts <run>/tls into the SUT and the generator

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]                  # component ids the checker reads; no rates here
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
wire = "tcp"              # G output.messages, W input.frames, F the framer's counted drops

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# The certificates the driver issues from CA 1, each first valid for 30 days. The SUT's serves
# `logit`, the name the generator dials; the generator's is its client one.
[tls.cert.statsd]
san = ["logit"]
usage = "server"

[tls.cert.generator]
san = ["generator"]
usage = "client"

# Steps 1 and 2: both ends trust CA 1 and a new CA 2. The SUT reloads the bundle on a SIGHUP,
# the generator on its poll; each end's certificate is still CA 1's.
[[step]]
at = "0s"
action = "trust"
on = "logit"
cas = [1, 2]
for = "40s"

[[step]]
at = "10s"
action = "signal"
on = "logit"
signal = "HUP"
for = "10s"

# Steps 3 to 5: the SUT's server certificate from CA 2, its SIGHUP, and a probe of the leaf
# served, which must chain to CA 2.
[[step]]
at = "2m"
action = "rotate"
on = "logit"
cert = "statsd"
days = 31
ca = 2
for = "40s"

[[step]]
at = "2m10s"
action = "signal"
on = "logit"
signal = "HUP"
for = "10s"

[[step]]
at = "2m25s"
action = "probe"
on = "logit"
cert = "statsd"
port = 8125
for = "5s"

# Step 6: a SUT restart drops the connection, and the generator verifies the CA 2 leaf against
# the bundle when it handshakes again.
[[step]]
at = "3m"
action = "restart"
on = "logit"
for = "30s"

# Step 7: the generator's client certificate from CA 2, which its poll reloads; its open
# connection keeps the CA 1 one.
[[step]]
at = "4m30s"
action = "rotate"
on = "generator"
cert = "generator"
days = 31
ca = 2
for = "40s"

# Step 8: the generator handshakes again, presenting the CA 2 certificate.
[[step]]
at = "5m30s"
action = "restart"
on = "logit"
for = "30s"

# Steps 9 and 10: the bundle drops CA 1. Every certificate in force is CA 2's.
[[step]]
at = "7m"
action = "trust"
on = "logit"
cas = [2]
for = "40s"

[[step]]
at = "7m10s"
action = "signal"
on = "logit"
signal = "HUP"
for = "10s"

# Steps 11 to 13: a rotation under CA 2 alone, and a probe, whose own client certificate is
# then CA 2's.
[[step]]
at = "9m"
action = "rotate"
on = "logit"
cert = "statsd"
days = 32
ca = 2
for = "40s"

[[step]]
at = "9m10s"
action = "signal"
on = "logit"
signal = "HUP"
for = "10s"

[[step]]
at = "9m25s"
action = "probe"
on = "logit"
cert = "statsd"
port = 8125
for = "5s"

# Step 14: both ends handshake again with CA 1 trusted by neither.
[[step]]
at = "10m"
action = "restart"
on = "logit"
for = "30s"

# Each SIGHUP reloads the listener once: two bundles and two certificates.
[[expect]]
name = "server-reloads-bundle-both"
service = "logit"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "reloaded" }
step = 2
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "server-reloads-ca2-leaf"
service = "logit"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "reloaded" }
step = 4
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "server-reloads-bundle-new"
service = "logit"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "reloaded" }
step = 10
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "server-reloads-total"
service = "logit"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "reloaded" }
window = "run"
reduce = "delta"
min = 4
max = 4

[[expect]]
name = "server-reload-failures"
service = "logit"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "failed" }
window = "run"
reduce = "delta"
max = 0

# The generator's poll reloads each bundle and its own rotation: three over the run, none
# failed.
[[expect]]
name = "client-reloads-bundle-both"
service = "generator"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "reloaded" }
step = 1
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "client-reloads-ca2-cert"
service = "generator"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "reloaded" }
step = 7
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "client-reloads-bundle-new"
service = "generator"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "reloaded" }
step = 9
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "client-reloads-total"
service = "generator"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "reloaded" }
window = "run"
reduce = "delta"
min = 3
max = 3

[[expect]]
name = "client-reload-failures"
service = "generator"
metric = "logit.tls.reloads"
component = "statsd"
attrs = { outcome = "failed" }
window = "run"
reduce = "delta"
max = 0

# After each restart the generator handshakes again and every drain reads lines; a refused
# handshake would show as a drain with none.
[[expect]]
name = "lines-after-ca2-leaf"
service = "logit"
metric = "logit.input.frames"
component = "statsd"
step = 6
window = "after"
reduce = "min_delta"
min = 1

[[expect]]
name = "lines-after-ca2-client"
service = "logit"
metric = "logit.input.frames"
component = "statsd"
step = 8
window = "after"
reduce = "min_delta"
min = 1

[[expect]]
name = "lines-after-ca1-dropped"
service = "logit"
metric = "logit.input.frames"
component = "statsd"
step = 14
window = "after"
reduce = "min_delta"
min = 1

# No handshake fails anywhere in the run: not the generator's, presenting either CA's
# certificate, and not a probe's.
[[expect]]
name = "no-connection-errors"
service = "logit"
metric = "logit.component.diagnostics"
component = "statsd"
attrs = { key = "connection_error" }
window = "run"
reduce = "delta"
max = 0
