# The load source in `script/soak`'s tls-ca-rotation scenario: 2,000 statsd counter lines a
# second over one TLS connection to the system under test, each batch of 100 lines one write,
# presenting a client certificate from the run's CAs and verifying the server's against the
# trust bundle behind `/tls/trust/live`, which a `trust` step swaps. It polls its certificate
# and bundle files every 10 s, so a rotation or a new bundle reaches it with no signal; its
# open connection keeps what it handshook with until it reconnects. Its `internal` telemetry
# goes to stdout as NDJSON, so the harness reads what it sent.
tls_reload_interval: 10s
admin: { bind: 127.0.0.1:9600 }
components:
  load:
    type: generate_in               # unbounded
    rate: 2000
    batch: 100
    event:
      metric: { name: "soak_requests_{seq%100}", kind: sum, value: 1 }
  statsd:
    type: statsd_out
    sources: [load]
    endpoint: logit:8125            # the server certificate's DNS name
    transport: tcp                  # output.messages counts a batch once its write completes
    format: statsd
    tls:
      ca_file: /tls/trust/live/ca.pem   # the bundle a `trust` step swaps
      cert_file: /tls/generator/live/cert.pem
      key_file: /tls/generator/live/key.pem
    # Never stall generate_in: a batch the SUT can't take while it restarts is counted here.
    buffer: { max_batches: 50, overflow: drop_newest, retry_max_delay: 1s }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
