# The system under test in `script/soak`'s cardinality-capped scenario: statsd-vm's SUT, with
# `max_series_per_metric: 10` on its `aggregate`. Each `soak_churn_N` name holds the first 10
# `id` values it sees in a life, and every later one folds into the name's overflow series,
# `logit.overflow: true`, so `aggregate` holds at most 100 + 10 x 10 + 10 series however many
# values arrive. Its `internal` telemetry goes to stdout as NDJSON for the harness to read.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # DogStatsD tags become attributes
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
    max_series_per_metric: 10
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd               # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
