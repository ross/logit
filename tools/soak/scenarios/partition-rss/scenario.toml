# One 45 s partition of the generator, then 13 minutes with no fault, to see whether a
# `generate_in -> statsd_out` process's resident memory falls back and holds flat after the
# backlog a partition builds, or keeps growing. The stack is statsd-vm's; the generator's `buffer`
# matches fanin's, whose partitions first showed the growth. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "partition-rss"
description = "statsd-vm's stack, one 45 s partition of the generator, then 13 minutes quiet: does the generator's RSS settle and hold flat"
duration = "15m45s"       # warmup + one cycle + cooldown
max_duration = "15m45s"   # one cycle: a second would put a fault in the quiet stretch
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
# In fanin the generator's RSS fell in steps for about 104 s after a partition's end. 120 s past
# recovery_bound puts rss_slope's fit on the plateau after the last step, about 10 minutes of it.
rss_settle = "120s"
cycle = "12m45s"          # >= last step's end (11m) + recovery_bound + 2 x progress_window

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# Step 1, the only fault: 2 minutes into the run.
[[step]]
at = "1m"
action = "partition"
on = "generator"
for = "45s"

# Step 2 is a marker, not a fault. A SIGHUP opens no fault window, and the generator, with no file
# target and no TLS, logs it and changes nothing, so its span gives the `[[expect]]` below a window
# that starts where rss_slope's fit does: at the partition's end plus recovery_bound and
# rss_settle.
[[step]]
at = "4m30s"
action = "signal"
on = "generator"
signal = "HUP"
for = "6m30s"

# The plateau holds: the generator's RSS at the window's end is at most 8 MiB above its value at
# the start. In fanin's 20261018T190542Z run the plateau after a partition moved within 1.5 MiB
# over 90 s, and the partition grew RSS by about 8.7 MiB per 5 s drain, so 8 MiB is over five
# times the plateau's noise and under one drain's worth of backlog growth.
[[expect]]
name = "generator-rss-plateau"
service = "generator"
metric = "logit.process.memory.resident.bytes"
step = 2
window = "during"
reduce = "rise"
max = 8388608
