# Generated log lines from `splunk_hec_out` under `ack: true` into `logit`'s `splunk_hec_in` and
# out to VictoriaMetrics, under network and lifecycle faults on both ends and a backend stop that
# backs up into busy `503`s. G counts only the lines the SUT acknowledged on `/ack`, after they
# were in its pipeline, so every window but a kill's is judged. A request the SUT took whose
# answer was lost is resent, and so is one whose ids the SUT forgot in a restart, once the sink's
# 30 s `ack_timeout` passes: a surplus allowed one batch per transport-error attempt and per timed
# out id. A `503` takes nothing and is a retry, not loss. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "splunk-hec-ingress"
description = "generator splunk_hec_out (ack: true) -> splunk_hec_in (HTTP) -> kv_metrics -> aggregate 500ms cumulative -> prometheus_out RW1 zstd -> VictoriaMetrics"
duration = "18m"          # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # the generator's ack_timeout 30s and retry_max_delay 1s, and a drain
cycle = "15m"             # >= last recovery (13m45s) + 2 x progress_window

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]                  # component ids the checker reads; no rates here
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "hec"
sut_listener = "hec"
sut_transforms = ["count"]
wire = "http"             # G events.delivered, W the listener's events.sent

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_requests_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# The SUT's egress carries its answers. Delayed 11 s, past splunk_hec_out's 10 s timeout, the
# answer to a body or a poll the SUT took arrives after the generator gave up on it, and the
# generator resends a batch the SUT holds: a surplus judged against its ack timeouts.
[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 11s"
for = "60s"

[[step]]
at = "2m30s"
action = "netem"
on = "logit"
args = "loss 30%"
for = "90s"

# Netem on the generator delays its requests: judged as well.
[[step]]
at = "5m"
action = "netem"
on = "generator"
args = "loss 10%"
for = "60s"

# The sink's two-batch queue, its inbox, `aggregate`'s, and `count`'s fill, and then the
# listener answers `503` code 9 after 5 s busy, deferring the batch to the client.
[[step]]
at = "7m"
action = "stop"
on = "victoria-metrics"
for = "90s"

# The SUT's graceful ends: each answers what it took before it exits, so they're judged. Each
# leaves ids the generator is still polling, which the next life doesn't know: the generator
# polls them `false` until its `ack_timeout` passes, then resends their batches.
[[step]]
at = "10m"
action = "stop"
on = "logit"
for = "30s"

[[step]]
at = "11m30s"
action = "restart"
on = "logit"
for = "30s"

# A SIGKILL loses up to one `internal` interval of the SUT's counts: reported.
[[step]]
at = "12m30s"
action = "kill"
on = "logit"
for = "30s"

[[expect]]
name = "listener-defers"
service = "logit"
metric = "logit.input.batches.deferred"
component = "hec"
step = "c0s4"
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "generator-retries-503s"
service = "generator"
metric = "logit.output.requests"
component = "hec"
attrs = { route = "event", class = "5xx" }
step = "c0s4"
window = "through"
reduce = "delta"
min = 1

# Under the delay each request in flight waits on its acknowledgment: every poll's answer comes
# too late, and every new connection's dial ends at `connect_timeout`, so the ack wait times out
# and the batch, which the SUT holds, is resent.
[[expect]]
name = "generator-ack-timeouts-under-delay"
service = "generator"
metric = "logit.output.acks"
component = "hec"
attrs = { result = "timeout" }
step = "c0s1"
window = "through"
reduce = "delta"
min = 1

# The restarted SUT answers the ids the last life issued `false`, and the generator resends
# their batches once its `ack_timeout` passes.
[[expect]]
name = "restart-forgets-acks"
service = "logit"
metric = "logit.input.acks.polled"
component = "hec"
attrs = { result = "unknown" }
step = "c0s6"
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "generator-ack-timeouts"
service = "generator"
metric = "logit.output.acks"
component = "hec"
attrs = { result = "timeout" }
step = "c0s6"
window = "through"
reduce = "delta"
min = 1

# The listener issues an id for every body it answers `200`.
[[expect]]
name = "listener-issues-acks"
service = "logit"
metric = "logit.input.acks.issued"
component = "hec"
window = "run"
reduce = "delta"
min = 1

# One channel and a poll within seconds of each id keep the ledger far under its bounds.
[[expect]]
name = "listener-evicts-no-acks"
service = "logit"
metric = "logit.input.acks.evicted"
component = "hec"
window = "run"
reduce = "delta"
max = 0

# Backpressure never reaches the sink as a drop: `block` holds every batch.
[[expect]]
name = "sink-never-drops"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s4"
window = "through"
reduce = "delta"
max = 0
