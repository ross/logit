# statsd lines routed on a DogStatsD `shard` tag by a `route` whose list-valued `routes:` value
# sends each shard-0 event whole to two targets, each target into its own aggregate, sink, and
# VictoriaMetrics, under a stop of the backend holding shard 0's copy, a restart of the SUT, and
# loss on the generator. Each sink's V is judged against its own target's sends
# (`split = "target"`), and the router against its copies. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "route-copy"
description = "statsd-vm with a list-valued route sending shard 0 whole to two targets, each with its own aggregate, sink, and VictoriaMetrics: one backend stopped, the SUT restarted, loss on the generator"
duration = "10m"          # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "7m"              # >= last recovery (5m45s) + 2 x progress_window
compose = "compose.override.yaml"   # adds victoria-metrics-b

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
wire_loss_outside_faults = 0.0
split = "target"          # each sink behind its own target and aggregate
sut_router = "split"

[[ledger.source]]         # one per generator the ledger follows into the SUT
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]           # shard 0's series
id = "vm_a"
target = "tier_a"
aggregate = "window_a"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[[ledger.sink]]           # every series
id = "vm_b"
target = "tier_b"
aggregate = "window_b"
backend = "victoria-metrics-b"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

[[step]]                  # c0s1: the backend holding shard 0's copy down
at = "0s"
action = "stop"
on = "victoria-metrics"
for = "90s"

[[step]]                  # c0s2: a stopped life, whose ledger rows are exact
at = "2m30s"
action = "restart"
on = "logit"
for = "30s"

[[step]]                  # c0s3
at = "4m"
action = "netem"
on = "generator"
args = "loss 10%"
for = "60s"

# vm_a's queue holds the stop, and vm_b keeps delivering every window.
[[expect]]
name = "b-delivers-while-a-stopped"
service = "logit"
metric = "logit.component.batches.delivered"
component = "vm_b"
step = "c0s1"
window = "during"
reduce = "delta"
min = 6

[[expect]]
name = "a-queues-while-stopped"
service = "logit"
metric = "logit.component.buffer.batches"
component = "vm_a"
step = "c0s1"
window = "during"
reduce = "max"
min = 5

[[expect]]
name = "a-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_a"
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

# Half the lines are shard 0, each copied once: about 1,000 copies a second.
[[expect]]
name = "router-copies-shard-0"
service = "logit"
metric = "logit.component.events.copied"
component = "split"
step = "c0s1"
window = "during"
reduce = "delta"
min = 50000

# `unrouted` is the router's null_out consumer. A counter that stays zero emits no point, so
# `router-copies-shard-0` stands for a positive read on the router.
[[expect]]
name = "nothing-unrouted"
service = "logit"
metric = "logit.component.events.received"
component = "unrouted"
window = "run"
reduce = "delta"
max = 0
