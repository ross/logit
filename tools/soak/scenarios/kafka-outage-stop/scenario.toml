# The SUT stops inside a VictoriaMetrics outage that has backed the chain up to a Kafka consumer:
# VictoriaMetrics is stopped 100 s, and 60 s into that the SUT is stopped for 20 s. At the signal
# `kafka_in` gives its parked send the lesser of `drain_timeout` and half its shutdown grace,
# then defers that batch and every batch behind it as `logit.input.batches.deferred`, commits
# only what every downstream inbox took, and leaves the group, all inside the grace, so the
# runtime's backstop finds no send to cut. The deferred records were read and never sent, and the
# next life reads them again from the commit, inside `ledger.wire`'s replay band. The sink drops
# its queue and `aggregate`'s send into the closed sink is dropped `closed_consumer`, as in
# sink-outage-stop. The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "kafka-outage-stop"
description = "kafka-consume-broker-restart with 500ms windows and a 2-batch blocking sink queue: the SUT stopped inside a VictoriaMetrics stop, so kafka_in defers its parked send for the next life"
duration = "5m40s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
# A rejoin, a backoff of up to 10 s to VictoriaMetrics back from its stop, and a drain.
recovery_bound = "60s"
cycle = "3m40s"           # the stops, their recovery, and a progress window of steady state
compose = "compose.override.yaml"   # creates the topic before the SUT starts

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "produce" # a kafka_out: G is its logit.output.records
sut_listener = "consume"
wire = "kafka"            # W is input.records; judged against the replay band
sut_transforms = ["labels"]

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_records_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]                  # c0s1: VictoriaMetrics down
at = "0s"
action = "stop"
on = "victoria-metrics"
for = "100s"

# 60 s fills the sink's queue and every inbox back to the consumer, so its send is parked when
# the stop comes; the second life starts while VictoriaMetrics is still down.
[[step]]                  # c0s2: the SUT stopped inside it
at = "60s"
action = "stop"
on = "logit"
for = "20s"

[[expect]]
name = "sink-queue-fills"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 2

[[expect]]
name = "aggregate-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "window"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

# The parked send's batch is deferred at the consumer, in the stopped life's final drain, and
# nothing is dropped there.
[[expect]]
name = "listener-batch-deferred"
service = "logit"
metric = "logit.input.batches.deferred"
component = "consume"
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "listener-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "consume"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
max = 0

# What a stop does to a blocked chain: the sink's queue is dropped at shutdown, and the batch
# `aggregate` was sending into the sink's inbox when the sink closed is dropped `closed_consumer`.
[[expect]]
name = "sink-drops-at-shutdown"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "aggregate-closed-consumer"
service = "logit"
metric = "logit.component.events.dropped"
component = "window"
attrs = { reason = "closed_consumer" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

# `block` holds every batch while the SUT runs: the second life, which starts with
# VictoriaMetrics still down, drops nothing.
[[expect]]
name = "sink-holds-after-restart"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s2"
window = "after"
reduce = "delta"
max = 0

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "last"
max = 0

# Every record here is one the generator wrote, so none may be dropped and committed past.
[[expect]]
name = "no-records-dropped"
service = "logit"
metric = "logit.input.records.dropped"
component = "consume"
window = "run"
reduce = "delta"
max = 0

# The member catches up on both partitions within the recovery bound of the backend's return.
[[expect]]
name = "lag-after-outage-p0"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "0" }
step = "c0s1"
window = "after"
reduce = "last"
max = 0

[[expect]]
name = "lag-after-outage-p1"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "1" }
step = "c0s1"
window = "after"
reduce = "last"
max = 0
