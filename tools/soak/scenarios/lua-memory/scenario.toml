# A `lua` stage whose VM outgrows `max_memory`: the SUT logs `memory_limit_exceeded`, drains, and
# exits 2 on its own, and the `exit` step's revert starts it again. The step names the exit code
# and the self-log key, so the watchdog accepts that exit and requires it, and the ledger judges
# the first life as a stopped one. The schema is docs/plans/soak-harness.md's "The scenario
# schema".

name = "lua-memory"
description = "statsd-vm with a lua stage that outgrows max_memory: the SUT exits 2 with memory_limit_exceeded and is started again"
duration = "8m10s"        # warmup + one cycle + cooldown, ending before the second life grows
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "6m10s"           # the exit, its recovery, and two progress windows of steady state

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
sut_aggregate = "window"
sut_script = "enrich"
wire_loss_outside_faults = 0.0

[[ledger.sink]]           # one per SUT sink the ledger follows to its backend
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

# The script starts keeping strings about 235 s after the timeline's zero, since the generator
# starts a few seconds before it, and the VM passes the cap about 32 s later. The window opens
# 5 s ahead of the first kept string and closes about 50 s after the predicted exit; its revert
# starts the exited SUT.
[[step]]
at = "2m50s"
action = "exit"
on = "logit"
code = 2
key = "memory_limit_exceeded"
for = "1m30s"

# The VM held more than the cap before the node failed: the gauge the failed check sets is in
# the shutdown drain.
[[expect]]
name = "vm-over-cap"
service = "logit"
metric = "logit.script.vm.memory"
component = "enrich"
step = "c0s1"
window = "during"
reduce = "max"
min = 67108864
