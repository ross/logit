# A Kubernetes pod log tree written as containerd and the kubelet write it, tailed by `cri_in`
# through a directory the two share, out to VictoriaMetrics from a disk spool, under a pause, a
# stop, a restart, and two kills of the SUT. The writer, soaklib/criwriter.py, interleaves
# stdout and stderr, splits long lines into 16 KiB `P` pieces, stalls a line mid-way for longer
# than `partial_timeout`, rotates every 45 s the kubelet's way (rename to `0.log.<time>`,
# reopen, gzip the older rotated file, keep five files) with a line split across each rename,
# and restarts the container into `1.log` once. `ledger.wire` judges `cri_in`'s events less its
# `partial_timeout` flushes against the writer's finished lines, inside the replay band, and
# holds the writer to the finished lines left on disk. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "cri-rotate"
description = "criwriter (CRI records, kubelet rotation, a container restart) -> cri_in -> set -> keep -> aggregate 10s cumulative -> prometheus_out RW1 zstd (disk spool) -> VictoriaMetrics"
duration = "10m10s"       # warmup + one cycle + cooldown; --duration overrides
# No max_duration: the kubelet's retention bounds the writer's files and the tailer's
# descriptors, and a longer run repeats the cycle on `1.log`.
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "7m10s"           # >= last recovery (6m05s) + 2 x progress_window
compose = "compose.override.yaml"   # the shared directory, and the writer in place of `logit`

[configs]
sut = "logit-sut.yaml"
generator = "cri-writer.json"   # criwriter.py's config, mounted at /config.yaml

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
vm_every_window = true    # one series, written in every window the tailer reads in

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "pods"   # the writer's own ids: G is its finished lines, events.delivered
sut_listener = "pods"
wire = "cri"              # W − S is cri_in's events less its partial_timeout flushes
sut_transforms = ["identity", "labels", "count", "metrics_only"]   # cri_in to aggregate

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_lines_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
# The tailer holds the live file of each attempt and the newest rotated file of the live one;
# the kubelet's compression closes the rest.
fd_growth = 10

# Each down window is 35 s, under the writer's 45 s rotation less a drain on each side, so it
# holds at most one rotation: a second would compress the file the SUT stopped reading in,
# which `cri_in` never reads, and `ledger.wire` FAILs that as the scenario's fault.

# The tailer stops reading; the writer doesn't, so it catches up after.
[[step]]
at = "0s"
action = "pause"
on = "logit"
for = "35s"

# A clean stop writes a final checkpoint and keeps each held run unsent, pinned at its first
# record: the restart reads it whole, so nothing replays and nothing splits.
[[step]]
at = "1m15s"
action = "stop"
on = "logit"
for = "35s"

[[step]]
at = "2m30s"
action = "restart"
on = "logit"
for = "30s"

# A SIGKILL writes no final checkpoint: what was read after the last one replays, and a
# rotation inside the kill leaves the live file under its rotated name, found by its inode at
# the restart.
[[step]]
at = "3m30s"
action = "kill"
on = "logit"
for = "35s"

[[step]]
at = "4m45s"
action = "kill"
on = "logit"
for = "35s"

# Each stall and each rotation's split line leaves a run that only `partial_timeout` sends:
# about 16 stalls and 13 rotations in a default run. A run held across a SUT stop can complete
# before the restart reads it, so the floor is well below their sum.
[[expect]]
name = "partial-timeout-flushes"
service = "logit"
metric = "logit.input.frames.truncated"
component = "pods"
attrs = { reason = "partial_timeout" }
window = "run"
reduce = "delta"
min = 10

# No line is oversize, malformed, or truncated in place, so `cri_in` drops none.
[[expect]]
name = "no-frames-dropped"
service = "logit"
metric = "logit.input.frames.dropped"
component = "pods"
window = "run"
reduce = "delta"
max = 0

[[expect]]
name = "files-rotated"
service = "logit"
metric = "logit.input.files.rotated"
component = "pods"
window = "run"
reduce = "delta"
min = 1

[[expect]]
name = "no-resume-rejected"
service = "logit"
metric = "logit.input.files.resume_rejected"
component = "pods"
window = "run"
reduce = "delta"
max = 0

[[expect]]
name = "no-checkpoint-errors"
service = "logit"
metric = "logit.input.checkpoint.errors"
component = "pods"
window = "run"
reduce = "delta"
max = 0
