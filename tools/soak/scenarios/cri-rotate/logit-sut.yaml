# The system under test in `script/soak`'s cri-rotate scenario: `cri_in` follows the pod log tree
# the writer keeps under the directory they share, and each line becomes one `soak_lines`
# increment in a 10 s cumulative aggregate, sent as remote-write 1.0 (zstd) to VictoriaMetrics
# from a disk spool. Its `internal` telemetry goes to stdout as NDJSON for the harness to read;
# `script/soak` runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  pods:
    type: cri_in
    root: /shared
    read_from: beginning
    # The image creates /var/lib/logit for its unprivileged user. The driver never recreates
    # the container, so the checkpoint survives a stop and a kill. With a checkpoint, a clean
    # stop keeps a held run unsent, and the restart reads it whole.
    checkpoint_path: /var/lib/logit/cri.checkpoint
    checkpoint_interval: 5s
  # Every node between `pods` and `window` forwards every event it receives, which
  # `ledger.edge` checks hop by hop. The path stamps the container's restart count on the
  # resource, which `prometheus_out` would write as a label; one constant identity keeps one
  # series across the container's restart.
  identity:
    type: set
    sources: [pods]
    resource:
      k8s.namespace.name: soak
      k8s.pod.name: writer
      k8s.pod.uid: soak
      k8s.container.name: app
      k8s.container.restart_count: 0
  labels: { type: keep, sources: [identity], fields: [] }   # drops `log.iostream`
  count:
    type: kv_metrics
    sources: [labels]
    counters: [{ name: soak_lines }]   # no `field`: +1 per event
  metrics_only:                     # else `window` passes each line's log on to the sink
    type: keep_signals
    sources: [count]
    signals: [metrics]
  window:
    type: aggregate
    sources: [metrics_only]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd
    # A disk spool keeps the sink's queue through a kill, so the egress band covers only
    # `aggregate`'s window, as for spool-kill-replay.
    buffer: { disk: { path: /tmp/soak-spool } }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
