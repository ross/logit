# The SUT stops while the second backend is still down: VictoriaMetrics B is stopped 150 s, and 60 s
# into that the SUT is stopped for 30 s. The second sink's queue is 4 batches under
# `overflow: drop_oldest`, so the first life's batches still queued at its shutdown are dropped
# and counted, and its egress gap is that sink's alone. The first sink delivers to its own backend
# up to the stop. The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "fanout-stop-outage"
description = "statsd-vm fanned out to two sinks and two VictoriaMetrics: the SUT stopped inside a stop of the second backend, so its shutdown drops that sink's queue"
duration = "6m15s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "4m15s"           # the stop, its recovery, and two progress windows of steady state
compose = "compose.override.yaml"   # adds victoria-metrics-b

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
split = "copy"            # each sink receives every batch `window` sends

[[ledger.source]]         # one per generator the ledger follows into the SUT
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]
id = "vm_a"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[[ledger.sink]]
id = "vm_b"
backend = "victoria-metrics-b"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]                  # c0s1: B down
at = "0s"
action = "stop"
on = "victoria-metrics-b"
for = "150s"

# The second life starts while B is still down.
[[step]]                  # c0s2: the SUT stopped inside it
at = "60s"
action = "stop"
on = "logit"
for = "30s"

[[expect]]
name = "b-drops-at-shutdown"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_b"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "a-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_a"
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "b-retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "vm_b"
step = "c0s1"
window = "after"
reduce = "last"
max = 0
