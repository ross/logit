# The system under test in `script/soak`'s http-concurrency scenario, http-ingress's SUT: InfluxDB line
# protocol over HTTP, a counter per point, a 500 ms cumulative aggregate, and remote-write 1.0
# (zstd) to VictoriaMetrics behind a two-batch blocking queue. Its `internal` telemetry goes to
# stdout as NDJSON for the harness to read; `script/soak` runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  influx:
    type: influxdb_in               # 503 after 5 s busy, with nothing taken
    bind: 0.0.0.0:8086
  count:
    # A point's fields decode to gauges, which V can't count, so each point gets a counter of 1.
    type: kv_metrics
    sources: [influx]
    counters: [{ name: soak_requests }]
  window:
    type: aggregate
    sources: [count]
    # One batch per window: at 10 s, a backend stop would take over 10 minutes to fill the
    # sink's 64-batch inbox and back up to the listener.
    interval: 500ms
    temporality: cumulative
    series_retention: 7200          # an hour of windows: a fault must never evict a series
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd
    buffer: { max_batches: 2 }      # overflow: block, the default
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
