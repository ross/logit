# http-ingress's stream at a quarter of its rate, 500 InfluxDB points a second in batches of 50,
# from an `influxdb_out` at `concurrency: 8` into `logit`'s `influxdb_in` over HTTP, under a
# 200 ms delay on the SUT's answers and then a backend stop. Ten batches a second need two or
# three requests in flight over that round trip, so the generator keeps up and drops nothing.
# `http-concurrency-1` is the same run at `concurrency: 1`; together they measure the field's
# gain on a slow link (docs/plans/sink-request-concurrency.md's "Findings"). The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "http-concurrency"
description = "generator influxdb_out concurrency 8 -> influxdb_in (HTTP) -> kv_metrics -> aggregate 500ms cumulative -> prometheus_out RW1 zstd -> VictoriaMetrics, a 200ms answer delay then a backend stop"
duration = "10m30s"       # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # the generator's retry_max_delay 1s, the sink's 10s, and a drain
cycle = "7m30s"           # >= last recovery (6m30s) + 2 x progress_window

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]                  # component ids the checker reads; no rates here
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "influx"
sut_listener = "influx"
sut_transforms = ["count"]
wire = "http"             # G events.delivered, W the listener's events.sent

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_requests_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# The SUT's egress carries its answers, so each request's round trip is about 200 ms: a slow
# link, well under the generator's 10 s timeout.
[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "3m30s"

# The sink's two-batch queue, its inbox, `aggregate`'s, and `count`'s fill in under a minute,
# and then the listener holds each request 5 s and answers `503`, deferring the batch to the
# client.
[[step]]
at = "4m15s"
action = "stop"
on = "victoria-metrics"
for = "90s"

# Little's law: ten batches a second over a 200 to 250 ms round trip keep two or three in
# flight.
[[expect]]
name = "in-flight-overlaps"
service = "generator"
metric = "logit.output.in_flight"
component = "influx"
step = "c0s1"
window = "during"
reduce = "max"
min = 2
max = 8

# The delay costs the generator nothing: its queue never overflows.
[[expect]]
name = "no-overflow-under-delay"
service = "generator"
metric = "logit.component.batches.dropped"
component = "influx"
attrs = { reason = "overflow_newest" }
step = "c0s1"
window = "during"
reduce = "delta"
max = 0

# The listener holds each request up to 5 s before its `503`, so every slot fills, and no more.
[[expect]]
name = "in-flight-reaches-concurrency"
service = "generator"
metric = "logit.output.in_flight"
component = "influx"
step = "c0s2"
window = "during"
reduce = "max"
min = 8
max = 8

[[expect]]
name = "generator-retries-503s"
service = "generator"
metric = "logit.output.requests"
component = "influx"
attrs = { class = "5xx" }
step = "c0s2"
window = "through"
reduce = "delta"
min = 1

# Backpressure never reaches the sink as a drop: `block` holds every batch.
[[expect]]
name = "sink-never-drops"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s2"
window = "through"
reduce = "delta"
max = 0
