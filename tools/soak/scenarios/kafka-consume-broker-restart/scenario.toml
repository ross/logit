# A generator's records produced to a local Kafka broker and consumed by `logit`'s `kafka_in`,
# out to VictoriaMetrics, under a restart and a pause of the broker and a kill and a stop of the
# SUT. Kafka holds every record, so the wire is judged as a file wire is: a kill replays what the
# member read after its last commit, a membership the pause cost replays the same, and a revoke
# rereads the batches it deferred, all inside `ledger.wire`'s replay band (tools/soak/README.md's
# "The checks"). The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "kafka-consume-broker-restart"
description = "generator -> kafka_out -> Kafka (restarted, paused) -> kafka_in (killed, stopped) -> aggregate 10s cumulative -> prometheus_out RW1 zstd (disk spool) -> VictoriaMetrics"
duration = "10m"          # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
# A rejoin, a backoff of up to 10 s to a broker back from a fault, and two aggregate
# windows.
recovery_bound = "60s"
cycle = "7m"              # >= last recovery (6m30s) + one progress window and slack
compose = "compose.override.yaml"   # creates the topic before the SUT starts

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "produce" # a kafka_out: G is its logit.output.records
sut_listener = "consume"
wire = "kafka"            # W is input.records; judged against the replay band
sut_transforms = ["labels"]

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_records_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# A clean restart: the broker writes its log and group state and comes back with both. The
# member's connections fail, it finds the coordinator again, and resumes from its commits.
[[step]]
at = "0s"
action = "restart"
on = "kafka"
for = "30s"

# Longer than the SUT's 10 s `session_timeout`, so when the broker resumes the coordinator
# expires the member: its next commit is fenced, and it rejoins and reads again from the last
# commit that landed.
[[step]]
at = "1m30s"
action = "pause"
on = "kafka"
for = "40s"

# No final commit and no LeaveGroup: the coordinator expires the dead member's 10 s session
# while the SUT is down for 30 s, so the restarted member joins at once and reads from the last
# commit, replaying what the killed life read after it.
[[step]]
at = "3m15s"
action = "kill"
on = "logit"
for = "30s"

# A clean stop: the member commits and leaves the group, and the next life reads on from there.
[[step]]
at = "5m"
action = "stop"
on = "logit"
for = "30s"

# A record that won't decode, or that the client skips, is dropped and committed past: every
# record here is one the generator wrote, so none may be.
[[expect]]
name = "no-records-dropped"
service = "logit"
metric = "logit.input.records.dropped"
component = "consume"
window = "run"
reduce = "delta"
max = 0

# The restarted process joins the group afresh.
[[expect]]
name = "rejoin-after-kill"
service = "logit"
metric = "logit.input.rebalances"
component = "consume"
step = "c0s3"
window = "after"
reduce = "delta"
min = 1

# The pause outlives the session, so the member rejoins once the broker resumes.
[[expect]]
name = "rejoin-after-pause"
service = "logit"
metric = "logit.input.rebalances"
component = "consume"
step = "c0s2"
window = "through"
reduce = "delta"
min = 1

# The coordinator refuses a commit from the expired generation.
[[expect]]
name = "fenced-in-pause"
service = "logit"
metric = "logit.input.commits"
attrs = { component = "consume", class = "fenced" }
step = "c0s2"
window = "through"
reduce = "delta"
min = 1

# The member catches up within the recovery bound of each step, on both partitions.
[[expect]]
name = "lag-after-restart-p0"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "0" }
step = "c0s1"
window = "after"
reduce = "last"
max = 0

[[expect]]
name = "lag-after-restart-p1"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "1" }
step = "c0s1"
window = "after"
reduce = "last"
max = 0

[[expect]]
name = "lag-after-pause-p0"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "0" }
step = "c0s2"
window = "after"
reduce = "last"
max = 0

[[expect]]
name = "lag-after-pause-p1"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "1" }
step = "c0s2"
window = "after"
reduce = "last"
max = 0

[[expect]]
name = "lag-after-kill-p0"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "0" }
step = "c0s3"
window = "after"
reduce = "last"
max = 0

[[expect]]
name = "lag-after-kill-p1"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "1" }
step = "c0s3"
window = "after"
reduce = "last"
max = 0

[[expect]]
name = "lag-after-stop-p0"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "0" }
step = "c0s4"
window = "after"
reduce = "last"
max = 0

[[expect]]
name = "lag-after-stop-p1"
service = "logit"
metric = "logit.input.lag"
attrs = { component = "consume", topic = "soak-in", partition = "1" }
step = "c0s4"
window = "after"
reduce = "last"
max = 0
