# The system under test in `script/soak`'s standin-remote-write scenario: statsd-vm's SUT with
# remote-write 1.0 (Snappy, the only encoding the stand-in decodes) to the scripted stand-in.
# Its `internal` telemetry goes to stdout as NDJSON for the harness to read; `script/soak` runs
# it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  remote_write:
    type: prometheus_out
    sources: [window]
    endpoint: http://standin:8080/api/v1/write
    version: 1
    compression: snappy             # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
