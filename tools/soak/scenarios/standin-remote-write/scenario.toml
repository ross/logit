# Every row of prometheus_out's sender-mode response-class table, against a scripted stand-in
# under load: each step tells the stand-in what to answer for 20 s, and its `class` names the
# fault class the sink must read (crates/logit-outputs/src/prometheus.rs, "Faults, retries and
# duplicate safety (sender mode)"). `ledger.standin` checks each step's effect at the sink and
# the stand-in's record against the sink's telemetry; V is what the stand-in stored. A rejected
# batch is lost, but the next window's cumulative totals overwrite it, so the ledger's gap stays
# 0. The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "standin-remote-write"
description = "statsd-vm into prometheus_out RW1 Snappy, against a stand-in answering every row of the sink's response-class table in turn"
duration = "32m40s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "30m40s"           # the last step, its recovery, and two progress windows

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[target]
kind = "standin"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]           # the one sink, whose writes the stand-in records
id = "remote_write"

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]                  # c0s1: any 5xx: the sink retries
at = "0s"
action = "respond"
on = "standin"
status = 503
class = "ambiguous"
for = "20s"

[[step]]                  # c0s2: a 5xx after storing: the resend stores the same samples
at = "1m35s"
action = "respond"
on = "standin"
status = 503
apply = true
class = "ambiguous"
for = "20s"

[[step]]                  # c0s3: 429: retried
at = "3m10s"
action = "respond"
on = "standin"
status = 429
class = "ambiguous"
for = "20s"

[[step]]                  # c0s4: 400 for invalid samples: dropped
at = "4m45s"
action = "respond"
on = "standin"
status = 400
body = "out of order sample"
class = "rejected"
for = "20s"

[[step]]                  # c0s5: VictoriaMetrics' decompression error: held
at = "6m20s"
action = "respond"
on = "standin"
status = 400
body = "cannot decompress snappy-encoded request with length 10: corrupt input"
class = "refused"
for = "20s"

[[step]]                  # c0s6: client_golang's decompression error: held
at = "7m55s"
action = "respond"
on = "standin"
status = 400
body = "snappy: corrupt input"
class = "refused"
for = "20s"

[[step]]                  # c0s7: credentials: held
at = "9m30s"
action = "respond"
on = "standin"
status = 401
class = "refused"
for = "20s"

[[step]]                  # c0s8: credentials: held
at = "11m5s"
action = "respond"
on = "standin"
status = 403
class = "refused"
for = "20s"

[[step]]                  # c0s9: proxy credentials: held
at = "12m40s"
action = "respond"
on = "standin"
status = 407
class = "refused"
for = "20s"

[[step]]                  # c0s10: not a remote-write receiver: held
at = "14m15s"
action = "respond"
on = "standin"
status = 404
class = "refused"
for = "20s"

[[step]]                  # c0s11: not a remote-write receiver: held
at = "15m50s"
action = "respond"
on = "standin"
status = 405
class = "refused"
for = "20s"

[[step]]                  # c0s12: not a remote-write receiver: held
at = "17m25s"
action = "respond"
on = "standin"
status = 501
class = "refused"
for = "20s"

[[step]]                  # c0s13: Thanos receive's conflict: dropped
at = "19m"
action = "respond"
on = "standin"
status = 409
class = "rejected"
for = "20s"

[[step]]                  # c0s14: request too large: dropped
at = "20m35s"
action = "respond"
on = "standin"
status = 413
class = "rejected"
for = "20s"

[[step]]                  # c0s15: unsupported encoding: held
at = "22m10s"
action = "respond"
on = "standin"
status = 415
class = "refused"
for = "20s"

[[step]]                  # c0s16: any other 4xx: dropped
at = "23m45s"
action = "respond"
on = "standin"
status = 422
class = "rejected"
for = "20s"

[[step]]                  # c0s17: a redirect, never followed: dropped
at = "25m20s"
action = "respond"
on = "standin"
status = 302
class = "rejected"
for = "20s"

[[step]]                  # c0s18: a transport error after the request was sent: retried
at = "26m55s"
action = "respond"
on = "standin"
answer = "reset"
class = "ambiguous"
for = "20s"

[[step]]                  # c0s19: a connect failure: held
at = "28m30s"
action = "stop"
on = "standin"
class = "clean"
for = "20s"

# One expectation per class, beside ledger.standin's check of every step.
[[expect]]
name = "ambiguous-retries"
service = "logit"
metric = "logit.component.retries"
component = "remote_write"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "rejected-drops"
service = "logit"
metric = "logit.component.batches.dropped"
component = "remote_write"
attrs = { reason = "rejected" }
step = "c0s4"
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "refused-holds"
service = "logit"
metric = "logit.component.retrying"
component = "remote_write"
step = "c0s7"
window = "during"
reduce = "max"
min = 1

[[expect]]
name = "refused-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "remote_write"
step = "c0s7"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "clean-holds"
service = "logit"
metric = "logit.component.retrying"
component = "remote_write"
step = "c0s19"
window = "during"
reduce = "max"
min = 1

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "remote_write"
step = "c0s19"
window = "after"
reduce = "last"
max = 0
