# The system under test in `script/soak`'s tail-outage-stop scenario: `tail_in` follows the
# writer's rotating file through the directory they share, `json` parses each line, and each
# becomes one `soak_lines` increment in a 500 ms cumulative aggregate, sent as remote-write 1.0
# (zstd) to VictoriaMetrics behind a two-batch queue under the default `overflow: block`. With
# VictoriaMetrics down, the queue and every inbox back to the tailer fill, and the tailer's send
# parks on a full inbox. Stopped then, the shutdown backstop cuts that send, and since `tail_in`
# has a `checkpoint_path` it counts the batch `logit.input.batches.deferred`: the checkpoint never
# passed it, so the next life reads it again. Its `internal` telemetry goes to stdout as NDJSON
# for the harness to read; `script/soak` runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  tail:
    type: tail_in
    # The wildcard matches the writer's rotated names (`app.log.1`, `app.log.2`, ...), so a
    # file renamed away is followed by inode and read to its end, never lost.
    paths: ["/shared/app.log*"]
    read_from: beginning
    # The image creates /var/lib/logit for its unprivileged user. The driver never recreates
    # the container, so the checkpoint survives the stop.
    checkpoint_path: /var/lib/logit/tail.checkpoint
    checkpoint_interval: 5s
  # Every node between `tail` and `window` forwards every event it receives, which
  # `ledger.edge` checks hop by hop: `json` passes a line it can't parse through unchanged.
  parse: { type: json, sources: [tail] }
  labels: { type: keep, sources: [parse], fields: [id] }   # no line carries `id`: no labels
  count:
    type: kv_metrics
    sources: [labels]
    counters: [{ name: soak_lines }]   # no `field`: +1 per event
  metrics_only:                     # else `window` passes each line's log on to the sink
    type: keep_signals
    sources: [count]
    signals: [metrics]
  window:
    type: aggregate
    sources: [metrics_only]
    # One batch a window: about 45 s of outage fills the sink's 64-batch inbox and `window`'s,
    # and about 20 s more every inbox back to the tailer.
    interval: 500ms
    temporality: cumulative
    series_retention: 7200          # an hour of windows: a fault must never evict a series
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd
    # overflow: block, the default. Its grace outlasts the listener's 5 s, so the chain stays
    # blocked until the backstop has cut the tailer's parked send: a sink that dropped its queue
    # first would unblock the send, and the tailer would return with nothing to cut. 10 s keeps
    # the whole shutdown inside the harness's 30 s `docker stop` timeout.
    buffer: { max_batches: 2, shutdown_grace: 10s }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
