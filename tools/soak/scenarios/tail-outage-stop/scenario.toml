# The SUT stops inside a VictoriaMetrics outage that has backed the chain up to a tailer:
# VictoriaMetrics is stopped 130 s, and 90 s into that the SUT is stopped for 20 s. The runtime's
# shutdown backstop cuts `tail_in`'s send parked on a full inbox, and because `tail_in` has a
# `checkpoint_path` it counts that batch `logit.input.batches.deferred`, never dropped: its
# checkpoint never passed the batch, so the next life reads it again, inside `ledger.wire`'s
# replay band for a cut tailer (docs/adr/shutdown-accounting-and-cancellation-safety.md, decision
# 19). The sink's 10 s `shutdown_grace` outlasts the tailer's 5 s, so the backstop always cuts
# first; the sink then drops its queue and `aggregate`'s send into the closed sink is dropped
# `closed_consumer`, as in sink-outage-stop. The schema is docs/plans/soak-harness.md's "The
# scenario schema".

name = "tail-outage-stop"
description = "tail-rotate with 500ms windows and a 2-batch blocking sink queue: the SUT stopped inside a VictoriaMetrics stop, so the shutdown backstop cuts the tailer's parked send, deferred for the next life"
duration = "6m10s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "4m10s"           # the stops, their recovery, and two progress windows of steady state
compose = "compose.override.yaml"   # mounts the shared directory into the writer and the SUT

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "file"   # a file_out: G is its events.delivered
sut_listener = "tail"
wire = "file"             # W is input.lines; judged against the replay band
sut_transforms = ["parse", "labels", "count", "metrics_only"]   # tail to aggregate, in order

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_lines_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
# The wildcard matches every rotated name, and the writer keeps every file, so the tailer holds
# each one open: about one more descriptor per rotation, some 8 over the run.
fd_growth = 16

[[step]]                  # c0s1: VictoriaMetrics down
at = "0s"
action = "stop"
on = "victoria-metrics"
for = "130s"

# The sink and `window` fill in about 45 s, and each of the four nodes between `window` and the
# tailer holds 64 batches, about 5 s of lines, so the tailer's send parks some 65 s in; 90 s
# leaves it parked when the stop comes. The second life starts while VictoriaMetrics is still
# down.
[[step]]                  # c0s2: the SUT stopped inside it
at = "90s"
action = "stop"
on = "logit"
for = "20s"

[[expect]]
name = "sink-queue-fills"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 2

[[expect]]
name = "aggregate-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "window"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

# The cut itself: the backstop counts the parked send's batch deferred at the tailer, in the
# stopped life's final drain, and drops nothing there.
[[expect]]
name = "listener-batch-deferred"
service = "logit"
metric = "logit.input.batches.deferred"
component = "tail"
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "listener-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "tail"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
max = 0

# What a stop does to a blocked chain: the sink's queue is dropped at shutdown, and the batch
# `aggregate` was sending into the sink's inbox when the sink closed is dropped `closed_consumer`.
[[expect]]
name = "sink-drops-at-shutdown"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "aggregate-closed-consumer"
service = "logit"
metric = "logit.component.events.dropped"
component = "window"
attrs = { reason = "closed_consumer" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

# `block` holds every batch while the SUT runs: the second life, which starts with
# VictoriaMetrics still down, drops nothing.
[[expect]]
name = "sink-holds-after-restart"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s2"
window = "after"
reduce = "delta"
max = 0

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "last"
max = 0

# The second life resumes from the checkpoint the cut left, which still names each file.
[[expect]]
name = "no-resume-rejected"
service = "logit"
metric = "logit.input.files.resume_rejected"
component = "tail"
window = "run"
reduce = "delta"
max = 0

[[expect]]
name = "no-checkpoint-errors"
service = "logit"
metric = "logit.input.checkpoint.errors"
component = "tail"
window = "run"
reduce = "delta"
max = 0
