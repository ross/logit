# tcp-ingress's pipeline with a 16-connection cap, under slow clients that hold its slots
# (docs/plans/soak-harness.md, item 31). The generator's one connection is open from the start,
# before any slot fills, and the clients send only LF bytes, which the framer skips, so they add
# nothing to W and the generator's wire is judged at 0 through every window. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "slowloris-tcp"
description = "generator -> statsd_in (TCP, max_connections 16) under silent, trickling, and half-open clients -> aggregate 10s cumulative -> prometheus_out RW1 zstd -> VictoriaMetrics"
duration = "10m30s"       # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "7m30s"           # >= last recovery (6m15s) + 2 x progress_window

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]                  # component ids the checker reads; no rates here
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
wire = "tcp"              # G output.messages, W input.frames, F the framer's counted drops

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# Eight connections that send nothing: each is closed at the 5 s handshake_timeout, counted and
# never diagnosed, and dialed again a second later.
[[step]]
at = "0s"
action = "slowclient"
on = "logit"
address = "logit:8125"
mode = "silent"
connections = 8
for = "60s"

# 24 connections each sending an LF a second, well inside the 20 s idle_timeout, which re-arms
# on every read that returns bytes: 15 take every free slot and hold it, and the listener
# closes each of the other nine at accept, counted, until the revert. That a byte trickle holds
# its slot is the limit ADR deployment-threat-model documents ("A client trickling bytes holds a
# TCP stream listener's connection permit"), so the scenario pins it: no idle close in the window.
[[step]]
at = "90s"
action = "slowclient"
on = "logit"
address = "logit:8125"
mode = "trickle"
connections = 24
interval = "1s"
for = "90s"

# Eight connections that send one LF, then lose their network with no FIN or RST: past their
# first byte, so the 20 s idle_timeout, not handshake_timeout, closes each.
[[step]]
at = "210s"
action = "slowclient"
on = "logit"
address = "logit:8125"
mode = "half_open"
connections = 8
for = "60s"

# Every client gone: the descriptors they held are back. The SUT holds 17 with the generator's
# connection and nothing else, at warmup and after the clients.
[[step]]
at = "290s"
action = "mark"
on = "logit"
for = "40s"

[[expect]]
name = "silent-closed"
service = "logit"
metric = "logit.input.connections.closed"
component = "statsd"
attrs = { reason = "handshake_timeout" }
step = "c0s1"
window = "during"
reduce = "delta"
min = 8

[[expect]]
name = "slots-full"
service = "logit"
metric = "logit.input.connections.rejected"
component = "statsd"
attrs = { reason = "limit" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "slots-held"
service = "logit"
metric = "logit.input.connections"
component = "statsd"
step = "c0s2"
window = "during"
reduce = "max"
min = 16
max = 16

[[expect]]
name = "trickle-holds"
service = "logit"
metric = "logit.input.connections.closed"
component = "statsd"
step = "c0s2"
window = "during"
reduce = "delta"
max = 0

[[expect]]
name = "half-open-idle"
service = "logit"
metric = "logit.input.connections.closed"
component = "statsd"
attrs = { reason = "idle" }
step = "c0s3"
window = "during"
reduce = "delta"
min = 8

# The generator's one connection stays open through each client's window: a redial into the
# full slots would be refused, so a reconnect names itself here.
[[expect]]
name = "generator-keeps-connection-silent"
service = "generator"
metric = "logit.output.reconnects"
component = "statsd"
step = "c0s1"
window = "during"
reduce = "delta"
max = 0

[[expect]]
name = "generator-keeps-connection-trickle"
service = "generator"
metric = "logit.output.reconnects"
component = "statsd"
step = "c0s2"
window = "during"
reduce = "delta"
max = 0

[[expect]]
name = "generator-keeps-connection-half-open"
service = "generator"
metric = "logit.output.reconnects"
component = "statsd"
step = "c0s3"
window = "during"
reduce = "delta"
max = 0

[[expect]]
name = "fds-released"
service = "logit"
metric = "logit.process.fds"
step = "c0s4"
window = "during"
reduce = "max"
max = 18
