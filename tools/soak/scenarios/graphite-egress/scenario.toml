# statsd-vm's stream into a cumulative `aggregate` and out through `graphite_out` to
# VictoriaMetrics' carbon plaintext listener, which the override turns on. The faults are the
# backend's stop and restart, which make the stream driver redial, netem and a partition on the
# SUT, and two kills of the backend, which measure the frames the sink counted written that
# never reached storage (docs/known-gaps/sinks.md, "A stream sink doesn't count the bytes its
# peer never acknowledged"). The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "graphite-egress"
description = "generator -> statsd_in (UDP) -> aggregate 10s cumulative -> graphite_out plaintext TCP -> VictoriaMetrics :2003"
duration = "18m35s"       # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "15m35s"          # >= last recovery (14m35s) + 2 x progress_window
compose = "compose.override.yaml"   # VictoriaMetrics' -graphiteListenAddr and flush interval

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
# Under `temporality: cumulative` V reads each life's last value, so only this row sees a lost
# middle window, such as one a stream sink counted delivered as the backend went down, and
# ledger.tail counts the samples a backend kill loses.
vm_every_window = true

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

# Carbon has no type, so VictoriaMetrics stores the running total under the path as written,
# with no `_total` suffix.
[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+"}'
# What a SIGKILL of VictoriaMetrics can lose of what it ingested: up to a second in memory, then
# the override's -inmemoryDataFlushInterval 5s before it's on disk. ledger.tail bounds each
# kill's loss by the lines the sink counted from this long before the kill.
kill_unflushed = "6s"

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "120s"

[[step]]
at = "3m"
action = "netem"
on = "logit"
args = "loss 30%"
for = "90s"

# A graceful stop closes the sink's pooled connection; the next send's probe finds it closed,
# and each redial is refused until the backend is back.
[[step]]
at = "5m"
action = "stop"
on = "victoria-metrics"
for = "90s"

[[step]]
at = "7m30s"
action = "restart"
on = "victoria-metrics"
for = "30s"

[[step]]
at = "9m30s"
action = "partition"
on = "logit"
for = "45s"

# A SIGKILL of the backend while windows flow, twice, half a 10 s window apart in phase:
# the kernel closes its connection, so the sink's next send probes it closed and redials, and
# each redial fails until the revert starts VictoriaMetrics again. What it ingested and hadn't
# saved, and anything still in its socket, is gone with nothing counting it; ledger.tail holds
# the sink's written lines to the stored samples, and ledger.windows leaves the gap to it.
[[step]]
at = "11m15s"
action = "kill"
on = "victoria-metrics"
for = "30s"

[[step]]
at = "13m20s"
action = "kill"
on = "victoria-metrics"
for = "30s"

# The sink connects again after each of the backend's stop and restart, and after each kill.
[[expect]]
name = "reconnects-after-stop"
service = "logit"
metric = "logit.output.reconnects"
component = "victoria_metrics"
step = "c0s3"
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "reconnects-after-restart"
service = "logit"
metric = "logit.output.reconnects"
component = "victoria_metrics"
step = "c0s4"
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "reconnects-after-kill"
service = "logit"
metric = "logit.output.reconnects"
component = "victoria_metrics"
step = "c0s6"
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "reconnects-after-second-kill"
service = "logit"
metric = "logit.output.reconnects"
component = "victoria_metrics"
step = "c0s7"
window = "through"
reduce = "delta"
min = 1
