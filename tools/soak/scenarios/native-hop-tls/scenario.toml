# native-hop over mutual TLS from the run's private CA, while the CA rotates both ends'
# certificates. `collector`'s `logit_in` serves a certificate that rotates three times, once
# broken, and reloads on a SIGHUP each time with the poll off; a probe reads the served
# certificate after each SIGHUP. `logit`'s `logit_out` presents a client certificate that
# rotates once and reloads on its own 10 s poll. A graceful restart of `collector` after both
# rotations makes `logit` handshake again with its reloaded certificate against the server's
# new one, and a kill of `logit` replays its spool over TLS to a `collector` that still holds
# its mark. The schema is docs/plans/soak-harness.md's "The scenario schema"; `ledger.hop` is
# its "The native hop".

name = "native-hop-tls"
description = "native-hop with the hop over mutual TLS, under certificate rotations on both ends"
duration = "14m"          # warmup + one cycle + cooldown; --duration overrides
# A second cycle's rotations would name the same days, and a certificate's notAfter must rise.
max_duration = "14m"
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "60s"    # the hop's request_timeout 10s, a sink's retry_max_delay 10s, two windows, a drain
cycle = "11m"             # >= last step's end (9m) + recovery_bound + 2 x progress_window
compose = "compose.override.yaml"   # adds collector, and mounts <run>/tls into both SUTs

[configs]
sut = "logit-sut.yaml"
collector = "logit-collector.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"  # in collector, the chain's last SUT
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.hop]]            # the native hop the ledger follows from logit to collector
from = "logit"
sink = "hop"              # logit's logit_out
to = "collector"
listener = "hop"          # collector's logit_in

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

# The certificates the driver issues from the run's CA, each first valid for 30 days.
# collector's serves `collector`, the name logit dials; logit's is its client one.
[tls.cert.hop]
san = ["collector"]
usage = "server"

[tls.cert.logit]
san = ["logit"]
usage = "client"

# Steps 1 to 3: a rotation of collector's certificate, its SIGHUP, and a probe of what the
# listener then serves. logit's open connection keeps the session it handshook.
[[step]]
at = "0s"
action = "rotate"
on = "collector"
cert = "hop"
days = 31
for = "40s"

[[step]]
at = "10s"
action = "signal"
on = "collector"
signal = "HUP"
for = "10s"

[[step]]
at = "25s"
action = "probe"
on = "collector"
cert = "hop"
port = 7400
for = "5s"

# Step 4: logit's client certificate, which its poll reloads with no signal.
[[step]]
at = "2m"
action = "rotate"
on = "logit"
cert = "logit"
days = 31
for = "40s"

# Step 5: a graceful restart of collector ends logit's connection, and logit handshakes again,
# presenting its reloaded certificate and verifying the server's rotated one. collector
# acknowledges everything it forwarded before it exits.
[[step]]
at = "3m"
action = "restart"
on = "collector"
for = "30s"

# Steps 6 to 8: a broken rotation, whose key doesn't match its certificate. The SIGHUP's reload
# fails, counted, and the listener keeps serving the generation of step 1.
[[step]]
at = "5m"
action = "rotate"
on = "collector"
cert = "hop"
days = 32
broken = true
for = "40s"

[[step]]
at = "5m10s"
action = "signal"
on = "collector"
signal = "HUP"
for = "10s"

[[step]]
at = "5m25s"
action = "probe"
on = "collector"
cert = "hop"
port = 7400
for = "5s"

# Steps 9 to 11: a good rotation after the broken one reloads.
[[step]]
at = "7m"
action = "rotate"
on = "collector"
cert = "hop"
days = 33
for = "40s"

[[step]]
at = "7m10s"
action = "signal"
on = "collector"
signal = "HUP"
for = "10s"

[[step]]
at = "7m25s"
action = "probe"
on = "collector"
cert = "hop"
port = 7400
for = "5s"

# Step 12: logit dies with collector up. The new process loads its client certificate at start
# and replays its spool under the old sender identity over a fresh handshake, and collector,
# holding that identity's mark, acknowledges what it already forwarded without forwarding it.
[[step]]
at = "8m30s"
action = "kill"
on = "logit"
for = "30s"

# Each SIGHUP after a good rotation reloads the listener once, and its notAfter rises by the
# extra day at least.
[[expect]]
name = "server-reload-1"
service = "collector"
metric = "logit.tls.reloads"
component = "hop"
attrs = { outcome = "reloaded" }
step = 2
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "server-expiry-rises-1"
service = "collector"
metric = "logit.tls.certificate.not_after"
component = "hop"
attrs = { side = "server" }
step = 2
window = "through"
reduce = "rise"
min = 86400

[[expect]]
name = "server-reload-2"
service = "collector"
metric = "logit.tls.reloads"
component = "hop"
attrs = { outcome = "reloaded" }
step = 10
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "server-expiry-rises-2"
service = "collector"
metric = "logit.tls.certificate.not_after"
component = "hop"
attrs = { side = "server" }
step = 10
window = "through"
reduce = "rise"
min = 86400

# The broken rotation's SIGHUP fails once, reloads nothing, and leaves notAfter where it was.
[[expect]]
name = "broken-reload-fails"
service = "collector"
metric = "logit.tls.reloads"
component = "hop"
attrs = { outcome = "failed" }
step = 7
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "broken-reloads-nothing"
service = "collector"
metric = "logit.tls.reloads"
component = "hop"
attrs = { outcome = "reloaded" }
step = 7
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "broken-expiry-holds"
service = "collector"
metric = "logit.tls.certificate.not_after"
component = "hop"
attrs = { side = "server" }
step = 7
window = "through"
reduce = "rise"
min = 0
max = 0

# Over the run: one reload per good rotation's SIGHUP, one failure, and nothing the steps
# didn't cause.
[[expect]]
name = "server-reloads-total"
service = "collector"
metric = "logit.tls.reloads"
component = "hop"
attrs = { outcome = "reloaded" }
window = "run"
reduce = "delta"
min = 2
max = 2

[[expect]]
name = "server-failures-total"
service = "collector"
metric = "logit.tls.reloads"
component = "hop"
attrs = { outcome = "failed" }
window = "run"
reduce = "delta"
min = 1
max = 1

# logit's poll reloads its client certificate with no signal.
[[expect]]
name = "client-reload"
service = "logit"
metric = "logit.tls.reloads"
component = "hop"
attrs = { outcome = "reloaded" }
step = 4
window = "through"
reduce = "delta"
min = 1
max = 1

[[expect]]
name = "client-expiry-rises"
service = "logit"
metric = "logit.tls.certificate.not_after"
component = "hop"
attrs = { side = "client" }
step = 4
window = "through"
reduce = "rise"
min = 86400

# After collector's restart, logit handshakes again with both rotated certificates, and every
# drain of collector's new life forwards frames.
[[expect]]
name = "reconnects-after-restart"
service = "logit"
metric = "logit.output.reconnects"
component = "hop"
step = 5
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "frames-after-restart"
service = "collector"
metric = "logit.component.events.sent"
component = "hop"
step = 5
window = "after"
reduce = "min_delta"
min = 1

# The restarted logit's spool replay is deduplicated over TLS.
[[expect]]
name = "replay-deduplicated"
service = "collector"
metric = "logit.input.batches.resends"
component = "hop"
step = 12
window = "after"
reduce = "delta"
min = 1

# No handshake of logit's is refused: a refused one is a `connection_error` on collector. A
# probe closes after its TLS handshake with no `Hello`, which collector diagnoses as one, so the
# run counts one per probe and none around the restart and the kill, where logit handshakes
# again.
[[expect]]
name = "connection-errors-are-the-probes"
service = "collector"
metric = "logit.component.diagnostics"
component = "hop"
attrs = { key = "connection_error" }
window = "run"
reduce = "delta"
min = 3
max = 3

[[expect]]
name = "no-connection-error-after-restart"
service = "collector"
metric = "logit.component.diagnostics"
component = "hop"
attrs = { key = "connection_error" }
step = 5
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "no-connection-error-after-kill"
service = "collector"
metric = "logit.component.diagnostics"
component = "hop"
attrs = { key = "connection_error" }
step = 12
window = "through"
reduce = "delta"
max = 0
