# The ingress SUT in `script/soak`'s native-hop-tls scenario: native-hop's `logit`, its hop over
# TLS to `collector`, verified against the run's CA, presenting a client certificate from it.
# It polls its certificate files every 10 s, so a rotation reaches it with no signal; its open
# connection keeps the certificate it handshook with until it reconnects. Its `internal`
# telemetry goes to stdout as NDJSON for the harness to read; `script/soak` runs it with
# `--log-format json`.
tls_reload_interval: 10s
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  hop:
    type: logit_out
    sources: [statsd]
    endpoint: collector:7400        # the server certificate's DNS name
    concurrency: 32
    request_timeout: 10s
    tls:
      ca_file: /tls/ca.pem          # the override mounts <run>/tls here
      cert_file: /tls/logit/live/cert.pem
      key_file: /tls/logit/live/key.pem
    # The driver kills and starts this container but never recreates it, so a directory in its
    # own filesystem survives the kill with no volume.
    buffer: { disk: { path: /tmp/soak-spool } }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
