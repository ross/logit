# A writer's file rotated the way logrotate's `copytruncate` rotates it, tailed by `logit`
# through a directory the two share under a pattern that matches the rotated copies, out to
# VictoriaMetrics from a disk spool. `file_out` never rotates the file itself; `copytruncate`
# steps copy it to a dated name (`app.log-01`, as `dateext` names it) and truncate it while the
# SUT runs, while it's stopped, and while it's killed, `gzip` steps compress an older copy in
# place, as `delaycompress` does, and a `replace` puts one copy's content back under a new inode
# while the SUT is down, as a restore or a migration does. Each case is a path ADR
# `tail-content-identity` added: a copy claims the original's position (decision 5), a rejected
# entry a copy claims isn't counted gone (decision 6), and a compressed file is skipped
# (decision 2). `ledger.wire` takes each copytruncate's lost and duplicated lines from that
# ADR's residuals and the step's own record (checks.py's `Ledger.copytruncate_band`). The
# schema is docs/plans/soak-harness.md's "The scenario schema".

name = "tail-copytruncate"
description = "writer -> file_out (copytruncate, gzip, replace steps) -> tail_in app.log* -> json -> aggregate 10s cumulative -> prometheus_out RW1 zstd (disk spool) -> VictoriaMetrics"
duration = "15m"          # warmup + one cycle + cooldown; --duration overrides
# Each copytruncate and gzip writes a name the cycle's next run would find taken, so a run
# holds one cycle.
max_duration = "15m"
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "12m"             # the last file step at 10m; the next cycle would start in cooldown
compose = "compose.override.yaml"   # mounts the shared directory into the writer and the SUT

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
vm_every_window = true    # one series, written in every window the tailer reads in

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "file"   # a file_out: G is its events.delivered
sut_listener = "tail"
wire = "file"             # W is input.lines; judged against the replay band
sut_transforms = ["parse", "labels", "count", "metrics_only"]   # tail to aggregate, in order

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_lines_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
# The tailer holds each copy open at its end while the pattern matches it: six copies, two of
# them later compressed and removed, against one file at warmup.
fd_growth = 10

# A copytruncate while the tailer runs: the copy claims the original's state from before the
# truncation and is read from there. Only bytes appended after the copy's last read, which the
# step records, can leave the copy shorter than what the tailer read, and it's read from 0
# instead, inside the band that record grants.
[[step]]
at = "0s"
action = "copytruncate"
on = "generator"
path = "app.log"
to = "app.log-01"
for = "5s"

# A clean stop writes a final checkpoint. The copytruncate inside it leaves app.log refilled
# under its old inode, whose head no longer matches, so the restart rejects that entry and the
# copy claims it at the checkpointed offset: nothing replays, and no `gone` count.
[[step]]
at = "1m"
action = "stop"
on = "logit"
for = "60s"

[[step]]
at = "1m10s"
action = "copytruncate"
on = "generator"
path = "app.log"
to = "app.log-02"
for = "5s"

[[step]]
at = "3m"
action = "copytruncate"
on = "generator"
path = "app.log"
to = "app.log-03"
for = "5s"

# The tailer has read app.log-01 to its end, so compressing it loses nothing; the `.gz` matches
# the pattern and must be skipped, never read as lines.
[[step]]
at = "4m"
action = "gzip"
on = "generator"
path = "app.log-01"
to = "app.log-01.gz"
for = "5s"

# A SIGKILL writes no final checkpoint: the copy made inside the kill claims app.log's last
# checkpointed entry, and what the tailer read after it replays, inside the kill's band. The
# replace gives app.log-02, read to its end before the kill, a new inode with the same bytes;
# it claims the old inode's entry at its end, so nothing replays.
[[step]]
at = "5m"
action = "kill"
on = "logit"
for = "90s"

[[step]]
at = "5m15s"
action = "copytruncate"
on = "generator"
path = "app.log"
to = "app.log-04"
for = "5s"

[[step]]
at = "5m45s"
action = "replace"
on = "generator"
path = "app.log-02"
for = "5s"

[[step]]
at = "8m"
action = "copytruncate"
on = "generator"
path = "app.log"
to = "app.log-05"
for = "5s"

[[step]]
at = "9m"
action = "gzip"
on = "generator"
path = "app.log-03"
to = "app.log-03.gz"
for = "5s"

[[step]]
at = "10m"
action = "copytruncate"
on = "generator"
path = "app.log"
to = "app.log-06"
for = "5s"

# The copy made inside the stop claims app.log's rejected entry at the restart. The copies made
# while the SUT runs claim too, unless a step records bytes appended after its copy's last read;
# `ledger.wire` guards those, granting a re-read of a copy only to such a step.
[[expect]]
name = "stop-copy-claimed"
service = "logit"
metric = "logit.input.files.claimed"
component = "tail"
step = 2
window = "after"
reduce = "delta"
min = 1

# The copy made inside the kill claims app.log's last checkpointed entry, and the replaced copy
# its old inode's entry, both at the restart.
[[expect]]
name = "kill-copy-and-replace-claimed"
service = "logit"
metric = "logit.input.files.claimed"
component = "tail"
step = 6
window = "after"
reduce = "delta"
min = 2

# The restart after the stop and the one after the kill each find app.log refilled under its
# checkpointed inode.
[[expect]]
name = "resumes-rejected"
service = "logit"
metric = "logit.input.files.resume_rejected"
component = "tail"
window = "run"
reduce = "delta"
min = 2

# The four copytruncates while the SUT runs; the two while it's down are rejected resumes.
[[expect]]
name = "truncations-seen"
service = "logit"
metric = "logit.input.files.truncated"
component = "tail"
window = "run"
reduce = "delta"
min = 4

# Each gzip step makes one compressed file under the pattern while the tailer runs.
[[expect]]
name = "compressed-skipped"
service = "logit"
metric = "logit.input.files.skipped"
component = "tail"
attrs = { reason = "compressed" }
window = "run"
reduce = "delta"
min = 2

# A compressed file read as text would be diagnosed as invalid UTF-8.
[[expect]]
name = "no-gzip-lines"
service = "logit"
metric = "logit.component.diagnostics"
component = "tail"
attrs = { key = "invalid_utf8" }
window = "run"
reduce = "delta"
max = 0

# Every rejected entry is claimed by the copy made of it, and every file the tailer finished
# keeps its content, so no entry is counted gone.
[[expect]]
name = "no-gone-bytes"
service = "logit"
metric = "logit.input.bytes.dropped"
component = "tail"
attrs = { reason = "gone" }
window = "run"
reduce = "delta"
max = 0

# Each candidate has one copy, and no two copies share a head.
[[expect]]
name = "no-ambiguous-claims"
service = "logit"
metric = "logit.component.diagnostics"
component = "tail"
attrs = { key = "claim_ambiguous" }
window = "run"
reduce = "delta"
max = 0

[[expect]]
name = "no-checkpoint-errors"
service = "logit"
metric = "logit.input.checkpoint.errors"
component = "tail"
window = "run"
reduce = "delta"
max = 0
