# The broker of `script/soak`'s kafka-oauth-reauth scenario, `apache/kafka:4.2.0` started by
# compose.override.yaml's entrypoint with `kafka-server-start.sh` on this file, bypassing the
# image's environment-to-properties scripts, so every setting the run depends on is here.
#
#   PLAINTEXT  :9092  unauthenticated: the healthcheck, the harness's topic read-back, and the
#                     inter-broker listener
#   OAUTH      :9096  SASL_PLAINTEXT, OAUTHBEARER only: the SUT's `kafka_out`
#
# OAUTHBEARER uses Kafka's own JWT validator: a token's signature must verify against the `idp`
# service's JWKS, which the broker fetches from the namespace holder's address, `sut-net`, and
# caches, and its issuer and audience must match the ones below. compose.override.yaml's
# `KAFKA_OPTS` allows the JWKS URL, which Kafka 4.x requires of every URL the validator fetches.
#
# A session lasts until its token expires, at most `connections.max.reauth.ms`, after which the
# broker closes a connection that sends anything but a re-authentication. The cap, 5 minutes, is
# above the tokens' 60 s, so each token's expiry ends its session.

node.id=1
process.roles=broker,controller
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER

listeners=PLAINTEXT://:9092,OAUTH://:9096,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://kafka:9092,OAUTH://kafka:9096
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,OAUTH:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

listener.name.oauth.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.oauth.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
listener.name.oauth.oauthbearer.sasl.server.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
listener.name.oauth.oauthbearer.connections.max.reauth.ms=300000
sasl.oauthbearer.jwks.endpoint.url=http://sut-net/default/jwks
sasl.oauthbearer.expected.issuer=http://sut-net/default
sasl.oauthbearer.expected.audience=soak

log.dirs=/tmp/kraft-combined-logs
num.partitions=1
auto.create.topics.enable=true
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
