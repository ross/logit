# Metric names that never repeat, at 200 a second, for over an hour. The interner never frees
# (docs/known-gaps/runtime.md, "Event model and interner"), so each name stays interned in the
# SUT and in the generator, which renders it, and both processes' interner strings and RSS grow
# for the whole run. `aggregate` forgets each name three windows after it, so its state stays
# flat and the growth is the interner's. The schema is docs/plans/soak-harness.md's "The
# scenario schema".

name = "cardinality"
description = "statsd-vm's load plus 200 never-repeating metric names a second, for 75 minutes: the interner grows in the SUT and the generator, and rss_slope FAILs on both as expected"
duration = "75m"          # over an hour, which an rss_slope FAIL needs
warmup = "2m"
cooldown = "3m"           # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "30m"

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]         # both inputs share the generator's one statsd sink, so G counts both
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]           # both inputs' series, so V holds every increment
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total|soak_cardinality_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
# Each new name costs each process about 100 bytes of live memory, about 70 MiB an hour at 200
# names a second. The shipped scenarios with a fixed set of names have read -25 to +36 MiB/h.
rss_growth_mib_per_hour = 48
fd_growth = 8

# Both processes intern every name, so both are expected to FAIL rss_slope.
[expected]
rss_slope = { logit = "FAIL", generator = "FAIL" }

[[step]]
at = "5m"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "2m"

[[step]]
at = "15m"
action = "stop"
on = "victoria-metrics"
for = "90s"

# Every name interns one string in each process: 200 a second is 720,000 an hour. No step loses
# a line on the wire, so the SUT sees every name.
[[expect]]
name = "sut-interner-grows"
service = "logit"
metric = "logit.process.interner.strings"
window = "run"
reduce = "slope"
min = 684000              # strings an hour: 95% of 720,000
max = 756000

[[expect]]
name = "generator-interner-grows"
service = "generator"
metric = "logit.process.interner.strings"
window = "run"
reduce = "slope"
min = 684000
max = 756000

# `aggregate` forgets every name it saw once, so its state doesn't grow: 200 idle evictions a
# second over the run window's 70 minutes is 840,000, less the last windows' names still held.
[[expect]]
name = "aggregate-evicts-each-name"
service = "logit"
metric = "logit.transform.series.evicted"
component = "window"
attrs = { reason = "idle" }
window = "run"
reduce = "delta"
min = 798000              # 95% of 840,000

[[expect]]
name = "aggregate-never-hits-its-cap"
service = "logit"
metric = "logit.transform.series.evicted"
component = "window"
attrs = { reason = "cardinality" }
window = "run"
reduce = "delta"
max = 0
