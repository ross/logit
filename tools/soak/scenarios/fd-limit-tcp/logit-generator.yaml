# The load source in `script/soak`'s fd-limit-tcp scenario: 2,000 statsd counter lines a second
# over eight TCP connections to the system under test, one per sink, each sink fed by its own
# 250-line-a-second input in batches of 50. The eight connections are what a limited SUT must
# accept again after its idle timeout closes them. Its `internal` telemetry goes to stdout as
# NDJSON, so the harness reads what it sent.
admin: { bind: 127.0.0.1:9600 }
components:
  load1:
    type: generate_in               # unbounded
    rate: 250
    batch: 50
    event:
      metric: { name: "soak_requests_{seq%100}", kind: sum, value: 1 }
  statsd1:
    type: statsd_out
    sources: [load1]
    endpoint: logit:8125
    transport: tcp                  # output.messages counts a batch once its write completes
    format: statsd
    # 50 batches is 10 s of this sink's load, so a write stalled for connect_timeout (5 s)
    # in a connection the SUT can't accept fills its queue and the loss is counted here;
    # never stall generate_in.
    buffer: { max_batches: 50, overflow: drop_newest, retry_max_delay: 1s }
  load2:
    type: generate_in               # unbounded
    rate: 250
    batch: 50
    event:
      metric: { name: "soak_requests_{seq%100}", kind: sum, value: 1 }
  statsd2:
