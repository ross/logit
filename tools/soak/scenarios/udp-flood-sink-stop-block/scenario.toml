# udp-flood-sink-stop with `receive.overflow: block` and a two-batch sink queue: the 60 s
# VictoriaMetrics stop backs up to the listener, its receive queue blocks instead of evicting,
# and the kernel drops what the socket buffer can't hold. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "udp-flood-sink-stop-block"
description = "a 20,000 lines/s statsd flood with a 60s VictoriaMetrics stop backing up to a blocking receive queue: the kernel drops, logit evicts nothing"
duration = "5m"           # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "3m"              # the stop, its recovery, and two progress windows of steady state

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
sut_aggregate = "window"
sut_sink = "victoria_metrics"
wire_loss_outside_faults = 0.0

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]
at = "0s"
action = "stop"
on = "victoria-metrics"
for = "60s"

[[expect]]
name = "sink-queue-fills"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 2

[[expect]]
name = "kernel-drops"
service = "logit"
metric = "logit.input.kernel.drops"
component = "statsd"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "block-never-evicts"
service = "logit"
metric = "logit.component.datagrams.dropped"
component = "statsd"
step = "c0s1"
window = "during"
reduce = "delta"
max = 0

# A drain sharing its tick with `aggregate`'s flush sees the batch pushed on that tick, so a
# drained queue reads at most 1.
[[expect]]
name = "sink-queue-drains"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "last"
max = 1

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "min"
max = 0

[[expect]]
name = "receive-queue-empties"
service = "logit"
metric = "logit.component.receive.utilization"
component = "statsd"
step = "c0s1"
window = "after"
reduce = "min"
max = 0.05
