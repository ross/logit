# The SUT stops inside a VictoriaMetrics outage that has backed the chain up to the listener:
# VictoriaMetrics is stopped 100 s, and 60 s into that the SUT is stopped for 20 s. Its shutdown
# drops the sink's queue, `aggregate`'s send into the closed sink is dropped `closed_consumer`,
# and the runtime's shutdown backstop cuts `statsd_in`'s send parked on `aggregate`'s full inbox,
# counting the batch and its events dropped `shutdown`
# (docs/adr/shutdown-accounting-and-cancellation-safety.md). The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "sink-outage-stop"
description = "statsd-vm with 500ms windows and a 2-batch blocking sink queue: the SUT stopped inside a VictoriaMetrics stop, so the shutdown backstop cuts the listener's parked send"
duration = "5m40s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "3m40s"           # the stops, their recovery, and two progress windows of steady state

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]         # one per generator the ledger follows into the SUT
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]           # one per SUT sink the ledger follows to its backend
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]                  # c0s1: VictoriaMetrics down
at = "0s"
action = "stop"
on = "victoria-metrics"
for = "100s"

# 60 s fills the sink's queue and inbox and then `aggregate`'s, so the listener's send is parked
# when the stop comes; the second life starts while VictoriaMetrics is still down.
[[step]]                  # c0s2: the SUT stopped inside it
at = "60s"
action = "stop"
on = "logit"
for = "20s"

[[expect]]
name = "sink-queue-fills"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 2

[[expect]]
name = "aggregate-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "window"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

# The cut itself: the backstop counts the parked send's batch and its events dropped `shutdown`
# at the listener, in the stopped life's final drain.
[[expect]]
name = "listener-batch-cut"
service = "logit"
metric = "logit.component.batches.dropped"
component = "statsd"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "listener-events-cut"
service = "logit"
metric = "logit.component.events.dropped"
component = "statsd"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

# What a stop does to a blocked chain: the sink's queue is dropped at shutdown, and the batch
# `aggregate` was sending into the sink's inbox when the sink closed is dropped `closed_consumer`.
[[expect]]
name = "sink-drops-at-shutdown"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "aggregate-closed-consumer"
service = "logit"
metric = "logit.component.events.dropped"
component = "window"
attrs = { reason = "closed_consumer" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

# `block` holds every batch while the SUT runs: the second life, which starts with
# VictoriaMetrics still down, drops nothing.
[[expect]]
name = "sink-holds-after-restart"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s2"
window = "after"
reduce = "delta"
max = 0

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "last"
max = 0
