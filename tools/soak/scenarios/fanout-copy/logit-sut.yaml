# The system under test in `script/soak`'s fanout-copy scenario: statsd over UDP, a 10 s
# cumulative aggregate, and two remote-write sinks fed by one fan-out, each to its own
# VictoriaMetrics. Each sink receives every batch, so each backend holds a full copy. Its
# `internal` telemetry goes to stdout as NDJSON for the harness to read.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  vm_a:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd               # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  vm_b:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics-b:8428/api/v1/write
    version: 1
    compression: zstd
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
