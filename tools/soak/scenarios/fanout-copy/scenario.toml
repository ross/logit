# statsd-vm with two sinks fed by one fan-out, each delivering to its own VictoriaMetrics, under
# faults on one backend, then the other, then both. Each sink holds a full copy, so each backend's
# total is judged against `aggregate` on its own (`split = "copy"`). The default sink queues hold
# a 90 s outage, so a stop on one backend never stalls the other. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "fanout-copy"
description = "statsd-vm fanned out to two sinks and two VictoriaMetrics: one backend stopped, then netem on the other, then both stopped"
duration = "12m30s"       # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "9m30s"           # >= last recovery (8m15s) + 2 x progress_window
compose = "compose.override.yaml"   # adds victoria-metrics-b

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
split = "copy"            # each sink receives every batch `window` sends

[[ledger.sink]]
id = "vm_a"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[[ledger.sink]]
id = "vm_b"
backend = "victoria-metrics-b"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

[[step]]                  # c0s1: B down alone
at = "0s"
action = "stop"
on = "victoria-metrics-b"
for = "90s"

[[step]]                  # c0s2: A's responses lossy
at = "3m"
action = "netem"
on = "victoria-metrics"
args = "loss 30%"
for = "60s"

[[step]]                  # c0s3 and c0s4: both down, overlapping by 60 s
at = "5m30s"
action = "stop"
on = "victoria-metrics"
for = "90s"

[[step]]
at = "6m"
action = "stop"
on = "victoria-metrics-b"
for = "90s"

# B's stop holds its queue and never A's: A delivers each window it sends, nine in 90 s.
[[expect]]
name = "a-delivers-while-b-stopped"
service = "logit"
metric = "logit.component.batches.delivered"
component = "vm_a"
step = "c0s1"
window = "during"
reduce = "delta"
min = 6

[[expect]]
name = "b-queues-while-stopped"
service = "logit"
metric = "logit.component.buffer.batches"
component = "vm_b"
step = "c0s1"
window = "during"
reduce = "max"
min = 5

[[expect]]
name = "b-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_b"
step = 1
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "a-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_a"
step = 3
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "b-drops-nothing-overlapping"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_b"
step = 4
window = "through"
reduce = "delta"
max = 0
