# The system under test in `script/soak`'s standin-datadog scenario: statsd-datadog's SUT with
# `datadog_out` posting series to the scripted stand-in instead of Datadog's intake. Its
# `internal` telemetry goes to stdout as NDJSON for the harness to read; `script/soak` runs it
# with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    # Delta: each window's increment goes out as a Datadog `count`, and V is the sum of the
    # points the stand-in stored. The series route skips a cumulative `Sum`.
    temporality: delta
  host:
    type: set
    sources: [window]
    # datadog_out reads `host.name` from the resource, and a count's interval in seconds from
    # `_logit.datadog.interval`, the window above.
    resource:
      host.name: logit-soak
    attributes:
      _logit.datadog.interval: 10
  datadog:
    type: datadog_out
    sources: [host]
    api_key: soak-standin           # the stand-in checks no key
    # Series go to the stand-in's /api/v2/series over plain HTTP.
    endpoints: { api: http://standin:8080 }
    compression: gzip               # the default, written out: the checks decode it with zlib
    # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
