# tail-rotate with `timestamp` and `drop_stale` in the path: each line carries the time the
# writer made it, and `drop_stale` discards one more than 50 s old, counted in its
# `events.discarded`, which `ledger.edge` takes out of its hop and the rest of the ledger out of
# what reached `aggregate`. A fault that keeps the tailer from reading for longer than 50 s
# leaves a backlog whose oldest lines are stale when it reads them: the pause, the 90 s stop,
# and the 150 s kill. The 30 s kill replays lines about 40 s old, which stay fresh, and so does
# the restart. The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "tail-rotate-stale"
description = "writer -> file_out (rotating) -> tail_in -> json -> timestamp -> drop_stale 50s -> aggregate 10s cumulative -> prometheus_out RW1 zstd (disk spool) -> VictoriaMetrics"
duration = "14m45s"       # warmup + one cycle + cooldown; --duration overrides
# As tail-rotate's: the tailer gains about one descriptor per 44 s rotation, about 34 by 25
# minutes, inside fd_growth's 40, and the writer keeps every file for about 74 minutes.
max_duration = "25m"
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "11m45s"          # >= last recovery (10m45s) + 2 x progress_window
compose = "compose.override.yaml"   # mounts the shared directory into the writer and the SUT

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
vm_every_window = true    # one series; every window holds a fresh line, a backlog's newest

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "file"   # a file_out: G is its events.delivered
sut_listener = "tail"
wire = "file"             # W is input.lines; judged against the replay band
# tail to aggregate, in order; `fresh` discards, counted
sut_transforms = ["parse", "stamp", "labels", "count", "metrics_only", "fresh"]

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_lines_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 40                 # one descriptor per rotation, as for tail-rotate

# The tailer stops reading for 60 s; the writer doesn't, so the first 10 s or so of its
# backlog is stale when the tailer reads it.
[[step]]
at = "0s"
action = "pause"
on = "logit"
for = "60s"

# A clean stop writes a final checkpoint, so nothing replays; the 90 s backlog's first 40 s
# and more is stale (the `stop-discards` bounds).
[[step]]
at = "2m"
action = "stop"
on = "logit"
for = "90s"

[[step]]
at = "4m30s"
action = "restart"
on = "logit"
for = "30s"

# A SIGKILL writes no final checkpoint: the restarted tailer reads the lines since the last
# 5 s checkpoint again, the oldest about 30 + 5 s old plus the start, under 50 s.
[[step]]
at = "6m"
action = "kill"
on = "logit"
for = "30s"

# The longer kill spans about three rotations, and most of its backlog is stale.
[[step]]
at = "7m30s"
action = "kill"
on = "logit"
for = "150s"

[[expect]]
name = "files-rotated"
service = "logit"
metric = "logit.input.files.rotated"
component = "tail"
window = "run"
reduce = "delta"
min = 1

[[expect]]
name = "no-resume-rejected"
service = "logit"
metric = "logit.input.files.resume_rejected"
component = "tail"
window = "run"
reduce = "delta"
max = 0

[[expect]]
name = "no-checkpoint-errors"
service = "logit"
metric = "logit.input.checkpoint.errors"
component = "tail"
window = "run"
reduce = "delta"
max = 0

# Every line carries an RFC 3339 `timestamp` that resolves.
[[expect]]
name = "timestamps-resolved"
service = "logit"
metric = "logit.transform.timestamp.resolved"
component = "stamp"
window = "run"
reduce = "delta"
min = 1

[[expect]]
name = "no-timestamp-invalid"
service = "logit"
metric = "logit.transform.timestamp.skipped"
component = "stamp"
attrs = { reason = "invalid" }
window = "run"
reduce = "delta"
max = 0

[[expect]]
name = "pause-discards"
service = "logit"
metric = "logit.component.events.discarded"
component = "fresh"
step = "c0s1"
window = "after"
reduce = "delta"
min = 1

# The stop leaves the tailer unread for S = 90 s at 1,000 lines a second, so it discards about
# rate x (S - max_age + L), L being the time from the start to reading past the backlog's last
# stale line: 40,000 plus 1,000 a second of L. 2,000 below covers the step's own timing and the
# writer's 100-line stamps; 6,000 above covers L up to 6 s, a start and a backlog read at
# 10,000 lines a second or faster.
[[expect]]
name = "stop-discards"
service = "logit"
metric = "logit.component.events.discarded"
component = "fresh"
step = "c0s2"
window = "after"
reduce = "delta"
min = 38000
max = 46000

[[expect]]
name = "restart-keeps-fresh"
service = "logit"
metric = "logit.component.events.discarded"
component = "fresh"
step = "c0s3"
window = "through"
reduce = "delta"
max = 0

# A node that discarded fresh lines would count here.
[[expect]]
name = "short-kill-keeps-fresh"
service = "logit"
metric = "logit.component.events.discarded"
component = "fresh"
step = "c0s4"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "long-kill-discards"
service = "logit"
metric = "logit.component.events.discarded"
component = "fresh"
step = "c0s5"
window = "after"
reduce = "delta"
min = 1
