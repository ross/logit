# The system under test in `script/soak`'s tail-rotate-stale scenario: `tail_in` follows the
# writer's rotating file through the directory they share, `json` parses each line, `timestamp`
# gives each event the time the writer stamped on its line, and `drop_stale` discards a line
# more than 50 s old before each becomes one `soak_lines` increment in a 10 s cumulative
# aggregate, sent as remote-write 1.0 (zstd) to VictoriaMetrics from a disk spool. Its
# `internal` telemetry goes to stdout as NDJSON for the harness to read; `script/soak` runs it
# with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  tail:
    type: tail_in
    # The wildcard matches the writer's rotated names (`app.log.1`, `app.log.2`, ...), so a
    # file renamed away is followed by inode and read to its end, never lost.
    paths: ["/shared/app.log*"]
    read_from: beginning
    # The image creates /var/lib/logit for its unprivileged user. The driver never recreates
    # the container, so the checkpoint survives a stop and a kill.
    checkpoint_path: /var/lib/logit/tail.checkpoint
    checkpoint_interval: 5s
  # Every node between `tail` and `window` sends each event it receives or counts it in
  # `events.discarded`, which `ledger.edge` checks hop by hop: `json` passes a line it can't
  # parse through unchanged, and `timestamp` forwards a line it can't resolve.
  parse: { type: json, sources: [tail] }
  # `tail_in` stamps each line with the time it read it; the writer's `file_out` wrote the
  # time it generated the line as the object's top-level `timestamp`, which `parse` made an
  # attribute. It goes ahead of `labels`, which removes that attribute.
  stamp: { type: timestamp, sources: [parse], from: timestamp, format: rfc3339 }
  labels: { type: keep, sources: [stamp], fields: [id] }   # no line carries `id`: no labels
  count:
    type: kv_metrics
    sources: [labels]
    counters: [{ name: soak_lines }]   # no `field`: +1 per event
  metrics_only:                     # else `window` passes each line's log on to the sink
    type: keep_signals
    sources: [count]
    signals: [metrics]
  # Immediately ahead of `window`, as `drop_stale` must be ahead of any node that keeps state.
  # 50 s clears what a 30 s kill replays, the lines read since the last 5 s checkpoint, which
  # are about 40 s old when the restarted tailer reads them again.
  fresh:
    type: drop_stale
    sources: [metrics_only]
    max_age: 50s
  window:
    type: aggregate
    sources: [fresh]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd
    # A disk spool keeps the sink's queue through a kill, so the egress band covers only
    # `aggregate`'s window, as for spool-kill-replay.
    buffer: { disk: { path: /tmp/soak-spool } }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
