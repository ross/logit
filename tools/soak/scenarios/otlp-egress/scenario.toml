# statsd-vm's stream into a cumulative `aggregate` and out through `otlp_out` over HTTP to
# VictoriaMetrics' `/opentelemetry` route, under netem, a partition, and a kill of the SUT, and a
# stop and a restart of the backend. The schema is docs/plans/soak-harness.md's "The scenario
# schema".

name = "otlp-egress"
description = "generator -> statsd_in (UDP) -> aggregate 10s cumulative -> otlp_out HTTP -> VictoriaMetrics /opentelemetry"
duration = "16m"          # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # the request timeout 10s, retry_max_delay 10s, two aggregate windows, a drain
cycle = "13m"             # >= last recovery (11m45s) + 2 x progress_window

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
vm_every_window = true

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

# VictoriaMetrics stores an OTLP sum under its own name, with no `_total` suffix.
[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "120s"

# A lost segment can stall a request past the sink's 10 s timeout, which it resends.
[[step]]
at = "3m"
action = "netem"
on = "logit"
args = "loss 30%"
for = "90s"

[[step]]
at = "5m"
action = "stop"
on = "victoria-metrics"
for = "90s"

[[step]]
at = "7m30s"
action = "restart"
on = "victoria-metrics"
for = "30s"

[[step]]
at = "8m45s"
action = "kill"
on = "logit"
for = "30s"

[[step]]
at = "10m15s"
action = "partition"
on = "logit"
for = "45s"

# The sink holds the queue through the backend's stop and drops nothing.
[[expect]]
name = "retrying-through-stop"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s3"
window = "during"
reduce = "max"
min = 1

[[expect]]
name = "no-batch-dropped"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
window = "run"
reduce = "delta"
max = 0
