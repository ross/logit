# The SUT stops inside a VictoriaMetrics outage that has backed the chain up to an HTTP
# listener: VictoriaMetrics is stopped 100 s, and 60 s into that the SUT is stopped for 20 s.
# `influxdb_in` sends each request's batch under a deadline 5 s from the start of its send and
# answers `503` busy with nothing taken when it passes, counting `logit.input.batches.deferred`.
# A request parked at the signal started its send before it, so that deadline passes before the
# listener's 5 s shutdown grace does: the listener answers it `503` and returns, the runtime's
# shutdown backstop finds no send to cut, and the client resends the batch to the next life.
# G counts only the points the SUT answered `204` for, so the ledger judges every window. The
# sink drops its queue and `aggregate`'s send into the closed sink is dropped `closed_consumer`,
# as in sink-outage-stop. The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "http-outage-stop"
description = "http-ingress with the SUT stopped inside a VictoriaMetrics stop: influxdb_in answers its parked request 503 inside the shutdown grace, and the client resends it"
duration = "5m40s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"    # the generator's retry_max_delay 1s, the sink's 10s, and a drain
cycle = "3m40s"           # the stops, their recovery, and two progress windows of steady state

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "influx"
sut_listener = "influx"
sut_transforms = ["count"]
wire = "http"             # G events.delivered, W the listener's events.sent

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_requests_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]                  # c0s1: VictoriaMetrics down
at = "0s"
action = "stop"
on = "victoria-metrics"
for = "100s"

# 60 s fills the sink's queue and every inbox back to the listener, so a request is parked
# when the stop comes; the second life starts while VictoriaMetrics is still down.
[[step]]                  # c0s2: the SUT stopped inside it
at = "60s"
action = "stop"
on = "logit"
for = "20s"

[[expect]]
name = "sink-queue-fills"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 2

[[expect]]
name = "aggregate-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "window"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

# The parked request is answered busy in the stopped life's final drain, and nothing is cut.
[[expect]]
name = "listener-defers"
service = "logit"
metric = "logit.input.batches.deferred"
component = "influx"
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "listener-cuts-nothing"
service = "logit"
metric = "logit.component.events.dropped"
component = "influx"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
max = 0

[[expect]]
name = "generator-retries-503s"
service = "generator"
metric = "logit.output.requests"
component = "influx"
attrs = { class = "5xx" }
step = "c0s1"
window = "through"
reduce = "delta"
min = 1

# What a stop does to a blocked chain: the sink's queue is dropped at shutdown, and the batch
# `aggregate` was sending into the sink's inbox when the sink closed is dropped `closed_consumer`.
[[expect]]
name = "sink-drops-at-shutdown"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
attrs = { reason = "shutdown" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "aggregate-closed-consumer"
service = "logit"
metric = "logit.component.events.dropped"
component = "window"
attrs = { reason = "closed_consumer" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

# `block` holds every batch while the SUT runs: the second life, which starts with
# VictoriaMetrics still down, drops nothing.
[[expect]]
name = "sink-holds-after-restart"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s2"
window = "after"
reduce = "delta"
max = 0

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "last"
max = 0
