# The load source in `script/soak`'s http-ingress scenario: 2,000 InfluxDB points a second to the
# system under test over `/api/v2/write`, each batch of 100 one request. Its `internal`
# telemetry goes to stdout as NDJSON, so the harness reads what it sent.
admin: { bind: 127.0.0.1:9600 }
components:
  load:
    type: generate_in               # unbounded
    rate: 2000
    batch: 100
    event:
      # One point per event, `soak_requests,series=<n> n="1"`: the carrier names the
      # measurement, and a string field rides as a field, so the SUT decodes no metric of its
      # own and its `kv_metrics` counts one per point. A batch holds each `series` once, so
      # no two points in one body share a series and timestamp, which the SUT's decoder would
      # merge.
      attributes:
        _logit.influxdb.measurement: soak_requests
        series: "{seq%100}"
        influxdb.field.n: "1"
  influx:
    type: influxdb_out
    sources: [load]
    url: http://logit:8086
    org: soak
    bucket: soak
    token: soak
    # 50 batches is 2.5 s of load, so a SUT that answers nothing for longer overflows it and
    # the loss is counted here; never stall generate_in. The default posture, at_least_once,
    # resends a batch whose answer was lost.
    buffer: { max_batches: 50, overflow: drop_newest, retry_max_delay: 1s }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
