# statsd-vm's stream into a cumulative `aggregate` and out through `otlp_out` over gRPC to a
# second `logit`, `collector`, which passes it on with `prometheus_out` to VictoriaMetrics, whose
# OTLP route is HTTP only. `collector` is the sink's relay: `logit` holds `aggregate` and the
# sink the ledger follows, and V splits on `logit`'s lives. Faults on the gRPC link and on each
# process, and a stop of the backend. The schema is docs/plans/soak-harness.md's "The scenario
# schema".

name = "otlp-grpc-egress"
description = "generator -> statsd_in (UDP) -> aggregate 10s cumulative -> otlp_out gRPC -> collector: otlp_in -> prometheus_out RW1 zstd -> VictoriaMetrics"
duration = "17m"          # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "60s"    # request timeout 10s + two sinks' retry_max_delay 10s + 2 windows + a drain
cycle = "14m"             # >= last recovery (13m) + 2 x progress_window
compose = "compose.override.yaml"   # adds collector, the relay

[configs]
sut = "logit-sut.yaml"
collector = "logit-collector.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
# No vm_every_window: a kill of collector loses the windows in its sink's queue, by design,
# and the next window's totals cover them.

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

# `logit`'s `otlp_out`, whose writes `collector` carries to VictoriaMetrics; `prometheus_out`
# adds the `_total` suffix to a monotonic sum.
[[ledger.sink]]
id = "collector"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'
relay = "collector"

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

# The gRPC link: logit's requests delayed, then 30% of its segments lost.
[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "120s"

[[step]]
at = "2m30s"
action = "netem"
on = "logit"
args = "loss 30%"
for = "90s"

[[step]]
at = "4m30s"
action = "partition"
on = "collector"
for = "45s"

# A graceful stop: collector finishes the requests it took before it exits.
[[step]]
at = "6m"
action = "stop"
on = "collector"
for = "30s"

# A pause holds a request past otlp_out's 10 s timeout, which it resends.
[[step]]
at = "7m15s"
action = "pause"
on = "collector"
for = "30s"

# collector dies with windows in its sink's queue; the next window's totals cover them.
[[step]]
at = "8m30s"
action = "kill"
on = "collector"
for = "30s"

[[step]]
at = "9m45s"
action = "stop"
on = "victoria-metrics"
for = "60s"

[[step]]
at = "11m30s"
action = "kill"
on = "logit"
for = "30s"

# The sink holds the queue through collector's stop and drops nothing.
[[expect]]
name = "retrying-through-collector-stop"
service = "logit"
metric = "logit.component.retrying"
component = "collector"
step = "c0s4"
window = "during"
reduce = "max"
min = 1

[[expect]]
name = "no-batch-dropped"
service = "logit"
metric = "logit.component.batches.dropped"
component = "collector"
window = "run"
reduce = "delta"
max = 0
