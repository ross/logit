# The ingress SUT in `script/soak`'s otlp-grpc-egress scenario: statsd over UDP, a 10 s
# cumulative aggregate, and `otlp_out` over gRPC to `collector`. Each point is a series' running
# total, so a resent request repeats a total rather than adding to it. Its `internal` telemetry
# goes to stdout as NDJSON for the harness to read; `script/soak` runs it with
# `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  collector:
    type: otlp_out
    sources: [window]
    endpoint: http://collector:4317
    protocol: grpc                  # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
