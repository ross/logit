# The relay in `script/soak`'s otlp-grpc-egress scenario: OTLP/gRPC from `logit`'s `otlp_out`,
# passed on unchanged as remote-write 1.0 (zstd) to VictoriaMetrics, whose OTLP route is HTTP
# only. It holds no `aggregate`: the running totals and their timestamps are `logit`'s. Its
# `internal` telemetry goes to stdout as NDJSON for the harness to read; `script/soak` runs it
# with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  otlp: { type: otlp_in, bind: 0.0.0.0:4317, protocol: grpc }
  victoria_metrics:
    type: prometheus_out
    sources: [otlp]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd               # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
