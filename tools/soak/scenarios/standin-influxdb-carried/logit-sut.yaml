# The system under test in `script/soak`'s standin-influxdb-carried scenario: standin-influxdb's
# SUT with no bucket or org configured, so `influxdb_out` writes to the ones each batch carries.
# A `set` after `aggregate` stamps the carriers `influxdb_in` would, as a relay's sender chose
# them. Its `internal` telemetry goes to stdout as NDJSON for the harness to read; `script/soak`
# runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    # Delta: each window's increment is one point, and V is the sum of the points the stand-in
    # stored, so a rejected window is a gap the ledger can count.
    temporality: delta
  carriers:
    type: set
    sources: [window]
    # The carriers influxdb_in sets from a write's query. With both org carriers set, the sink
    # sends `org=` and `orgID=`.
    resource:
      _logit.influxdb.bucket: soak-carried
      _logit.influxdb.org: soak-org
      _logit.influxdb.org_id: 0123456789abcdef
  influx:
    type: influxdb_out
    sources: [carriers]
    url: http://standin:8080        # the stand-in checks no token
    token: soak-standin
    # No bucket, org, default_bucket, or default_org: every value is carried.
    # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
