# The system under test in `script/soak`'s spool-enospc scenario: statsd-vm's SUT with its sink on
# a disk spool whose directory is a 128 KiB tmpfs (the scenario's compose override), so a long
# VictoriaMetrics stop fills the filesystem before the spool reaches its own bound. Its
# `internal` telemetry goes to stdout as NDJSON for the harness to read; `script/soak` runs it
# with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd
    # max_bytes is far above the tmpfs the override mounts at the spool path, so a write fails
    # with ENOSPC before the spool's own bound applies.
    buffer:
      disk: { path: /tmp/soak-spool, max_bytes: 4MiB, segment_bytes: 16KiB }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
