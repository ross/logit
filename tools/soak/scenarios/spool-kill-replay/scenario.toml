# A disk-spooled sink survives a SIGKILL: VictoriaMetrics stops for 150 s, and 60 s into that
# the SUT is killed with no shutdown signal and started again 30 s later, while VictoriaMetrics is
# still down. The totals the first process spooled are replayed by the second, which keeps
# spooling until VictoriaMetrics is back, so the killed life's egress lands in VictoriaMetrics.
# The schema is docs/plans/soak-harness.md's "The scenario schema"; how the ledger judges a
# killed life is its "Which life a hop is judged in".

name = "spool-kill-replay"
description = "statsd-vm with a disk-spooled sink: a SIGKILL inside a 150s VictoriaMetrics stop, replayed by the next process"
duration = "6m15s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "4m15s"           # the stop, its recovery, and two progress windows of steady state

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
sut_aggregate = "window"
sut_sink = "victoria_metrics"
wire_loss_outside_faults = 0.0

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]
at = "0s"
action = "stop"
on = "victoria-metrics"
for = "150s"

# The second life starts while VictoriaMetrics is still down, so it replays the spool into a
# sink that keeps retrying, and spools on top of it.
[[step]]
at = "60s"
action = "kill"
on = "logit"
for = "30s"

# The spool holds every window the outage queues.
[[expect]]
name = "spool-holds-the-outage"
service = "logit"
metric = "logit.component.buffer.disk.segments"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 1

[[expect]]
name = "spool-queues-windows"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 2

# The restarted process finds the killed one's records at open.
[[expect]]
name = "spool-replayed-at-restart"
service = "logit"
metric = "logit.component.buffer.disk.replayed"
component = "victoria_metrics"
step = "c0s2"
window = "after"
reduce = "delta"
min = 1

# A replay happens once, at open: delivering the backlog once VictoriaMetrics is back opens
# nothing.
[[expect]]
name = "no-second-replay"
service = "logit"
metric = "logit.component.buffer.disk.replayed"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "delta"
max = 0

[[expect]]
name = "sink-never-drops"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "last"
max = 0
