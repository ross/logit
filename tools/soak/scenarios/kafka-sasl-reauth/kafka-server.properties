# The broker of `script/soak`'s kafka-sasl-reauth scenario, `apache/kafka:4.2.0` started by
# compose.override.yaml's entrypoint with `kafka-server-start.sh` on this file, bypassing the
# image's environment-to-properties scripts, so every setting the run depends on is here.
#
#   PLAINTEXT  :9092  unauthenticated: the healthcheck, the harness's topic read-back, and the
#                     inter-broker listener
#   SASLP      :9096  SASL_PLAINTEXT, SCRAM-SHA-512 only: the SUT's `kafka_out`
#
# The SCRAM user is `logit` with the password `logit-secret`, a throwaway for this stack, which
# `kafka-storage.sh format --add-scram` writes into the metadata log. A restart keeps the log and
# with it the credential.
#
# A SCRAM session on SASLP lasts `connections.max.reauth.ms`, 30 s, after which the broker closes
# a connection that sends anything but a re-authentication. `kafka_out` redials instead, so the
# run renews the session about once every 20 s per connection.

node.id=1
process.roles=broker,controller
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER

listeners=PLAINTEXT://:9092,SASLP://:9096,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://kafka:9092,SASLP://kafka:9096
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,SASLP:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

listener.name.saslp.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.saslp.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.saslp.scram-sha-512.connections.max.reauth.ms=30000

log.dirs=/tmp/kraft-combined-logs
num.partitions=1
auto.create.topics.enable=true
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
