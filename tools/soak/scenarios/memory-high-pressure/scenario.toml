# memory-high with the throttle between the SUT's steady memory and what its bounded queues
# cost in the outage, so the kernel throttles and reclaims from it while the queues fill.
# Over `memory.high` the kernel throttles, never kills: no OOM is expected, and whatever the
# slowed SUT can't take must be counted. The `cgroup` revert counts how often the throttle
# engaged, and `timeline` reports it. The schema is docs/plans/soak-harness.md's "The scenario
# schema".

name = "memory-high-pressure"
description = "sink-outage-block with memory.high at 36M on the SUT's cgroup, below the outage's 42 MiB: the kernel throttles and reclaims, and nothing is lost uncounted"
duration = "6m"           # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "4m"              # the throttle around the stop, its recovery, and two progress windows

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]         # one per generator the ledger follows into the SUT
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]           # one per SUT sink the ledger follows to its backend
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

# With no throttle the SUT's cgroup peaked at 42.0 MiB and its resident memory at 45.5 MiB
# through this outage, against 26 to 30 MiB steady (20261104T020422Z). The throttle sits
# between the two, opens before the outage, and closes after its recovery.
[[step]]
at = "0s"
action = "cgroup"
on = "logit"
memory_high = "36M"
for = "160s"

[[step]]
at = "10s"
action = "stop"
on = "victoria-metrics"
for = "90s"

[[expect]]
name = "sink-queue-fills"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s2"
window = "during"
reduce = "max"
min = 2

[[expect]]
name = "sink-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "victoria_metrics"
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "aggregate-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "window"
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "listener-drops-counted"
service = "logit"
metric = "logit.component.datagrams.dropped"
component = "statsd"
attrs = { reason = "overflow_oldest" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

# The chain stays blocked until the sink's next retry after the revert, up to its
# `retry_max_delay` later, so a bound that must hold for the whole episode reads `through`.
[[expect]]
name = "no-kernel-drops"
service = "logit"
metric = "logit.input.kernel.dropped"
component = "statsd"
step = "c0s2"
window = "through"
reduce = "delta"
max = 0

# `block` at the sink holds every batch: none is dropped, whatever the outage's length.
[[expect]]
name = "sink-never-drops"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s2"
window = "through"
reduce = "delta"
max = 0

# A drain sharing its tick with `aggregate`'s flush sees the batch pushed on that tick, so a
# drained queue reads at most 1.
[[expect]]
name = "sink-queue-drains"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s2"
window = "after"
reduce = "last"
max = 1

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s2"
window = "after"
reduce = "min"
max = 0
