# The system under test in `script/soak`'s standin-influxdb scenario: statsd-vm's SUT with
# `influxdb_out` writing line protocol to the scripted stand-in, its bucket and org configured.
# Its `internal` telemetry goes to stdout as NDJSON for the harness to read; `script/soak` runs
# it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    # Delta: each window's increment is one point, and V is the sum of the points the stand-in
    # stored, so a rejected window is a gap the ledger can count.
    temporality: delta
  influx:
    type: influxdb_out
    sources: [window]
    url: http://standin:8080        # the stand-in checks no token
    token: soak-standin
    bucket: soak
    org: soak-org
    # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
