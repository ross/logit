# The load source in `script/soak`'s syslog-tcp-ingress scenario: 2,000 log lines a second as
# RFC 5424 syslog over one TCP connection to the system under test, octet-counted, each batch of
# 100 messages one write. `syslog_out` runs its default posture, `at_least_once`, so it resends a
# batch after an ambiguous attempt instead of dropping it. Its `internal` telemetry goes to
# stdout as NDJSON, so the harness reads what it sent.
admin: { bind: 127.0.0.1:9600 }
components:
  load:
    type: generate_in               # unbounded
    rate: 2000
    batch: 100
    event:
      log: "id={seq%50}"            # the SUT's `kv` reads `id`, one series per value
  syslog:
    type: syslog_out
    sources: [load]
    endpoint: logit:6514
    transport: tcp                  # output.messages counts a batch once its write completes
    hostname: soak
    app_name: soak-syslog
    # 50 batches is 2.5 s of load, so a write stalled for connect_timeout (5 s) overflows it and
    # the loss is counted here; never stall generate_in.
    buffer: { max_batches: 50, overflow: drop_newest, retry_max_delay: 1s }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
