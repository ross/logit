# statsd-vm with a `sample` keyed on a DogStatsD `shard` tag between the listener and
# `aggregate`, under stops, a kill, and a restart of the SUT. `sample` discards a shard's every
# line, counted in its `events.discarded`, which `ledger.edge` judges at the node and the rest of
# the ledger takes out of what reached `aggregate`. The verdict is a hash of the key with nothing
# carried across a restart, so `ledger.absent` requires that the backend holds no series of a
# discarded shard from any SUT life. The schema is docs/plans/soak-harness.md's "The scenario
# schema".
#
# The kept set, from `logit_core::sampling`'s frozen contract: XXH64 with seed 0 over the tag's
# bytes (statsd_in reads `shard:3` as the string "3"), kept when the hash's top 53 bits are
# below 0.5 x 2^53, which at `rate: 0.5` is a hash below 2^63, a clear top bit:
#
#   shard  XXH64("<shard>")    kept
#   0      633457081244afec    yes
#   1      b7b41276360564d4    no
#   2      6021b5621680598b    yes
#   3      26167c2af5162ca4    yes
#   4      913914322ca46b89    no
#   5      6a81b47405b648ed    yes
#   6      122ebd68645a7cf7    yes
#   7      184a52b6a00d7ab7    yes
#   8      ad4662bb7caac864    no
#   9      1d35ed3e41ee029a    yes
#
# Any XXH64 implementation redoes it; tools/soak/soaklib/sampling.py is one, checked against
# xxHash's published vectors and the contract's pinned ones, and the self-test holds both
# selectors below to its verdicts. So 7 of the 10 shards are kept and 30% of the lines discarded.

name = "sample-path"
description = "statsd-vm with DogStatsD shard tags through a sample keyed on the shard (rate 0.5): the kept shards balance, and no discarded shard reaches VictoriaMetrics in any SUT life"
duration = "15m30s"       # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "12m30s"          # >= last recovery (11m15s) + 2 x progress_window

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
sut_transforms = ["keyed"]   # discards the shards outside the kept set, counted

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total", shard=~"0|2|3|5|6|7|9"}'
vm_absent_selector = '{__name__=~"soak_requests_[0-9]+_total", shard=~"1|4|8"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "120s"

[[step]]
at = "3m"
action = "stop"
on = "logit"
for = "30s"

[[step]]
at = "5m"
action = "kill"
on = "logit"
for = "30s"

[[step]]
at = "7m"
action = "restart"
on = "logit"
for = "30s"

[[step]]
at = "9m"
action = "stop"
on = "victoria-metrics"
for = "90s"

# Every line carries a shard, so every verdict is the key's.
[[expect]]
name = "every-verdict-keyed"
service = "logit"
metric = "logit.transform.sample.decisions"
component = "keyed"
attrs = { by = "missing" }
window = "run"
reduce = "delta"
max = 0

[[expect]]
name = "discards-by-key"
service = "logit"
metric = "logit.transform.sample.decisions"
component = "keyed"
attrs = { outcome = "discarded", by = "key" }
window = "run"
reduce = "delta"
min = 1
