# The system under test in `script/soak`'s standin-otlp scenario: statsd-vm's SUT with
# `otlp_out` sending OTLP/HTTP metrics, gzipped, to the scripted stand-in. Its `internal`
# telemetry goes to stdout as NDJSON for the harness to read; `script/soak` runs it with
# `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    # Cumulative: OTLP has no identity that makes a resend overwrite, and a running total that a
    # resend repeats is the sink's remedy, so a rejected window is overwritten by the next.
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  otlp:
    type: otlp_out
    sources: [window]
    endpoint: http://standin:8080   # OTLP/HTTP, to /v1/metrics
    compression: gzip
    # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
