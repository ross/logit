# A 90 s VictoriaMetrics outage against a two-batch sink queue under the default
# `overflow: block`: the queue and then the sink's inbox fill, backpressure reaches the
# listener, whose receive queue drops the oldest datagrams and counts them, and the sink drains
# to empty once VictoriaMetrics is back. The SUT's 500 ms aggregate window is what lets 90 s
# fill the sink's 64-batch inbox. The schema is docs/plans/soak-harness.md's "The scenario
# schema".

name = "sink-outage-block"
description = "statsd-vm with 500ms windows and a 2-batch blocking sink queue: a 90s VictoriaMetrics stop backs up to the listener, which counts its drops"
duration = "5m30s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "3m30s"           # the stop, its recovery, and two progress windows of steady state

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
sut_aggregate = "window"
sut_sink = "victoria_metrics"
wire_loss_outside_faults = 0.0

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]
at = "0s"
action = "stop"
on = "victoria-metrics"
for = "90s"

[[expect]]
name = "sink-queue-fills"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "max"
min = 2

[[expect]]
name = "sink-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "aggregate-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "window"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "listener-drops-counted"
service = "logit"
metric = "logit.component.datagrams.dropped"
component = "statsd"
attrs = { reason = "overflow_oldest" }
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "no-kernel-drops"
service = "logit"
metric = "logit.input.kernel.drops"
component = "statsd"
step = "c0s1"
window = "during"
reduce = "delta"
max = 0

# A drain sharing its tick with `aggregate`'s flush sees the batch pushed on that tick, so a
# drained queue reads at most 1.
[[expect]]
name = "sink-queue-drains"
service = "logit"
metric = "logit.component.buffer.batches"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "last"
max = 1

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s1"
window = "after"
reduce = "min"
max = 0
