# A destination slower than the sink's 2 s `timeout`: the first fault delays VictoriaMetrics's
# responses by 3 s, so it applies each write and the sink never sees the acknowledgment; the
# second throttles the SUT's egress so a request can't finish in 2 s. Either way the attempt is an
# `Ambiguous` transport error, and the sink resends. Under `temporality: cumulative` the resend
# overwrites the same totals. The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "slow-destination"
description = "statsd-vm with a 2s sink timeout: a 3s response delay at VictoriaMetrics, then a throttled SUT egress, each timing out requests the sink resends"
duration = "7m45s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "5m45s"           # the last fault, its recovery, and two progress windows of steady state

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.sink]]           # one per SUT sink the ledger follows to its backend
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]                  # c0s1: responses arrive after the timeout
at = "0s"
action = "netem"
on = "victoria-metrics"
args = "delay 3s"
for = "60s"

[[step]]                  # c0s2: the request can't finish inside the timeout
at = "3m"
action = "netem"
on = "logit"
args = "rate 2kbit"
for = "60s"

[[expect]]
name = "response-delay-times-out"
service = "logit"
metric = "logit.output.requests"
component = "victoria_metrics"
attrs = { class = "network_error" }
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "response-delay-retries"
service = "logit"
metric = "logit.component.retries"
component = "victoria_metrics"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "throttle-times-out"
service = "logit"
metric = "logit.output.requests"
component = "victoria_metrics"
attrs = { class = "network_error" }
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "throttle-retries"
service = "logit"
metric = "logit.component.retries"
component = "victoria_metrics"
step = "c0s2"
window = "during"
reduce = "delta"
min = 1

# A slow destination is retried, never dropped.
[[expect]]
name = "response-delay-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "throttle-drops-nothing"
service = "logit"
metric = "logit.component.batches.dropped"
component = "victoria_metrics"
step = "c0s2"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "retrying-clears"
service = "logit"
metric = "logit.component.retrying"
component = "victoria_metrics"
step = "c0s2"
window = "after"
reduce = "last"
max = 0
