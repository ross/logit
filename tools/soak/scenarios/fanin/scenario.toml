# Two generators of different kinds into one aggregate and one sink: statsd over UDP into
# `statsd_in`, and syslog-framed lines over UDP into `lines_in`, which `kv` and `kv_metrics` turn
# into one counter increment each. A datagram is one line is one event is one increment on both
# legs, so each source's wire is judged in its own unit and the two meet at `aggregate`. Each
# fault holds one generator, so the other source's wire and intake are judged through it. The
# schema is docs/plans/soak-harness.md's "The scenario schema".

name = "fanin"
description = "statsd and syslog lines from two generators into one aggregate and VictoriaMetrics: netem, partition, and stop on each generator in turn"
duration = "16m30s"       # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "13m30s"          # >= last recovery (12m30s) + 2 x progress_window
compose = "compose.override.yaml"   # adds generator-lines

[configs]                 # the SUT's config, and each generator's under its service name
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"
generator-lines = "logit-generator-lines.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]         # one per generator the ledger follows into the SUT
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.source]]
service = "generator-lines"
generator_input = "load"
generator_sink = "syslog"
sut_listener = "lines"
sut_transforms = ["parse", "labels", "count", "metrics_only"]   # lines to aggregate, in order

[[ledger.sink]]           # both sources' series, so V holds every increment
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total|soak_lines_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

[[step]]
at = "0s"
action = "netem"
on = "generator"
args = "loss 10%"
for = "60s"

[[step]]
at = "2m15s"
action = "netem"
on = "generator-lines"
args = "loss 10%"
for = "60s"

[[step]]
at = "4m30s"
action = "partition"
on = "generator"
for = "45s"

[[step]]
at = "6m30s"
action = "partition"
on = "generator-lines"
for = "45s"

[[step]]
at = "8m30s"
action = "stop"
on = "generator"
for = "60s"

[[step]]
at = "10m45s"
action = "stop"
on = "generator-lines"
for = "60s"

# While one generator is stopped, its listener reads nothing in some drain, and the other's
# reads in every drain.
[[expect]]
name = "statsd-idle-while-generator-stopped"
service = "logit"
metric = "logit.input.datagrams"
component = "statsd"
step = 5
window = "during"
reduce = "min_delta"
max = 0

[[expect]]
name = "lines-reads-while-generator-stopped"
service = "logit"
metric = "logit.input.datagrams"
component = "lines"
step = 5
window = "during"
reduce = "min_delta"
min = 5000

[[expect]]
name = "lines-idle-while-generator-lines-stopped"
service = "logit"
metric = "logit.input.datagrams"
component = "lines"
step = 6
window = "during"
reduce = "min_delta"
max = 0

[[expect]]
name = "statsd-reads-while-generator-lines-stopped"
service = "logit"
metric = "logit.input.datagrams"
component = "statsd"
step = 6
window = "during"
reduce = "min_delta"
min = 5000
