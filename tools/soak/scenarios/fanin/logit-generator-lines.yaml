# The second load source in `script/soak`'s fanin scenario: 2,000 log lines a second as RFC 5424
# syslog over UDP to the system under test's `lines_in`. `syslog_out` sends one message per
# datagram, so a datagram is one line, the ledger's unit. Its `internal` telemetry goes to stdout
# as NDJSON, so the harness reads what it sent.
admin: { bind: 127.0.0.1:9600 }
components:
  load:
    type: generate_in               # unbounded
    rate: 2000
    batch: 100
    event:
      log: "id={seq%50}"            # the SUT's `kv` reads `id`, one series per value
  syslog:
    type: syslog_out
    sources: [load]
    endpoint: logit:5514
    transport: udp
    hostname: soak
    app_name: soak-lines
    buffer: { overflow: drop_newest, retry_max_delay: 1s }   # never stall generate_in
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
