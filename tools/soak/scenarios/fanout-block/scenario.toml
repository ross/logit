# Two sinks fed by one fan-out, one of them with a two-batch blocking queue, through a 90 s stop
# of that sink's VictoriaMetrics. A fan-out offers each batch to its consumers in turn through one
# send, so once the stopped sink's queue and inbox are full, `aggregate` waits on it and the
# healthy sink stops receiving too: one blocking sink holds every sink beside it. The scenario
# pins that coupling, the backpressure reaching the listener, and the recovery of both sinks once
# the backend is back. The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "fanout-block"
description = "two fanned-out sinks, one with a 2-batch blocking queue: its backend's 90s stop blocks aggregate, so the healthy sink stalls too"
duration = "5m30s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "60s"          # >= recovery_bound
recovery_bound = "45s"
cycle = "3m30s"           # the stop, its recovery, and two progress windows of steady state
compose = "compose.override.yaml"   # adds victoria-metrics-b

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
split = "copy"

[[ledger.source]]         # one per generator the ledger follows into the SUT
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]
id = "vm_a"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[[ledger.sink]]
id = "vm_b"
backend = "victoria-metrics-b"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

[[step]]                  # c0s1
at = "0s"
action = "stop"
on = "victoria-metrics-b"
for = "90s"

# c0s2: the stop's late part, once vm_b's queue and inbox are full and `aggregate` waits on it.
# A mark makes no Docker call; it names the span the vm_a stall is bounded over.
[[step]]
at = "50s"
action = "mark"
on = "logit"
for = "40s"

[[expect]]
name = "b-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "vm_b"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "aggregate-inbox-full"
service = "logit"
metric = "logit.component.inbox.full"
component = "window"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

# The coupling: with aggregate held on vm_b, vm_a delivers what it had queued and then nothing.
[[expect]]
name = "a-stalls-behind-b"
service = "logit"
metric = "logit.component.batches.delivered"
component = "vm_a"
step = "c0s2"
window = "during"
reduce = "delta"
max = 2

[[expect]]
name = "listener-drops-counted"
service = "logit"
metric = "logit.component.datagrams.dropped"
component = "statsd"
attrs = { reason = "overflow_oldest" }
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "no-sink-drops-a"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_a"
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "no-sink-drops-b"
service = "logit"
metric = "logit.component.batches.dropped"
component = "vm_b"
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "a-resumes"
service = "logit"
metric = "logit.component.batches.delivered"
component = "vm_a"
step = "c0s1"
window = "after"
reduce = "delta"
min = 20

[[expect]]
name = "b-queue-drains"
service = "logit"
metric = "logit.component.buffer.batches"
component = "vm_b"
step = "c0s1"
window = "after"
reduce = "last"
max = 1
