# The far SUT in `script/soak`'s native-hop-spans scenario: native-hop's, with every internal span
# kept. Its rate is at least the sender's, so it records a span for every trace the hop carries
# (docs/adr/native-hop-trace-context.md). Its `internal` telemetry, spans included, goes to
# stdout as NDJSON for the harness to read; `script/soak` runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  hop: { type: logit_in, bind: 0.0.0.0:7400 }
  window:
    type: aggregate
    sources: [hop]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd
    buffer: { disk: { path: /tmp/soak-spool } }
  self: { type: internal, interval: 5s, span_sample_rate: 1.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
