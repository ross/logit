# The ingress SUT in `script/soak`'s native-hop-spans scenario: native-hop's, with internal spans
# at the product's default `span_sample_rate`. `logit_out` carries a sampled batch's trace
# context in the hop frame, so `collector`'s spans continue its traces. Its `internal` telemetry, spans included, goes to stdout as NDJSON
# for the harness to read; `script/soak` runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  hop:
    type: logit_out
    sources: [statsd]
    endpoint: collector:7400
    concurrency: 32
    request_timeout: 10s
    # The driver kills and starts this container but never recreates it, so a directory in its
    # own filesystem survives the kill with no volume.
    buffer: { disk: { path: /tmp/soak-spool } }
  self: { type: internal, interval: 5s, span_sample_rate: 0.1, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
