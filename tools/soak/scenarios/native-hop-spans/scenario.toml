# native-hop with internal spans on both SUTs at the product's default rate
# (`span_sample_rate: 0.1`), so span emission and the hop frame's trace context run under the
# same faults. Each SUT's spans go to its stdout beside its metrics, where the harness's NDJSON
# reader skips them, since a span event carries no metrics. `internal` buffers at most 512 spans
# per component between drains and counts the rest
# `logit.internal.spans.dropped{reason="buffer_full"}`. At the default rate a backlog should
# stay under that, so `drops` judges a span drop as it does any other. The schema is
# docs/plans/soak-harness.md's "The scenario schema"; `ledger.hop` is its "The native hop".

name = "native-hop-spans"
description = "native-hop with span_sample_rate 0.1 on both SUTs: internal spans and the hop's trace context under faults"
duration = "17m"          # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "60s"    # the hop's request_timeout 10s, a sink's retry_max_delay 10s, two windows, a drain
cycle = "14m"
compose = "compose.override.yaml"   # adds collector, the far SUT

[configs]
sut = "logit-sut.yaml"
collector = "logit-collector.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"  # in collector, the chain's last SUT
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.hop]]            # the native hop the ledger follows from logit to collector
from = "logit"
sink = "hop"              # logit's logit_out
to = "collector"
listener = "hop"          # collector's logit_in

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

# The link: logit's sends to collector delayed, then 10% of them lost.
[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "120s"

[[step]]
at = "2m30s"
action = "netem"
on = "logit"
args = "loss 10%"
for = "90s"

[[step]]
at = "4m30s"
action = "partition"
on = "collector"
for = "45s"

# A graceful stop: collector acknowledges everything it forwarded before it exits.
[[step]]
at = "6m"
action = "stop"
on = "collector"
for = "30s"

# A pause can leave frames in an ended connection that a resend races.
[[step]]
at = "7m30s"
action = "pause"
on = "collector"
for = "30s"

# logit dies with collector up: its spool replays under the old sender identity, which
# collector still holds a mark for.
[[step]]
at = "9m"
action = "kill"
on = "logit"
for = "30s"

# collector dies and forgets its marks.
[[step]]
at = "11m"
action = "kill"
on = "collector"
for = "30s"

# logit dies while collector is down, so nothing it spooled was delivered: the replay is exact.
[[step]]
at = "12m15s"
action = "stop"
on = "collector"
for = "90s"

[[step]]
at = "12m45s"
action = "kill"
on = "logit"
for = "30s"

# The restarted logit replays its spool, and collector, holding the old identity's mark,
# acknowledges what it already forwarded without forwarding it again.
[[expect]]
name = "replay-deduplicated"
service = "collector"
metric = "logit.input.batches.resends"
component = "hop"
step = "c0s6"
window = "after"
reduce = "delta"
min = 1

# A killed collector ends logit's connection; logit connects again.
[[expect]]
name = "reconnects-after-collector-kill"
service = "logit"
metric = "logit.output.reconnects"
component = "hop"
step = "c0s7"
window = "through"
reduce = "delta"
min = 1

# The spool holds the hop's frames through collector's stop.
[[expect]]
name = "spool-holds-the-stop"
service = "logit"
metric = "logit.component.buffer.batches"
component = "hop"
step = "c0s4"
window = "during"
reduce = "max"
min = 2

# Both SUTs record spans for the whole run. `internal` counts what it drains on its own handle,
# one drain behind.
[[expect]]
name = "spans-emitted-logit"
service = "logit"
metric = "logit.internal.spans.emitted"
component = "self"
window = "run"
reduce = "delta"
min = 1

[[expect]]
name = "spans-emitted-collector"
service = "collector"
metric = "logit.internal.spans.emitted"
component = "self"
window = "run"
reduce = "delta"
min = 1
