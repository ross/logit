# The system under test in `script/soak`'s kafka-otlp-broker-restart scenario: statsd over UDP, a
# 2 s delta aggregate, and `kafka_out` producing one OTLP metrics export request in protobuf per
# window to the stack's broker, every series of the window in one record. Delta, so each data
# point carries its window's increments and the ledger sums the topic's points into V. Its
# `internal` telemetry goes to stdout as NDJSON for the harness to read.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  window:
    type: aggregate
    sources: [statsd]
    interval: 2s
    temporality: delta
  kafka:
    type: kafka_out
    sources: [window]
    brokers: ["kafka:9092"]
    format: otlp_proto
    topics: { metrics: soak }       # scenario.toml's [target] topic
    # The defaults otherwise: unkeyed, acks all, idempotent. A 10 s bound, under the
    # scenario's 40 s pause of the broker, turns the pause into response timeouts: `Ambiguous`
    # attempts the broker deduplicates when they are resent.
    timeout: 10s
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
