# statsd-vm with a `lua` stage between the listener and `aggregate`, under statsd-vm's schedule.
# The script rewrites every event, drops every 53rd, fails on every 97th, and returns one event
# from `flush()` each window, so `ledger.script` balances all four outcomes across stops,
# pauses, and partitions. The schema is docs/plans/soak-harness.md's "The scenario schema".

name = "lua-path"
description = "statsd-vm with lua between statsd_in and aggregate: rewrite, script_drop, script errors, and a flush() rollup"
duration = "16m"          # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "13m"             # >= last recovery (11m45s) + 2 x progress_window

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]                  # component ids the checker reads; no rates here
sut_aggregate = "window"
sut_script = "enrich"
wire_loss_outside_faults = 0.0

[[ledger.source]]         # one per generator the ledger follows into the SUT
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.sink]]           # one per SUT sink the ledger follows to its backend
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# Step offsets are relative to each cycle's start; the cycle repeats while it fits before
# cooldown.
[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 200ms 50ms"
for = "120s"

[[step]]
at = "3m"
action = "netem"
on = "logit"
args = "loss 30%"
for = "90s"

[[step]]
at = "5m"
action = "netem"
on = "generator"
args = "loss 10%"
for = "60s"

[[step]]
at = "6m30s"
action = "stop"
on = "victoria-metrics"
for = "90s"

[[step]]
at = "8m30s"
action = "pause"
on = "logit"
for = "30s"

[[step]]
at = "9m30s"
action = "stop"
on = "logit"
for = "30s"

[[step]]
at = "10m15s"
action = "partition"
on = "logit"
for = "45s"

# The script's three outcomes besides an emit, each seen in the first fault's window.
[[expect]]
name = "script-drops"
service = "logit"
metric = "logit.component.events.dropped"
component = "enrich"
attrs = { reason = "script_drop" }
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "script-errors"
service = "logit"
metric = "logit.component.errors"
component = "enrich"
attrs = { reason = "process" }
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "flush-emits"
service = "logit"
metric = "logit.component.flush.events"
component = "enrich"
step = "c0s1"
window = "during"
reduce = "delta"
min = 1
