# tail-rotate-delete's pipeline under an open-files limit on the SUT, set while the writer is
# still building up to the eight files it keeps: the tailer holds each rotated file open, so it
# needs a new descriptor at every rotation, and the limit leaves room for two. From the third
# rotation in the window on, its opens fail with EMFILE, diagnosed `open_error`, and so do its
# directory listings, counted `logit.input.scan.errors{op="read_dir"}`. The files it couldn't
# open wait in the shared directory, which deletes none before the window ends, and its first
# scan after the revert opens them from their start. `ledger.wire` judges the run's lines
# against the replay band, with no SUT life ended, so no line may be lost. The schema is
# docs/plans/soak-harness.md's "The scenario schema".

name = "fd-limit-tail"
description = "writer -> file_out (rotating, max_files 8) -> tail_in under an open-files limit -> json -> aggregate 10s cumulative -> prometheus_out RW1 zstd (disk spool) -> VictoriaMetrics"
duration = "25m"          # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
# The window, then about 17 quiet minutes, in which the writer reaches its retention and
# deletes a file at each rotation.
cycle = "22m"
compose = "compose.override.yaml"   # mounts the shared directory into the writer and the SUT

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0
vm_every_window = true    # one series, written in every window the tailer reads in

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "file"   # a file_out: G is its events.delivered
sut_listener = "tail"
wire = "file"             # W is input.lines; judged against the replay band
sut_transforms = ["parse", "labels", "count", "metrics_only"]   # tail to aggregate, in order

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__="soak_lines_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
# As tail-rotate-delete: two files open at warmup and up to ten from the eighth rotation on.
fd_growth = 10

# At 60 s the writer has rotated once, so the tailer holds two files and 21 descriptors in all,
# the 19 tail-rotate-delete's fds-bounded names and those two. A limit of 24 leaves room for
# `internal`'s /proc reads, a checkpoint write, and a readiness probe's connection until the
# rotations at about 88 s and 132 s take it.
[[step]]
at = "0s"
action = "prlimit"
on = "logit"
nofile = 24
for = "4m"

# The drain straddling the revert carries the failures counted before it, so the window that
# must see none starts a drain interval and more past the revert.
[[step]]
at = "4m8s"
action = "mark"
on = "logit"
for = "60s"

[[expect]]
name = "limit-landed"
service = "logit"
metric = "logit.process.fds.limit"
step = "c0s1"
window = "during"
reduce = "min"
min = 24
max = 24

[[expect]]
name = "listings-fail"
service = "logit"
metric = "logit.input.scan.errors"
component = "tail"
attrs = { op = "read_dir" }
step = "c0s1"
window = "during"
reduce = "delta"
min = 1

[[expect]]
name = "listings-recover"
service = "logit"
metric = "logit.input.scan.errors"
component = "tail"
attrs = { op = "read_dir" }
step = "c0s2"
window = "during"
reduce = "delta"
max = 0

[[expect]]
name = "files-rotated"
service = "logit"
metric = "logit.input.files.rotated"
component = "tail"
window = "run"
reduce = "delta"
min = 1

# No file the tailer had read is deleted with bytes it recorded as unread.
[[expect]]
name = "no-gone-bytes"
service = "logit"
metric = "logit.input.bytes.dropped"
component = "tail"
window = "run"
reduce = "delta"
max = 0

# A checkpoint write inside the window can fail on its temporary file; one after it can't.
[[expect]]
name = "checkpoints-recover"
service = "logit"
metric = "logit.input.checkpoint.errors"
component = "tail"
step = "c0s2"
window = "during"
reduce = "delta"
max = 0

# The eight files the writer keeps, a deleted one still draining, and the staged file of a
# rotation in progress, which the `app.log*` glob also matches.
[[expect]]
name = "files-open-bounded"
service = "logit"
metric = "logit.input.files.open"
component = "tail"
window = "run"
reduce = "max"
max = 10

# The writer reaches its retention long before the end, so the tailer holds about its eight
# files at the last drain: every file the limit kept it from opening was opened after it.
[[expect]]
name = "files-open-plateau"
service = "logit"
metric = "logit.input.files.open"
component = "tail"
window = "run"
reduce = "last"
min = 7

# Eight rotations after warmup put the writer past its retention, so it deleted a file.
[[expect]]
name = "writer-deletes"
service = "generator"
metric = "logit.output.file.rotations"
component = "file"
window = "run"
reduce = "delta"
min = 8

# One watch on the shared directory and one per file open.
[[expect]]
name = "watches-bounded"
service = "logit"
metric = "logit.input.watch.watches"
component = "tail"
window = "run"
reduce = "max"
max = 11
