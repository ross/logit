# rolling-overlap-tcp's control: its stack, configs, and first two closes, each under its churn
# client and netem delay, with the holder's `net.ipv4.tcp_migrate_req` at 0 (the compose
# override). A closing instance's listener resets the handshakes in flight on it, so
# `overlap.migrate` PASSes a close whose churn client read a reset, WARNs one that read none, and
# FAILs a reset with no close. Set beside rolling-overlap-tcp's run, it shows the resets the
# sysctl removes. The schema is docs/plans/soak-harness.md's "The scenario schema"; the overlap
# is its "A TCP rolling overlap (W37)".

name = "rolling-overlap-tcp-nomigrate"
description = "generator (8 TCP connections) -> statsd_in over TCP on one port, reuse_port, tcp_migrate_req 0, in two instances stopped in turn under a churn client -> aggregate 10s cumulative -> prometheus_out RW1 zstd (disk spool) -> VictoriaMetrics"
duration = "8m30s"        # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "5m30s"           # >= last recovery (4m25s) + 2 x progress_window
compose = "compose.override.yaml"   # adds sut-net, its tcp_migrate_req, and logit-b

[configs]
sut = "logit-sut.yaml"    # both instances' config
generator = "logit-generator.yaml"

[overlap]
holder = "sut-net"
instances = ["logit", "logit-b"]
label = "soak_instance"   # the attribute the config's `set` stamps, a label on every series

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = ["load_0", "load_1", "load_2", "load_3", "load_4", "load_5", "load_6", "load_7"]
generator_sink = ["statsd_0", "statsd_1", "statsd_2", "statsd_3", "statsd_4", "statsd_5",
                  "statsd_6", "statsd_7"]
sut_listener = "statsd"
sut_transforms = ["instance"]
wire = "tcp"              # G output.messages, W input.frames, F the framer's counted drops

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

[[step]]                  # c0s1: the holder's egress delayed, so a handshake is in flight 100 ms
at = "0s"
action = "netem"
on = "sut-net"
args = "delay 100ms"
for = "90s"

[[step]]                  # c0s2: 20 dials every 100 ms across logit's close
at = "5s"
action = "slowclient"
on = "logit-b"
address = "sut-net:8125"
mode = "churn"
connections = 20
interval = "100ms"
for = "60s"

[[step]]                  # c0s3: logit down; its listener closes 5 s in, after shutdown.delay
at = "10s"
action = "stop"
on = "logit"
for = "60s"

[[step]]                  # c0s4
at = "2m30s"
action = "netem"
on = "sut-net"
args = "delay 100ms"
for = "90s"

[[step]]                  # c0s5: across logit-b's close
at = "2m35s"
action = "slowclient"
on = "logit"
address = "sut-net:8125"
mode = "churn"
connections = 20
interval = "100ms"
for = "60s"

[[step]]                  # c0s6: logit-b down
at = "2m40s"
action = "stop"
on = "logit-b"
for = "60s"

# A connection stays where it was accepted, so an instance started after the other took every
# connection reads nothing in that life, until the other closes: its series has no segment there,
# and `ledger.egress` WARNs "resets aren't SUT lives − 1", the known overlap WARN.
#
# Over TCP a connection moves only once the stopping instance closes it, after shutdown.delay
# and a redial, so the other instance's first drain of a stop can read nothing: each row reads
# the window's total, not every drain.

[[expect]]                # logit-b reads every connection while logit is down
name = "logit-b-carries-c0s3"
service = "logit-b"
metric = "logit.input.frames"
component = "statsd"
step = "c0s3"
window = "during"
reduce = "delta"
min = 1

[[expect]]                # and logit while logit-b is
name = "logit-carries-c0s6"
service = "logit"
metric = "logit.input.frames"
component = "statsd"
step = "c0s6"
window = "during"
reduce = "delta"
min = 1
