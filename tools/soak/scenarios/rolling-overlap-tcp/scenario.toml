# rolling-overlap over TCP: two instances of one SUT on one TCP port under `reuse_port`, `logit`
# and `logit-b`, in the network namespace of a holder, `sut-net`, stopped and restarted in turn as
# a rolling upgrade overlaps them, with the holder's `net.ipv4.tcp_migrate_req` at 1 (the compose
# override). Each close of an instance's listener comes with a `churn` client dialing the port
# 200 times a second from the other instance's side, and a 100 ms netem delay on the holder that
# keeps each handshake in flight about that long, so a close always finds handshakes on its
# listener: with the sysctl on, the kernel moves them to the other instance's, and
# `overlap.migrate` FAILs on any reset the churn client reads. rolling-overlap-tcp-nomigrate is
# the control with the sysctl off. A close also ends the generator's connections to the closing
# instance, which redial to the other, and `ledger.overlap` bounds what each close loses of
# them. The schema is docs/plans/soak-harness.md's "The scenario schema"; the overlap is its
# "Rolling overlap (W12b)" and "A TCP rolling overlap (W37)".

name = "rolling-overlap-tcp"
description = "generator (8 TCP connections) -> statsd_in over TCP on one port, reuse_port, tcp_migrate_req 1, in two instances swapped in turn under a churn client -> aggregate 10s cumulative -> prometheus_out RW1 zstd (disk spool) -> VictoriaMetrics"
duration = "13m30s"       # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
cycle = "10m30s"          # >= last recovery (9m15s) + 2 x progress_window
compose = "compose.override.yaml"   # adds sut-net, its tcp_migrate_req, and logit-b

[configs]
sut = "logit-sut.yaml"    # both instances' config
generator = "logit-generator.yaml"

[overlap]
holder = "sut-net"
instances = ["logit", "logit-b"]
label = "soak_instance"   # the attribute the config's `set` stamps, a label on every series

[ledger]
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = ["load_0", "load_1", "load_2", "load_3", "load_4", "load_5", "load_6", "load_7"]
generator_sink = ["statsd_0", "statsd_1", "statsd_2", "statsd_3", "statsd_4", "statsd_5",
                  "statsd_6", "statsd_7"]
sut_listener = "statsd"
sut_transforms = ["instance"]
wire = "tcp"              # G output.messages, W input.frames, F the framer's counted drops

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

[[step]]                  # c0s1: the holder's egress delayed, so a handshake is in flight 100 ms
at = "0s"
action = "netem"
on = "sut-net"
args = "delay 100ms"
for = "90s"

[[step]]                  # c0s2: 20 dials every 100 ms across logit's close
at = "5s"
action = "slowclient"
on = "logit-b"
address = "sut-net:8125"
mode = "churn"
connections = 20
interval = "100ms"
for = "60s"

[[step]]                  # c0s3: logit down; its listener closes 5 s in, after shutdown.delay
at = "10s"
action = "stop"
on = "logit"
for = "60s"

[[step]]                  # c0s4
at = "2m30s"
action = "netem"
on = "sut-net"
args = "delay 100ms"
for = "90s"

[[step]]                  # c0s5: across logit-b's close
at = "2m35s"
action = "slowclient"
on = "logit"
address = "sut-net:8125"
mode = "churn"
connections = 20
interval = "100ms"
for = "60s"

[[step]]                  # c0s6: logit-b down
at = "2m40s"
action = "stop"
on = "logit-b"
for = "60s"

[[step]]                  # c0s7
at = "4m50s"
action = "netem"
on = "sut-net"
args = "delay 100ms"
for = "60s"

[[step]]                  # c0s8: across logit's restart
at = "4m55s"
action = "slowclient"
on = "logit-b"
address = "sut-net:8125"
mode = "churn"
connections = 20
interval = "100ms"
for = "45s"

[[step]]                  # c0s9: logit restarted, back at once
at = "5m"
action = "restart"
on = "logit"
for = "30s"

[[step]]                  # c0s10
at = "7m20s"
action = "netem"
on = "sut-net"
args = "delay 100ms"
for = "90s"

[[step]]                  # c0s11: across logit-b's close
at = "7m25s"
action = "slowclient"
on = "logit"
address = "sut-net:8125"
mode = "churn"
connections = 20
interval = "100ms"
for = "60s"

[[step]]                  # c0s12: logit-b down again
at = "7m30s"
action = "stop"
on = "logit-b"
for = "60s"

[[expect]]                # logit-b reads every connection while logit is down
name = "logit-b-carries-c0s3"
service = "logit-b"
metric = "logit.input.frames"
component = "statsd"
step = "c0s3"
window = "during"
reduce = "min_delta"
min = 1

[[expect]]                # and logit while logit-b is
name = "logit-carries-c0s6"
service = "logit"
metric = "logit.input.frames"
component = "statsd"
step = "c0s6"
window = "during"
reduce = "min_delta"
min = 1

[[expect]]
name = "logit-carries-c0s12"
service = "logit"
metric = "logit.input.frames"
component = "statsd"
step = "c0s12"
window = "during"
reduce = "min_delta"
min = 1
