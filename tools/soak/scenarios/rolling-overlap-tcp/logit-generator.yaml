# The load source in `script/soak`'s rolling-overlap-tcp and rolling-overlap-tcp-nomigrate
# scenarios: 2,000 statsd counter lines a second over TCP, from eight inputs of 250 a second, each
# into its own `statsd_out` and so its own connection, each batch of 25 lines one write. The
# kernel hashes each connection to one instance on the shared port as it dials, and it stays
# there until that instance closes it. Its `internal` telemetry goes to stdout as NDJSON, so the
# harness reads what it sent.
admin: { bind: 127.0.0.1:9600 }
components:
  load_0:
    type: generate_in               # unbounded
    rate: 250
    batch: 25
    event:
      metric: { name: "soak_requests_{seq%100}", kind: sum, value: 1 }
  statsd_0:
    type: statsd_out
    sources: [load_0]
    endpoint: sut-net:8125          # the holder's address, which both instances listen on
    transport: tcp                  # output.messages counts a batch once its write completes
    format: statsd
    # 100 batches is 10 s of load, so a write stalled for connect_timeout (5 s) overflows
    # nothing; never stall generate_in.
    buffer: { max_batches: 100, overflow: drop_newest, retry_max_delay: 1s }
  load_1:
    type: generate_in
    rate: 250
    batch: 25
    event:
      metric: { name: "soak_requests_{seq%100}", kind: sum, value: 1 }
  statsd_1:
    type: statsd_out
    sources: [load_1]
    endpoint: sut-net:8125
    transport: tcp
    format: statsd
    buffer: { max_batches: 100, overflow: drop_newest, retry_max_delay: 1s }
