# native-hop under a netem delay on logit's sends long enough that the send window, not the
# link, bounds the hop. logit's `logit_out` offers a window of 4 frames; `statsd_in` hands it
# 10 batches a second from the generator's 2,000 lines, one frame each. A delay of d holds each
# frame's ack a round trip of about d, so the hop carries about 4 / d frames a second: at 50 ms,
# 80, above the intake, so the window never fills and nothing queues; at 1 s, 4, and the spool
# gains about 6 batches a second; at 500 ms, 8, and it gains about 2. Each delay ends with the
# backlog draining at the link's speed. The ledger judges that nothing is lost or forwarded
# twice. The schema is docs/plans/soak-harness.md's "The scenario schema"; `ledger.hop` is its
# "The native hop".

name = "native-hop-rtt"
description = "native-hop with a 4-frame send window under netem delays: the window, not the link, bounds the hop"
duration = "13m"          # warmup + one cycle + cooldown
warmup = "60s"
cooldown = "120s"         # >= recovery_bound
recovery_bound = "60s"    # the hop's request_timeout 10s, a sink's retry_max_delay 10s, two windows, a drain
cycle = "10m"             # >= last step's end (8m) + recovery_bound + 2 x progress_window
compose = "compose.override.yaml"   # adds collector, the far SUT

[configs]
sut = "logit-sut.yaml"
collector = "logit-collector.yaml"
generator = "logit-generator.yaml"

[ledger]
sut_aggregate = "window"  # in collector, the chain's last SUT
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"

[[ledger.hop]]            # the native hop the ledger follows from logit to collector
from = "logit"
sink = "hop"              # logit's logit_out
to = "collector"
listener = "hop"          # collector's logit_in

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64
fd_growth = 8

# Step 1, the control: a 50 ms delay, 80 frames a second through the window, above the intake.
[[step]]
at = "0s"
action = "netem"
on = "logit"
args = "delay 50ms"
for = "90s"

# Step 2: a 1 s delay, about 4 frames a second through the window, against 10 a second in.
[[step]]
at = "2m30s"
action = "netem"
on = "logit"
args = "delay 1s"
for = "150s"

# Step 3: a 500 ms delay, about 8 frames a second, so the backlog grows at a third of step 2's
# rate.
[[step]]
at = "6m"
action = "netem"
on = "logit"
args = "delay 500ms"
for = "120s"

# Under the control the window never fills and the spool stays near empty.
[[expect]]
name = "control-under-window"
service = "logit"
metric = "logit.output.in_flight"
component = "hop"
step = 1
window = "during"
reduce = "max"
max = 3

[[expect]]
name = "control-no-backlog"
service = "logit"
metric = "logit.component.buffer.batches"
component = "hop"
step = 1
window = "during"
reduce = "max"
max = 20

# Under each long delay the connection's window is the 4 offered, every frame of it is in
# flight, and the spool's backlog grows: about 6 batches a second for 150 s at 1 s, and 2 a
# second for 120 s at 500 ms, each bound a third of that.
[[expect]]
name = "window-1s"
service = "logit"
metric = "logit.output.window"
component = "hop"
step = 2
window = "during"
reduce = "max"
min = 4
max = 4

[[expect]]
name = "in-flight-at-window-1s"
service = "logit"
metric = "logit.output.in_flight"
component = "hop"
step = 2
window = "during"
reduce = "max"
min = 4
max = 4

[[expect]]
name = "backlog-grows-1s"
service = "logit"
metric = "logit.component.buffer.batches"
component = "hop"
step = 2
window = "during"
reduce = "rise"
min = 300

[[expect]]
name = "in-flight-at-window-500ms"
service = "logit"
metric = "logit.output.in_flight"
component = "hop"
step = 3
window = "during"
reduce = "max"
min = 4
max = 4

[[expect]]
name = "backlog-grows-500ms"
service = "logit"
metric = "logit.component.buffer.batches"
component = "hop"
step = 3
window = "during"
reduce = "rise"
min = 80

# Once each delay ends the backlog drains within the recovery bound.
[[expect]]
name = "backlog-drains-1s"
service = "logit"
metric = "logit.component.buffer.batches"
component = "hop"
step = 2
window = "after"
reduce = "last"
max = 5

[[expect]]
name = "backlog-drains-500ms"
service = "logit"
metric = "logit.component.buffer.batches"
component = "hop"
step = 3
window = "after"
reduce = "last"
max = 5

# The hop sink drops nothing: a delay is never a reason to.
[[expect]]
name = "no-hop-drops"
service = "logit"
metric = "logit.component.events.dropped"
component = "hop"
window = "run"
reduce = "delta"
max = 0
