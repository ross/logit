# The system under test in `script/soak`'s tcp-ingress scenario: statsd over TCP, a 10 s
# cumulative aggregate, and remote-write 1.0 (zstd) to VictoriaMetrics. Its `internal` telemetry
# goes to stdout as NDJSON for the harness to read; `script/soak` runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd:
    type: statsd_in
    transport: tcp                  # no receive queue: the connection is the backpressure
    bind: 0.0.0.0:8125
    idle_timeout: 60s               # past the 45 s partition, short of the 90 s generator pause
  window:
    type: aggregate
    sources: [statsd]
    interval: 10s
    temporality: cumulative
    series_retention: 360           # a fault must never evict a series
  victoria_metrics:
    type: prometheus_out
    sources: [window]
    endpoint: http://victoria-metrics:8428/api/v1/write
    version: 1
    compression: zstd               # buffer: defaults (block, at_least_once, retry_max_delay 10s)
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
