# A generated statsd stream into `logit` over TCP and out to VictoriaMetrics, under network and
# lifecycle faults on both ends of the connection. TCP retransmits what netem drops, so loss on
# the generator's link is judged at 0; a stall of the SUT backs up into the generator, whose
# counted overflow and ambiguous drops stay out of G; a stop or kill of the SUT can reset the
# connection with lines in its socket buffers, so `ledger.wire` reports those windows. The
# schema is docs/plans/soak-harness.md's "The scenario schema".

name = "tcp-ingress"
description = "generator -> statsd_in (TCP) -> aggregate 10s cumulative -> prometheus_out RW1 zstd -> VictoriaMetrics"
duration = "20m30s"       # warmup + one cycle + cooldown; --duration overrides
warmup = "60s"            # no faults: baseline rate, RSS, fds
cooldown = "120s"         # no faults at the end; >= recovery_bound
recovery_bound = "45s"    # retry_max_delay 10s + two aggregate windows + a drain
rss_settle = "60s"        # the generator or SUT releases partition-time memory over about 100 s
cycle = "17m30s"          # >= last recovery (16m30s) + 2 x progress_window
compose = "compose.override.yaml"   # caps both ends' TCP socket buffers

[configs]
sut = "logit-sut.yaml"
generator = "logit-generator.yaml"

[ledger]                  # component ids the checker reads; no rates here
sut_aggregate = "window"
wire_loss_outside_faults = 0.0

[[ledger.source]]
service = "generator"
generator_input = "load"
generator_sink = "statsd"
sut_listener = "statsd"
wire = "tcp"              # G output.messages, W input.frames, F the framer's counted drops

[[ledger.sink]]
id = "victoria_metrics"
backend = "victoria-metrics"
vm_selector = '{__name__=~"soak_requests_[0-9]+_total"}'

[thresholds]
progress_window = "30s"
rss_growth_mib_per_hour = 64   # WARN under 1h, FAIL above
fd_growth = 8

# Netem on the generator delays or drops its segments, which TCP retransmits: judged at 0.
[[step]]
at = "0s"
action = "netem"
on = "generator"
args = "delay 200ms 50ms"
for = "120s"

[[step]]
at = "3m"
action = "netem"
on = "generator"
args = "loss 10%"
for = "90s"

# Netem on the SUT drops its ACKs: judged, with a surplus allowed per ambiguous attempt.
[[step]]
at = "5m30s"
action = "netem"
on = "logit"
args = "loss 30%"
for = "90s"

# The SUT's kernel keeps ACKing until its receive buffer fills, then the generator's write
# stalls past connect_timeout and its queue overflows: judged. A write that took part of a frame
# fails ambiguous and is counted dropped; one that took nothing fails clean and is retried. The
# override's buffer caps make the stall happen inside 30 s.
[[step]]
at = "8m"
action = "pause"
on = "logit"
for = "30s"

# A stop or kill can reset the connection with lines in its buffers: reported.
[[step]]
at = "9m30s"
action = "stop"
on = "logit"
for = "30s"

[[step]]
at = "11m"
action = "kill"
on = "logit"
for = "30s"

# No RST in 45 s: judged when the SUT keeps its address, and reported when the reconnect
# moves it, since the generator's retransmits then go nowhere.
[[step]]
at = "12m30s"
action = "partition"
on = "logit"
for = "45s"

# Silent past the SUT's 60 s idle_timeout, so it closes the connection.
[[step]]
at = "14m15s"
action = "pause"
on = "generator"
for = "90s"

[[expect]]
name = "no-idle-close-under-delay"
service = "logit"
metric = "logit.input.connections.closed"
component = "statsd"
attrs = { reason = "idle" }
step = "c0s1"
window = "through"
reduce = "delta"
max = 0

[[expect]]
name = "generator-overflows"
service = "generator"
metric = "logit.component.batches.dropped"
component = "statsd"
attrs = { reason = "overflow_newest" }
step = "c0s4"
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "generator-ambiguous"
service = "generator"
metric = "logit.component.batches.dropped"
component = "statsd"
attrs = { reason = "ambiguous_at_most_once" }
step = "c0s4"
window = "through"
reduce = "delta"
min = 1

[[expect]]
name = "idle-close"
service = "logit"
metric = "logit.input.connections.closed"
component = "statsd"
attrs = { reason = "idle" }
step = "c0s8"
window = "through"
reduce = "delta"
min = 1
