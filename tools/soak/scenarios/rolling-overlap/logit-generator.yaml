# The load source in `script/soak`'s rolling-overlap scenario: statsd-vm's 2,000 statsd counter
# lines a second over UDP, one line per datagram, from eight inputs of 250 a second, each into its
# own `statsd_out`. A UDP sink sends from one socket, so each sink is one flow, and the kernel
# hashes each flow to one instance on the shared port: eight flows spread over the instances and
# move between them as they stop and start. Its `internal` telemetry goes to stdout as NDJSON, so
# the harness reads what it sent.
admin: { bind: 127.0.0.1:9600 }
components:
  load_0:
    type: generate_in               # unbounded
    rate: 250
    batch: 25
    event:
      metric: { name: "soak_requests_{seq%100}", kind: sum, value: 1 }
  statsd_0:
    type: statsd_out
    sources: [load_0]
    endpoint: sut-net:8125          # the holder's address, which both instances listen on
    format: statsd
    max_packet_bytes: "32"          # one line per datagram: the ledger's unit
    buffer: { overflow: drop_newest, retry_max_delay: 1s }   # never stall generate_in
  load_1:
    type: generate_in
    rate: 250
    batch: 25
    event:
      metric: { name: "soak_requests_{seq%100}", kind: sum, value: 1 }
  statsd_1:
    type: statsd_out
    sources: [load_1]
    endpoint: sut-net:8125
    format: statsd
    max_packet_bytes: "32"
    buffer: { overflow: drop_newest, retry_max_delay: 1s }
