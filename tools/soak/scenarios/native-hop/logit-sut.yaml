# The ingress SUT in `script/soak`'s native-hop scenario: statsd from the generator, forwarded
# over the native hop to `collector`, with the hop sink on a disk spool so a SIGKILL loses
# nothing it took. Its `internal` telemetry goes to stdout as NDJSON for the harness to read;
# `script/soak` runs it with `--log-format json`.
admin: { bind: 127.0.0.1:9600 }     # the image HEALTHCHECK's probe address
components:
  statsd: { type: statsd_in, bind: 0.0.0.0:8125 }   # receive: defaults (drop_oldest)
  hop:
    type: logit_out
    sources: [statsd]
    endpoint: collector:7400
    window: 32
    request_timeout: 10s
    # The driver kills and starts this container but never recreates it, so a directory in its
    # own filesystem survives the kill with no volume.
    buffer: { disk: { path: /tmp/soak-spool } }
  self: { type: internal, interval: 5s, span_sample_rate: 0.0, logs: off }
  telemetry: { type: stdio_out, sources: [self], format: json }
