# Compose overlay for the `demo` shape-survey producer (tools/shape-survey/producers/demo.sh),
# layered over demo/compose.yaml so `demo/` itself is never modified. It changes two things about
# the `logit` service:
#
#   * `/config.yaml` comes from ${SHAPE_SURVEY_CONFIG}, the tapped config the producer generates.
#   * ${SHAPE_SURVEY_RUN_DIR} is mounted at /shape-survey, where that config writes the capture.
#
# Both are absolute paths from `--env-file <run dir>/compose.env`, not the environment, because
# `${DOCKER}` is `sudo docker` by default and sudo doesn't forward variables. They must be
# absolute: with `-f demo/compose.yaml` first, the project directory is `demo/`.
services:
  logit:
    volumes:
      # Same target as demo/compose.yaml's own config mount, so this replaces it: Compose merges a
      # service's volumes by mount target.
      - ${SHAPE_SURVEY_CONFIG}:/config.yaml:ro
      - ${SHAPE_SURVEY_RUN_DIR}:/shape-survey
