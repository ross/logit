# Additive drop-in (see ../collectd/Dockerfile) -- turns on exactly the two plugins this survey
# needs and nothing collectd defaults on its own: a destination. Every other default-enabled
# plugin in Debian's own collectd.conf is untouched by this file.
#
# `logit` is always reachable at the network alias "logit" (tools/shape-survey/lib.sh's
# start_logit). Ports are this producer's own collectd_in/graphite_in binds
# (../../configs/hostagents.yaml / hostagents-wire-grouped.yaml).
#
# No `Interval` here or in the main collectd.conf: collectd's own default is 10s, which is what
# this survey wants, so it is left unstated on purpose rather than restated.
LoadPlugin network
LoadPlugin write_graphite

<Plugin network>
	# collectd's own binary `network` protocol, unencrypted and unsigned -- the wire
	# `collectd_in` decodes (docs/adr/collectd-binary-relay.md). Default MaxPacketSize/TTL.
	Server "logit" "25826"
</Plugin>

<Plugin write_graphite>
	# Carbon plaintext over TCP -- everything else (Prefix, Postfix, StoreRates,
	# EscapeCharacter, SeparateInstances...) at the plugin's own default.
	<Node "logit">
		Host "logit"
		Port "2003"
		Protocol "tcp"
	</Node>
</Plugin>
