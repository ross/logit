# Additive outputs-only config, loaded alongside the official image's own shipped
# /etc/telegraf/telegraf.conf via `--config-directory` (tools/shape-survey/producers/hostagents.sh
# runs `telegraf --config /etc/telegraf/telegraf.conf --config-directory /etc/telegraf/telegraf.d`
# rather than baking a custom image) -- the [agent] section and the default-enabled inputs (cpu,
# disk, diskio, kernel, mem, processes, swap, system, confirmed against the image rather than
# trusted from memory) are entirely untouched. Nothing here changes them.
#
# Three outputs, each at its own plugin default apart from the one pointer it needs (a `logit`
# input component's address) -- one per output so `source` separates them in the survey
# (configs/hostagents.yaml's header comment has the mapping). "logit" is the fixed network alias
# tools/shape-survey/lib.sh's start_logit gives the logit container.
[[outputs.graphite]]
  servers = ["logit:2004"]

[[outputs.prometheus_client]]
  listen = ":9273"

[[outputs.opentelemetry]]
  service_address = "logit:4317"
