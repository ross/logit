# The `oteldemo` producer's collector extras layer, selected through the demo's
# `OTEL_COLLECTOR_CONFIG_EXTRAS`, its documented extension point, which the core compose file
# loads after `otelcol-config.yml`. It adds one exporter; the only other change is dropping
# `docker_stats` from the metrics receivers (below).
#
# The collector merges config files but replaces arrays, so each pipeline's `exporters:` list
# repeats the upstream names for the core layer: `debug` on all three, plus the `span_metrics`
# connector on traces. `processors:`, and the traces and logs `receivers:`, are omitted so they
# merge through untouched. The `profiles` pipeline is left alone: `logit` has no profiles signal.

exporters:
  # `logit` resolves because compose-overlay.yaml attaches the collector to the survey network.
  # OTLP/HTTP so all three signals land on one `otlp_in` and `shape`'s `source` tag stays a single
  # value (configs/oteldemo.yaml's header). Everything else is the exporter's default, including
  # gzip, which `otlp_in` decodes.
  otlphttp/logit:
    endpoint: http://logit:4318

service:
  pipelines:
    traces:
      exporters: [debug, span_metrics, otlphttp/logit]
    metrics:
      # The upstream receiver list minus `docker_stats`, the one deviation from the demo as
      # shipped. On an SELinux-enforcing host it can't reach /var/run/docker.sock ("permission
      # denied while trying to connect to the docker API"), and a failed receiver start takes the
      # whole collector down. Fixing it would mean relabeling the shared host's docker.sock or
      # running the collector privileged. The cost is `container.*` metrics about the demo's own
      # containers, not SDK output. See README "Caveats each author recorded".
      receivers:
        [
          http_check/frontend-proxy,
          host_metrics,
          nginx,
          otlp,
          redis,
          postgresql,
          prometheus/ad,
          span_metrics,
        ]
      exporters: [debug, otlphttp/logit]
    logs:
      exporters: [debug, otlphttp/logit]
