# The `oteldemo` producer's compose overlay, the only change this survey makes to the demo's
# `compose.yaml`: it attaches `otel-collector` to the survey network so it can export to `logit`.
# Every other service stays on the demo's own bridge and can't see `logit`.
#
# The collector's config change lives in otelcol-config-extras.yml, selected through the demo's
# `OTEL_COLLECTOR_CONFIG_EXTRAS` variable from the generated `survey.env`.

networks:
  # The producer's network, created by `survey_begin`. Passed in by name so the overlay can't
  # drift from lib.sh's naming scheme.
  survey:
    name: ${SHAPE_SURVEY_NET:?the survey network name, from the generated survey.env}
    external: true

services:
  otel-collector:
    networks:
      # A service that names any network joins only those, so omitting `default` would take the
      # collector off the demo's bridge and fail every SDK export.
      default: {}
      survey: {}
