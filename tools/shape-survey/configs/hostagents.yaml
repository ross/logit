# The `hostagents` producer's capture (tools/shape-survey/producers/hostagents.sh): collectd and
# Telegraf, each from its official distribution in default configuration, driving `logit` over
# every wire this repo has a listener for. Agent images and config: tools/shape-survey/hostagents/;
# what an idle, containerized default install is evidence about: the producer's representativeness
# line in provenance.txt. Findings: docs/design/data-shapes.md §5.2.
#
# Why this producer matters: almost every metrics input emits one metric per event
# (`logit.shape.metrics` is 1 for statsd_in, otlp_in, prometheus_in and graphite_in). `collectd_in`
# decodes one event per collectd value list, carrying that type's N data sources as N
# `MetricRecord`s (`load` has 3, `if_octets`/`disk_octets` 2, most types 1;
# docs/adr/collectd-binary-relay.md), so the collectd leg is this survey's only live measurement of
# metrics-per-event.
#
# Five legs, one host-metrics source each, the wire in parentheses:
#
#   collectd_network    <- collectd's `network` plugin                 (collectd binary, UDP 25826)
#   graphite_collectd   <- collectd's `write_graphite` plugin          (carbon plaintext, TCP 2003)
#   graphite_telegraf   <- Telegraf's `outputs.graphite`               (carbon plaintext, TCP 2004)
#   prometheus_telegraf <- Telegraf's `outputs.prometheus_client`, scraped (Prometheus text/OM, HTTP)
#   otlp_telegraf       <- Telegraf's `outputs.opentelemetry`          (OTLP/gRPC)
#
# One collectd process feeds the first two (the same host through two protocols); one Telegraf
# process feeds the last three (how each output serializer flattens the same fields-heavy points;
# the producer's summary section has events-per-flush per output).
#
# One tap per input, not two: a metrics input's events arrive finished
# (tools/shape-survey/README.md, "The config pattern").
#
# This is the default-batching variant. `collectd_network`, `graphite_collectd` and
# `graphite_telegraf` run their default `receive.batch_max_events`, so `logit.shape.batch.events`
# on those legs is the accumulator's regrouping (docs/adr/decoupled-listener-io.md), not the
# agent's own datagram or line boundaries. configs/hostagents-wire-grouped.yaml sets
# `batch_max_events: 1` on those three, so a batch there is one datagram on the collectd leg and
# one carbon line on the two graphite legs. `prometheus_telegraf` and `otlp_telegraf` bypass the
# accumulator in both variants, so their batches are always the wire's (one scrape response, one
# OTLP request).
admin:
  # start_logit polls `logit ready` against this rather than sleeping.
  bind: 0.0.0.0:9600

components:
  # -- the inputs ------------------------------------------------------------------------------------

  # collectd's `network` plugin on collectd's own default port: one event per value list, N metric
  # records in wire order for an N-data-source type. No `types_db:`: nothing downstream reads a
  # data-source name, and the wire is unaffected by it either way (fixtures/collectd-relay.yaml).
  collectd_network:
    type: collectd_in
    bind: 0.0.0.0:25826

  # collectd's `write_graphite` plugin: carbon plaintext, the same host through a second protocol.
  graphite_collectd:
    type: graphite_in
    bind: 0.0.0.0:2003

  # Telegraf's `outputs.graphite`, on a distinct bind from graphite_collectd's so `shape`'s `source`
  # tag (the origin component) separates the two agents.
  graphite_telegraf:
    type: graphite_in
    bind: 0.0.0.0:2004

  # Telegraf's `outputs.prometheus_client`, scraped. `interval: 5s` against Telegraf's own 10s
  # `flush_interval` buys more scrapes inside the capture window (exporters.yaml's reasoning).
  prometheus_telegraf:
    type: prometheus_in
    scrape_targets: ["http://telegraf:9273/metrics"]
    interval: 5s

  # Telegraf's `outputs.opentelemetry`, OTLP/gRPC. If this leg is missing from a run's summary, the
  # producer's provenance.txt says why (tools/shape-survey/producers/hostagents.sh).
  otlp_telegraf:
    type: otlp_in
    bind: 0.0.0.0:4317
    protocol: grpc

  # -- the taps ----------------------------------------------------------------------------------------
  # One `shape` per input for the reason exporters.yaml gives: the cumulative gauges are per
  # component with no `source` breakdown, so five inputs through one `shape` would answer a
  # question about none of them individually. `resource: drop` is the default, stated.
  tap_collectd_network:
    type: shape
    sources: [collectd_network]
    interval: 10s
    resource: drop

  tap_graphite_collectd:
    type: shape
    sources: [graphite_collectd]
    interval: 10s
    resource: drop

  tap_graphite_telegraf:
    type: shape
    sources: [graphite_telegraf]
    interval: 10s
    resource: drop

  tap_prometheus_telegraf:
    type: shape
    sources: [prometheus_telegraf]
    interval: 10s
    resource: drop

  tap_otlp_telegraf:
    type: shape
    sources: [otlp_telegraf]
    interval: 10s
    resource: drop

  # -- the capture -----------------------------------------------------------------------------------
  # `distributions: samples` keeps `shape`'s raw observations raw through the window;
  # `max_samples_per_series` is far above what this capture can produce. Past it `aggregate` falls
  # back to a DdSketch and summarize.py fails loudly rather than report an approximation.
  shape_rollup:
    type: aggregate
    sources:
      [
        tap_collectd_network,
        tap_graphite_collectd,
        tap_graphite_telegraf,
        tap_prometheus_telegraf,
        tap_otlp_telegraf,
      ]
    interval: 10s
    distributions: samples
    max_samples_per_series: 5000000
    max_retained_series: 1000000

  shape_out:
    type: file_out
    sources: [shape_rollup]
    path: /out/shape.log
    rotate:
      # `file_out` requires a rotation trigger, and a survey that rotated would lose the start of
      # its own capture.
      max_bytes: "64GiB"
