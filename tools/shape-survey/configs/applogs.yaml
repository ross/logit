# The `applogs` producer's capture (tools/shape-survey/producers/applogs.sh): eight structured-
# logging libraries at pinned versions, each in its documented production configuration inside a
# small HTTP app, plus one Django app under `opentelemetry-instrument`, measured by `shape`
# (docs/adr/shape-observer-component.md). Findings: docs/design/data-shapes.md §5.3.
#
# Two halves, measured differently:
#
# A. The JSON loggers (tools/shape-survey/applogs/{python,node,go,ruby}/). Each app writes one JSON
#    line per request to its own file; one `tail_in` per file follows it, and each leg gets the
#    two-tap pattern (tools/shape-survey/README.md, "The config pattern"):
#
#      <app>_in --+--> tap_input  (shape: the raw line, 1 attribute, a long body)
#                 |
#                 +--> <app>_json (json) --> tap_<app> (shape: the line's fields as attributes,
#                                                       its nested objects as nested maps)
#
#    `json` merges only the top level, so pino-http's `req`/`res` and semantic_logger's `payload`
#    stay nested maps inside one attribute, the quantity docs/plans/data-shape-survey.md wants a
#    distribution of.
#
# B. The Django + OpenTelemetry leg. `otlp_in` receives traces, metrics and logs straight from the
#    SDK with no Collector in between, so the resource width measured is the Python SDK's own. One
#    tap: these events arrive structured, and a second tap would measure an identity function.
#
# Tap layout. `shape` tags every per-event and per-batch measurement with `source` (the origin
# component), so eight sources through one `shape` stay separable, but its cumulative gauges
# (`distinct_keys`, `distinct_keysets`, `keyset_share.top1`/`top5`) are per component. So: one
# shared `tap_input` for the eight raw-line sources, where every app's key-set is the same two
# `tail_in` attributes and a per-app table would answer nothing; and one `shape` per app after its
# `json`, where the key-set is the library's record shape.
#
# Batch counts. `tail_in` has no receive queue but does batch-assemble, at `receive:`'s defaults
# here (1000 events, 1 MiB, 100 ms; graph rule 17 accepts only those fields on it), so
# `logit.shape.batch.events` on the file legs is that assembly's grouping, not a producer's
# packing. `otlp_in` bypasses the accumulator, so the Django leg's batch counts are the SDK's own
# batch-processor export grouping.
#
# No `set` stage. `tail_in` stamps no resource attributes and this producer adds none, so
# `logit.shape.batch.resource_attributes` is 0 on every file leg by construction, leaving the
# Django leg's value as what a default Python OTel SDK Resource carries.
admin:
  # start_logit polls `logit ready` against this rather than sleeping.
  bind: 0.0.0.0:9600

components:
  # -- A: one tail_in per log file -------------------------------------------------------------------
  # Every app writes into /out/applogs/ on the run directory, mounted in logit at /out.
  # `read_from: beginning` so a line written before logit's first scan is still captured; no
  # checkpoint, because each run is a fresh directory.

  # structlog's documented production JSON config. No default-configuration sibling: its
  # out-of-the-box renderer is ConsoleRenderer (text), not JSON (app_structlog.py).
  structlog_prod_in:
    type: tail_in
    paths: ["/out/applogs/structlog-prod.log"]
    read_from: beginning

  # python-json-logger: `JsonFormatter()` bare (default) against the quickstart's format-string
  # form (prod), the one Python library here with a JSON default to contrast against.
  pyjson_prod_in:
    type: tail_in
    paths: ["/out/applogs/pyjson-prod.log"]
    read_from: beginning

  pyjson_default_in:
    type: tail_in
    paths: ["/out/applogs/pyjson-default.log"]
    read_from: beginning

  # pino + pino-http at pino-http's defaults, the only app whose library decides the record's
  # fields (pino-std-serializers' nested `req`/`res` objects).
  pino_http_in:
    type: tail_in
    paths: ["/out/applogs/pino-http.log"]
    read_from: beginning

  # A bare `pino()` logger with the same eight fields, so the pair isolates pino-http's serializers.
  pino_default_in:
    type: tail_in
    paths: ["/out/applogs/pino-default.log"]
    read_from: beginning

  # Go's `log/slog` JSONHandler with nil options: the default configuration, and for slog the only
  # one.
  slog_default_in:
    type: tail_in
    paths: ["/out/applogs/slog-default.log"]
    read_from: beginning

  # zap's `NewProductionConfig()`, sink redirected to a file and nothing else changed.
  zap_prod_in:
    type: tail_in
    paths: ["/out/applogs/zap-prod.log"]
    read_from: beginning

  # semantic_logger with `formatter: :json`, Ruby's stand-in for lograge, which needs Rails
  # (applogs/ruby/app.rb's header).
  semlog_prod_in:
    type: tail_in
    paths: ["/out/applogs/semlog-prod.log"]
    read_from: beginning

  # -- A, tap 1: the raw line ------------------------------------------------------------------------
  # Straight off `tail_in`: a `LogRecord` whose body is the whole JSON line and whose attributes
  # are the tailer's file provenance. `body_bytes` here is the line length.
  tap_input:
    type: shape
    sources:
      [
        structlog_prod_in,
        pyjson_prod_in,
        pyjson_default_in,
        pino_http_in,
        pino_default_in,
        slog_default_in,
        zap_prod_in,
        semlog_prod_in,
      ]
    interval: 10s
    # `drop` (the default), stated: no observed resource attribute leaves this pipeline.
    resource: drop

  # -- A, the realistic chain: parse the JSON --------------------------------------------------------
  # One `json` per source so each app can have its own `shape` downstream (see the header).
  # `skip_to_brace` stays off: every line here is JSON from its first byte, and turning it on would
  # hide a library that emitted a prefix.
  structlog_prod_json: { type: json, sources: [structlog_prod_in] }
  pyjson_prod_json: { type: json, sources: [pyjson_prod_in] }
  pyjson_default_json: { type: json, sources: [pyjson_default_in] }
  pino_http_json: { type: json, sources: [pino_http_in] }
  pino_default_json: { type: json, sources: [pino_default_in] }
  slog_default_json: { type: json, sources: [slog_default_in] }
  zap_prod_json: { type: json, sources: [zap_prod_in] }
  semlog_prod_json: { type: json, sources: [semlog_prod_in] }

  # -- A, tap 2: after parsing, one component per app ------------------------------------------------
  tap_structlog_prod:
    type: shape
    sources: [structlog_prod_json]
    interval: 10s
    resource: drop

  tap_pyjson_prod:
    type: shape
    sources: [pyjson_prod_json]
    interval: 10s
    resource: drop

  tap_pyjson_default:
    type: shape
    sources: [pyjson_default_json]
    interval: 10s
    resource: drop

  tap_pino_http:
    type: shape
    sources: [pino_http_json]
    interval: 10s
    resource: drop

  tap_pino_default:
    type: shape
    sources: [pino_default_json]
    interval: 10s
    resource: drop

  tap_slog_default:
    type: shape
    sources: [slog_default_json]
    interval: 10s
    resource: drop

  tap_zap_prod:
    type: shape
    sources: [zap_prod_json]
    interval: 10s
    resource: drop

  tap_semlog_prod:
    type: shape
    sources: [semlog_prod_json]
    interval: 10s
    resource: drop

  # -- B: Django under opentelemetry-instrument ------------------------------------------------------
  # OTLP/gRPC on 4317, `opentelemetry-exporter-otlp`'s default protocol; the SDK is at its defaults
  # apart from the endpoint and the logging opt-in (see the producer). All three signals arrive on
  # this one listener.
  django_otlp_in:
    type: otlp_in
    bind: 0.0.0.0:4317
    protocol: grpc

  # One tap for all three signals: `shape` tags each measurement with `signal` (`logs`/`metrics`/
  # `spans`, `+`-joined when an event carries several), so the rows stay separable inside one
  # component while sharing its cumulative key tables.
  tap_django:
    type: shape
    sources: [django_otlp_in]
    interval: 10s
    resource: drop

  # -- the capture -----------------------------------------------------------------------------------
  # `distributions: samples` keeps `shape`'s raw observations raw through the window;
  # `max_samples_per_series` is far above what this capture can produce. Past it `aggregate` falls
  # back to a DdSketch and summarize.py fails loudly rather than report an approximation.
  shape_rollup:
    type: aggregate
    sources:
      [
        tap_input,
        tap_structlog_prod,
        tap_pyjson_prod,
        tap_pyjson_default,
        tap_pino_http,
        tap_pino_default,
        tap_slog_default,
        tap_zap_prod,
        tap_semlog_prod,
        tap_django,
      ]
    interval: 10s
    distributions: samples
    max_samples_per_series: 5000000
    max_retained_series: 1000000

  shape_out:
    type: file_out
    sources: [shape_rollup]
    path: /out/shape.log
    rotate:
      # `file_out` requires a rotation trigger, and a survey that rotated would lose the start of
      # its own capture.
      max_bytes: "64GiB"
