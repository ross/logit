# The `exporters` producer's capture (tools/shape-survey/producers/exporters.sh): official
# Prometheus exporters in default configuration, scraped by `prometheus_in` and measured by
# `shape` (docs/adr/shape-observer-component.md). Findings: docs/design/data-shapes.md §5.2.
#
# What `shape` measures here. `prometheus_in` in scrape mode emits one event per series and one
# batch per target per scrape (docs/adr/prometheus-scrape-and-exposition.md), so at the tap:
#
#   logit.shape.attributes    = labels per series
#   logit.shape.batch.events  = series per scrape (one exporter's whole /metrics response)
#   logit.shape.key_bytes     = label-name lengths
#   logit.shape.value_bytes   = label-value lengths
#
# Labels per series is wire labels plus a small constant. Scrape mode puts its own identity
# (`instance`, `prometheus.target`) on the resource, which `resource: drop` removes, so an event's
# attributes are the exposition line's labels plus at most `prometheus.type` (on a family whose
# wire type the model has no kind for; node_exporter's `node_netstat_*`/`node_vmstat_*` families
# are untyped, so about 2% of its series carry it: docs/design/data-shapes.md §3, "Labels per
# series") and `prometheus.timestamp` (when the line carried one; these exporters don't). A
# histogram's `le` and a summary's `quantile` are structure inside the metric record, not labels,
# so a histogram family contributes one event rather than one per bucket.
#
# One `prometheus_in` per target, named after the exporter, rather than one component with six
# `scrape_targets:`: `shape` tags every measurement with the batch's `source`, which is the
# component name, so one multi-target component would fold every exporter into one row.
#
# One tap, not two: a metrics input's events arrive finished, and a second tap would measure an
# identity function (tools/shape-survey/README.md, "The config pattern").
#
# The exporters are in default configuration and the services they watch are idle, so this is
# evidence about label and series structure per exporter; series counts scale with real objects
# (devices, databases, keyspaces, vhosts) and are a floor.
admin:
  # start_logit polls `logit ready` against this rather than sleeping.
  bind: 0.0.0.0:9600

components:
  # -- the exporters, one component each ------------------------------------------------------------
  # `interval: 5s` against the 15s default: this capture wants >=10 scrapes per target inside its
  # 70s default window, and an idle exporter's output does not change between scrapes.
  #
  # Each hostname is the network alias `survey_start_service` gives that container
  # (tools/shape-survey/lib.sh).

  # node_exporter, as seen from inside a container: fewer block devices, filesystems and network
  # interfaces than a real host (provenance.txt records the caveat).
  node_exporter:
    type: prometheus_in
    scrape_targets: ["http://node-exporter:9100/metrics"]
    interval: 5s

  # postgres_exporter against a stock `postgres` with one empty database: the per-database and
  # per-table families are at their smallest.
  postgres_exporter:
    type: prometheus_in
    scrape_targets: ["http://postgres-exporter:9187/metrics"]
    interval: 5s

  # redis_exporter against a stock `redis` with no keyspaces in use: `db*` families absent.
  redis_exporter:
    type: prometheus_in
    scrape_targets: ["http://redis-exporter:9121/metrics"]
    interval: 5s

  # nginx-prometheus-exporter reading the open-source `stub_status` module; NGINX Plus's API would
  # be a different, larger shape.
  nginx_exporter:
    type: prometheus_in
    scrape_targets: ["http://nginx-exporter:9113/metrics"]
    interval: 5s

  # blackbox_exporter's `/probe` endpoint, the shape an operator scrapes: a synthetic check per
  # request, answered with that probe's result series. The `target`/`module` query string is part
  # of the URL; `prometheus_in` strips a query string from the `prometheus.target` attribute it
  # stamps but sends the URL as given.
  blackbox_probe:
    type: prometheus_in
    scrape_targets: ["http://blackbox-exporter:9115/probe?module=http_2xx&target=http://nginx"]
    interval: 5s

  # The app-runtime example: blackbox_exporter's own `/metrics` is a stock `client_golang` default
  # registry (`go_*`, `process_*`, `promhttp_*`), what any Go service instrumented with the
  # standard library exposes before an application metric is added.
  go_runtime:
    type: prometheus_in
    scrape_targets: ["http://blackbox-exporter:9115/metrics"]
    interval: 5s

  # -- the taps ----------------------------------------------------------------------------------------
  # One `shape` per exporter rather than one shared component with six sources, unlike
  # configs/interop.yaml: the per-event and per-batch series carry `source` and stay separable in
  # one component, but the cumulative gauges (`distinct_keys`, `distinct_keysets`,
  # `keyset_share.top1`/`top5`) are per component, carrying `tap` alone
  # (crates/logit-transforms/src/shape.rs). Six exporters through one `shape` would answer "how
  # many distinct label-name sets do these six produce between them", a fact about no exporter.
  #
  # `resource: drop` is the default, stated: no observed resource attribute leaves this pipeline,
  # and it is why the attribute counts are wire labels rather than wire labels +
  # `instance`/`prometheus.target`.
  tap_node_exporter:
    type: shape
    sources: [node_exporter]
    interval: 10s
    resource: drop

  tap_postgres_exporter:
    type: shape
    sources: [postgres_exporter]
    interval: 10s
    resource: drop

  tap_redis_exporter:
    type: shape
    sources: [redis_exporter]
    interval: 10s
    resource: drop

  tap_nginx_exporter:
    type: shape
    sources: [nginx_exporter]
    interval: 10s
    resource: drop

  tap_blackbox_probe:
    type: shape
    sources: [blackbox_probe]
    interval: 10s
    resource: drop

  tap_go_runtime:
    type: shape
    sources: [go_runtime]
    interval: 10s
    resource: drop

  # -- the capture -----------------------------------------------------------------------------------
  # `distributions: samples` keeps `shape`'s raw observations raw through the window;
  # `max_samples_per_series` is far above what this capture can produce. Past it `aggregate` falls
  # back to a DdSketch and summarize.py fails loudly rather than report an approximation.
  shape_rollup:
    type: aggregate
    sources:
      [
        tap_node_exporter,
        tap_postgres_exporter,
        tap_redis_exporter,
        tap_nginx_exporter,
        tap_blackbox_probe,
        tap_go_runtime,
      ]
    interval: 10s
    distributions: samples
    max_samples_per_series: 5000000
    max_retained_series: 1000000

  shape_out:
    type: file_out
    sources: [shape_rollup]
    path: /out/shape.log
    rotate:
      # `file_out` requires a rotation trigger, and a survey that rotated would lose the start of
      # its own capture.
      max_bytes: "64GiB"
