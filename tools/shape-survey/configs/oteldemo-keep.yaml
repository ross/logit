# The `oteldemo` producer's optional second capture: configs/oteldemo.yaml with the tap on
# `resource: keep`, so `aggregate` keys every series per resource and a per-service breakdown
# becomes possible. Run only on `SHAPE_SURVEY_OTELDEMO_KEEP=1`
# (tools/shape-survey/producers/oteldemo.sh), never by the main capture.
# tools/shape-survey/README.md, "`resource: keep` captures", has the handling rules.
#
# Why a separate config: `resource: drop` is what lets a run's summary leave an environment the
# traffic could not (docs/adr/shape-observer-component.md). With `keep`, the observed `Resource`
# reaches `aggregate`, which keys its series on it, and `file_out`'s human render merges those
# attributes into each record's `attrs` line. The output of this config is identity-bearing: it
# names the demo's services, host, container ids and the collector's detected CPU model. It stays
# in the run directory (`perf/results/` is gitignored) and nothing derived from it is pasted
# anywhere without being read first.
#
# What it answers that the main run cannot: does attribute width differ by service? The demo
# instruments many languages, each with its own SDK and instrumentation-library stack, and a
# pooled distribution hides that. A short run suffices: per-service shape is a property of each
# SDK's instrumentation, not of run length.
#
# Everything else is unchanged from configs/oteldemo.yaml, whose header says what every series
# means.
admin:
  bind: 0.0.0.0:9600

components:
  otlp_gateway:
    type: otlp_in
    bind: 0.0.0.0:4318
    protocol: http

  # The one difference from configs/oteldemo.yaml. `keep` governs the per-event output only: what
  # `shape` emits at flush (per-batch samples and cumulative gauges) goes out under an empty
  # `Resource`, since a window spans many batches. So a per-service split exists for
  # `logit.shape.attributes` and its per-event siblings, not for `logit.shape.batch.*`.
  tap_input:
    type: shape
    sources: [otlp_gateway]
    interval: 10s
    resource: keep

  # `max_retained_series` does real work here: `keep` multiplies the series count by the number of
  # distinct resources (roughly services x containers).
  shape_rollup:
    type: aggregate
    sources: [tap_input]
    interval: 10s
    distributions: samples
    max_samples_per_series: 5000000
    max_retained_series: 1000000

  shape_out:
    type: file_out
    sources: [shape_rollup]
    path: /out/shape.log
    rotate:
      max_bytes: "64GiB"
