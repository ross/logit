# The `oteldemo` producer's capture (tools/shape-survey/producers/oteldemo.sh): the OpenTelemetry
# Demo at a pinned tag, a ~20-service polyglot application under its own Locust load generator,
# exporting through its own Collector into one `otlp_in`, measured by `shape`
# (docs/adr/shape-observer-component.md). Findings: docs/design/data-shapes.md §5.4.
#
# Where `shape` sits in the chain:
#
#   application SDK -> (OTLP/gRPC) -> the demo's otel-collector -> (OTLP/HTTP) -> otlp_in -> shape
#
# So these numbers are post-collector, not raw SDK output: a collector in front of a gateway is how
# OTLP is deployed, and it is the shape a `logit` meets. What the collector's processors add is in
# the producer's summary section (`resource_detection` puts a dozen or so
# `host.*`/`os.*`/`container.*` attributes on every resource); read the resource-width number with
# that attached.
#
# One input, one tap. One input because `otlp_in`'s HTTP mode takes all three signals on one
# listener and `shape` tags every measurement with `signal`, so traces, metrics and logs stay
# separable without a component each. One tap because OTLP arrives finished; there is no
# `json`/`regex`/`kv` chain an operator would run over it, and a `tap_landed` would measure an
# identity function (tools/shape-survey/README.md, "The config pattern").
#
# How to read the series:
#
#   logit.shape.attributes          attributes on one span / metric point / log record as the
#                                   collector exported it (resource attributes are not in here:
#                                   `resource: drop`, and they are reported per batch instead)
#   logit.shape.batch.events        events in one (Resource, Scope) group of one collector export
#                                   request (see below); not "one SDK batch"
#   logit.shape.batch.resource_attributes
#                                   the width of an OTLP `Resource` after `resource_detection`:
#                                   the number that matters for OTLP, since a resource is per
#                                   batch in the model
#   logit.shape.batch.scope_attributes
#                                   the width of the `InstrumentationScope`, usually 0; the
#                                   collector's own self-telemetry scopes carry `otelcol.*`
#                                   attributes, which is why its config has a
#                                   `transform/sanitize_logs` processor upstream of this tap
#   logit.shape.span.events/links   span events and links per span, and span-event attribute counts
#   logit.shape.body_bytes          a log record's body length
#
# What a "batch" is here. `otlp_in` bypasses the `BatchAccumulator`, and the OTLP codec never
# collapses groups: every `(ResourceSpans/Metrics/Logs, Scope*)` pair inside one export request
# becomes its own `EventBatch` (crates/logit-proto/src/otlp/mod.rs). So `logit.shape.batch.events`
# is events per (Resource, Scope) group of one collector export request: not the SDK's own batch
# (the collector may have merged or split it) and not a `logit`-side regrouping (there is none).
# The pinned demo's core collector config has no `batch` processor, so what the collector exports
# is what its receivers and scrapers handed the pipeline, split by resource and scope.
admin:
  # start_logit polls `logit ready` against this rather than sleeping.
  bind: 0.0.0.0:9600

components:
  # -- the input ---------------------------------------------------------------------------------
  # OTLP/HTTP on the standard 4318. The demo's collector is pointed here by
  # tools/shape-survey/oteldemo/otelcol-config-extras.yml, alongside the exporters the demo ships
  # with. HTTP rather than gRPC because `otlp_in` takes a single `protocol:`: a gRPC listener would
  # be a second component, and `shape`'s `source` tag (the origin component) would split one
  # collector's traffic in two.
  otlp_gateway:
    type: otlp_in
    bind: 0.0.0.0:4318
    protocol: http

  # -- the tap -----------------------------------------------------------------------------------
  # One `shape`, for the reason in the header. `resource: drop` is the default, stated, and it is
  # why there is no per-service breakdown in this producer's output: `service.name` is a resource
  # attribute. The count per batch survives (`logit.shape.batch.resource_attributes`), which for
  # OTLP is the number the survey is after; configs/oteldemo-keep.yaml is the per-service variant.
  tap_input:
    type: shape
    sources: [otlp_gateway]
    interval: 10s
    resource: drop

  # -- the capture -------------------------------------------------------------------------------
  # `distributions: samples` keeps `shape`'s raw observations raw through the window;
  # `max_samples_per_series` is far above what this capture can produce. Past it `aggregate` falls
  # back to a DdSketch and summarize.py fails loudly rather than report an approximation.
  shape_rollup:
    type: aggregate
    sources: [tap_input]
    interval: 10s
    distributions: samples
    max_samples_per_series: 5000000
    max_retained_series: 1000000

  shape_out:
    type: file_out
    sources: [shape_rollup]
    path: /out/shape.log
    rotate:
      # `file_out` requires a rotation trigger, and a survey that rotated would lose the start of
      # its own capture.
      max_bytes: "64GiB"
