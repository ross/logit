# The refused-credentials leg of `script/s3-interop`. The script starts it with a wrong secret
# key, reads its telemetry to see the sink hold and retry, stops it, then starts it again with the
# right key and `S3_INTEROP_RUN=run2`. The spool keeps the first run's 200 events across the restart,
# so the objects the second run writes hold both runs' events, told apart by their `run` attribute.
admin: { bind: 127.0.0.1:9600 }

components:
  load:
    type: generate_in
    count: 200
    rate: 250
    batch: 50
    event:
      log: "creds {seq}"
      attributes: { seq: "{seq}", run: !env S3_INTEROP_RUN }

  archive:
    type: s3_out
    sources: [load]
    bucket: !env S3_INTEROP_BUCKET
    region: !env S3_INTEROP_REGION
    endpoint: !env S3_INTEROP_ENDPOINT
    path_style: !env S3_INTEROP_PATH_STYLE
    prefix: !env S3_INTEROP_PREFIX
    max_age: 5s
    credentials:
      access_key_id: !env S3_INTEROP_ACCESS_KEY
      secret_access_key: !env S3_INTEROP_SECRET_KEY
    buffer:
      retry_max_delay: 2s
      shutdown_grace: 30s
      disk:
        path: /spool
      max_bytes: 64MiB

  self: { type: internal, interval: 1s, span_sample_rate: 0.0 }
  telemetry:
    type: stdio_out
    sources: [self]
    target: !env S3_INTEROP_TELEMETRY
    format: json
