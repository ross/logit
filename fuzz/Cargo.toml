[package]
name = "logit-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace, outside the root one, so libfuzzer-sys and the sanitizer build never enter
# the stable build or CI (docs/adr/out-of-ci-fuzzing.md). `script/unsafe-check fuzz` drives it.
[workspace]
members = [".", "seedgen"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
logit-core = { path = "../crates/logit-core" }
logit-proto = { path = "../crates/logit-proto" }

# Symbols in a crash's stack trace.
[profile.release]
debug = 1

[[bin]]
name = "native_frame"
path = "fuzz_targets/native_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_batch_v1"
path = "fuzz_targets/native_batch_v1.rs"
test = false
doc = false
bench = false

[[bin]]
