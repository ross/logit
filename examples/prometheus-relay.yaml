# Relays a scraped `/metrics` endpoint through `logit` unchanged: `prometheus_in` scrapes a target
# on an interval and `prometheus_out` re-exposes what it decoded for something else to scrape. No
# `aggregate` sits between them, so the pair is a fixed point modulo the normalizations
# `crates/logit-proto/src/prometheus/mod.rs`'s module doc lists
# (docs/adr/prometheus-scrape-and-exposition.md). Change `scrape_targets` to your exporter.
#
# The one normalization you see here: the scraper stamps an `instance` label (the scraped
# `host:port`) onto every series, as Prometheus's own scrape does. `job` is operator identity, not
# a fact about the target, so it isn't stamped; add a `set` component between the two if you need
# one.
components:
  node_exporter:
    type: prometheus_in
    scrape_targets: ["http://127.0.0.1:9100/metrics"] # an absolute http(s) URL; node-exporter's default
    interval: 15s # the standard Prometheus scrape cadence

  metrics:
    type: prometheus_out
    sources: [node_exporter]
    # No TLS and no auth on this endpoint (docs/known-gaps.md): bind loopback or pod-local and
    # front it with something that has both.
    bind: 127.0.0.1:9464
