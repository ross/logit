# A contributor-facing fixture for `flatten` (docs/adr/flatten-transform.md):
# tail_in -> json -> flatten -> keep -> kv_metrics -> aggregate -> influxdb_out against a nested
# JSON log line, the shape no other example carries. Not wired into `script/server`; covered by
# `script/validate` like every shipped config. Change `paths` to your log files and `influx_out`
# to your InfluxDB.
#
# The motivating shape is a pino-http-style completion record (docs/design/data-shapes-rows.md):
# the request/response detail nested under `req`/`res` is what no tag-rendering sink,
# `influxdb_out` included, can represent.
#
# Topology:
#
#   app.log --tail--> app_in (tail_in)
#                          |
#                          v
#                    app_json (json)     <- req/res land as nested Value::Maps
#                          |
#                          v
#                     app_flat (flatten) <- req.method, req.url, res.statusCode become ordinary,
#                          |                 dot-named attributes that `keep` below can select
#                          v
#                    app_trimmed (keep)  <- only the two dotted tags aggregate should key on
#                          |
#                          v
#                    app_metrics (kv_metrics)
#                          |
#                          v
#                    app_windowed (aggregate)
#                          |
#                          v
#                      influx_out
#
# `flatten` creates attribute width, and width is cardinality, so `app_trimmed` runs after
# `app_flat`, never before.
components:
  app_in:
    type: tail_in
    paths: ["/var/log/app/*.jsonl"]

  app_json:
    type: json
    sources: [app_in]

  # attributes: all (the default): the app's logging library decides req/res's shape, so a named
  # field list would need editing every time that shape changes.
  app_flat:
    type: flatten
    sources: [app_json]

  # keep after flatten, not before: req.method/res.statusCode don't exist as attributes until
  # flatten runs, and everything flatten doesn't touch (a wide k8s.labels map, say) stays bounded
  # by never being kept.
  app_trimmed:
    type: keep
    sources: [app_flat]
    fields: [req.method, res.statusCode]

  app_metrics:
    type: kv_metrics
    sources: [app_trimmed]
    counters:
      - name: app.requests # +1 per event

  app_windowed:
    type: aggregate
    sources: [app_metrics]
    interval: 10s

  influx_out:
    type: influxdb_out
    sources: [app_windowed]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN
