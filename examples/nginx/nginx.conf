# Reference nginx config for docs/plans/nginx-integration.md's workstream F: proves
# syslog_in -> json -> kv_metrics -> keep -> aggregate -> influxdb_out (plus stdio_out for
# visibility) against a real nginx, end to end in this repo's own dev stack. Also exercises
# docs/plans/access-log-spans.md's workstream B: the same access line also carries the
# trace-context/span convention (docs/design/data-model.md's "Well-known attribute names"), so
# `examples/nginx-to-influxdb.yaml`'s `nginx_trace` stage can turn it into a real span.
#
# Three server blocks: a plain static vhost, a proxied vhost with a real upstream hop (so
# $upstream_response_time is actually populated), and the (unexposed) upstream itself. Two
# log_formats, both `escape=json` so any character JSON can't represent literally is escaped
# rather than corrupting the line -- see docs/adr/json-parsing-into-attributes.md for what
# `json` expects on the receiving end.

load_module modules/ngx_http_js_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    js_path "/etc/nginx/njs/";
    js_import main from delay.js;

    # `logit` has no `traceparent` parser as of `trace_context`'s original design
    # (docs/adr/log-record-trace-context.md), but as of
    # docs/adr/trace-context-span-lifting.md it does -- these `map`s exist only because nginx's
    # own log_format has no way to invoke that parser itself; the split has to happen somewhere,
    # and a `map` (stock nginx, no njs) is the cheapest place. Positional regex captures are
    # usable directly as a map value (ngx_http_map_module). No `default` on the id maps => an
    # empty string when the header is absent -- `trace_context` then reports
    # `skipped{reason="missing"}` for a request with genuinely no trace context. A present-but-
    # malformed `traceparent` is logged raw (below) and parsed first, so it reports `invalid`
    # instead -- these maps only ever blank $trace_id/$span_id, never the header itself.
    map $http_traceparent $trace_id {
        "~^00-([0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $1;
    }
    # This vhost's own span id -- nginx here plays the edge (the static vhost has no upstream to
    # forward a header to), so it mints one from $request_id (nginx's own built-in unique
    # request id, 32 hex characters since 1.11.0): the first 16 hex characters of a 32-hex
    # random id are exactly as random as a dedicated 16-hex id would be, with no js_content
    # needed to mint one from scratch.
    map $request_id $span_id {
        "~^([0-9a-f]{16})" $1;
    }
    map $status $span_status {
        "~^5" error;
        default ok;
    }

    # Verbose; nginx's own container log (stdout only) -- never ingested by `logit` in this
    # topology. Kept as a cutover safety net: see the two `access_log` directives below.
    log_format access_json_full escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
        '"request_method":"$request_method","request_uri":"$request_uri","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time","http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"}';

    # Lean; syslog only -- exactly and only the fields nginx_json/nginx_metrics
    # (examples/nginx-to-influxdb.yaml) read downstream. Numeric fields (status, body_bytes_sent,
    # request_time) are unquoted JSON numbers; host/request_method and upstream_response_time are
    # quoted strings. On a non-proxied request, plain nginx log_formats render
    # $upstream_response_time as a literal "-"; empirically, under `escape=json` it comes out as
    # an empty string ("") instead -- nginx's JSON-escaping variable copier doesn't replicate the
    # plain copier's not-found-to-"-" substitution. Either way it fails kv_metrics's numeric
    # coercion the same way (`crates/logit-transforms/src/kv_metrics.rs::numeric`), so the metric
    # is silently skipped for that event regardless of which literal shows up. On a retried
    # request it's a comma-separated list of per-attempt times -- never bare JSON either way.
    #
    # Fixed-field width sanity check (docs/plans/nginx-integration.md's "first task"): the
    # skeleton around the original six variables was ~104 bytes, ~130 typical total. The six
    # trace/span fields added since add up to ~90 more bytes fixed (two 32/16-hex ids twice each,
    # the `traceparent` header itself, a few digits of timestamp/duration, `"ok"`/`"error"`) --
    # still comfortably inside any syslog message-size cap this nginx enforces. $host is the one
    # unbounded, client-controlled field -- see docs/known-gaps.md for the empirical finding on
    # what actually happens when it's pushed past nginx's own request-header limits (measured
    # well short of any syslog-side truncation).
    #
    # `span.end_s`/`span.duration_s` (not `_ms`): `$msec` and `$request_time` are both seconds
    # with millisecond resolution (a float), never integer milliseconds -- see
    # docs/adr/trace-context-span-lifting.md's "Producer timing model". `$msec` is the log-write
    # instant, so it pairs with the *duration* nginx already measures back to a *start*, not with
    # $request_time as if it were itself a start -- `trace_context` resolves the pair into
    # (end - duration, end) for the span's actual start/end. Both are QUOTED here, unlike the
    # unquoted `$request_time` above: an unquoted number parses as a JSON float
    # (`serde_json`/`Value::F64`), which `trace_context`'s `_s` form accepts but only reproduces
    # to ~1us at epoch magnitude (a float's precision, not nginx's); quoted, it parses as a
    # string and goes through the exact digit-for-digit decimal parser instead, matching
    # nginx's own millisecond resolution exactly rather than adding float noise below it.
    log_format access_json_syslog escape=json
        '{"host":"$host","request_method":"$request_method","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"traceparent":"$http_traceparent","trace.id":"$trace_id","span.id":"$span_id",'
        '"span.end_s":"$msec","span.duration_s":"$request_time","span.status":"$span_status"}';

    server {
        listen 80;
        server_name static.local;

        access_log /dev/stdout access_json_full;
        access_log syslog:server=logit:5140,tag=nginx_access,nohostname access_json_syslog;

        location / {
            root /usr/share/nginx/html;
        }
    }

    server {
        listen 80;
        server_name proxy.local;

        access_log /dev/stdout access_json_full;
        access_log syslog:server=logit:5140,tag=nginx_access,nohostname access_json_syslog;

        location / {
            proxy_pass http://127.0.0.1:8081/;
            # Forwards an inbound traceparent unchanged (proxy_pass forwards headers by default
            # regardless, but this documents the intent); the upstream below logs no access line
            # of its own, so there's no second span to parent here today -- see
            # docs/known-gaps.md's entry on deriving an upstream CLIENT span from
            # $upstream_connect_time/$upstream_header_time/$upstream_response_time.
            proxy_set_header traceparent $http_traceparent;
        }
    }

    # The proxy vhost's upstream -- not otherwise exposed (bound to loopback only), one container,
    # no second image, still a real proxy_pass hop so $upstream_response_time is genuinely
    # populated rather than synthesized. Its own access log is silenced: not required for the
    # integration proof, and keeping it off is what keeps stdio_out's output focused on the two
    # public vhosts.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        # Randomized 10-300ms response delay via njs (docs/plans/nginx-integration.md) so
        # nginx.request_time/nginx.upstream_response_time show a real distribution instead of
        # near-uniform sub-millisecond values -- a DdSketch's percentiles are a much more
        # convincing proof point at p50/p90/p99 when the underlying latencies actually vary.
        location / {
            js_content main.delay;
        }
    }
}
