# Reference nginx config for docs/plans/0002-nginx-integration.md's workstream F: proves
# syslog_in -> json -> kv_metrics -> keep -> aggregate -> influxdb_out (plus stdio_out for
# visibility) against a real nginx, end to end in this repo's own dev stack.
#
# Three server blocks: a plain static vhost, a proxied vhost with a real upstream hop (so
# $upstream_response_time is actually populated), and the (unexposed) upstream itself. Two
# log_formats, both `escape=json` so any character JSON can't represent literally is escaped
# rather than corrupting the line -- see docs/adr/0010-json-parsing-into-attributes.md for what
# `json` expects on the receiving end.

load_module modules/ngx_http_js_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    js_path "/etc/nginx/njs/";
    js_import main from delay.js;

    # Verbose; nginx's own container log (stdout only) -- never ingested by `logit` in this
    # topology. Kept as a cutover safety net: see the two `access_log` directives below.
    log_format access_json_full escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
        '"request_method":"$request_method","request_uri":"$request_uri","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time","http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"}';

    # Lean; syslog only -- exactly and only the fields nginx_json/nginx_metrics
    # (examples/nginx-to-influxdb.yaml) read downstream. Numeric fields (status, body_bytes_sent,
    # request_time) are unquoted JSON numbers; host/request_method and upstream_response_time are
    # quoted strings. On a non-proxied request, plain nginx log_formats render
    # $upstream_response_time as a literal "-"; empirically, under `escape=json` it comes out as
    # an empty string ("") instead -- nginx's JSON-escaping variable copier doesn't replicate the
    # plain copier's not-found-to-"-" substitution. Either way it fails kv_metrics's numeric
    # coercion the same way (`crates/logit-transforms/src/kv_metrics.rs::numeric`), so the metric
    # is silently skipped for that event regardless of which literal shows up. On a retried
    # request it's a comma-separated list of per-attempt times -- never bare JSON either way.
    #
    # Fixed-field width sanity check (docs/plans/0002-nginx-integration.md's "first task"): the
    # skeleton around the six variables is ~104 bytes; a typical line (short host, GET, 200,
    # small body) comes to ~130 bytes total, comfortably inside any syslog message-size cap this
    # nginx enforces. $host is the one unbounded, client-controlled field -- see
    # docs/known-gaps.md for the empirical finding on what actually happens when it's pushed past
    # nginx's own request-header limits (measured well short of any syslog-side truncation).
    log_format access_json_syslog escape=json
        '{"host":"$host","request_method":"$request_method","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"}';

    server {
        listen 80;
        server_name static.local;

        access_log /dev/stdout access_json_full;
        access_log syslog:server=logit:5140,tag=nginx_access,nohostname access_json_syslog;

        location / {
            root /usr/share/nginx/html;
        }
    }

    server {
        listen 80;
        server_name proxy.local;

        access_log /dev/stdout access_json_full;
        access_log syslog:server=logit:5140,tag=nginx_access,nohostname access_json_syslog;

        location / {
            proxy_pass http://127.0.0.1:8081/;
        }
    }

    # The proxy vhost's upstream -- not otherwise exposed (bound to loopback only), one container,
    # no second image, still a real proxy_pass hop so $upstream_response_time is genuinely
    # populated rather than synthesized. Its own access log is silenced: not required for the
    # integration proof, and keeping it off is what keeps stdio_out's output focused on the two
    # public vhosts.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        # Randomized 10-300ms response delay via njs (docs/plans/0002-nginx-integration.md) so
        # nginx.request_time/nginx.upstream_response_time show a real distribution instead of
        # near-uniform sub-millisecond values -- a DdSketch's percentiles are a much more
        # convincing proof point at p50/p90/p99 when the underlying latencies actually vary.
        location / {
            js_content main.delay;
        }
    }
}
