# Taps a flow with `shape` (docs/adr/shape-observer-component.md) without perturbing it: the real
# leg (`statsd -> rollup -> metrics`) is untouched, and a second branch off the same listener turns
# every event into a measurement of its own shape (attribute counts, key and value lengths,
# nesting depth, metric record counts), which a second `aggregate` folds into distributions.
#
#   statsd ─┬─> rollup ─> metrics        (the real pipeline, unchanged)
#           └─> tap ─> shape_rollup ─> shape_out
#
# `shape` emits counts and lengths only, never an observed key, value, log body, or metric name,
# so `shape_out`'s output can leave an environment the traffic itself can't.
#
# Before running this against a production flow:
#
#   * A tap turns a single-consumer edge into a fan-out, and `shape` mutates, so one branch pays a
#     batch clone (docs/design/memory.md). Measure, then remove the tap.
#   * `shape` never summarizes: distribution-shaped quantities go out as raw `Samples`, and the
#     `aggregate` below turns them into sketches. Set `distributions: samples` there to keep the
#     exact values.
#
# A second `shape` at the far end of a transform chain measures how much wider events get on the
# way through; each tap tags its output with its own component name, so the two stay distinct.
components:
  statsd:
    type: statsd_in
    bind: 0.0.0.0:8125

  # -- the real pipeline, which never sees the tap ------------------------------------------------
  rollup:
    type: aggregate
    sources: [statsd]
    interval: 10s

  metrics:
    type: stdio_out
    sources: [rollup]
    target: stdout

  # -- the tap ------------------------------------------------------------------------------------
  tap:
    type: shape
    sources: [statsd]
    # How often the per-batch measurements and the cumulative gauges are emitted. Per-event
    # measurements ride out on the events themselves.
    interval: 10s
    # `drop` (the default) replaces the batch resource with an empty one. `keep` lets that
    # identity travel with the measurements, for a per-service breakdown.
    resource: drop
    # Bounds on the two cumulative tables, a memory guard rather than a tuning knob. Past either,
    # new keys or key-sets are counted but not tracked, and `logit.shape.tracking_overflow` goes
    # to 1.
    max_tracked_keys: 4096
    max_tracked_keysets: 4096

  shape_rollup:
    type: aggregate
    sources: [tap]
    interval: 10s

  shape_out:
    type: stdio_out
    sources: [shape_rollup]
    target: stdout
