# A minimal example matching the v0.1 vertical slice target (docs/OVERVIEW.md): statsd/DogStatsD
# in, a 10s aggregation window, one enrichment script, InfluxDB 2.x out. Matches the `influxdb`
# service seeded by compose.yaml for local testing.
#
# Config is a flat graph of components (docs/design/pipeline-graph.md,
# docs/adr/component-graph-configuration.md): each names its own `sources`, rather than
# sitting in a fixed inputs/transforms/outputs pipeline. `aggregate` is the only implemented
# built-in transform so far (docs/adr/aggregation-window-semantics.md) -- `logit run` rejects
# a config referencing any other unimplemented kind with a clear error. `token: !env
# INFLUXDB_TOKEN` below pulls the token from the environment rather than inlining a secret in the
# file (docs/adr/env-yaml-tag.md) -- any field on any component can use `!env` the same way.
components:
  statsd_in:
    type: statsd_in
    bind: 0.0.0.0:8125
    # Every field below defaults (docs/adr/decoupled-listener-io.md) -- an omitted `receive:`
    # block is exactly the values shown here, commented out purely as a reference for tuning a
    # real deployment. `receive:` is meaningful only on a datagram listener (statsd_in, syslog_in);
    # `logit-pipeline`'s graph validation rejects it on any other component kind.
    # receive:
    #   max_datagrams: 10000        # receive-queue depth, in datagrams -- whichever of this or max_bytes trips first
    #   max_bytes: "32MiB"          # bound on undecoded datagram bytes held in the queue
    #   overflow: drop_oldest       # block | drop_oldest | drop_newest -- what happens once both bounds are full;
    #                               # drop_oldest (not buffer:'s block) is the default here on purpose -- blocking a
    #                               # UDP reader relocates loss into the kernel where nothing counts it
    #   batch_max_events: 1000      # events accumulated across datagrams before one send downstream; 1 means
    #                               # one send per datagram, today's pre-ADR `decoupled-listener-io` behavior
    #   batch_max_bytes: "1MiB"     # the other accumulation bound -- whichever trips first
    #   batch_flush_interval: 100ms # longest an accumulated batch waits before being sent regardless of size;
    #                               # 0s disables the timer, leaving the two bounds above as the only trigger
    #   # receive_buffer_bytes: 8MiB  # SO_RCVBUF, requested at bind -- omitted leaves the kernel default alone
    #   shutdown_grace: 5s          # how long SIGTERM waits for the receive queue to drain before dropping the rest

  windowed:
    type: aggregate
    sources: [statsd_in]
    interval: 10s

  enrich:
    type: lua
    sources: [windowed]
    script: |
      function process(event)
        event.attributes.env = event.attributes.env or "dev"
        return event
      end

  influx_out:
    type: influxdb_out
    sources: [enrich]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN
    # Every field below defaults (docs/adr/buffered-sink-delivery.md) -- an omitted `buffer:`
    # block is exactly the values shown here, commented out purely as a reference for tuning a
    # real deployment. `buffer:` is meaningful only on a sink; `logit-pipeline`'s graph validation
    # rejects it on any other component kind.
    # buffer:
    #   max_batches: 1024      # queue depth, in batches -- whichever of this or max_bytes trips first
    #   max_bytes: "64MiB"     # estimated heap footprint bound -- a quoted string, always (KiB/MiB/GiB or a bare number)
    #   overflow: block        # block | drop_oldest | drop_newest -- what happens once both bounds are full
    #   # delivery: at_least_once  # at_least_once | at_most_once -- omitted derives from the sink's own
    #                              # duplicate_safe() fact (true for influxdb_out's idempotent overwrite)
    #   retry_budget: 60s      # wall-clock ceiling on retrying one batch before it's dropped
    #   retry_max_delay: 10s   # backoff cap between retry attempts
    #   shutdown_grace: 5s     # how long SIGTERM waits for the queue to drain before dropping the rest
