# A minimal example matching the v0.1 vertical slice target (docs/OVERVIEW.md): statsd/DogStatsD
# in, a 10s aggregation window, one enrichment script, InfluxDB 2.x out. Matches the `influxdb`
# service seeded by compose.yaml for local testing.
#
# Config is a flat graph of components (docs/design/pipeline-graph.md,
# docs/adr/0009-component-graph-configuration.md): each names its own `sources`, rather than
# sitting in a fixed inputs/transforms/outputs pipeline. `aggregate` is the only implemented
# built-in transform so far (docs/adr/0008-aggregation-window-semantics.md) -- `logit run` rejects
# a config referencing any other unimplemented kind with a clear error. `token: !env
# INFLUXDB_TOKEN` below pulls the token from the environment rather than inlining a secret in the
# file (docs/adr/0010-env-yaml-tag.md) -- any field on any component can use `!env` the same way.
components:
  statsd_in:
    type: statsd_in
    bind: 0.0.0.0:8125

  windowed:
    type: aggregate
    sources: [statsd_in]
    interval: 10s

  enrich:
    type: lua
    sources: [windowed]
    script: |
      function process(event)
        event.attributes.env = event.attributes.env or "dev"
        return event
      end

  influx_out:
    type: influxdb_out
    sources: [enrich]
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token: !env INFLUXDB_TOKEN
