# A minimal example matching the v0.1 vertical slice target (docs/OVERVIEW.md): statsd/DogStatsD
# in, one enrichment script, InfluxDB 2.x out. Matches the `influxdb` service seeded by
# compose.yaml for local testing.
#
# No builtin transforms yet -- none are implemented (`logit run` rejects any `builtin:` stage with
# a clear error). This originally also had a `builtin: aggregate` window ahead of the Lua stage;
# dropped for now so this config actually runs end-to-end. Re-add it once the aggregate transform
# exists -- the stateful, flush-on-interval piece is a separate, well-scoped follow-up from
# pipeline orchestration itself.
inputs:
  statsd_in:
    type: statsd
    bind: 0.0.0.0:8125

outputs:
  influx_out:
    type: influx_db
    url: http://influxdb:8086
    org: logit
    bucket: metrics
    token_env: INFLUXDB_TOKEN

pipelines:
  app_metrics:
    inputs: [statsd_in]
    transforms:
      - lua: |
          function process(event)
            event.attributes.env = event.attributes.env or "dev"
            return event
          end
    outputs: [influx_out]
