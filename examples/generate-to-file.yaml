# A synthetic load: `generate_in` renders a fixed number of events from a template, an ordinary
# `json` stage parses their bodies, and the result is written to a file sink. This is the shape
# every perf scenario takes (docs/plans/load-test-harness.md) -- run it directly to see the
# generator's own completion line:
#
#   logit --log-format json run examples/generate-to-file.yaml
#
# ...which ends with `{"message":"generation complete","events":1000,...}` on stderr. `count` is
# reached, `generate_in` returns, its senders drop, and the existing listener-exit cascade flushes
# the sink and exits 0 -- nothing here needs a signal or a timeout to stop it.
components:
  # No socket and no decoder: this listener renders a declarative template as fast as `count` and
  # `rate` allow, so a measurement is of the pipeline rather than of a load-generator process and
  # a kernel socket buffer.
  gen:
    type: generate_in

    # Total events, exactly: the last batch is short (`count % batch`) rather than rounded up, so
    # a derived events/s divides by the number actually produced. Omit for an unbounded soak run.
    count: 1000

    # Events per `EventBatch` down the fanout -- the same unit a real listener's batch assembly
    # produces. Bigger amortizes the per-batch runtime cost (one channel send, one telemetry
    # point, one span) over more events; lower it to measure that per-batch cost instead.
    batch: 100

    # Target events/s, paced against the wall clock. Kept low here so the example is polite to run
    # on a laptop; a real scenario omits it entirely (generate as fast as backpressure allows) or
    # sets it high. Above roughly a thousand batches per second the pacing is bursty within any
    # given millisecond -- the average still holds (docs/known-gaps.md).
    rate: 5000

    # Batch-level resource attributes: built once and Arc-shared by every event, so they cost a
    # refcount bump per event rather than a map. A `{seq}`/`{seq%N}` placeholder is legal here but
    # is rendered *once*, at seq 0 -- the resource is per batch, not per event, so put cardinality
    # in `event.attributes` below instead.
    resource:
      service.name: synthetic

    event:
      # The generated log body. `{{` and `}}` write literal braces, which is what lets a JSON body
      # be a template at all; `{seq%50}` renders the 0-based event counter modulo 50, giving this
      # scenario 50 distinct paths. Placeholders are for cardinality, never decoration: each one
      # costs a rendering and a copy per event, whereas a field with no placeholder in it is
      # rendered once at startup and shared by every event.
      log: '{{"method":"GET","path":"/x/{seq%50}","status":200,"bytes":1024}}'

      # Event attributes: literal keys (interned once), templated values. 10 distinct hosts here.
      attributes:
        host: "web-{seq%10}"

      # One metric per event. `kind` is sum (a delta counter), gauge, or distribution -- and a
      # distribution generates *raw* samples, never a pre-built sketch, because summarizing is
      # `aggregate`'s job, not a listener's (docs/adr/lossless-transit.md).
      metric:
        name: requests
        kind: sum
        value: 1

  # The stage under test in this example: an ordinary transform, composed downstream exactly as it
  # would be behind a real listener. Swapping what sits here is how a scenario changes what it
  # measures, which is why `generate_in` has no "shape" enum of its own.
  parse:
    type: json
    sources: [gen]

  # `/dev/null` so the example measures everything up to the sink's write without a real file's
  # size or filesystem in the number. `stdio_out` with a path target is the non-rotating file
  # sink; `file_out` is the same implementation with a rotation policy attached, which /dev/null
  # has no use for.
  sink:
    type: stdio_out
    sources: [parse]
    target: /dev/null
