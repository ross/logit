# One connection, N streams: the edge half. examples/fan-out-central.yaml is the far side;
# examples/forwarder-edge.yaml has the `logit_out` field reference this file doesn't repeat.
#
# Two streams (a host's statsd metrics and an application's syslog lines) share one `logit_out`,
# so one TCP connection, through the graph's N->1 fan-in. `set` stamps each with a `stream` tag
# that the central `route` splits on; the native wire format carries it end to end.
#
# Run alongside examples/fan-out-central.yaml. Start the central process first, or `logit_out`
# keeps retrying the connection (lazy connect, not a config error). Change `endpoint` below to
# the central host.
#
#   logit run examples/fan-out-central.yaml &
#   logit run examples/fan-out-edge.yaml
#
# Topology (this file):
#
#   statsd (UDP) --> host_in (statsd_in) --> tag_host (set: stream=host) --\
#                                                                          >--> central_out (logit_out)
#   syslog (UDP) --> app_in (syslog_in) ----> tag_app  (set: stream=app) --/
components:
  host_in:
    type: statsd_in
    bind: 0.0.0.0:8125

  tag_host:
    type: set
    sources: [host_in]
    attributes:
      stream: host
    # resource:                    # stamped once per batch rather than once per event; the
    #   service.name: host-agent   #   central `route` can match it with `by: {resource: ..}`

  app_in:
    type: syslog_in
    bind: 0.0.0.0:5514

  tag_app:
    type: set
    sources: [app_in]
    attributes:
      stream: app

  central_out:
    type: logit_out
    sources: [tag_host, tag_app]
    endpoint: central:5150
