# Expose a `/metrics` endpoint for Prometheus to scrape: drain logit's own self-telemetry,
# aggregate it into cumulative counters/histograms, and serve the result
# (docs/adr/prometheus-scrape-and-exposition.md). `prometheus_out` is in exposition mode here
# because `bind:` is set; `endpoint:` would make it a remote-write sender instead. The scraper
# picks Prometheus text 0.0.4 or OpenMetrics 1.0 with its `Accept` header. `internal` feeds it so
# the example runs standalone; any other metrics source works the same way.
#
# The `aggregate` stage is not optional. Prometheus counters are cumulative and `prometheus_out`
# never accumulates a delta: a delta `Sum`/`Histogram` reaching it is skipped and counted
# (`logit.output.metrics.skipped{metric_kind="delta_sum"}`) with a diagnostic naming the fix.
# `aggregate`'s `temporality: cumulative` keeps a per-series running total across windows and
# emits `Sum{Cumulative}` with `start_timestamp` set. Drop it and the gauges still work while every
# counter stops being exposed.
components:
  self:
    type: internal
    interval: 10s

  windowed:
    type: aggregate
    sources: [self]
    interval: 10s
    temporality: cumulative
    # `series_retention` and `max_retained_series` default to non-zero values, which
    # `temporality: cumulative` requires (graph rule 39); they keep the running total alive across
    # the window boundary.

  metrics:
    type: prometheus_out
    sources: [windowed]
    # Loopback, not 0.0.0.0: the endpoint has no TLS and no auth and serves every label of every
    # series to anything that connects. Bind loopback or pod-local and front it with something
    # that has both (docs/adr/prometheus-scrape-and-exposition.md, "Security posture"). Change the
    # port if 9464 is taken.
    bind: 127.0.0.1:9464
    # Every field below is its default; omit it for the same effect.
    # path: /metrics             # any other path is a 404; any other method on it is a 405
    # expire_after: 5m           # a series not updated within this window stops being exposed;
    #                            # 0s disables expiry
    # max_series: 100000         # hard cap on distinct series; over it the least-recently-updated
    #                            # is evicted first and counted
    # buffer: (all defaults, docs/adr/buffered-sink-delivery.md -- max_batches 1024,
    #          max_bytes "64MiB", overflow block, retry_budget 60s, retry_max_delay 10s,
    #          shutdown_grace 5s, plus an optional `disk:` sub-block for durable buffering.
    #          `send` here only replaces in-memory registry state and never fails, so the queue
    #          exists for uniformity, not because a delivery can back up.)
