# Expose a `/metrics` endpoint for Prometheus to scrape: receive statsd on one edge, aggregate,
# and serve the result as Prometheus text 0.0.4 / OpenMetrics 1.0 -- the topology `prometheus_out`
# exists for (docs/adr/prometheus-scrape-and-exposition.md). The scraping client picks the dialect
# with its own `Accept` header; both are served off the one endpoint.
#
# NOTE ON TEMPORALITY. Prometheus counters are cumulative, and `prometheus_out` deliberately does
# *not* accumulate deltas itself (that is summarization, and ADR `lossless-transit` reserves it for
# a named stage). A delta `Sum`/`Histogram` reaching this sink is skipped and counted
# (`logit.output.metrics.skipped{metric_kind="delta_sum"}`) with a throttled
# `delta_temporality_unresolved` diagnostic. The named stage that fixes it is `aggregate`'s
# `temporality: cumulative` mode, which is landing separately -- so **as this tree stands**, the
# pipeline below exposes statsd gauges (and timers, as summaries) while statsd counters are skipped
# and counted. Once `temporality: cumulative` is available, uncomment the line under `windowed:` and
# counters survive too.
#
# Config is a flat graph of components (docs/design/pipeline-graph.md,
# docs/adr/component-graph-configuration.md): each names its own `sources`, rather than sitting in
# a fixed inputs/transforms/outputs pipeline.
components:
  statsd_in:
    type: statsd_in
    bind: 127.0.0.1:8125

  windowed:
    type: aggregate
    sources: [statsd_in]
    interval: 10s
    # temporality: cumulative  # see the NOTE above -- what makes counters and histograms survive
    #                          # the trip to a Prometheus exposition

  metrics:
    type: prometheus_out
    sources: [windowed]
    # 127.0.0.1, not 0.0.0.0, deliberately: this endpoint has no TLS and no auth in v1, and it
    # serves every label of every series it holds to anything that connects
    # (docs/adr/prometheus-scrape-and-exposition.md's "Security posture", docs/known-gaps.md).
    # Bind loopback or pod-local and let something that does have TLS and auth front it; reaching
    # off-host is a choice to make deliberately, not one to inherit from this file.
    bind: 127.0.0.1:9464
    # Every field below defaults -- an omitted field is exactly the value shown here, commented
    # out purely as a reference for tuning a real deployment.
    # path: /metrics             # any other path is a 404; any other method on this path is a 405
    # expire_after: 5m           # a series not updated within this window stops being exposed --
    #                            # Prometheus's own staleness horizon; 0s disables expiry entirely
    # max_series: 100000         # hard cap on distinct series held; over it the least-recently-
    #                            # updated is evicted first, counted
    #                            # logit.output.series.evicted{reason="cardinality"}
    # buffer: (all defaults, see docs/adr/buffered-sink-delivery.md -- max_batches 1024,
    #          max_bytes "64MiB", overflow block, retry_budget 60s, retry_max_delay 10s,
    #          shutdown_grace 5s, plus an optional `disk:` sub-block for durable buffering).
    #          `send` here only ever replaces in-memory registry state and never fails, so this
    #          sink's queue exists for uniformity rather than because a delivery can back up.
