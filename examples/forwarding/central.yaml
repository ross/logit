# The central half of a forwarding pair: this `logit` receives what every edge.yaml forwards over
# the native transport, windows the metrics once, and delivers each signal to its backend.
#
#   edges ==native, TLS==> remote_in -> by_signal
#
#   by_signal --> metric_events -> cumulative_10s -> VictoriaMetrics
#             --> log_events    -> Loki
#             --> trace_events  -> Tempo
#
# Check it with `logit validate central.yaml` and draw it with
# `logit graph central.yaml | dot -Tsvg > central.svg`. docs/deploying.md's "Operating a pair"
# says how to start, stop, and upgrade the two together.

hostname: central

# /readyz and /healthz for a container or Kubernetes probe. No TLS and no auth: keep this port
# off public networks.
admin:
  bind: 0.0.0.0:9600

components:
  # --- Input ---------------------------------------------------------------------------------

  remote_in:
    type: logit_in
    bind: 0.0.0.0:5140
    tls:
      cert_file: /etc/logit/tls/server.pem
      key_file: /etc/logit/tls/server.key
      # Requires each edge to present a certificate this CA signed (mutual TLS). Omit it for
      # server-only TLS, and drop the edges' client certificates to match.
      client_ca_file: /etc/logit/tls/ca.pem

  # --- Signal routing ------------------------------------------------------------------------

  # One router gives each backend only its own signal. An event carrying several signals is split
  # into one event per target, each holding only that target's payloads and a copy of the
  # original's attributes, so Loki never receives a metric point and Tempo never receives a log.
  # An edge's `internal` telemetry arrives here as ordinary events and takes the same route as
  # everything else. A signal `signals:` doesn't list is discarded and counted, so add a route
  # here before an edge starts sending a new signal.
  by_signal:
    type: route_signals
    sources: [remote_in]
    signals:
      metrics: metric_events
      logs: log_events
      traces: trace_events

  metric_events:
    type: target

  log_events:
    type: target

  trace_events:
    type: target

  # If a backend needs the edges' self-telemetry treated differently (an InfluxDB org and bucket,
  # say), split it once here, whatever each edge names its `internal`: every `internal` carries
  # `service.name: logit`. Point `by_signal`'s `sources` at `by_service`, which passes on everything
  # it doesn't claim, and put the special handling downstream of `peer_self`. docs/deploying.md's
  # "Operating a pair" has the whole recipe.
  #
  # by_service:
  #   type: route
  #   sources: [remote_in]
  #   by: {resource: service.name}
  #   routes:
  #     logit: peer_self
  #
  # peer_self:
  #   type: target

  # --- Window --------------------------------------------------------------------------------

  # The edges forward raw, so the window is applied once, here. Prometheus remote write takes
  # running totals, not per-window increments.
  cumulative_10s:
    type: aggregate
    sources: [metric_events]
    interval: 10s
    temporality: cumulative

  # --- Backends ------------------------------------------------------------------------------
  #
  # The backends share an input, so each one spools to disk: while one is down, its spool takes
  # the backlog instead of stopping `remote_in`, which the other backends read from. Put
  # /var/lib/logit on a persistent volume, writable by the user logit runs as.

  # VictoriaMetrics' remote write: Prometheus remote write 1.0, compressed with zstd.
  victoria_out:
    type: prometheus_out
    sources: [cumulative_10s]
    endpoint: http://victoriametrics:8428/api/v1/write
    version: 1
    compression: zstd
    buffer:
      disk:
        path: /var/lib/logit/spool/victoria_out

  loki_out:
    type: otlp_out
    sources: [log_events]
    protocol: http
    endpoint: http://loki:3100/otlp
    buffer:
      disk:
        path: /var/lib/logit/spool/loki_out

  tempo_out:
    type: otlp_out
    sources: [trace_events]
    protocol: grpc
    endpoint: tempo:4317
    buffer:
      disk:
        path: /var/lib/logit/spool/tempo_out

  # --- Self-telemetry ------------------------------------------------------------------------
  #
  # This node's own telemetry goes to the same backends through sinks of its own. Sharing the
  # data sinks would put `self` on the data path, and it would stop draining last at shutdown,
  # losing the shutdown-time counts it exists to export.

  # The same rate as the edges, so every forwarded trace stays whole.
  self:
    type: internal
    interval: 10s
    span_sample_rate: 0.1

  # `internal` emits each metric, log, and span as its own event, so each target below receives
  # one signal. The metrics get their own branch because `aggregate` passes a log or span event
  # through.
  self_by_signal:
    type: route_signals
    sources: [self]
    signals:
      metrics: self_metric_events
      logs: self_log_events
      traces: self_trace_events

  self_metric_events:
    type: target

  self_log_events:
    type: target

  self_trace_events:
    type: target

  self_cumulative_10s:
    type: aggregate
    sources: [self_metric_events]
    interval: 10s
    temporality: cumulative

  # Best-effort: a stalled backend sheds this node's oldest telemetry instead of spooling it.
  self_victoria_out:
    type: prometheus_out
    sources: [self_cumulative_10s]
    endpoint: http://victoriametrics:8428/api/v1/write
    version: 1
    compression: zstd
    buffer:
      overflow: drop_oldest

  self_loki_out:
    type: otlp_out
    sources: [self_log_events]
    protocol: http
    endpoint: http://loki:3100/otlp
    buffer:
      overflow: drop_oldest

  self_tempo_out:
    type: otlp_out
    sources: [self_trace_events]
    protocol: grpc
    endpoint: tempo:4317
    buffer:
      overflow: drop_oldest
