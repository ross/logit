# A syslog relay: receive over TCP, forward over TCP, the topology RFC 5425 (syslog over TLS)
# exists for once `tls:` is uncommented on both ends (docs/adr/syslog-tcp-ingress-and-tls.md).
# Header fields (hostname, tag/app-name, PID, severity, structured data) round-trip through the
# real decoder on the other end, modulo the normalizations docs/adr/lossless-transit.md permits;
# an event that never passed through `syslog_in` falls back to this file's configured defaults.
# Change `endpoint` to your receiver.
#
#   sender (TCP) --> syslog_in --> syslog_out --> receiver (TCP)
#
# A TCP `syslog_in` auto-detects RFC 6587 framing per connection from its first byte (a digit
# means octet-counting, anything else LF-delimited); there is no `framing:` field. `syslog_out`
# over TCP always emits octet-counting, the one framing transparent to a newline inside a message.
components:
  syslog_in:
    type: syslog_in
    bind: 0.0.0.0:6514
    transport: tcp             # udp (the default) | tcp -- tls: below requires tcp
    # Every field below is its default; omit it for the same effect.
    # tls:                      # presence turns TLS on and makes it required; tcp only (no DTLS)
    #   cert_file: server.pem   # required -- this listener's own certificate chain
    #   key_file: server.key    # required -- server.pem's private key
    #   client_ca_file: null    # set for mutual TLS; omit for server-auth-only TLS
    # handshake_timeout: 5s     # tcp only; bounds the TLS accept and the wait for the first byte
    #                             separately. Not an idle timeout
    # idle_timeout: 5m          # off by default; closes a connection quiet for longer than this.
    #                             A plaintext syslog sender can't detect the close
    #                             (docs/adr/idle-connection-timeout.md)

    # A TCP syslog_in has no receive queue (TCP's own flow control is the backpressure), so only
    # the batch-assembly and shutdown fields apply, per connection.
    # receive:
    #   batch_max_events: 1000      # events accumulated per connection before one send downstream
    #   batch_max_bytes: "1MiB"     # the other per-connection accumulation bound
    #   batch_flush_interval: 100ms # longest an accumulated batch waits regardless of size; 0s disables the timer
    #   shutdown_grace: 5s          # how long a graceful shutdown waits to drain in-flight work

  syslog_out:
    type: syslog_out
    sources: [syslog_in]
    endpoint: collector.internal:6514   # RFC 5425's registered port for syslog over TLS
    transport: tcp              # udp (the default) | tcp -- tls: below requires tcp
    # Every field below is its default; omit it for the same effect.
    # format: rfc5424            # rfc3164 | rfc5424 -- rfc3164's TIMESTAMP has no year or timezone
    # facility: local0           # PRI facility used only when the event carries no syslog.facility attribute
    # hostname: null              # HOSTNAME/APP-NAME fallbacks, used only when the event carries
    # app_name: null              # no syslog.hostname/syslog.tag attribute
    # max_message_bytes: "8192"   # bounds one encoded message (PRI + header + MSG)
    # connect_timeout: 5s         # tcp only -- also bounds the tls: handshake, same budget
    # tls:                       # presence turns TLS on and makes it required, even an empty
    #                             # tls: {}; tcp only
    #   ca_file: ca.pem           # trust this CA instead of the bundled Mozilla set
    #   cert_file: client.pem     # cert_file/key_file together, for mutual TLS
    #   key_file: client.key
    #   insecure_skip_verify: false   # encrypted but not verified; never set together with ca_file
    # structured_data: null       # opt-in RFC 5424 STRUCTURED-DATA element from an event's
    #                             # non-syslog.* attributes, e.g. { sd_id: "logit@32473" }; a
    #                             # syslog.sd attribute renders regardless; ignored under rfc3164

    # buffer: (docs/adr/buffered-sink-delivery.md), shown at its defaults:
    # buffer:
    #   max_batches: 1024
    #   max_bytes: 64MiB
    #   overflow: block
    #   delivery: null             # null derives from duplicate_safe(): false for syslog_out, so at_most_once
    #   retry_budget: 60s
    #   retry_max_delay: 10s
    #   shutdown_grace: 5s
