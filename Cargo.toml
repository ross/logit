[workspace]
resolver = "2"
members = [
    "crates/logit-core",
    "crates/logit-config",
    "crates/logit-script",
    "crates/logit-proto",
    "crates/logit-pipeline",
    "crates/logit-inputs",
    "crates/logit-outputs",
    "crates/logit-transforms",
    "crates/logit-cli",
    "crates/logit-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
logit-core = { path = "crates/logit-core" }
logit-config = { path = "crates/logit-config" }
logit-script = { path = "crates/logit-script" }
logit-proto = { path = "crates/logit-proto" }
logit-pipeline = { path = "crates/logit-pipeline" }
logit-inputs = { path = "crates/logit-inputs" }
logit-outputs = { path = "crates/logit-outputs" }
logit-transforms = { path = "crates/logit-transforms" }
logit-bench = { path = "crates/logit-bench" }

bytes = "1"
# OTLP codec only (crates/logit-proto/src/otlp) -- messages generated once, offline, and committed
# (docs/adr/committed-pregenerated-otlp-protobuf.md); no `prost-build`/`protoc` at build time.
prost = "0.14"
# The native wire format's compression (docs/design/wire-protocol.md) -- pure Rust, no C toolchain
# (ADR `containerized-development`). `zstd` is deliberately not a dependency: the real `zstd` crate
# builds C via `zstd-sys`, and the pure-Rust alternatives aren't yet competitive -- see
# `docs/adr/native-wire-format-encoding.md`.
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode", "checked-decode"] }
# CRC-32C (Castagnoli) for the native frame header -- distinct polynomial from the CRC-32/IEEE
# `crc32fast` already pulls in transitively; hardware-accelerated on x86-64/aarch64 with a pure-Rust
# software fallback, no C dependency.
crc32c = "0.6"
smallvec = { version = "1", features = ["union"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "io-std", "time", "signal", "fs"] }
# For SO_RCVBUF on a UDP listener (docs/adr/decoupled-listener-io.md) -- tokio::net::UdpSocket
# exposes no socket-option setters, so binding goes through socket2 and converts afterward.
# Already present transitively (via tokio/hyper) at this exact version -- pinning it as a direct
# dependency doesn't add a new entry to the dependency tree.
socket2 = "0.6.5"
# OTLP/JSON decoding only (crates/logit-proto/src/otlp/json) -- `AnyValue.bytesValue` is the one
# field proto3 JSON base64-encodes; everything else in that dialect is hand-parsed (see
# ADR `otlp-json-decoding`). Already present transitively (via reqwest/rustls) at this exact
# version -- pinning it as a direct dependency adds no new crate version to the graph.
base64 = "0.22.1"
clap = { version = "4", features = ["derive", "env"] }
serde_norway = "0.9"
sketches-ddsketch = "0.4"
# rustls, not the default native-tls/OpenSSL backend -- keeps "no host toolchain needed"
# (ADR `containerized-development`) intact, since rustls has no system OpenSSL to link against.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# otlp_in/otlp_out's hand-rolled unary gRPC transport (docs/adr/hand-rolled-grpc-over-hyper.md)
# -- direct deps at the exact versions `reqwest` already pins in Cargo.lock, so pulling them in
# adds no new version of any of the four to the dependency graph. `reqwest` itself stays the OTLP/
# HTTP client (otlp_out's HTTP transport); these are for otlp_in's server (both transports) and
# otlp_out's gRPC client.
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
# `client-legacy` (+ `http2`) is otlp_out's gRPC connection manager (docs/adr/otlp-tls-and-pooled-grpc-client.md)
# -- a `hyper_util::client::legacy::Client` replaces the hand-rolled per-request TcpStream connect,
# which is what gives the gRPC transport both TLS and connection pooling in one move.
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http2"] }
http = "1"
http-body-util = "0.1"
# otlp_out's optional gzip request compression and otlp_in's matching decode
# (docs/adr/otlp-compression-and-decompression-bounds.md) -- default features only, which pulls in
# the pure-Rust `miniz_oxide` backend rather than a C zlib, keeping "no host toolchain needed"
# intact (ADR `containerized-development`).
flate2 = "1"
# TLS for otlp_out (both transports) and otlp_in (docs/adr/otlp-tls-and-pooled-grpc-client.md).
# All four already resolve in Cargo.lock at these exact versions, transitively via `reqwest`'s
# `rustls-tls` feature -- promoting them to direct dependencies adds no new crate version to the
# graph (script/audit confirms, not assumes). `ring` is the crypto provider throughout; `aws-lc-rs`
# is never enabled -- it needs a C toolchain, which would break `containerized-development`'s "no
# host toolchain needed" property.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# PEM parsing (`CertificateDer::pem_slice_iter`, `PrivateKeyDer::from_pem_slice`, ...) lives behind
# this crate's `std` feature -- there is no separate `pem` feature, confirmed against the vendored
# crate source, not assumed. `rustls-pemfile` is deprecated in this crate's favor, so this is the
# one PEM parser in the dependency graph, not a second one.
rustls-pki-types = { version = "1", features = ["std"] }
# otlp_in's TLS acceptor, and a dev-only canned-TLS-server helper for otlp_out's tests.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# otlp_out's gRPC transport: TLS + connection pooling via `HttpsConnector` under `hyper-util`'s
# client. `native-tokio` is deliberately NOT enabled -- that feature pulls in `rustls-native-certs`,
# a new crate this decision doesn't need (see the ADR's "default trust store" note).
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "logging"] }
# The bundled Mozilla root set otlp_out's HTTP transport already trusts by default via `reqwest`;
# promoted to a direct dependency so otlp_out's gRPC transport can use the identical default.
webpki-roots = "1"
# tail_in/docker_in's inotify wake source, Linux only (docs/adr/file-tailing-and-docker-json-logs.md).
# Already present transitively (via `mio`) at this exact version -- a direct, Linux-only dependency
# on it adds no new crate version to the graph.
libc = "0.2.189"
# The `regex` transform's engine (docs/adr/regex-transform.md) --
# `crates/logit-transforms/src/regex.rs`'s matching, and `crates/logit-pipeline/src/graph.rs`'s
# validation rule, which compiles the configured pattern at `logit validate` time so an invalid
# one is a config error, not a run-time surprise. Genuinely new to the shipped graph, unlike
# `socket2`/`libc`/the rustls stack above: it adds `regex`, `regex-automata`, `regex-syntax`, and
# `aho-corasick` (`memchr` is already here via `serde_json`). `regex-lite` is in Cargo.lock today
# only as a dev-dependency of `divan` (logit-bench, which ships in nothing), so picking it would
# not have been a promotion either -- the ADR records why the full engine's lazy DFA and literal
# prefilters were worth three extra crates on a per-event hot path. Pure Rust and MIT OR
# Apache-2.0 throughout, so ADR `containerized-development`'s "no host toolchain needed" holds
# and deny.toml's allowlist covers it (`aho-corasick`'s `Unlicense OR MIT` resolves through MIT,
# exactly as the already-present `memchr` does) -- script/audit confirms, not assumes.
regex = "1"
# Leveled structured self-logging (docs/plans/operator-surface.md, ADR
# `tracing-for-self-logging.md`), replacing `logit-core::diag::Diagnostics`'s bare `eprintln!`.
# Already present transitively (via `hyper`/`tokio`'s own instrumentation) at this exact version --
# promoting it to a direct dependency adds no new crate version to the graph.
tracing = "0.1"
# The subscriber that actually renders `tracing` events -- a genuinely new subtree, unlike
# `tracing` itself: `tracing-subscriber` plus its own dependencies not already in the lock,
# `sharded-slab`, `thread_local`, `matchers`, `nu-ansi-term`, `regex-automata`/`regex-syntax`
# already promoted above. All MIT or (MIT OR Apache-2.0); `deny.toml`'s allowlist already covers
# both -- script/audit confirms, not assumes.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }

[profile.release]
lto = true
codegen-units = 1
