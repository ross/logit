[workspace]
resolver = "2"
members = [
    "crates/logit-core",
    "crates/logit-config",
    "crates/logit-script",
    "crates/logit-proto",
    "crates/logit-inputs",
    "crates/logit-outputs",
    "crates/logit-transforms",
    "crates/logit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
logit-core = { path = "crates/logit-core" }
logit-config = { path = "crates/logit-config" }
logit-script = { path = "crates/logit-script" }
logit-proto = { path = "crates/logit-proto" }
logit-inputs = { path = "crates/logit-inputs" }
logit-outputs = { path = "crates/logit-outputs" }
logit-transforms = { path = "crates/logit-transforms" }

bytes = "1"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
clap = { version = "4", features = ["derive"] }
serde_norway = "0.9"
sketches-ddsketch = "0.4"
# rustls, not the default native-tls/OpenSSL backend -- keeps "no host toolchain needed"
# (ADR 0005) intact, since rustls has no system OpenSSL to link against.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
