# The transit mapping table: what each sink does with each metric kind, each log field, and each
# feature that changes a record's fate. It's the canonical copy; spec/transit/README.md explains the schema and how a
# flow checks it. `crates/logit-cli/src/transit/mapping.rs` validates it.

# The class vocabulary, the canonical copy. A record-level row's class is one of exact,
# normalized, degraded, skipped, or dropped, best to worst; a field-level row's (`record` rows for
# unit, description, start_timestamp, exemplars, exemplars_on_summary, and min_max, a `log` row
# for one of a log's fields, and every `attributes` row) is one of exact, normalized, or lost.
classes:
  exact: The pair's decoder reads back the same kind, value, and field.
  normalized: >-
    A permitted normalization applied, named by the cell's reason; a record or field the
    normalization doesn't touch reads back exact.
  degraded: >-
    The value survives in a lesser kind or shape, such as a sketch written as dotted count and
    quantile series; the cell names the counter that counts it. A cell whose record keeps its kind
    and shape and loses only a field the format has no slot for has reason structural instead.
  lost: >-
    A field the record loses while the record itself survives; the cell names the counter that
    counts it, or its reason is structural when the destination's format has no slot for it.
  skipped: >-
    The record leaves no wire form, because the sink has none for it or the config chose none;
    the cell names the counter that counts it.
  dropped: >-
    The record is lost for a reason the config didn't ask for; the cell names the counter that
    counts it.
# A cell may still say `reason: uncounted` only on the rows `UNCOUNTED_ALLOWED` names in
# `crates/logit-cli/src/transit/mapping.rs`: a span at any sink, a log beside metrics at a sink
# that writes the metrics, the trace datadog_out and splunk_hec_out leave off a log for a
# `trace_id` or `span_id` attribute, and datadog_out's carrier on a log.
# docs/adr/telemetry-loss-vocabulary.md's amendment "structural loss has no counter" has the rule.

sinks: [statsd_out, prometheus_out, influxdb_out, otlp_out, datadog_out, graphite_out, syslog_out, splunk_hec_out, kafka_out]

rows:
  # --- sum: temporality and monotonicity -------------------------------------------------------
  - kind: sum
    feature: delta_monotonic
    cells:
      statsd_out:
        class: exact
        text: >-
          A `|c` counter line, with its sample rate divided out when statsd_in decoded it, so no
          `@rate` is written.
      prometheus_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_delta}
        text: >-
          Prometheus has no delta counter, so a bare delta sum is dropped, with a throttled
          `delta_temporality_unresolved` warning; an `aggregate` with `temporality: cumulative`
          upstream turns it into a counter.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=monotonic_delta_sum}
        text: >-
          A `value` field of a measurement named for the record, its temporality and monotonicity
          dropped, which influxdb_in reads back as a gauge named `<name>.value`, counted once per
          record.
      otlp_out:
        class: exact
        text: An OTLP `Sum` with delta temporality and the monotonic flag.
      datadog_out:
        class: exact
        text: >-
          A series `count` point, its `interval` from the `_logit.metrics.interval` flag or 0,
          which datadog_in reads back as a delta monotonic sum.
      graphite_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=monotonic_delta_sum}
        text: >-
          The bare value as a datapoint, its temporality and monotonicity dropped, which
          graphite_in reads back as a gauge.
  - kind: sum
    feature: delta_nonmonotonic
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=non_monotonic_delta_sum}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=non_monotonic_delta_sum}
          text: >-
            A signed `|c` increment. A statsd counter has no monotonic flag, so it reads back
            monotonic.
      prometheus_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_delta}
        text: A bare delta sum is dropped, as for a monotonic one.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=non_monotonic_delta_sum}
        text: >-
          A `value` field, its temporality and monotonicity dropped, read back as a gauge named
          `<name>.value`, counted once per record.
      otlp_out:
        class: exact
        text: An OTLP `Sum` with delta temporality, not monotonic.
      datadog_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=non_monotonic_sum}
        text: >-
          A series `count` point of the raw value, as Datadog's exporter sends any delta sum, which
          datadog_in reads back as a monotonic delta sum.
      graphite_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=non_monotonic_delta_sum}
        text: The bare value, read back as a gauge, as for a monotonic delta sum.
  - kind: sum
    feature: cumulative_monotonic
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=cumulative_sum}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=cumulative_sum}
          text: >-
            The running total as a bare `|g` gauge, never `|c`, which a statsd server would add to
            itself on every flush.
      prometheus_out:
        class: normalized
        reason: total_suffix
        text: >-
          A `counter` family. Its sample is named with `_total`, appended when the record's name
          lacks it, so such a record reads back under the longer name.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=cumulative_sum}
        text: >-
          A `value` field holding the running total, its temporality and monotonicity dropped,
          read back as a gauge named `<name>.value`, counted once per record.
      otlp_out:
        class: exact
        text: An OTLP `Sum` with cumulative temporality and the monotonic flag.
      datadog_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_cumulative}
        text: >-
          Datadog's exporter differences a running total into a delta first, so it's dropped,
          with a throttled `unresolved_cumulative` warning; a `cumulative_to_delta` upstream
          makes it a delta `count`.
      graphite_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=cumulative_sum}
        text: The running total as a bare value, read back as a gauge.
  - kind: sum
    feature: cumulative_nonmonotonic
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=cumulative_sum}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=cumulative_sum}
          text: The running total as a bare `|g` gauge.
      prometheus_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=non_monotonic_sum}
        text: Prometheus has no non-monotonic counter, so the running total is a `gauge`.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=cumulative_sum}
        text: >-
          A `value` field, its temporality and monotonicity dropped, read back as a gauge named
          `<name>.value`, counted once per record.
      otlp_out:
        class: exact
        text: An OTLP `Sum` with cumulative temporality, not monotonic.
      datadog_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=non_monotonic_sum}
        text: >-
          A series `gauge` point of the running value, as Datadog's exporter sends it, which
          datadog_in reads back as a gauge; a `cumulative_to_delta` upstream with
          `non_monotonic: difference` or `reset_on_decrease` makes it a delta `count`.
      graphite_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=cumulative_sum}
        text: The running total as a bare value, read back as a gauge.

  # --- sum: scalar type ------------------------------------------------------------------------
  - kind: sum
    feature: f64
    cells:
      statsd_out:
        class: exact
        text: The value is written as the shortest float that reads back to the same bits.
      prometheus_out:
        class: exact
        text: The sample's double.
      influxdb_out:
        class: exact
        text: A float field, written as the shortest string that reads back to the same bits.
      otlp_out:
        class: exact
        text: The data point's `as_double`.
      datadog_out:
        class: exact
        text: >-
          The point's double.
      graphite_out:
        class: exact
        text: The value is written as the shortest float that reads back to the same bits.
  - kind: sum
    feature: i64
    cells:
      statsd_out:
        class: normalized
        reason: f64_value
        text: >-
          statsd_out writes every digit, and statsd_in reads the number back as an f64, so an
          integer reads back as a float and one beyond 2^53 rounds.
      prometheus_out:
        class: normalized
        reason: f64_value
        text: >-
          A sample is a double, so an integer is written as its nearest `f64` and reads back as a
          float, rounded beyond 2^53.
      influxdb_out:
        class: exact
        text: An `<n>i` integer field, read back as an `i64`.
      otlp_out:
        class: exact
        text: The data point's `as_int`.
      datadog_out:
        class: normalized
        reason: integer_as_double
        text: >-
          The point's double, the integer's nearest `f64`, read back as a float.
      graphite_out:
        class: normalized
        reason: f64_value
        text: >-
          Plaintext writes every digit and pickle the nearest `f64`, and graphite_in reads either
          back as a float, rounded beyond 2^53.
  - kind: sum
    feature: u64
    cells:
      statsd_out:
        class: normalized
        reason: f64_value
        text: >-
          statsd_out writes every digit, and statsd_in reads the number back as an f64, so an
          integer reads back as a float and one beyond 2^53 rounds.
      prometheus_out:
        class: normalized
        reason: f64_value
        text: >-
          A sample is a double, so an integer is written as its nearest `f64` and reads back as a
          float, rounded beyond 2^53.
      influxdb_out:
        class: exact
        text: An `<n>u` unsigned field, read back as a `u64`.
      otlp_out:
        class: normalized
        reason: u64_as_int
        counter: logit.output.metrics.normalized{reason=u64_as_double}
        text: >-
          OTLP has one signed integer, so a `u64` that fits an `int64` is `as_int` and reads back
          as an `i64`; one above `i64::MAX` is `as_double`, counted, and reads back as an `f64`.
      datadog_out:
        class: normalized
        reason: integer_as_double
        text: >-
          The point's double, the integer's nearest `f64`, read back as a float.
      graphite_out:
        class: normalized
        reason: f64_value
        text: >-
          Plaintext writes every digit and pickle the nearest `f64`, and graphite_in reads either
          back as a float, rounded beyond 2^53.
  - kind: sum
    feature: bool
    cells:
      statsd_out:
        class: normalized
        reason: bool_value
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: A boolean is written as `1` or `0` and reads back as that number.
      prometheus_out:
        class: normalized
        reason: bool_value
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: A boolean is the sample `1` or `0` and reads back as that number.
      influxdb_out:
        class: exact
        text: A `true` or `false` field, read back as a boolean.
      otlp_out:
        class: normalized
        reason: bool_value
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: A boolean is `as_int` `1` or `0` and reads back as that integer.
      datadog_out:
        class: normalized
        reason: bool_as_double
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: >-
          The point's double, `1` or `0`, read back as a float.
      graphite_out:
        class: normalized
        reason: bool_value
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: A boolean is written as `1` or `0` and reads back as that number.

  # --- gauge -----------------------------------------------------------------------------------
  - kind: gauge
    feature: f64
    cells:
      statsd_out:
        class: exact
        text: An absolute `|g` gauge line.
      prometheus_out:
        class: exact
        text: >-
          A `gauge` family, or the family type the `_logit.metrics.type` flag (`info`,
          `stateset`) or the `_logit.prometheus.type` carrier (`untyped`, `unknown`) names.
      influxdb_out:
        class: normalized
        reason: value_field
        text: >-
          A `value` field of a measurement named for the record, read back as a gauge named
          `<name>.value`; an event carrying the `_logit.influxdb.measurement` carrier writes its
          gauges as that measurement's fields instead, under their own names.
      otlp_out:
        class: exact
        text: An OTLP `Gauge`, `as_double`.
      datadog_out:
        class: exact
        text: >-
          A series `gauge` point, a `rate` under the `_logit.metrics.type` flag, or unspecified
          under the `_logit.datadog.type` carrier.
      graphite_out:
        class: exact
        text: A `path value timestamp` line, or a pickled datapoint.
  - kind: gauge
    feature: i64
    cells:
      statsd_out:
        class: normalized
        reason: f64_value
        text: >-
          statsd_out writes every digit, and statsd_in reads the number back as an f64, so an
          integer reads back as a float and one beyond 2^53 rounds.
      prometheus_out:
        class: normalized
        reason: f64_value
        text: >-
          A sample is a double, so an integer is written as its nearest `f64` and reads back as a
          float, rounded beyond 2^53.
      influxdb_out:
        class: normalized
        reason: value_field
        text: An `<n>i` `value` field, read back as an `i64` gauge named `<name>.value`.
      otlp_out:
        class: exact
        text: An OTLP `Gauge`, `as_int`.
      datadog_out:
        class: normalized
        reason: integer_as_double
        text: >-
          The point's double, the integer's nearest `f64`, read back as a float.
      graphite_out:
        class: normalized
        reason: f64_value
        text: >-
          Plaintext writes every digit and pickle the nearest `f64`, and graphite_in reads either
          back as a float, rounded beyond 2^53.
  - kind: gauge
    feature: u64
    cells:
      statsd_out:
        class: normalized
        reason: f64_value
        text: >-
          statsd_out writes every digit, and statsd_in reads the number back as an f64, so an
          integer reads back as a float and one beyond 2^53 rounds.
      prometheus_out:
        class: normalized
        reason: f64_value
        text: >-
          A sample is a double, so an integer is written as its nearest `f64` and reads back as a
          float, rounded beyond 2^53.
      influxdb_out:
        class: normalized
        reason: value_field
        text: An `<n>u` `value` field, read back as a `u64` gauge named `<name>.value`.
      otlp_out:
        class: normalized
        reason: u64_as_int
        counter: logit.output.metrics.normalized{reason=u64_as_double}
        text: >-
          A `u64` that fits an `int64` is `as_int` and reads back as an `i64`; one above
          `i64::MAX` is `as_double`, counted, and reads back as an `f64`.
      datadog_out:
        class: normalized
        reason: integer_as_double
        text: >-
          The point's double, the integer's nearest `f64`, read back as a float.
      graphite_out:
        class: normalized
        reason: f64_value
        text: >-
          Plaintext writes every digit and pickle the nearest `f64`, and graphite_in reads either
          back as a float, rounded beyond 2^53.
  - kind: gauge
    feature: bool
    cells:
      statsd_out:
        class: normalized
        reason: bool_value
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: A boolean is written as `1` or `0` and reads back as that number.
      prometheus_out:
        class: normalized
        reason: bool_value
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: A boolean is the sample `1` or `0` and reads back as that number.
      influxdb_out:
        class: normalized
        reason: value_field
        text: A `true` or `false` `value` field, read back as a gauge named `<name>.value`.
      otlp_out:
        class: normalized
        reason: bool_value
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: A boolean is `as_int` `1` or `0` and reads back as that integer.
      datadog_out:
        class: normalized
        reason: bool_as_double
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: >-
          The point's double, `1` or `0`, read back as a float.
      graphite_out:
        class: normalized
        reason: bool_value
        counter: logit.output.metrics.normalized{reason=bool_value}
        text: A boolean is written as `1` or `0` and reads back as that number.
  - kind: gauge
    feature: negative
    cells:
      statsd_out:
        class: degraded
        counter: logit.output.metrics.degraded{reason=negative_gauge}
        text: >-
          statsd has no negative absolute gauge, so statsd_out writes `0|g` then `-v|g` in one
          datagram, counted once per record. A statsd server ends at the right value, but statsd_in
          reads the pair as a gauge of 0 and a relative adjustment.
      prometheus_out:
        class: exact
        text: A negative sample, written as is.
      influxdb_out:
        class: normalized
        reason: value_field
        text: A negative `value` field, read back as a gauge named `<name>.value`.
      otlp_out:
        class: exact
        text: A negative data point, written as is.
      datadog_out:
        class: exact
        text: >-
          A negative double, as any other.
      graphite_out:
        class: exact
        text: A negative value, written as is.

  # A gauge flagged `_logit.metrics.type: info` or `stateset`, as prometheus_in decodes an
  # OpenMetrics `info` or `stateset` family. A sink's other outcomes for the gauge are its scalar
  # row's, and the flag's are the `family_type` row's.
  - kind: gauge
    feature: prometheus_info
    cells:
      statsd_out:
        class: exact
        text: As any other gauge; the type flag isn't written.
      prometheus_out:
        class: exact
        text: An `info` family, its sample named `<name>_info`.
      influxdb_out:
        class: exact
        text: As any other gauge; the type flag isn't written.
      otlp_out:
        class: normalized
        reason: prometheus_info_sum
        text: >-
          A cumulative non-monotonic OTLP `Sum` named `<name>_info`, as the OTel Prometheus
          compatibility spec's Info section (marked Development) has it, read back as that sum.
      datadog_out:
        class: exact
        text: As any other gauge; the type flag isn't written.
      graphite_out:
        class: exact
        text: As any other gauge; the type flag isn't written.
  - kind: gauge
    feature: prometheus_stateset
    cells:
      statsd_out:
        class: exact
        text: As any other gauge; the type flag isn't written.
      prometheus_out:
        class: exact
        text: A `stateset` family, one sample per state.
      influxdb_out:
        class: exact
        text: As any other gauge; the type flag isn't written.
      otlp_out:
        class: normalized
        reason: prometheus_stateset_sum
        text: >-
          A cumulative non-monotonic OTLP `Sum`, as the OTel Prometheus compatibility spec's
          StateSet section (marked Development) has it, read back as that sum.
      datadog_out:
        class: exact
        text: As any other gauge; the type flag isn't written.
      graphite_out:
        class: exact
        text: As any other gauge; the type flag isn't written.

  # --- gauge_delta -----------------------------------------------------------------------------
  - kind: gauge_delta
    feature: f64
    cells:
      statsd_out:
        - when: {relative_gauges: true}
          class: exact
          text: A relative `+v|g` or `-v|g` line.
        - class: dropped
          counter: logit.output.messages.dropped{reason=unresolved_gauge_delta}
          text: >-
            An unresolved relative adjustment is dropped unless `relative_gauges: true`, with a
            throttled `gauge_delta_unresolved` warning; an `aggregate` upstream resolves it into a
            gauge.
      prometheus_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: >-
          An unresolved relative adjustment has no absolute value to expose and is dropped, with
          a throttled `gauge_delta_unresolved` warning; an `aggregate` upstream resolves it into a
          gauge.
      influxdb_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: >-
          An unresolved relative adjustment is dropped, with a throttled `gauge_delta_unresolved`
          warning; an `aggregate` upstream resolves it into a gauge.
      otlp_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: >-
          An unresolved relative adjustment is dropped, with a throttled `gauge_delta_unresolved`
          warning; an `aggregate` upstream resolves it into a gauge.
      datadog_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: >-
          Nothing upstream resolved the relative gauge to an absolute one, so the series encoders
          drop it.
      graphite_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: >-
          Carbon has no relative gauge, so an unresolved adjustment is dropped, with a throttled
          `gauge_delta_unresolved` warning; an `aggregate` upstream resolves it into a gauge.
  - kind: gauge_delta
    feature: i64
    cells:
      statsd_out:
        - when: {relative_gauges: true}
          class: normalized
          reason: f64_value
          text: A relative line, read back as an f64.
        - class: dropped
          counter: logit.output.messages.dropped{reason=unresolved_gauge_delta}
          text: 'Dropped unless `relative_gauges: true`, as for a float adjustment.'
      prometheus_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      influxdb_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      otlp_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      datadog_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: >-
          Nothing upstream resolved the relative gauge to an absolute one, so the series encoders
          drop it.
      graphite_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
  - kind: gauge_delta
    feature: u64
    cells:
      statsd_out:
        - when: {relative_gauges: true}
          class: normalized
          reason: f64_value
          text: A relative line, read back as an f64.
        - class: dropped
          counter: logit.output.messages.dropped{reason=unresolved_gauge_delta}
          text: 'Dropped unless `relative_gauges: true`, as for a float adjustment.'
      prometheus_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      influxdb_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      otlp_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      datadog_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: >-
          Nothing upstream resolved the relative gauge to an absolute one, so the series encoders
          drop it.
      graphite_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
  - kind: gauge_delta
    feature: bool
    cells:
      statsd_out:
        - when: {relative_gauges: true}
          class: normalized
          reason: bool_value
          counter: logit.output.metrics.normalized{reason=bool_value}
          text: A relative line of `1` or `0`.
        - class: dropped
          counter: logit.output.messages.dropped{reason=unresolved_gauge_delta}
          text: 'Dropped unless `relative_gauges: true`, as for a float adjustment.'
      prometheus_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      influxdb_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      otlp_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.
      datadog_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: >-
          Nothing upstream resolved the relative gauge to an absolute one, so the series encoders
          drop it.
      graphite_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_gauge_delta}
        text: Dropped, as for a float adjustment.

  # --- raw multi-value kinds -------------------------------------------------------------------
  - kind: samples
    cells:
      statsd_out:
        - when: {format: statsd}
          class: normalized
          reason: dialect
          counter: logit.output.messages.normalized{reason=dialect}
          text: >-
            Under `format: statsd`, a multi-value line splits into one line per value, uncounted,
            and an `h` or `d` timer is written as `ms`, counted once per record it renames.
        - class: exact
          text: >-
            One `|ms`, `|h`, or `|d` line holding every value, the type letter from the
            `_logit.statsd.type` carrier, or `ms` with no carrier, so a Datadog distribution point
            leaves as a timer, not `|d`. `@rate` is written when it isn't 1.
      prometheus_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=samples}
        text: >-
          Sketched, each value weighted by its inverse sample rate, then written as the
          `distribution` row describes.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=samples}
        text: >-
          Sketched, each value weighted by its inverse sample rate, then written as the
          `distribution` row describes, counted once per record. A non-finite sum or quantile counts
          as that row says.
      otlp_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=samples}
        text: >-
          Sketched, each value weighted by its inverse sample rate, then written as the
          `distribution` row describes.
      datadog_out:
        class: exact
        text: >-
          A distribution point holding every value, which datadog_in reads back as samples at rate
          1.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=samples}
          text: >-
            Under `multi_value: expand`, sketched, each value weighted by its inverse sample rate,
            then dotted `.count`, `.sum`, `.min`, `.max`, and `.q0_5` to `.q0_99` datapoints.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=samples}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  - kind: set_members
    cells:
      statsd_out:
        class: normalized
        reason: member_per_line
        counter: logit.output.messages.normalized{reason=member_sanitized}
        text: >-
          One `|s` line per member, under either dialect and uncounted, so a multi-member set
          line reads back as one record per member; a statsd server counts the same distinct
          members either way. A member holding `:`, `|`, or a control character is written with
          `_` in its place, counted once per member.
      prometheus_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=set_members}
        text: A `gauge` of the distinct member count; the members are gone.
      influxdb_out:
        class: skipped
        counter: logit.output.metrics.skipped{metric_kind=set_members}
        text: >-
          Line protocol has no set, so set members aren't written, with a throttled
          `encode_error` warning.
      otlp_out:
        class: skipped
        counter: logit.output.metrics.skipped{metric_kind=set_members}
        text: >-
          OTLP has no cardinality type, so set members aren't written, with a throttled
          `otlp_set_members_metric_skipped` warning.
      datadog_out:
        class: skipped
        counter: logit.output.metrics.skipped{metric_kind=set_members}
        text: >-
          The series encoders have no form for set members, so none is written.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=set_members}
          text: >-
            Under `multi_value: expand`, the distinct member count as a `.count` datapoint; the
            members are gone.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=set_members}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.

  # --- summarized kinds ------------------------------------------------------------------------
  - kind: distribution
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=distribution}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=distribution}
          text: >-
            Dotted `.count` and `.sum` counters and `.min`, `.max`, and `.q0_5` to `.q0_99`
            gauges. Counts and sums merge across senders at a statsd server; quantiles and
            extremes are the last sender's.
      prometheus_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=distribution}
        text: >-
          A `summary` of the sketch's `0` (its minimum), `0.5`, `0.75`, `0.9`, `0.95`, `0.99`,
          and `1` (its maximum) quantiles with its exact `_sum` and `_count`; the sketch is gone,
          so quantiles from two senders don't merge.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=distribution}
        text: >-
          In the `summary` row's shape: float `count` and `sum` fields and the sketch's `0` (its
          minimum), `0.5`, `0.9`, `0.99`, and `1` (its maximum) quantiles, each read back as a
          gauge under `<name>.`; the sketch is gone, counted once per record. A non-finite sum or
          quantile is left off the line, and the record also counts
          `logit.output.metrics.degraded{reason=non_finite_component}`.
      otlp_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=distribution}
        text: >-
          An OTLP `Summary` of the sketch's `0` (its minimum), `0.5`, `0.75`, `0.9`, `0.95`,
          `0.99`, and `1` (its maximum) quantiles with its own count and sum; OTLP has no mergeable
          sketch.
      datadog_out:
        class: exact
        text: >-
          A sketch under `Mapping::agent`, bin for bin, with its exact count, sum, min, and max;
          `avg` is recomputed from them.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=distribution}
          text: >-
            Under `multi_value: expand`, dotted `.count`, `.sum`, `.min`, `.max`, and `.q0_5` to
            `.q0_99` datapoints; the sketch is gone, so quantiles from two senders don't merge.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=distribution}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  - kind: set
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=set}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=set}
          text: >-
            The estimate as a `.count` gauge; two senders' estimates don't add, and the registers
            are gone.
      prometheus_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=set}
        text: A `gauge` of the estimate; the registers are gone.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=set}
        text: >-
          A `value=<estimate>u` field, read back as a gauge named `<name>.value`; the registers are
          gone, counted once per record.
      otlp_out:
        class: skipped
        counter: logit.output.metrics.skipped{metric_kind=set}
        text: >-
          OTLP has no cardinality type, so a set estimate isn't written, with a throttled
          `otlp_set_metric_skipped` warning.
      datadog_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=set}
        text: >-
          A series `gauge` of the estimate, the Agent's `s`; the registers are gone.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=set}
          text: >-
            Under `multi_value: expand`, the estimate as a `.count` datapoint; the registers are
            gone.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=set}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  - kind: histogram
    feature: delta
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=histogram}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Dotted `.count`, `.sum`, and `.bucket_<bound>` counters and `.min` and `.max`
            gauges.
      prometheus_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_delta}
        text: >-
          A delta histogram is dropped, with a throttled `delta_temporality_unresolved` warning;
          an `aggregate` with `temporality: cumulative` upstream makes it a running one.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=histogram}
        text: >-
          Telegraf's shape: float `count`, `sum`, `min`, and `max` fields, a field per finite bound
          named by the bound and holding the cumulative count up to it, and `+Inf` holding the
          total, each read back as a gauge under `<name>.`, its temporality dropped, counted once
          per record. A non-finite `sum`, `min`, or `max` is left off the line, and the record also
          counts `logit.output.metrics.degraded{reason=non_finite_component}`.
      otlp_out:
        class: normalized
        reason: inf_bucket
        text: >-
          An OTLP `Histogram` with delta temporality. OTLP requires an overflow count above the
          highest bound, so a histogram whose last bound is finite reads back with an empty
          `+Inf` bucket.
      datadog_out:
        - when: {histograms: {mode: counters, send_aggregation_metrics: true}}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `histograms.mode: counters`, a `<name>.bucket` count per bucket tagged
            `lower_bound` and `upper_bound` in the exporter's `formatFloat` form, beside the
            `.count`, `.sum`, `.min`, and `.max` series.
        - when: {histograms: {mode: nobuckets, send_aggregation_metrics: true}}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `histograms.mode: nobuckets`, the `.count`, `.sum`, `.min`, and `.max` series
            alone.
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            A sketch under `Mapping::agent` with its counts spread over the buckets as Datadog's
            exporter spreads them, and the point's count, sum, and average, which datadog_in reads
            back as a distribution. A histogram whose one bucket is `+Inf`, such as otlp_in's
            reading of a bucketless point, keys every observation at the Agent's key -1, about
            `-9.94e-10`, as the exporter does.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `multi_value: expand`, dotted `.count`, `.sum`, `.min`, and `.max` datapoints and
            a `.bucket_<bound>` datapoint per bucket holding that bucket's own count, its
            temporality dropped. A non-finite `.sum`, `.min`, or `.max` is left off, and the record
            also counts once as `logit.output.metrics.degraded{reason=non_finite_component}`.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=histogram}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  - kind: histogram
    feature: cumulative
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=histogram}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            The same dotted series, every one a gauge, since a running total sent as `|c` would
            be added to itself.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=histogram}
        text: >-
          Telegraf's shape: float `count`, `sum`, `min`, and `max` fields, a field per finite bound
          named by the bound and holding the cumulative count up to it, and `+Inf` holding the
          total, each read back as a gauge under `<name>.`, its temporality dropped, counted once
          per record. A non-finite `sum`, `min`, or `max` is left off the line, and the record also
          counts `logit.output.metrics.degraded{reason=non_finite_component}`.
      otlp_out:
        class: normalized
        reason: inf_bucket
        text: >-
          An OTLP `Histogram` with cumulative temporality. OTLP requires an overflow count above the
          highest bound, so a histogram whose last bound is finite reads back with an empty
          `+Inf` bucket.
      prometheus_out:
        class: normalized
        reason: inf_bucket
        text: >-
          A `histogram` family of running-sum buckets and `_sum` when it has one, or a
          `gaugehistogram` under the type flag. `+Inf` states the total, so a histogram whose
          last bound is finite reads back with an empty `+Inf` bucket. `min` and `max` are
          `record/min_max`'s.
      datadog_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_cumulative}
        text: >-
          Datadog's exporter differences a running total into a delta first, so it's dropped,
          with a throttled `unresolved_cumulative` warning; a `cumulative_to_delta` upstream
          makes it a delta histogram.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `multi_value: expand`, the same dotted datapoints as a delta one's.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=histogram}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  # A histogram with a `NaN` bucket bound, in any order. A record holding both a `NaN` and a
  # `-Inf` bound reaches this row and `neg_inf_bound`. A sink's other histogram outcomes are its
  # temporality row's.
  - kind: histogram
    feature: nan_bound
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=histogram}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Each bucket is its own dotted series, as for any other bound: `.bucket_NaN` holds
            that bucket's own count.
      prometheus_out:
        class: degraded
        counter: logit.output.metrics.degraded{reason=non_finite_component}
        text: >-
          A `NaN` bound has no place among the sorted bounds, so it has no bucket, and its count
          reaches only `+Inf` and `_count`.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{reason=non_finite_component}
        text: >-
          No field key spells a `NaN` bound, so none is written, and its count reaches only
          `count` and `+Inf`.
      otlp_out:
        class: degraded
        counter: logit.output.metrics.degraded{reason=non_finite_component}
        text: >-
          OTLP bounds are finite, so a `NaN` bound's count joins the overflow bucket. `count`
          and every cumulative count are kept.
      datadog_out:
        - when: {histograms: {mode: counters, send_aggregation_metrics: true}}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `histograms.mode: counters`, a `NaN` bound is one more bucket's bound: the
            `<name>.bucket` counts beside it carry a `nan` `lower_bound` or `upper_bound` tag, the
            exporter's `formatFloat` form.
        - when: {histograms: {mode: nobuckets, send_aggregation_metrics: true}}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `histograms.mode: nobuckets`, no bucket is written, so the bound goes with the
            rest.
        - class: dropped
          counter: logit.output.metrics.dropped{reason=non_monotonic_bounds}
          text: >-
            Datadog's exporter keys a `NaN` bound at the Agent's key 1 on amd64, so a `NaN` above
            a bound that keys higher makes a bucket whose upper key is below its lower one, and
            the point is dropped, as the exporter drops it. A `NaN` below every bound that keys
            above 1 would instead be sketched with its count at key 1.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `multi_value: expand`, each bucket is its own dotted datapoint, as for any other
            bound: `.bucket_NaN` holds that bucket's own count.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=histogram}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  # A histogram with a `-Inf` bucket bound.
  - kind: histogram
    feature: neg_inf_bound
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=histogram}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Each bucket is its own dotted series, as for any other bound: `.bucket_-inf` holds
            that bucket's own count.
      prometheus_out:
        class: exact
        text: '`-Inf` is an ordinary bound: an `le="-Inf"` bucket, first.'
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{reason=non_finite_component}
        text: >-
          No field key spells a `-Inf` bound, so none is written, and its count reaches every
          finite bound's field.
      otlp_out:
        class: degraded
        counter: logit.output.metrics.degraded{reason=non_finite_component}
        text: >-
          OTLP bounds are finite, so a `-Inf` bound's count joins the first bucket. `count` and
          every cumulative count are kept.
      datadog_out:
        - when: {histograms: {mode: counters, send_aggregation_metrics: true}}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `histograms.mode: counters`, a `-Inf` bound is one more bucket's bound: the
            `<name>.bucket` counts beside it carry a `-inf` `lower_bound` or `upper_bound` tag,
            the exporter's `formatFloat` form.
        - when: {histograms: {mode: nobuckets, send_aggregation_metrics: true}}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `histograms.mode: nobuckets`, no bucket is written, so the bound goes with the
            rest.
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            In the sketch, as Datadog's exporter builds it on amd64: Go's `int(-Inf)` keys the
            bound at the Agent's key -1, so the `-Inf` bucket's count lands near `-1e-9` rather
            than below every other bucket, and the sketch's `min` is that bin's value.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=histogram}
          text: >-
            Under `multi_value: expand`, each bucket is its own dotted datapoint, as for any other
            bound: `.bucket_-inf` holds that bucket's own count.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=histogram}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  # A histogram flagged `_logit.metrics.type: gaugehistogram`, as prometheus_in decodes an
  # OpenMetrics `gaugehistogram` family. A sink's other outcomes are its temporality row's, and the
  # flag's are the `family_type` row's.
  - kind: histogram
    feature: gauge_histogram
    cells:
      statsd_out:
        class: exact
        text: As `histogram/cumulative`; the type flag isn't written.
      prometheus_out:
        class: exact
        text: A `gaugehistogram` family, with `_gsum` and `_gcount`.
      influxdb_out:
        class: exact
        text: As `histogram/cumulative`; the type flag isn't written.
      otlp_out:
        class: skipped
        counter: logit.output.metrics.skipped{metric_kind=gauge_histogram}
        text: >-
          The OTel Prometheus compatibility spec drops a GaugeHistogram, since OTLP has no
          histogram that isn't a running count, so it isn't written, with a throttled
          `otlp_gauge_histogram_skipped` warning.
      datadog_out:
        class: exact
        text: As `histogram/cumulative`; the type flag isn't written.
      graphite_out:
        class: exact
        text: As `histogram/cumulative`; the type flag isn't written.
  - kind: exponential_histogram
    feature: delta
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=exponential_histogram}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=exponential_histogram}
          text: >-
            Dotted `.count`, `.sum`, and `.zero_count` counters and `.min` and `.max` gauges. Its
            buckets aren't written, since each scale would mint its own series names.
      prometheus_out:
        - when: {bind: null}
          class: dropped
          counter: logit.output.metrics.dropped{reason=native_histogram}
          text: >-
            Remote-write carries native histograms, but the sender doesn't map them yet, so one
            is dropped.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=exponential_histogram}
          text: Neither exposition dialect has native-histogram syntax, so none is written.
      influxdb_out:
        class: skipped
        counter: logit.output.metrics.skipped{metric_kind=exponential_histogram}
        text: >-
          Neither Telegraf nor the OTel Collector's InfluxDB exporter has a line-protocol form for
          an exponential histogram, so none is written, with a throttled `encode_error` warning.
      otlp_out:
        class: exact
        text: An OTLP `ExponentialHistogram`, field for field.
      datadog_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=exponential_histogram}
        text: >-
          A sketch under every `histograms.mode`, its buckets re-mapped onto the Agent's bins as
          Datadog's exporter re-maps them, with the point's count, sum, and average, which
          datadog_in reads back as a distribution; with `send_aggregation_metrics`, the `.count`,
          `.sum`, `.min`, and `.max` series too.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=exponential_histogram}
          text: >-
            Under `multi_value: expand`, dotted `.count`, `.sum`, `.min`, `.max`, and `.zero_count`
            datapoints. Its buckets aren't written, since each scale would mint its own paths.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=exponential_histogram}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  - kind: exponential_histogram
    feature: cumulative
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=exponential_histogram}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=exponential_histogram}
          text: The same dotted series, every one a gauge, and no buckets.
      prometheus_out:
        - when: {bind: null}
          class: dropped
          counter: logit.output.metrics.dropped{reason=native_histogram}
          text: Dropped, as for a delta one.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=exponential_histogram}
          text: Neither exposition dialect has native-histogram syntax, so none is written.
      influxdb_out:
        class: skipped
        counter: logit.output.metrics.skipped{metric_kind=exponential_histogram}
        text: >-
          Neither Telegraf nor the OTel Collector's InfluxDB exporter has a line-protocol form for
          an exponential histogram, so none is written, with a throttled `encode_error` warning.
      otlp_out:
        class: exact
        text: An OTLP `ExponentialHistogram`, field for field.
      datadog_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_cumulative}
        text: >-
          Datadog's exporter can't send a cumulative exponential histogram, so it's dropped, with
          a throttled `unresolved_cumulative` warning; a `cumulative_to_delta` upstream makes it a
          delta one.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=exponential_histogram}
          text: >-
            Under `multi_value: expand`, the same dotted datapoints as a delta one's, and no
            buckets.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=exponential_histogram}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  - kind: summary
    feature: delta
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=summary}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=summary}
          text: >-
            Dotted `.count` and `.sum` counters, which a statsd server sums across flushes as it
            does a delta histogram's, and per-quantile gauges.
      prometheus_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_delta}
        text: >-
          A Prometheus summary is a running total, so a delta one, which only
          `cumulative_to_delta` makes, is dropped, with a throttled `delta_summary_unresolved`
          warning; send this sink the summary from ahead of that component.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=summary}
        text: >-
          Telegraf's shape: float `count` and `sum` fields and a field per quantile named by the
          quantile (`0.5`, `0.99`), each read back as a gauge under `<name>.`, counted once per
          record. Line protocol has no temporality, so a delta summary writes as a cumulative one
          does. A non-finite `sum`, quantile, or quantile value is left off the line, and the record
          also counts `logit.output.metrics.degraded{reason=non_finite_component}`.
      otlp_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=unresolved_delta}
        text: >-
          OTLP defines every summary as cumulative, so a delta one is dropped, with a throttled
          `delta_summary_unresolved` warning.
      datadog_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=summary}
        text: >-
          A `<name>.quantile` gauge per quantile tagged `quantile:<q>`, and `.count` (no unit) and
          `.sum` as `count` points, as Datadog's exporter writes a summary it differenced, counted
          once per record; datadog_in reads them back as gauges and counts.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=summary}
          text: >-
            Under `multi_value: expand`, dotted `.count` and `.sum` datapoints and a `.q<quantile>`
            datapoint per quantile, its temporality dropped.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=summary}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.
  - kind: summary
    feature: cumulative
    cells:
      statsd_out:
        - when: {multi_value: skip}
          class: skipped
          counter: logit.output.metrics.skipped{metric_kind=summary}
          text: 'Under `multi_value: skip`, no line is written.'
        - class: degraded
          counter: logit.output.metrics.degraded{metric_kind=summary}
          text: Dotted `.count`, `.sum`, and per-quantile gauges.
      prometheus_out:
        class: exact
        text: A `summary` family of its quantiles, `_sum`, and `_count`.
      influxdb_out:
        class: degraded
        counter: logit.output.metrics.degraded{metric_kind=summary}
        text: >-
          Telegraf's shape: float `count` and `sum` fields and a field per quantile named by the
          quantile (`0.5`, `0.99`), each read back as a gauge under `<name>.`, counted once per
          record. A non-finite `sum`, quantile, or quantile value is left off the line, and the
          record also counts `logit.output.metrics.degraded{reason=non_finite_component}`.
      otlp_out:
        class: exact
        text: An OTLP `Summary`.
      datadog_out:
        class: degraded
        counter: logit.output.fields.dropped{reason=unresolved_cumulative}
        text: >-
          A `<name>.quantile` gauge per quantile tagged `quantile:<q>`, which datadog_in reads back
          as gauges. The running count and sum need differencing first, so they're dropped,
          counted, with a throttled `unresolved_cumulative` warning; a `cumulative_to_delta`
          upstream makes them sendable.
      graphite_out:
        - when: {multi_value: expand}
          class: degraded
          counter: logit.output.metrics.degraded{metric_kind=summary}
          text: >-
            Under `multi_value: expand`, dotted `.count` and `.sum` datapoints and a `.q<quantile>`
            datapoint per quantile.
        - class: skipped
          counter: logit.output.metrics.skipped{metric_kind=summary}
          text: >-
            Under `multi_value: skip`, the default, no datapoint is written.

  # --- record fields ---------------------------------------------------------------------------
  - kind: record
    feature: unit
    cells:
      statsd_out:
        class: lost
        reason: structural
        text: statsd has no unit, so none is written.
      influxdb_out:
        class: lost
        reason: structural
        text: Line protocol has no unit, so none is written.
      otlp_out:
        class: exact
        text: The `Metric`'s `unit`.
      prometheus_out:
        - when: {bind: null}
          class: exact
          text: Remote-write carries the unit in its metadata.
        - class: lost
          counter: logit.output.metrics.degraded{reason=unit_not_suffix}
          text: >-
            OpenMetrics writes `# UNIT` only when `_<unit>` ends the family name; otherwise it's
            left off, counted.
      datadog_out:
        class: lost
        counter: logit.output.fields.omitted{reason=unit_unmapped}
        text: >-
          The series' `unit` as Datadog names it. A unit datadog_in decoded (its batch marked
          `_logit.datadog.units`) leaves as it is. Any other source's unit leaves as it is when
          it's a Datadog unit name, else mapped as Datadog's OTel exporter maps a UCUM unit (`ms`
          as `millisecond`, `By/s` as `byte/second`, `{request}` as `request`); one with no
          Datadog name, `1` included, is left off, counted once per record.
      graphite_out:
        class: lost
        reason: structural
        text: Carbon has no unit, so none is written.
  - kind: record
    feature: description
    cells:
      statsd_out:
        class: lost
        reason: structural
        text: statsd has no description, so none is written.
      prometheus_out:
        class: exact
        text: The family's `# HELP` line.
      influxdb_out:
        class: lost
        reason: structural
        text: Line protocol has no description, so none is written.
      otlp_out:
        class: exact
        text: The `Metric`'s `description`.
      datadog_out:
        class: lost
        reason: structural
        text: Datadog's intake has no description, so none is written.
      graphite_out:
        class: lost
        reason: structural
        text: Carbon has no description, so none is written.
  - kind: record
    feature: start_timestamp
    cells:
      statsd_out:
        class: lost
        reason: structural
        text: statsd has no start time, so none is written.
      influxdb_out:
        class: lost
        reason: structural
        text: >-
          Line protocol has no start time, so none is written, though the OTel Collector's InfluxDB
          exporter writes a `start_time_unix_nano` field; `docs/known-gaps/influxdb.md` has the gap.
      otlp_out:
        class: exact
        text: The data point's `start_time_unix_nano`.
      prometheus_out:
        class: lost
        reason: structural
        text: >-
          OpenMetrics' `_created` sample, written for a counter, histogram, or summary; a gauge has
          no `_created`, so its start time is left off.
      datadog_out:
        class: lost
        reason: structural
        text: A series point has no start time, so none is written.
      graphite_out:
        class: lost
        reason: structural
        text: Carbon has no start time, so none is written.
  - kind: record
    feature: exemplars
    cells:
      statsd_out:
        class: lost
        reason: structural
        text: statsd has no exemplars, so none are written.
      influxdb_out:
        class: lost
        reason: structural
        text: >-
          Line protocol has no exemplars, so none are written, though the OTel Collector's InfluxDB
          exporter writes each as a point of a `<name>_exemplar` measurement;
          `docs/known-gaps/influxdb.md` has the gap.
      otlp_out:
        class: exact
        text: The data point's exemplars.
      prometheus_out:
        class: lost
        counter: logit.output.metrics.degraded{reason=exemplar_omitted}
        text: >-
          In OpenMetrics, on a counter's `_total` line or the bucket line its value falls in, at
          most one per line. One with no line to sit on, such as a gauge's, or one over the
          128-code-point label budget, on either wire, is left off, counted.
      datadog_out:
        class: lost
        reason: structural
        text: Datadog's intake has no exemplars, so none are written.
      graphite_out:
        class: lost
        reason: structural
        text: Carbon has no exemplars, so none are written.
  # influxdb_out, otlp_out, and graphite_out write a `samples` or `distribution` record only in a
  # lesser form, so its fields are never compared there and none of them has a cell.
  # prometheus_out's summary is a lesser form too, but its cell names the counter its exposition
  # moves for the unit.
  - kind: record
    feature: unit_on_distribution
    cells:
      prometheus_out:
        - when: {bind: null}
          class: exact
          text: Remote-write carries the unit in its metadata.
        - class: lost
          counter: logit.output.metrics.degraded{reason=unit_not_suffix}
          text: >-
            OpenMetrics writes `# UNIT` only when `_<unit>` ends the family name; otherwise it's
            left off, counted.
      statsd_out:
        class: lost
        reason: structural
        text: statsd has no unit, so none is written.
      datadog_out:
        class: lost
        reason: structural
        text: >-
          Distribution points and sketches have no unit field, so a `samples` or `distribution`
          record's unit is left off; only the series routes write one.
  # statsd_out, influxdb_out, and graphite_out write a summary only as dotted series or fields, a
  # lesser kind, and datadog_out skips it, so its fields are never compared there and none of them
  # has a cell.
  - kind: record
    feature: exemplars_on_summary
    cells:
      otlp_out:
        class: lost
        reason: structural
        text: A `SummaryDataPoint` has no exemplars field, so a summary's exemplars are left off.
      prometheus_out:
        class: lost
        counter: logit.output.metrics.degraded{reason=exemplar_omitted}
        text: >-
          A summary has no `_total` or bucket line for an exemplar to sit on, so its exemplars are
          left off, counted.
  # statsd_out, influxdb_out, and graphite_out write a histogram only as dotted series or fields, a
  # lesser kind, and datadog_out skips it, so its fields are never compared there and none of them
  # has a cell.
  # influxdb_out writes `min` and `max` as fields of that line (the `histogram` rows).
  - kind: record
    feature: min_max
    cells:
      prometheus_out:
        class: lost
        reason: structural
        text: A histogram's `min` and `max` have no Prometheus series, so they aren't written.
      otlp_out:
        class: exact
        text: The data point's `min` and `max`.
  - kind: record
    feature: no_recorded_value
    cells:
      statsd_out:
        class: skipped
        counter: logit.output.messages.skipped{reason=no_recorded_value}
        text: A point flagged as holding no recorded value has no statsd line.
      influxdb_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          A point flagged as holding no recorded value isn't written, with a throttled
          `no_recorded_value` warning.
      otlp_out:
        class: exact
        text: The data point's `flags` carry `NO_RECORDED_VALUE`, and the point is kept.
      prometheus_out:
        - when: {bind: null}
          class: exact
          text: >-
            Remote-write writes a flagged `Gauge` or cumulative `Sum` as Prometheus's stale
            marker, read back flagged; a flagged non-monotonic `Sum`'s goes on a `gauge`, as its
            value would.
        - class: skipped
          counter: logit.output.metrics.skipped{reason=no_recorded_value}
          text: A point flagged as holding no recorded value isn't exposed.
      datadog_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          Datadog has no marker for a point with no recorded value, so it isn't written.
      graphite_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          Carbon has no marker for a point with no recorded value, so it isn't written, with a
          throttled `no_recorded_value` warning.
  - kind: record
    feature: no_recorded_value_delta_sum
    cells:
      statsd_out:
        class: skipped
        counter: logit.output.messages.skipped{reason=no_recorded_value}
        text: A point flagged as holding no recorded value has no statsd line.
      influxdb_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          A point flagged as holding no recorded value isn't written, with a throttled
          `no_recorded_value` warning.
      otlp_out:
        class: exact
        text: The data point's `flags` carry `NO_RECORDED_VALUE`, and the point is kept.
      prometheus_out:
        - when: {bind: null}
          class: degraded
          counter: logit.output.metrics.degraded
          text: >-
            Remote-write writes a flagged delta `Sum` as a stale marker, its temporality ignored,
            since a marker holds no reading to be delta about: a monotonic one on a `counter`, read
            back as a flagged cumulative counter, counted
            `logit.output.metrics.degraded{metric_kind=delta_sum}`, and a non-monotonic one on a
            `gauge`, counted `logit.output.metrics.degraded{metric_kind=non_monotonic_sum}`. An
            unflagged delta `Sum` is dropped.
        - class: skipped
          counter: logit.output.metrics.skipped{reason=no_recorded_value}
          text: A point flagged as holding no recorded value isn't exposed.
      datadog_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          Datadog has no marker for a point with no recorded value, so it isn't written.
      graphite_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          Carbon has no marker for a point with no recorded value, so it isn't written, with a
          throttled `no_recorded_value` warning.
  - kind: record
    feature: no_recorded_value_other_kind
    cells:
      statsd_out:
        class: skipped
        counter: logit.output.messages.skipped{reason=no_recorded_value}
        text: A point flagged as holding no recorded value has no statsd line.
      influxdb_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          A point flagged as holding no recorded value isn't written, with a throttled
          `no_recorded_value` warning.
      otlp_out:
        class: exact
        text: The data point's `flags` carry `NO_RECORDED_VALUE`, and the point is kept.
      prometheus_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          A flagged record of a kind other than `Gauge` or `Sum` isn't written in either mode. It
          would be several series, and the flag doesn't say which of them existed, so a stale
          marker would name a series that may never have been sent.
      datadog_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          Datadog has no marker for a point with no recorded value, so it isn't written.
      graphite_out:
        class: skipped
        counter: logit.output.metrics.skipped{reason=no_recorded_value}
        text: >-
          Carbon has no marker for a point with no recorded value, so it isn't written, with a
          throttled `no_recorded_value` warning.
  - kind: record
    feature: service_check
    cells:
      statsd_out:
        - when: {format: statsd}
          class: skipped
          counter: logit.output.messages.skipped{reason=dialect}
          text: Plain statsd has no service check, so none is written.
        - class: exact
          text: >-
            A gauge carrying the `_logit.statsd.service_check.*` carriers is a DogStatsD `_sc`
            line again.
      prometheus_out:
        class: exact
        text: The status gauge; the check's carriers aren't labels.
      influxdb_out:
        class: normalized
        reason: value_field
        text: The status gauge as a `value` field; the check's carriers aren't tags.
      otlp_out:
        class: exact
        text: The status gauge; the check's carriers aren't attributes.
      datadog_out:
        class: exact
        text: >-
          Record 0 of a service check goes to the check route alone, and datadog_in reads it back
          as the same status gauge and carriers.
      graphite_out:
        class: exact
        text: The status gauge; the check's carriers aren't tags.
  # influxdb_out escapes any name, and otlp_out and datadog_out write it as is, so no record reaches
  # this row there and none of them has a cell.
  - kind: record
    feature: name_unsafe
    cells:
      statsd_out:
        class: normalized
        reason: name_sanitized
        counter: logit.output.metrics.normalized{reason=name_sanitized}
        text: >-
          Every `:`, `|`, `@`, `#`, `,`, control, and whitespace character in a name is written as
          `_`, so the record reads back under the sanitized name, counted once per record it
          renames.
      prometheus_out:
        class: normalized
        reason: name_sanitized
        counter: logit.output.metrics.normalized{reason=name_sanitized}
        text: >-
          A name is forced into `[a-zA-Z_:][a-zA-Z0-9_:]*`, each other character `_`, so the record
          reads back under the sanitized name, counted once per record it renames. Two names that
          sanitize onto one in a batch keep one family, the other counted
          `logit.output.metrics.dropped{reason=name_collision}`; across batches they merge into one
          series, uncounted.
      graphite_out:
        class: normalized
        reason: path_sanitized
        counter: logit.output.metrics.normalized{reason=path_sanitized}
        text: >-
          Every whitespace, control, `;`, `/`, and `\` character in a path is written as `_`, so the
          record reads back under the sanitized path, counted once per record.
  # statsd_out, influxdb_out, datadog_out, and graphite_out write no exemplars, and otlp_out
  # writes an exemplar's keys as is, so no record reaches these two rows there and none of them
  # has a cell.
  # A monotonic sum reaches the first, a histogram the second, each only through an exemplar the
  # OpenMetrics writer puts on a line (a counter's first, a histogram's first per bucket); another
  # kind's exemplar has no line to sit on in exposition (record/exemplars).
  - kind: record
    feature: exemplar_key_unsafe
    cells:
      prometheus_out:
        class: normalized
        reason: name_sanitized
        counter: logit.output.labels.normalized{reason=name_sanitized}
        text: >-
          An exemplar's attribute key is written as a label name forced into
          `[a-zA-Z_][a-zA-Z0-9_]*`, each other character `_`, as a series label's is, so the
          exemplar reads back under the sanitized key, counted once per key it renames.
  - kind: record
    feature: exemplar_key_unsafe_histogram
    cells:
      prometheus_out:
        class: normalized
        reason: name_sanitized
        counter: logit.output.labels.normalized{reason=name_sanitized}
        text: >-
          An exemplar's attribute key is written as a label name forced into
          `[a-zA-Z_][a-zA-Z0-9_]*`, each other character `_`, as a series label's is, so the
          exemplar reads back on its bucket under the sanitized key, counted once per key it
          renames.
  - kind: record
    feature: sample_rate
    cells:
      statsd_out:
        class: exact
        text: The rate is written as `@rate` on the line.
      prometheus_out:
        class: exact
        text: Each value is weighted by its inverse rate in the sketch the `samples` row describes.
      influxdb_out:
        class: exact
        text: Each value is weighted by its inverse rate in the sketch the `samples` row describes.
      otlp_out:
        class: exact
        text: Each value is weighted by its inverse rate in the sketch the `samples` row describes.
      datadog_out:
        class: degraded
        counter: logit.output.metrics.degraded{reason=sample_rate_expanded}
        text: >-
          The distribution route has no sample rate, so each value is repeated by its weight,
          the inverse of the rate rounded, and datadog_in reads the values back at rate 1.
      graphite_out:
        class: exact
        text: >-
          Under `multi_value: expand`, each value is weighted by its inverse rate in the sketch the
          `samples` row describes.
  # A sink that writes a `samples` record only in a lesser form, as prometheus_out, influxdb_out,
  # otlp_out, and graphite_out do, never compares its fields, so none of them has a cell.
  - kind: record
    feature: sample_rate_unweighted
    cells:
      statsd_out:
        class: exact
        text: The rate is written as `@rate` on the line.
      datadog_out:
        class: lost
        counter: logit.output.metrics.degraded{reason=sample_rate_rounded}
        text: >-
          A rate below 1 that rounds to weight 1, such as 0.8, writes each value once on the
          distribution route, which has no rate, so datadog_in reads it back at rate 1, counted once
          per record.
  - kind: record
    feature: superseded
    cells:
      statsd_out:
        class: exact
        text: Each record is its own line; a statsd server applies them in order.
      prometheus_out:
        - when: {bind: null}
          class: exact
          text: Remote-write sends each sample with its own timestamp.
        - class: normalized
          reason: superseded
          text: >-
            The exposition registry holds one sample per series, so a later record of the series
            replaces an earlier one before a scrape reads it: the pull model's overwrite,
            uncounted.
      otlp_out:
        class: exact
        text: Each record is its own data point.
      influxdb_out:
        class: exact
        text: Each point is its own line at its own timestamp.
      datadog_out:
        class: exact
        text: >-
          Each record is its own point at its own timestamp.
      graphite_out:
        class: exact
        text: >-
          Each record is its own datapoint at its own second. A whisper store keeps one point per
          path and second, so there a later point in the same second replaces an earlier one.
  - kind: record
    feature: same_instant
    cells:
      statsd_out:
        class: exact
        text: Each record is its own line.
      prometheus_out:
        - when: {bind: null}
          class: dropped
          counter: logit.output.metrics.dropped{reason=duplicate_timestamp}
          text: >-
            One series can't hold two samples at one timestamp, so the later point wins and the
            earlier is dropped, counted, when it differs from it or is an increment, such as a
            Datadog `rate`, or an observation set, such as a `samples` record's summary; a
            `dedup_timestamps` upstream merges or collapses the pair instead.
        - class: normalized
          reason: superseded
          text: >-
            The exposition registry holds one sample per series, so the later point replaces this
            one: the pull model's overwrite, uncounted.
      influxdb_out:
        class: normalized
        reason: next_nanosecond
        text: >-
          A point sharing a series and a timestamp with one already in the batch takes the next
          free nanosecond, so both are kept.
      otlp_out:
        class: exact
        text: Each record is its own data point.
      datadog_out:
        class: dropped
        counter: logit.output.metrics.dropped{reason=duplicate_timestamp}
        text: >-
          Datadog keeps one point per series per second, the higher of two in one request, so the
          sink sends the later point and drops this one, counted, when it differs from the one
          sent or is an increment: two equal delta counts or `rate`s are two events.
          Only the series route collapses: a `samples` record leaves on the distribution-points
          route, where Datadog keeps both, and a `distribution`, an `exponential_histogram`, and
          a `histogram` under `histograms.mode: distributions` on the sketches route, so they
          don't reach this row, unless `histograms.send_aggregation_metrics` also writes a
          histogram's `.count`, `.sum`, `.min`, and `.max` series, which collapse. A `dedup_timestamps` with `precision: 1s` upstream merges or
          collapses the pair instead.
      graphite_out:
        class: exact
        text: >-
          Each record is its own datapoint; a whisper store keeps the later of two points at one
