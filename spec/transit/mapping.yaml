  # --- attributes ------------------------------------------------------------------------------
  - kind: attributes
    feature: string_value
    cells:
      statsd_out:
        - when: {format: statsd}
          class: lost
          counter: logit.output.tags.omitted{reason=dialect}
          text: Plain statsd has no tags; each is counted once per wire tag.
        - class: normalized
          reason: tag_rewritten
          counter: logit.output.tags.normalized
          text: >-
            A DogStatsD `key:value` tag. Each `:`, `|`, `@`, `#`, `,`, control, and whitespace
            character in the key, and each but `:` in the value, is written as `_`, counted once per
            wire tag as `name_sanitized` for a key and `value_sanitized` for a value. A `host` on a
            line with no host of its own is its `host:` tag, which statsd_in reads back as
            `host.name`.
      prometheus_out:
        class: normalized
        reason: label_sanitized
        counter: logit.output.labels.normalized{reason=name_sanitized}
        text: >-
          A label; its name is forced into `[a-zA-Z_][a-zA-Z0-9_]*`, so a key holding `.` or another
          character reads back under the sanitized name, counted once per label it renames.
      otlp_out:
        class: exact
        text: A string attribute.
      influxdb_out:
        class: lost
        counter: logit.output.tags.omitted{reason=unencodable}
        text: >-
          A tag. A value holding a line break, ending in `\`, or with `\` before a space has no
          spelling and is left off, counted.
      datadog_out:
        class: exact
        text: >-
          A `key:value` tag, `host` included. `host.name` is the record's host, which datadog_in
          reads back as `host.name` on every route. On a log, a top-level key of the log object.
      graphite_out:
        - when: {tags: drop}
          class: lost
          counter: logit.output.tags.omitted{reason=dialect}
          text: >-
            Under `tags: drop`, no tag is written, counted once per attribute, so series that differ
            only in their tags write one path.
        - class: normalized
          reason: tag_sanitized
          counter: logit.output.metrics.normalized{reason=tag_sanitized}
          text: >-
            A `;name=value` tag. Each `;`, `!`, `^`, `=`, whitespace, and control character in the
            name, and each `;`, whitespace, and control character and a leading `~` in the value, is
            written as `_`, counted once per record.
      syslog_out:
        - when: {format: rfc3164}
          class: lost
          reason: structural
          text: >-
            RFC 3164 has no structured data, so an attribute outside the header fields is left off.
        - when: {format: rfc5424, structured_data: {sd_id: transit@32473}}
          class: normalized
          reason: structured_data
          text: >-
            Under `structured_data:`, a PARAM of the opt-in SD-ELEMENT, which syslog_in reads back
            as a string inside `syslog.sd`, under the SD-ID and the attribute's key. The PARAM-VALUE
            is the string.
        - class: lost
          reason: structural
          text: >-
            Under RFC 5424 with no `structured_data:`, an attribute outside the header fields has
            no slot, so it's left off; `structured_data:` writes each public event attribute other
            than `host.name`, `process.pid`, and the `syslog.*` keys as an SD-PARAM, which
            syslog_in reads back inside `syslog.sd`.
      splunk_hec_out:
        class: normalized
        reason: log_fields
        text: >-
          A `fields` string, or on a span a string in its `attributes` object, read back as itself.
          On a log, splunk_hec_in reads a non-empty `otel.log.name` into the event name, and a
          `trace_id` that parses as a trace id, with a `span_id` that parses or none, into the trace,
          so none of them reads back as an attribute.
      kafka_out:
        - when: {format: text}
          class: lost
          reason: structural
          text: >-
            A `format: text` record holds the log body alone, so the attribute is left off, as
            every attribute is.
        - class: exact
          text: The event as `stdio_out`'s JSON object, read back whole by the event JSON reader.
