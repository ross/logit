# datadog_trace_in's tracer cases into datadog_out with nothing between, through the sink's trace
# readiness gate: a tracer sends no Agent `_top_level` mark, so the gate holds back every chunk as
# needing an Agent's processing.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/ddtrace/v04.json
  out:
    type: datadog_out
    sources: [case]
    api_key: transit-unused   # the spec sends nothing; a real config reads !env DD_API_KEY
    endpoints:
      api: http://127.0.0.1:8080
      logs: http://127.0.0.1:8080
      traces: http://127.0.0.1:8080
