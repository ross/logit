# statsd_in's cases into otlp_out with nothing between: samples as a summary, set members
# skipped.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/statsd/mixed.json
  out:
    type: otlp_out
    sources: [case]
    endpoint: http://127.0.0.1:4318
