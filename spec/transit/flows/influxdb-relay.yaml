# influxdb_in's cases relayed to influxdb_out, the like pair with nothing between: each batch
# written to the bucket and org it carries, the defaults applying to none here.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/influxdb/mixed.json
  out:
    type: influxdb_out
    sources: [case]
    url: http://127.0.0.1:8086
    token: unused
    default_bucket: metrics
    default_org: acme
