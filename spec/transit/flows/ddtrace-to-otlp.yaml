# datadog_trace_in's tracer cases into otlp_out with nothing between: each span as an OTLP span,
# its Datadog fields as span attributes.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/ddtrace/v04.json
  out:
    type: otlp_out
    sources: [case]
    endpoint: http://127.0.0.1:4318
