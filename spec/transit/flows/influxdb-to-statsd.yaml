# influxdb_in's cases into statsd_out under DogStatsD, with nothing between: each typed field a
# gauge line, tags as DogStatsD tags, and the measurement and bucket carriers left off.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/influxdb/mixed.json
  out:
    type: statsd_out
    sources: [case]
    endpoint: 127.0.0.1:8125
    format: dogstatsd
