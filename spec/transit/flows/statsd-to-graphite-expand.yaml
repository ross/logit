# statsd_in's cases into graphite_out under `multi_value: expand`: timers, sets, and
# summarized kinds as dotted datapoints.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/statsd/mixed.json
  out:
    type: graphite_out
    sources: [case]
    endpoint: 127.0.0.1:2003
    multi_value: expand
