# datadog_in's log and event cases into otlp_out with nothing between: each as an OTLP log
# record.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/datadog-logs/agent-logs.json
  out:
    type: otlp_out
    sources: [case]
    endpoint: http://127.0.0.1:4318
