# statsd_in's cases relayed to statsd_out under `format: statsd`, the dialect change: no tags, no
# DogStatsD segments, events, or service checks, and multi-value lines split.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/statsd/mixed.json
  out:
    type: statsd_out
    sources: [case]
    endpoint: 127.0.0.1:8125
    format: statsd
