# otlp_in's metrics cases through `cumulative_to_delta` into datadog_out: a cumulative monotonic
# sum leaves as a count, a cumulative histogram and exponential histogram as sketches, and a
# summary with its `.count` and `.sum`, where with nothing between they're dropped. Each case
# runs alone, so `initial_value: keep` emits a series' first point whole; a later point of the
# same series is its difference from the one before.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/otlp/sums.json
  deltas:
    type: cumulative_to_delta
    sources: [case]
    initial_value: keep
  out:
    type: datadog_out
    sources: [deltas]
    api_key: transit-unused   # the spec sends nothing; a real config reads !env DD_API_KEY
    endpoints:
      api: http://127.0.0.1:8080
      logs: http://127.0.0.1:8080
      traces: http://127.0.0.1:8080
