# statsd_in's cases exposed by prometheus_out for a scrape, with nothing between, so every kind
# the statsd cases hold reaches the prometheus_out column: a bare delta sum dropped, raw samples
# and set members summarized.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/statsd/mixed.json
  out:
    type: prometheus_out
    sources: [case]
    bind: 127.0.0.1:9464
