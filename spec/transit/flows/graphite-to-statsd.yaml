# graphite_in's cases into statsd_out as DogStatsD, with nothing between: each gauge a `|g` line,
# each tag a DogStatsD tag.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/graphite/tagged.json
  out:
    type: statsd_out
    sources: [case]
    endpoint: 127.0.0.1:8125
    format: dogstatsd
