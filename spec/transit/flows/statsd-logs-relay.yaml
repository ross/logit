# statsd_in's log, span, and payload-less event cases back into statsd_out under DogStatsD, with
# nothing between: each DogStatsD event as its `_e{}` line, and no other event written.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/statsd-logs/event.json
  out:
    type: statsd_out
    sources: [case]
    endpoint: 127.0.0.1:8125
    format: dogstatsd
