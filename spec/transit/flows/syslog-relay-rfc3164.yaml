# syslog_in's cases relayed to syslog_out under `format: rfc3164`: no year, whole seconds,
# no MSGID or STRUCTURED-DATA, and a PID only inside a TAG.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/syslog/logger-rfc5424-basic.json
  out:
    type: syslog_out
    sources: [case]
    endpoint: 127.0.0.1:514
    format: rfc3164
