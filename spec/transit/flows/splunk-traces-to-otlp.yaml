# splunk_hec_in's span cases into otlp_out with nothing between: the exporter's span object back
# into OTLP spans.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/splunk-traces/capture.json
  out:
    type: otlp_out
    sources: [case]
    endpoint: http://127.0.0.1:4318
