# otlp_in's log cases into syslog_out under RFC 5424 with `structured_data:` set: each log's
# event attributes as PARAMs of one `transit@32473` SD-ELEMENT, which syslog_in reads back inside
# `syslog.sd`, and its resource attributes left off.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/otlp-logs/fields.json
  out:
    type: syslog_out
    sources: [case]
    endpoint: 127.0.0.1:514
    structured_data:
      sd_id: transit@32473
