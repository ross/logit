# splunk_hec_in's span cases into datadog_trace_out with nothing between, under the default
# `version: v0.4`. The sink has no readiness gate, so every OTel span is sent, with its Datadog
# fields empty.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/splunk-traces/capture.json
  out:
    type: datadog_trace_out
    sources: [case]
    endpoint: http://127.0.0.1:8126
