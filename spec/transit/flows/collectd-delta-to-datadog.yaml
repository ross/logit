# collectd_in's cases through `cumulative_to_delta` into datadog_out: COUNTER, a cumulative
# monotonic sum, leaves as a count, and under `non_monotonic: reset_on_decrease` so does DERIVE,
# a cumulative non-monotonic sum, where with nothing between COUNTER is dropped and DERIVE is a
# gauge of its running total. Each case runs alone, so `initial_value: keep` emits a series'
# first point whole; a later point of the same series is its difference from the one before.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/collectd/value-lists.json
  deltas:
    type: cumulative_to_delta
    sources: [case]
    initial_value: keep
    non_monotonic: reset_on_decrease
  out:
    type: datadog_out
    sources: [deltas]
    api_key: transit-unused   # the spec sends nothing; a real config reads !env DD_API_KEY
    endpoints:
      api: http://127.0.0.1:8080
      logs: http://127.0.0.1:8080
      traces: http://127.0.0.1:8080
