# datadog_in's cases exposed by prometheus_out for a scrape, with nothing between: a bare delta
# count has no counter to fold into, and a sketch becomes a summary.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/datadog/series-v1.json
  out:
    type: prometheus_out
    sources: [case]
    bind: 127.0.0.1:9464
