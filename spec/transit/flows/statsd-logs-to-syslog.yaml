# statsd_in's log, span, and payload-less event cases into syslog_out with nothing between: each log
# as one RFC 5424 message, and no other event written.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/statsd-logs/event.json
  out:
    type: syslog_out
    sources: [case]
    endpoint: 127.0.0.1:514
