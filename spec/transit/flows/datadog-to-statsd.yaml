# datadog_in's cases into statsd_out under DogStatsD, with nothing between: a count as `|c`, a
# gauge or rate as `|g`, distribution points as one `|ms` line, and a sketch as dotted series.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/datadog/series-v1.json
  out:
    type: statsd_out
    sources: [case]
    endpoint: 127.0.0.1:8125
    format: dogstatsd
