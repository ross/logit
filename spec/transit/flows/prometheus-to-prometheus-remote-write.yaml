# prometheus_in's scrape cases sent by prometheus_out as remote-write 1.0, with nothing between:
# every sample timestamped, so the receiver stamps no timestamp marker, and the scrape target
# carried as the `instance` label.
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/prometheus/mixed.json
  out:
    type: prometheus_out
    sources: [case]
    endpoint: http://127.0.0.1:9090/api/v1/write
