# otlp_in's metrics cases into datadog_out with nothing between, under the default
# `histograms.mode: distributions`: a delta sum as a count, a cumulative non-monotonic one and a
# gauge as gauges, a delta histogram and exponential histogram as sketches, and a summary as
# `.quantile` gauges; a cumulative monotonic sum, histogram, or exponential histogram is dropped
# (`otlp-delta-to-datadog` converts them first).
# `path:` names one case so `logit run` can run this by hand; the transit spec runs every case in
# that file's directory (spec/transit/README.md).
components:
  case:
    type: replay_in
    path: ../cases/otlp/sums.json
  out:
    type: datadog_out
    sources: [case]
    api_key: transit-unused   # the spec sends nothing; a real config reads !env DD_API_KEY
    endpoints:
      api: http://127.0.0.1:8080
      logs: http://127.0.0.1:8080
      traces: http://127.0.0.1:8080
