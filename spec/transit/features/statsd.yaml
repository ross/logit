# The statsd and DogStatsD wire features a case under cases/statsd/ can exercise, from
# crates/logit-proto/src/statsd/mod.rs's grammar and docs/design/telemetry-landscape.md's statsd
# and DogStatsD sections. A case names the ones it exercises in its `.meta.yaml`.
- name: counter
  text: A `|c` counter line, decoded to a delta monotonic sum.
- name: counter_sample_rate
  text: A counter with `@rate`, extrapolated to `value / rate` at decode.
- name: gauge
  text: An absolute `|g` gauge line.
- name: gauge_delta
  text: A `|g` value with a leading `+` or `-`, decoded to an unresolved relative adjustment.
- name: timer_ms
  text: A `|ms` timer line, decoded to raw samples with the `ms` type carrier.
- name: timer_h
  text: A `|h` histogram line, decoded to raw samples with the `h` type carrier.
- name: timer_d
  text: A `|d` distribution line, decoded to raw samples with the `d` type carrier.
- name: timer_sample_rate
  text: A timer with `@rate`, carried on the samples verbatim, not extrapolated.
- name: set
  text: A `|s` set line, decoded to set members in wire order.
- name: multi_value_line
  text: >-
    Several `:`-separated values on one line: one event per value for `c` and `g`, one event
    holding them all for a timer or a set.
- name: tags
  text: A DogStatsD `|#` tag segment, valued and bare tags both.
- name: tags_reserved
  text: >-
    A tag key or value holding a space, `@`, or another character the line grammar doesn't split
    a tag on, read as written.
- name: host
  text: >-
    A `host:` tag, or an event's or service check's `h:` field, decoded to `host.name` as a
    DogStatsD Agent reads it: a non-empty `h:` first, else the last `host:` tag, never a tag.
- name: hostless
  text: >-
    An empty `host:` tag, the Agent's hostless sample, decoded to the `_logit.datadog.hostless`
    mark.
- name: tags_host_name
  text: >-
    A `host.name:` tag: beside the line's own host it's omitted at decode and counted
    `logit.input.tags.omitted{reason="reserved_key"}`, and on a line with no host of its own it's
    `host.name`.
- name: tags_repeated_key
  text: A tag key given more than once, folded into an array in wire order.
- name: tags_duplicate
  text: An exact duplicate tag token, deduplicated at decode.
- name: container_id
  text: >-
    A `|c:` local-data segment: its container id decodes to `container.id` and a cgroup inode to
    the `_logit.statsd.cgroup_inode` carrier.
- name: external_data
  text: A `|e:<external-data>` segment, stamped as the `_logit.statsd.external_data` carrier.
- name: cardinality
  text: A `|card:<cardinality>` segment, stamped as the `_logit.statsd.cardinality` carrier.
- name: timestamp_T
  text: >-
    A `|T<unix-seconds>` segment (or an event's or service check's `d:`), which sets the event
    timestamp and stamps the `_logit.metrics.closed: timestamped` flag.
- name: service_check
  text: A DogStatsD `_sc` service check, decoded to a gauge of its status with its carriers.
- name: event
  text: A DogStatsD `_e` event, decoded to a log with its carriers.
- name: name_sanitized
  text: >-
    A metric name holding a byte the statsd grammar reserves (`:`, `|`, a newline), which the
    wire can't carry and statsd_out writes as `_`.
