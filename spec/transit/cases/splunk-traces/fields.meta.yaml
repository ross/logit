# A hand-written /event body: a server span with a string, an integer, a float, a bool, a `u64`
# above `i64::MAX`, an object, and an array attribute, two events (one with scalar, `u64`, object,
# and array attributes and a timestamp, one bare), and two links (one with a `trace_state` and
